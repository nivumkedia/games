<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech Homework</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(160deg, #eaf4ff 0%, #f7fbf5 100%);
    color: #22303f;
    min-height: 100vh;
  }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: block; }

  /* ===== LANDING ===== */
  #landing.active {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  #landing h1 {
    font-size: 2.4rem;
    color: #1c5d8a;
    margin-bottom: 40px;
  }
  #landing p.tag {
    color: #5a7184;
    margin-bottom: 40px;
    font-size: 1.05rem;
  }
  .role-buttons {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .role-btn {
    width: 220px;
    padding: 36px 20px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 10px 24px rgba(0,0,0,0.12);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .role-btn:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,0.16); }
  .role-btn:active { transform: translateY(-1px); }
  .role-btn .emoji { display: block; font-size: 2.6rem; margin-bottom: 12px; }
  #btn-client { background: linear-gradient(135deg, #4fb0e8, #2e86c1); }
  #btn-therapist { background: linear-gradient(135deg, #6fcf97, #219150); }

  /* ===== SHARED TOPBAR ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(255,255,255,0.75);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    position: sticky;
    top: 0;
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  .topbar h2 { font-size: 1.15rem; color: #1c5d8a; }
  .back-btn {
    background: #fff;
    border: 1px solid #d7e3ec;
    color: #2e86c1;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .back-btn:hover { background: #eaf4ff; }

  .container { max-width: 760px; margin: 0 auto; padding: 24px; }

  /* generic */
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  label { font-size: 0.85rem; color: #5a7184; font-weight: 600; display: block; margin-bottom: 6px; }
  select, input[type=text], textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #d7e3ec;
    font-size: 1rem;
    font-family: inherit;
    background: #fbfdff;
  }
  textarea { resize: vertical; min-height: 90px; }
  .btn {
    background: #2e86c1;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .btn:hover { background: #256a99; }
  .btn.secondary { background: #eaf4ff; color: #2e86c1; }
  .btn.secondary:hover { background: #d7e9fb; }
  .btn.green { background: #219150; }
  .btn.green:hover { background: #1a7440; }
  .btn.danger { background: #e0563f; }
  .btn.danger:hover { background: #c8452f; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .client-list-item, .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border-radius: 12px;
    background: #fbfdff;
    border: 1px solid #eef3f7;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .client-list-item:hover, .list-item:hover { border-color: #cfe6f9; }
  .client-name { font-weight: 700; color: #22303f; }

  .client-btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .client-btn {
    padding: 12px 18px;
    border-radius: 12px;
    border: 1px solid #cfe6f9;
    background: #eaf4ff;
    color: #1c5d8a;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .client-btn:hover { background: #d7e9fb; }
  .add-client-btn {
    background: #219150;
    border-color: #219150;
    color: #fff;
    font-size: 1.2rem;
    padding: 12px 20px;
  }
  .add-client-btn:hover { background: #1a7440; }
  .client-btn-wrap { position: relative; display: inline-block; }
  .client-btn-wrap .client-btn { padding-right: 30px; }
  .client-btn-delete {
    position: absolute;
    top: 4px;
    right: 6px;
    width: 18px;
    height: 18px;
    line-height: 16px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.12);
    color: #1c5d8a;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .client-btn-delete:hover { background: #e0563f; color: #fff; }
  .client-sub { font-size: 0.82rem; color: #7a8ea1; margin-top: 2px; }

  .passage-text {
    font-size: 1.3rem;
    line-height: 1.9;
    color: #22303f;
    white-space: pre-wrap;
  }

  .empty-note { color: #90a2b3; font-size: 0.9rem; padding: 10px 2px; }
</style>
</head>
<body>

<!-- ===== LANDING ===== -->
<div id="landing" class="screen active">
  <h1>Speech Homework</h1>
  <div class="role-buttons">
    <button class="role-btn" id="btn-client">
      Client
    </button>
    <button class="role-btn" id="btn-therapist">
      Therapist
    </button>
  </div>
</div>

<!-- ===== CLIENT ===== -->
<div id="client-view" class="screen">
  <div class="topbar">
    <h2>Client</h2>
    <button class="back-btn" onclick="goHome()">← Home</button>
  </div>
  <div class="container">

    <div class="card" id="client-picker-card">
      <label>Who's practicing?</label>
      <div id="client-select-list"></div>
    </div>

    <div class="card" id="client-session-setup" style="display:none;">
      <div class="row" style="justify-content:space-between;">
        <div><strong id="active-client-name"></strong></div>
      </div>
      <div style="margin-top:14px;">
        <label>Exercise</label>
        <div class="passage-text" id="client-exercise-display"></div>
      </div>
    </div>

  </div>
</div>

<!-- ===== THERAPIST ===== -->
<div id="therapist-view" class="screen">
  <div class="topbar">
    <h2>Therapist</h2>
    <button class="back-btn" onclick="goHome()">← Home</button>
  </div>
  <div class="container">

    <div class="card">
      <label>Clients</label>
      <div id="therapist-client-list" class="client-btn-row"></div>
      <div id="add-client-form" class="row" style="margin-top:10px; display:none;">
        <input type="text" id="therapist-new-client" placeholder="Username...">
        <button class="btn green" onclick="therapistAddClient()">Save</button>
      </div>
    </div>

  </div>
</div>

<!-- ===== CLIENT DETAIL (therapist view of one client) ===== -->
<div id="client-detail-view" class="screen">
  <div class="topbar">
    <h2 id="detail-client-name"></h2>
    <button class="back-btn" onclick="showScreen('therapist-view'); renderTherapistView();">← Therapist</button>
  </div>
  <div class="container">

    <div class="card">
      <label>Exercise</label>
      <textarea id="detail-exercise-text" placeholder="Type an exercise for this client..."></textarea>
      <div class="row" style="margin-top:8px;">
        <button class="btn" onclick="saveExercise()">Save</button>
        <span id="exercise-saved-note" style="color:#219150; font-weight:600; font-size:0.9rem; display:none;">Saved ✓</span>
      </div>
    </div>

    <div class="card">
      <button class="btn danger" onclick="deleteActiveDetailClient()">Remove client</button>
    </div>

  </div>
</div>

<script>
/* ===================== DATA ===================== */
function loadClients() {
  return JSON.parse(localStorage.getItem('st_clients') || '[]');
}
function saveClients(list) {
  localStorage.setItem('st_clients', JSON.stringify(list));
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ===================== NAV ===================== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() { showScreen('landing'); }

document.getElementById('btn-client').addEventListener('click', () => {
  showScreen('client-view');
  renderClientPicker();
});
document.getElementById('btn-therapist').addEventListener('click', () => {
  showScreen('therapist-view');
  renderTherapistView();
});

/* ===================== CLIENT FLOW ===================== */
let activeClientId = null;

function renderClientPicker() {
  document.getElementById('client-session-setup').style.display = 'none';
  document.getElementById('client-picker-card').style.display = 'block';

  const clients = loadClients();
  const listEl = document.getElementById('client-select-list');
  listEl.innerHTML = '';
  if (clients.length === 0) {
    listEl.innerHTML = '<div class="empty-note">No clients yet — ask your therapist to set one up.</div>';
  }
  clients.forEach(c => {
    const div = document.createElement('div');
    div.className = 'client-list-item';
    div.innerHTML = `<div class="client-name">${escapeHtml(c.name)}</div><div>→</div>`;
    div.onclick = () => selectClient(c.id);
    listEl.appendChild(div);
  });
}

function selectClient(id) {
  activeClientId = id;
  const client = loadClients().find(c => c.id === id);
  document.getElementById('client-picker-card').style.display = 'none';
  document.getElementById('client-session-setup').style.display = 'block';
  document.getElementById('active-client-name').textContent = client.name;
  document.getElementById('client-exercise-display').textContent = client.exercise || 'No exercise assigned yet.';
}

/* ===================== THERAPIST FLOW ===================== */
let activeDetailClientId = null;

function renderTherapistView() {
  renderTherapistClientList();
}

function renderTherapistClientList() {
  const clients = loadClients();
  const listEl = document.getElementById('therapist-client-list');
  listEl.innerHTML = '';
  clients.forEach(c => {
    const wrap = document.createElement('span');
    wrap.className = 'client-btn-wrap';

    const btn = document.createElement('button');
    btn.className = 'client-btn';
    btn.textContent = c.name;
    btn.onclick = () => {
      activeDetailClientId = c.id;
      showScreen('client-detail-view');
      renderClientDetail(c.id);
    };

    const del = document.createElement('button');
    del.className = 'client-btn-delete';
    del.textContent = '×';
    del.title = 'Remove client';
    del.onclick = (e) => {
      e.stopPropagation();
      deleteClient(c.id);
    };

    wrap.appendChild(btn);
    wrap.appendChild(del);
    listEl.appendChild(wrap);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'client-btn add-client-btn';
  addBtn.textContent = '+';
  addBtn.onclick = showAddClientForm;
  listEl.appendChild(addBtn);
}

function showAddClientForm() {
  document.getElementById('add-client-form').style.display = 'flex';
  const input = document.getElementById('therapist-new-client');
  input.value = '';
  input.focus();
}

function therapistAddClient() {
  const input = document.getElementById('therapist-new-client');
  const name = input.value.trim();
  if (!name) return;
  const clients = loadClients();
  clients.push({ id: uid(), name, sounds: [] });
  saveClients(clients);
  input.value = '';
  document.getElementById('add-client-form').style.display = 'none';
  renderTherapistClientList();
}

function renderClientDetail(clientId) {
  const clients = loadClients();
  const client = clients.find(c => c.id === clientId);
  if (!client) { showScreen('therapist-view'); renderTherapistView(); return; }
  document.getElementById('detail-client-name').textContent = client.name;
  document.getElementById('detail-exercise-text').value = client.exercise || '';
  document.getElementById('exercise-saved-note').style.display = 'none';
}

function saveExercise() {
  if (!activeDetailClientId) return;
  const clients = loadClients();
  const client = clients.find(c => c.id === activeDetailClientId);
  if (!client) return;
  client.exercise = document.getElementById('detail-exercise-text').value;
  saveClients(clients);

  const note = document.getElementById('exercise-saved-note');
  note.style.display = 'inline';
  clearTimeout(saveExercise._timer);
  saveExercise._timer = setTimeout(() => { note.style.display = 'none'; }, 1500);
}

function deleteClient(clientId) {
  if (!confirm('Remove this client?')) return;
  let clients = loadClients().filter(c => c.id !== clientId);
  saveClients(clients);
  if (activeDetailClientId === clientId) {
    activeDetailClientId = null;
    showScreen('therapist-view');
  }
  renderTherapistClientList();
}

function deleteActiveDetailClient() {
  if (!activeDetailClientId) return;
  deleteClient(activeDetailClientId);
}

/* ===================== UTIL ===================== */
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}
</script>
</body>
</html>

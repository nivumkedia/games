function nearestEnemy() {
    if (enemies.length === 0) return null;
    const playerCenter = centerOf(player);
    let nearest = null;
    let nearestDistance = Infinity;
    enemies.forEach(enemy => {
        const enemyCenter = centerOf(enemy);
        const distance = Math.hypot(enemyCenter.x - playerCenter.x, enemyCenter.y - playerCenter.y);
        if (distance < nearestDistance) {
            nearest = enemy;
            nearestDistance = distance;
        }
    });
    return nearest;
}

function defaultSwordAngle() {
    return player.facing > 0 ? -0.42 : Math.PI + 0.42;
}

function swordAimAngle() {
    const enemy = nearestEnemy();
    if (!enemy) return defaultSwordAngle();
    const playerCenter = centerOf(player);
    const enemyCenter = centerOf(enemy);
    return Math.atan2(enemyCenter.y - playerCenter.y, enemyCenter.x - playerCenter.x);
}

function swordHitsEnemy(enemy, angle) {
    return directionalHit(enemy, angle, swordReach(), swordThickness());
}

function directionalHit(enemy, angle, reach, thickness) {
    const playerCenter = centerOf(player);
    const enemyCenter = centerOf(enemy);
    const dx = enemyCenter.x - playerCenter.x;
    const dy = enemyCenter.y - playerCenter.y;
    const forward = dx * Math.cos(angle) + dy * Math.sin(angle);
    if (forward < 0 || forward > reach) return false;
    const side = Math.abs(-dx * Math.sin(angle) + dy * Math.cos(angle));
    const enemyRadius = Math.max(enemy.w, enemy.h) / 2;
    return side <= thickness / 2 + enemyRadius;
}

function radialHit(enemy, radius) {
    const playerCenter = centerOf(player);
    const enemyCenter = centerOf(enemy);
    return Math.hypot(enemyCenter.x - playerCenter.x, enemyCenter.y - playerCenter.y) <= radius + Math.max(enemy.w, enemy.h) / 2;
}

function enemyAttackBox(enemy) {
    const padX = enemy.attackPadX || 26;
    const padY = enemy.attackPadY || 24;
    return {
        x: enemy.x - padX,
        y: enemy.y - padY,
        w: enemy.w + padX * 2,
        h: enemy.h + padY * 2
    };
}

function playerShielded() {
    return player.shieldTimer > 0;
}

function playerDucking() {
    return duckUnlocked && keys.duck && player.grounded;
}

function playerBlocking() {
    return (keys.block || playerShielded()) && !playerDucking();
}

function playerArrowBox() {
    if (!playerDucking()) return player;
    return {
        x: player.x,
        y: player.y + 30,
        w: player.w,
        h: player.h - 30
    };
}

function currentCharacter() {
    return characters[currentCharacterId] || characters.azure;
}

function applyCharacterBuild(keepFeet = false) {
    const character = currentCharacter();
    const oldBottom = player.y + player.h;
    player.w = character.width;
    player.h = character.height;
    if (keepFeet) player.y = oldBottom - player.h;
}

function syncCharacterSelect() {
    characterButtons.forEach(button => {
        button.classList.toggle("selected", button.dataset.character === currentCharacterId);
    });
}

function chooseCharacter(characterId) {
    if (!characters[characterId]) return;
    currentCharacterId = characterId;
    applyCharacterBuild();
    respawn();
    gameOver = false;
    gameStarted = true;
    characterSelect.classList.add("hidden");
    loseScreen.classList.add("hidden");
    syncCharacterSelect();
}

function angleDifference(a, b) {
    return Math.atan2(Math.sin(a - b), Math.cos(a - b));
}

function nearestBlockThreat() {
    const playerCenter = centerOf(player);
    let nearest = null;
    let nearestDistance = Infinity;
    const consider = threat => {
        const threatCenter = centerOf(threat);
        const distance = Math.hypot(threatCenter.x - playerCenter.x, threatCenter.y - playerCenter.y);
        if (distance < nearestDistance) {
            nearest = threat;
            nearestDistance = distance;
        }
    };

    arrows.forEach(consider);
    enemies.forEach(enemy => {
        if (enemyHasSword(enemy) && enemy.attackTimer > 0) consider(enemy);
    });
    if (!nearest) enemies.forEach(enemy => {
        if (enemyHasSword(enemy)) consider(enemy);
    });
    return nearest;
}

function swordBlockAngle() {
    const threat = nearestBlockThreat();
    if (!threat) return defaultSwordAngle();
    const playerCenter = centerOf(player);
    const threatCenter = centerOf(threat);
    return Math.atan2(threatCenter.y - playerCenter.y, threatCenter.x - playerCenter.x);
}

function swordBlocksHit(source) {
    if (!playerBlocking() || !source) return false;
    const playerCenter = centerOf(player);
    const sourceCenter = centerOf(source);
    const angleToSource = Math.atan2(sourceCenter.y - playerCenter.y, sourceCenter.x - playerCenter.x);
    const blockAngle = swordBlockAngle();
    const distance = Math.hypot(sourceCenter.x - playerCenter.x, sourceCenter.y - playerCenter.y);
    const blocked = Math.abs(angleDifference(angleToSource, blockAngle)) <= 1.08 && distance <= swordBlockReach();
    if (blocked) {
        if (player.blockFlashTimer <= 0) spawnBlockSparks(source, blockAngle);
        player.blockFlashTimer = 8;
    }
    return blocked;
}

function enemyKillReward(enemy) {
    if (enemy.type === "bigFlyer") return 5;
    if (enemy.type === "archer" || enemy.type === "aimArcher" || enemy.type === "shieldArcher" || enemy.type === "jumpArcher") return 4;
    if (enemy.type === "chaosSentry") return 3;
    if (enemy.type === "jumpSentry") return 3;
    if (enemy.type === "sentry") return 2;
    return 1;
}

function attackBreaksArmor(enemy, attackKind, comboLevel = 1) {
    if (!enemy.armor) return true;
    if (attackKind === "slam") return true;
    if (enemy.armor === "combo") return comboLevel >= 2 || attackKind === "heavy" || attackKind === "spear" || attackKind === "arrow";
    if (enemy.armor === "heavy") return attackKind === "heavy" || attackKind === "spear" || attackKind === "arrow";
    if (enemy.armor === "pierce") return attackKind === "spear" || attackKind === "arrow";
    if (enemy.armor === "ranged") return attackKind === "arrow";
    return true;
}

function armorLabel(armor) {
    if (armor === "combo") return "COMBO";
    if (armor === "heavy") return "HEAVY";
    if (armor === "pierce") return "PIERCE";
    if (armor === "ranged") return "ARROW";
    return "";
}

function playerArcheryRange() {
    return ([720, 1440, 2160][archeryRangeLevel] || 720) + (currentCharacter().archeryRangeBonus || 0);
}

function defeatEnemy(index) {
    const defeatedEnemy = enemies[index];
    enemies.splice(index, 1);
    killsThisLevel += 1;
    killBank += enemyKillReward(defeatedEnemy);
    updateHud();
}

function tryDefeatEnemy(index, attackKind, comboLevel = 1) {
    const enemy = enemies[index];
    if (!attackBreaksArmor(enemy, attackKind, comboLevel)) {
        spawnArmorPing(enemy);
        enemy.armorFlashTimer = 16;
        return false;
    }
    defeatEnemy(index);
    return true;
}

function updateCombatEffects() {
    for (let i = combatEffects.length - 1; i >= 0; i--) {
        const effect = combatEffects[i];
        effect.life -= 1;
        if (effect.type === "spark") {
            effect.x += effect.vx;
            effect.y += effect.vy;
            effect.vy += 0.18;
            effect.vx *= 0.94;
        }
        if (effect.life <= 0) combatEffects.splice(i, 1);
    }
}

function assignEnemyArmor(enemy, index) {
    if (enemy.armor) return enemy.armor;
    if (index < ADVANCED_COMBAT_START_LEVEL) return null;
    if (enemy.type === "archer" || enemy.type === "aimArcher" || enemy.type === "shieldArcher" || enemy.type === "jumpArcher") return "ranged";
    if (enemy.type === "bigFlyer") return "pierce";
    if (enemy.type === "sentry" || enemy.type === "jumpSentry" || enemy.type === "chaosSentry") return "heavy";
    if (enemy.type === "pattern" || enemy.type === "chaos" || enemy.type === "wanderer") return "combo";
    return null;
}

function enemyWeaponTierForLevel(index) {
    if (index >= ADVANCED_COMBAT_START_LEVEL + 2) return 3;
    if (index >= ADVANCED_COMBAT_START_LEVEL + 1) return 2;
    if (index >= ADVANCED_COMBAT_START_LEVEL) return 1;
    return 0;
}

function shootArrow(enemy) {
    const playerCenter = player.x + player.w / 2;
    const enemyCenter = enemy.x + enemy.w / 2;
    const direction = playerCenter >= enemyCenter ? 1 : -1;
    let vx = direction * 10.5;
    let vy = 0;
    let arrowStartX = direction > 0 ? enemy.x + enemy.w : enemy.x - 34;
    let arrowStartY = enemy.y + 14;
    if (enemy.type === "aimArcher" || enemy.type === "shieldArcher" || enemy.type === "jumpArcher") {
        const targetX = player.x + player.w / 2;
        const targetY = player.y + player.h / 2;
        const dx = targetX - arrowStartX;
        const dy = targetY - arrowStartY;
        const distance = Math.max(1, Math.hypot(dx, dy));
        const speed = 10.8;
        vx = (dx / distance) * speed;
        vy = (dy / distance) * speed;
    }
    const arrowAngle = Math.atan2(vy, vx);
    arrows.push({
        x: arrowStartX,
        y: arrowStartY,
        w: 34,
        h: 6,
        vx,
        vy,
        breaksShield: enemy.type === "shieldArcher",
        distance: 0,
        maxDistance: enemy.shootRange || 680
    });
    spawnArrowRelease(arrowStartX, arrowStartY + 3, arrowAngle, enemy.type === "shieldArcher" ? "#8deaff" : "#ffd166");
}

function firePlayerArrow(clientX, clientY) {
    if (!archeryUnlocked || !archeryReady) return;
    const startX = player.x + player.w / 2;
    const startY = player.y + player.h / 2;
    const targetX = clientX + cameraX;
    const targetY = clientY;
    const dx = targetX - startX;
    const dy = targetY - startY;
    const distance = Math.max(1, Math.hypot(dx, dy));
    const speed = 12;
    const arrowAngle = Math.atan2(dy, dx);
    playerArrows.push({
        x: startX,
        y: startY,
        w: 34,
        h: 6,
        vx: (dx / distance) * speed,
        vy: (dy / distance) * speed,
        distance: 0,
        maxDistance: playerArcheryRange()
    });
    spawnArrowRelease(startX, startY, arrowAngle, "#49ffa8");
    archeryReady = false;
}

function shieldDurationSeconds() {
    return Math.max(0.65, 1 + shieldUpgradeLevel * 0.5 + (currentCharacter().shieldBonus || 0));
}

function formatSeconds(value) {
    return Number.isInteger(value) ? `${value}` : `${value.toFixed(1)}`;
}

function clampLevel(value) {
    return Math.max(0, Math.min(levels.length - 1, value));
}

function clampUpgrade(value) {
    return Math.max(0, Math.min(3, value));
}

function resize() {
    const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 1.25));
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function loadLevel(index, resetLives = false) {
    const level = levels[index];
    levelIndex = index;
    gameOver = false;
    loseScreen.classList.add("hidden");
    world.width = level.width;
    start = { ...level.start };
    goal = { ...level.goal };
    applyCharacterBuild();
    platforms = level.platforms.map(platform => ({ ...platform }));
    enemies = level.enemies.map(enemy => ({
        ...enemy,
        baseY: enemy.y,
        armor: assignEnemyArmor(enemy, index),
        weaponTier: enemyWeaponTierForLevel(index),
        armorFlashTimer: 0,
        vx: 0,
        vy: 0,
        jumpTimer: randomJumpDelay(),
        moveTimer: randomMoveDelay(),
        patternIndex: 0,
        patternTimer: enemy.stepTime || 1,
        attackClock: enemy.attackOffset || 5,
        attackTimer: 0
    }));
    enemies.forEach(enemy => {
        if (enemy.type === "wanderer") chooseEnemyDirection(enemy);
        if (enemy.type === "chaos" || enemy.type === "chaosSentry" || enemy.type === "bigFlyer") chooseChaosDirection(enemy);
    });
    if (resetLives) lives = STARTING_LIVES;
    shieldUnlocked = index >= 7;
    duckUnlocked = index >= 10;
    archeryUnlocked = index >= 13;
    heavyUnlocked = index >= ADVANCED_COMBAT_START_LEVEL;
    spearUnlocked = index >= ADVANCED_COMBAT_START_LEVEL + 1;
    slamUnlocked = index >= ADVANCED_COMBAT_START_LEVEL + 2;
    archeryReady = false;
    arrows = [];
    playerArrows = [];
    combatEffects = [];
    comboStep = 0;
    comboTimer = 0;
    killsThisLevel = 0;
    updateHud();
    respawn();
}

function updateHud() {
    const level = levels[levelIndex];
    let extra = "";
    if (heavyUnlocked && levelIndex === ADVANCED_COMBAT_START_LEVEL) extra = " New: Press 5/U for a heavy slash that breaks heavy armor.";
    if (spearUnlocked && levelIndex === ADVANCED_COMBAT_START_LEVEL + 1) extra = " New: Press 6/I for a spear thrust that pierces armor.";
    if (slamUnlocked && levelIndex === ADVANCED_COMBAT_START_LEVEL + 2) extra = " New: Press 7/O while grounded for a ground slam.";
    setInstruction(`${level.intro || level.name}${extra}`);
    updateLivesCounter();
    updateShop();
}

function updateLivesCounter() {
    livesCounter.textContent = `Lives ${lives}`;
}

function setInstruction(text) {
    hud.textContent = text;
    if (text === lastHudText) return;
    lastHudText = text;
    showInstructionCallout(text);
}

function showInstructionCallout(text) {
    const hudRect = hud.getBoundingClientRect();
    instructionCallout.textContent = text;
    instructionCallout.style.setProperty("--target-x", `${hudRect.left + hudRect.width / 2}px`);
    instructionCallout.style.setProperty("--target-y", `${hudRect.top + hudRect.height / 2}px`);
    instructionCallout.classList.remove("play");
    void instructionCallout.offsetWidth;
    instructionCallout.classList.add("play");
}

function respawn() {
    player.x = start.x;
    player.y = start.y;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.facing = 1;
    player.attackTimer = 0;
    player.attackAngle = defaultSwordAngle();
    player.blockAngle = defaultSwordAngle();
    player.blockFlashTimer = 0;
    player.shieldTimer = 0;
    cameraX = 0;
}

function takeHit(source = null) {
    if (swordBlocksHit(source)) return;
    lives -= 1;
    if (lives <= 0) {
        showLoseScreen();
        return;
    }
    respawn();
    updateLivesCounter();
}

function showLoseScreen() {
    lives = 0;
    updateLivesCounter();
    gameStarted = false;
    gameOver = true;
    archeryReady = false;
    shopPanel.classList.remove("open");
    loseLine.textContent = `You ran out of lives on ${levels[levelIndex].name}.`;
    loseScreen.classList.remove("hidden");
}

function retryAfterLoss() {
    loseScreen.classList.add("hidden");
    gameOver = false;
    gameStarted = true;
    loadLevel(levelIndex, true);
}

function attack() {
    player.attackTimer = 14;
    player.attackAngle = swordAimAngle();
    spawnSwordTrail(player.attackAngle);
    for (let i = enemies.length - 1; i >= 0; i--) {
        if (!swordHitsEnemy(enemies[i], player.attackAngle)) continue;
        const enemyCenter = centerOf(enemies[i]);
        spawnHitSparks(enemyCenter.x, enemyCenter.y, player.attackAngle);
        defeatEnemy(i);
    }
}

function shield() {
    if (!shieldUnlocked) return;
    if (playerShielded()) return;
    player.shieldTimer = shieldDurationSeconds() * 60;
    player.blockAngle = swordBlockAngle();
}

function attackUpgradeCost() {
    return 10 + attackUpgradeLevel;
}

function shieldUpgradeCost() {
    return 15 + shieldUpgradeLevel * 5;
}

function archeryUpgradeCost() {
    return archeryRangeLevel === 0 ? 30 : 40;
}

function updateShop() {
    if (attackUpgradeLevel >= 3) {
        shopInfo.textContent = `Kills: ${killBank}. Attack range is maxed out. Sword block time ${shieldUpgradeLevel}/3.`;
        attackUpgradeBtn.textContent = "Maxed Out";
        attackUpgradeBtn.disabled = true;
    } else {
        const attackCost = attackUpgradeCost();
        attackUpgradeBtn.textContent = `Buy Attack Range (${attackCost})`;
        attackUpgradeBtn.disabled = killBank < attackCost;
    }

    if (!shieldUnlocked) {
        shieldUpgradeBtn.textContent = "Sword Block Locked";
        shieldUpgradeBtn.disabled = true;
    } else if (shieldUpgradeLevel >= 3) {
        shieldUpgradeBtn.textContent = "Sword Block Maxed";
        shieldUpgradeBtn.disabled = true;
    } else {
        const shieldCost = shieldUpgradeCost();
        shieldUpgradeBtn.textContent = `Buy Sword Block Time (${shieldCost})`;
        shieldUpgradeBtn.disabled = killBank < shieldCost;
    }

    if (!archeryUnlocked) {
        archeryUpgradeBtn.textContent = "Archery Locked";
        archeryUpgradeBtn.disabled = true;
    } else if (archeryRangeLevel >= 2) {
        archeryUpgradeBtn.textContent = "Archery Maxed Out";
        archeryUpgradeBtn.disabled = true;
    } else {
        const archeryCost = archeryUpgradeCost();
        const nextRange = archeryRangeLevel + 2;
        archeryUpgradeBtn.textContent = `Buy ${nextRange}-Platform Shot (${archeryCost})`;
        archeryUpgradeBtn.disabled = killBank < archeryCost;
    }

    const attackLine = attackUpgradeLevel >= 3
        ? "Attack range maxed"
        : `Attack range ${attackUpgradeLevel}/3, next ${attackUpgradeCost()} kills`;
    const shieldLine = shieldUpgradeLevel >= 3
        ? `Sword block maxed at ${formatSeconds(shieldDurationSeconds())} sec`
        : shieldUnlocked
            ? `Sword block time ${shieldUpgradeLevel}/3, next ${shieldUpgradeCost()} kills`
            : "Sword block time locked until Level 8";
    const archeryLine = archeryRangeLevel >= 2
        ? "Archery range maxed at 3 platforms"
        : archeryUnlocked
            ? `Archery range ${archeryRangeLevel + 1} platform, next ${archeryUpgradeCost()} kills`
            : "Archery range locked until Level 14";
    shopInfo.textContent = `Kills: ${killBank}. ${attackLine}. ${shieldLine}. ${archeryLine}.`;
}

function buyAttackUpgrade() {
    if (attackUpgradeLevel >= 3) return;
    const cost = attackUpgradeCost();
    if (killBank < cost) return;
    killBank -= cost;
    attackUpgradeLevel += 1;
    updateHud();
}

function buyShieldUpgrade() {
    if (!shieldUnlocked) return;
    if (shieldUpgradeLevel >= 3) return;
    const cost = shieldUpgradeCost();
    if (killBank < cost) return;
    killBank -= cost;
    shieldUpgradeLevel += 1;
    updateHud();
}

function buyArcheryUpgrade() {
    if (!archeryUnlocked) return;
    if (archeryRangeLevel >= 2) return;
    const cost = archeryUpgradeCost();
    if (killBank < cost) return;
    killBank -= cost;
    archeryRangeLevel += 1;
    updateHud();
}

function saveGame() {
    const saveData = {
        levelIndex,
        lives,
        killBank,
        attackUpgradeLevel,
        shieldUpgradeLevel,
        archeryRangeLevel,
        currentCharacterId
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    saveBtn.textContent = "Saved";
    if (saveResetTimer) clearTimeout(saveResetTimer);
    saveResetTimer = setTimeout(() => {
        saveBtn.textContent = "Save";
    }, 1200);
}

function resetProgress() {
    if (!confirm("Reset all Battlebound progress? This cannot be undone.")) return;
    localStorage.removeItem(SAVE_KEY);
    Object.keys(keys).forEach(key => {
        keys[key] = false;
    });
    killBank = 0;
    attackUpgradeLevel = 0;
    shieldUpgradeLevel = 0;
    archeryRangeLevel = 0;
    currentCharacterId = "azure";
    gameStarted = false;
    gameOver = false;
    shopPanel.classList.remove("open");
    loseScreen.classList.add("hidden");
    characterSelect.classList.remove("hidden");
    if (saveResetTimer) clearTimeout(saveResetTimer);
    saveBtn.textContent = "Save";
    lastHudText = "";
    loadLevel(0, true);
    syncCharacterSelect();
}

function loadSavedGame() {
    let saveData = null;
    try {
        saveData = JSON.parse(localStorage.getItem(SAVE_KEY));
    } catch (error) {
        saveData = null;
    }
    if (!saveData || typeof saveData !== "object") return false;

    killBank = Math.max(0, Number(saveData.killBank) || 0);
    attackUpgradeLevel = clampUpgrade(Number(saveData.attackUpgradeLevel) || 0);
    shieldUpgradeLevel = clampUpgrade(Number(saveData.shieldUpgradeLevel) || 0);
    archeryRangeLevel = Math.max(0, Math.min(2, Number(saveData.archeryRangeLevel) || 0));
    lives = Math.max(1, Math.min(STARTING_LIVES, Number(saveData.lives) || STARTING_LIVES));
    if (characters[saveData.currentCharacterId]) currentCharacterId = saveData.currentCharacterId;
    loadLevel(clampLevel(Number(saveData.levelIndex) || 0));
    return true;
}

function gateUnlocked() {
    return enemies.length === 0;
}

function completeLevel() {
    if (!gateUnlocked()) return;
    if (levelIndex >= levels.length - 1) {
        loadLevel(0, true);
        return;
    }
    loadLevel(levelIndex + 1);
}

function update() {
    enemies.forEach(enemy => {
        if (enemy.type === "jumper") {
            const t = performance.now() / 1000 + enemy.jumpOffset;
            const hop = Math.max(0, Math.sin(t * 3.4));
            enemy.y = enemy.baseY - hop * 76;
        }

        if (enemy.type === "randomJumper") {
            enemy.jumpTimer -= 1 / 60;
            if (enemy.jumpTimer <= 0 && enemy.y >= enemy.baseY) {
                enemy.vy = -14;
                enemy.jumpTimer = randomJumpDelay();
            }
            enemy.vy += 0.62;
            enemy.y += enemy.vy;
            if (enemy.y > enemy.baseY) {
                enemy.y = enemy.baseY;
                enemy.vy = 0;
            }
        }

        if (enemy.type === "jumpSentry") {
            enemy.jumpTimer -= 1 / 60;
            if (enemy.jumpTimer <= 0 && enemy.y >= enemy.baseY) {
                enemy.vy = -15;
                enemy.jumpTimer = randomJumpDelay();
            }
            enemy.vy += 0.66;
            enemy.y += enemy.vy;
            if (enemy.y > enemy.baseY) {
                enemy.y = enemy.baseY;
                enemy.vy = 0;
            }
            enemy.attackClock -= 1 / 60;
            if (enemy.attackClock <= 0) {
                enemy.attackTimer = 0.6;
                enemy.attackClock = 3;
            }
            if (enemy.attackTimer > 0) {
                enemy.attackTimer -= 1 / 60;
                if (rectsOverlap(player, enemyAttackBox(enemy))) takeHit(enemy);
            }
        }

        if (enemy.type === "wanderer") {
            enemy.moveTimer -= 1 / 60;
            if (enemy.moveTimer <= 0) chooseEnemyDirection(enemy);
            enemy.x += enemy.vx;
            enemy.y += enemy.vy;
            if (enemy.x < enemy.minX || enemy.x + enemy.w > enemy.maxX) {
                enemy.vx *= -1;
                enemy.x = Math.max(enemy.minX, Math.min(enemy.maxX - enemy.w, enemy.x));
            }
            if (enemy.y < enemy.minY || enemy.y + enemy.h > enemy.maxY) {
                enemy.vy *= -1;
                enemy.y = Math.max(enemy.minY, Math.min(enemy.maxY - enemy.h, enemy.y));
            }
        }

        if (enemy.type === "chaos") {
            enemy.moveTimer -= 1 / 60;
            if (enemy.moveTimer <= 0) chooseChaosDirection(enemy);
            enemy.x += enemy.vx;
            enemy.y += enemy.vy;
            if (enemy.x < enemy.minX || enemy.x + enemy.w > enemy.maxX) {
                enemy.vx *= -1;
                enemy.x = Math.max(enemy.minX, Math.min(enemy.maxX - enemy.w, enemy.x));
                enemy.moveTimer = Math.min(enemy.moveTimer, 0.4);
            }
            if (enemy.y < enemy.minY || enemy.y + enemy.h > enemy.maxY) {
                enemy.vy *= -1;
                enemy.y = Math.max(enemy.minY, Math.min(enemy.maxY - enemy.h, enemy.y));
                enemy.moveTimer = Math.min(enemy.moveTimer, 0.4);
            }
        }

        if (enemy.type === "chaosSentry") {
            enemy.moveTimer -= 1 / 60;
            if (enemy.moveTimer <= 0) chooseChaosDirection(enemy);
            enemy.x += enemy.vx;
            enemy.y += enemy.vy;
            if (enemy.x < enemy.minX || enemy.x + enemy.w > enemy.maxX) {
                enemy.vx *= -1;
                enemy.x = Math.max(enemy.minX, Math.min(enemy.maxX - enemy.w, enemy.x));
                enemy.moveTimer = Math.min(enemy.moveTimer, 0.4);
            }
            if (enemy.y < enemy.minY || enemy.y + enemy.h > enemy.maxY) {
                enemy.vy *= -1;
                enemy.y = Math.max(enemy.minY, Math.min(enemy.maxY - enemy.h, enemy.y));
                enemy.moveTimer = Math.min(enemy.moveTimer, 0.4);
            }
            enemy.attackClock -= 1 / 60;
            if (enemy.attackClock <= 0) {
                enemy.attackTimer = 0.6;
                enemy.attackClock = 3;
            }
            if (enemy.attackTimer > 0) {
                enemy.attackTimer -= 1 / 60;
                if (rectsOverlap(player, enemyAttackBox(enemy))) takeHit(enemy);
            }
        }

        if (enemy.type === "bigFlyer") {
            enemy.moveTimer -= 1 / 60;
            if (enemy.moveTimer <= 0) chooseChaosDirection(enemy);
            enemy.x += enemy.vx;
            enemy.y += enemy.vy;
            if (enemy.x < enemy.minX || enemy.x + enemy.w > enemy.maxX) {
                enemy.vx *= -1;
                enemy.x = Math.max(enemy.minX, Math.min(enemy.maxX - enemy.w, enemy.x));
                enemy.moveTimer = Math.min(enemy.moveTimer, 0.4);
            }
            if (enemy.y < enemy.minY || enemy.y + enemy.h > enemy.maxY) {
                enemy.vy *= -1;
                enemy.y = Math.max(enemy.minY, Math.min(enemy.maxY - enemy.h, enemy.y));
                enemy.moveTimer = Math.min(enemy.moveTimer, 0.4);
            }
            if (rectsOverlap(player, enemy)) takeHit();
            enemy.attackClock -= 1 / 60;
            if (enemy.attackClock <= 0) {
                enemy.attackTimer = 0.7;
                enemy.attackClock = 3;
            }
            if (enemy.attackTimer > 0) {
                enemy.attackTimer -= 1 / 60;
                if (rectsOverlap(player, enemyAttackBox(enemy))) takeHit(enemy);
            }
        }

        if (enemy.type === "jumpArcher") {
            enemy.jumpTimer -= 1 / 60;
            if (enemy.jumpTimer <= 0 && enemy.y >= enemy.baseY) {
                enemy.vy = -14.5;
                enemy.jumpTimer = randomJumpDelay();
            }
            enemy.vy += 0.64;
            enemy.y += enemy.vy;
            if (enemy.y > enemy.baseY) {
                enemy.y = enemy.baseY;
                enemy.vy = 0;
            }
        }

        if (enemy.type === "archer" || enemy.type === "aimArcher" || enemy.type === "shieldArcher" || enemy.type === "jumpArcher") {
            enemy.attackClock -= 1 / 60;
            if (enemy.attackClock <= 0) {
                if (Math.abs((player.x + player.w / 2) - (enemy.x + enemy.w / 2)) <= (enemy.shootRange || 680)) {
                    shootArrow(enemy);
                }
                enemy.attackClock = 3.6;
            }
        }

        if (enemy.type === "pattern") {
            enemy.patternTimer -= 1 / 60;
            if (enemy.patternTimer <= 0) {
                enemy.patternIndex = (enemy.patternIndex + 1) % enemy.pattern.length;
                enemy.patternTimer = enemy.stepTime;
            }
            const direction = enemy.pattern[enemy.patternIndex];
            enemy.x += direction[0] * enemy.speed;
            enemy.y += direction[1] * enemy.speed;
        }

        if (enemy.type === "sentry") {
            enemy.attackClock -= 1 / 60;
            if (enemy.attackClock <= 0) {
                enemy.attackTimer = 0.55;
                enemy.attackClock = 5;
            }
            if (enemy.attackTimer > 0) {
                enemy.attackTimer -= 1 / 60;
                if (rectsOverlap(player, enemyAttackBox(enemy))) takeHit(enemy);
            }
        }
    });

    for (let i = arrows.length - 1; i >= 0; i--) {
        const arrow = arrows[i];
        arrow.x += arrow.vx;
        arrow.y += arrow.vy || 0;
        arrow.distance += Math.hypot(arrow.vx, arrow.vy || 0);
        if (arrow.distance > arrow.maxDistance || arrow.x < -80 || arrow.x > world.width + 80) {
            arrows.splice(i, 1);
            continue;
        }
        if (rectsOverlap(arrow, playerArrowBox())) {
            const blocked = swordBlocksHit(arrow);
            if (!blocked) spawnArrowImpact(arrow.x + arrow.w / 2, arrow.y + arrow.h / 2, Math.atan2(arrow.vy || 0, arrow.vx), arrow.breaksShield ? "#8deaff" : "#ffd166");
            arrows.splice(i, 1);
            if (blocked) {
                if (arrow.breaksShield) player.shieldTimer = 0;
                continue;
            }
            takeHit(arrow);
        }
    }

    for (let i = playerArrows.length - 1; i >= 0; i--) {
        const arrow = playerArrows[i];
        arrow.x += arrow.vx;
        arrow.y += arrow.vy;
        arrow.distance += Math.hypot(arrow.vx, arrow.vy);
        if (arrow.distance > arrow.maxDistance || arrow.x < -80 || arrow.x > world.width + 80) {
            playerArrows.splice(i, 1);
            continue;
        }
        for (let enemyIndex = enemies.length - 1; enemyIndex >= 0; enemyIndex--) {
            if (!rectsOverlap(arrow, enemies[enemyIndex])) continue;
            spawnArrowImpact(arrow.x + arrow.w / 2, arrow.y + arrow.h / 2, Math.atan2(arrow.vy, arrow.vx), "#49ffa8");
            playerArrows.splice(i, 1);
            defeatEnemy(enemyIndex);
            break;
        }
    }

    const character = currentCharacter();
    const speed = player.grounded ? character.groundAccel : character.airAccel;
    if (keys.left) {
        player.vx -= speed;
        player.facing = -1;
    }
    if (keys.right) {
        player.vx += speed;
        player.facing = 1;
    }
    if (!keys.left && !keys.right) player.vx *= player.grounded ? 0.82 : 0.96;
    player.vx = Math.max(-character.maxSpeed, Math.min(character.maxSpeed, player.vx));

    if (keys.jump && player.grounded) {
        player.vy = -character.jumpPower;
        player.grounded = false;
    }

    player.vy += world.gravity;
    if (keys.down && !player.grounded) player.vy += world.gravity * 0.7;
    player.vy = Math.min(player.vy, 18);

    player.x += player.vx;
    for (const platform of platforms) {
        if (!rectsOverlap(player, platform)) continue;
        if (player.vx > 0) player.x = platform.x - player.w;
        if (player.vx < 0) player.x = platform.x + platform.w;
        player.vx = 0;
    }

    player.y += player.vy;
    player.grounded = false;
    for (const platform of platforms) {
        if (!rectsOverlap(player, platform)) continue;
        if (player.vy > 0) {
            player.y = platform.y - player.h;
            player.vy = 0;
            player.grounded = true;
        } else if (player.vy < 0) {
            player.y = platform.y + platform.h;
            player.vy = 0;
        }
    }

    player.x = Math.max(0, Math.min(world.width - player.w, player.x));
    if (player.y > world.height + 180) takeHit();
    if (player.attackTimer > 0) player.attackTimer -= 1;
    if (player.shieldTimer > 0) player.shieldTimer -= 1;
    if (player.blockFlashTimer > 0) player.blockFlashTimer -= 1;
    updateCombatEffects();
    if (playerBlocking()) player.blockAngle = swordBlockAngle();
    if (rectsOverlap(player, goal)) completeLevel();

    cameraX = Math.max(0, Math.min(world.width - window.innerWidth, player.x - window.innerWidth * 0.38));
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.fill();
}

function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    sky.addColorStop(0, "#07101d");
    sky.addColorStop(0.48, "#102744");
    sky.addColorStop(1, "#06101c");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.fillStyle = "rgba(171, 237, 255, 0.72)";
    for (let i = 0; i < 34; i++) {
        const x = (i * 173 - cameraX * 0.08) % (window.innerWidth + 180) - 60;
        const y = 36 + (i * 47) % 210;
        const size = 1 + (i % 3) * 0.6;
        ctx.fillRect(x, y, size, size);
    }

    ctx.fillStyle = "rgba(126, 245, 255, 0.12)";
    ctx.beginPath();
    ctx.arc(window.innerWidth - 118, 92, 46, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(223, 251, 255, 0.78)";
    ctx.beginPath();
    ctx.arc(window.innerWidth - 118, 92, 24, 0, Math.PI * 2);
    ctx.fill();

    const backOffset = -(cameraX * 0.12) % 520;
    ctx.fillStyle = "rgba(35, 78, 116, 0.42)";
    ctx.beginPath();
    ctx.moveTo(backOffset - 120, window.innerHeight);
    for (let x = backOffset - 120; x < window.innerWidth + 620; x += 260) {
        ctx.lineTo(x + 120, window.innerHeight - 235);
        ctx.lineTo(x + 260, window.innerHeight);
    }
    ctx.closePath();
    ctx.fill();

    const frontOffset = -(cameraX * 0.24) % 430;
    ctx.fillStyle = "rgba(18, 52, 82, 0.62)";
    ctx.beginPath();
    ctx.moveTo(frontOffset - 100, window.innerHeight);
    for (let x = frontOffset - 100; x < window.innerWidth + 520; x += 215) {
        ctx.lineTo(x + 96, window.innerHeight - 152);
        ctx.lineTo(x + 215, window.innerHeight);
    }
    ctx.closePath();
    ctx.fill();

    const glow = ctx.createLinearGradient(0, window.innerHeight - 170, 0, window.innerHeight);
    glow.addColorStop(0, "rgba(73, 255, 168, 0)");
    glow.addColorStop(1, "rgba(73, 255, 168, 0.08)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, window.innerHeight - 170, window.innerWidth, 170);
}

function swordGripPoint(angle, mode = "attack") {
    const playerCenter = centerOf(player);
    const side = Math.cos(angle) >= 0 ? 1 : -1;
    const guardLift = mode === "block" ? player.h * -0.1 : player.h * -0.03;
    return {
        x: playerCenter.x + side * (player.w * 0.48 + 3),
        y: playerCenter.y + guardLift
    };
}

function drawSwordHolder(drawY, drawH, character) {
    const side = player.facing >= 0 ? 1 : -1;
    const beltY = drawY + drawH * 0.62;
    const hipX = player.x + player.w / 2 - side * player.w * 0.34;

    ctx.save();
    ctx.fillStyle = "rgba(44, 32, 28, 0.92)";
    roundRect(player.x + player.w * 0.12, beltY - 3, player.w * 0.76, 7, 4);
    ctx.fillStyle = "#cda15b";
    roundRect(player.x + player.w * 0.43, beltY - 5, player.w * 0.14, 11, 3);

    ctx.translate(hipX, beltY + drawH * 0.14);
    ctx.rotate(side * 0.14);
    ctx.fillStyle = "rgba(23, 24, 30, 0.9)";
    roundRect(-4, -2, 8, drawH * 0.36, 4);
    ctx.fillStyle = character.foot;
    roundRect(-5, -4, 10, 5, 3);
    ctx.restore();
}

function drawPlayerCharacter(drawY, drawH, character) {
    const centerX = player.x + player.w / 2;
    const side = player.facing >= 0 ? 1 : -1;
    const headSize = Math.max(15, Math.min(21, player.w * 0.58));
    const headX = centerX;
    const headY = drawY + headSize * 0.5 + 1;
    const torsoY = drawY + headSize * 0.78;
    const torsoH = Math.max(18, drawH - headSize * 0.8 - 9);
    const torsoW = player.w * 0.78;
    const legY = drawY + drawH - 14;
    const legW = Math.max(7, player.w * 0.24);

    ctx.fillStyle = "rgba(6, 13, 24, 0.35)";
    roundRect(player.x + 2, player.y + player.h - 4, player.w - 4, 6, 3);

    ctx.fillStyle = character.foot;
    roundRect(centerX - player.w * 0.34, legY, legW, 13, 4);
    roundRect(centerX + player.w * 0.1, legY, legW, 13, 4);
    ctx.fillStyle = "#13263a";
    roundRect(centerX - player.w * 0.4, player.y + player.h - 7, legW + 5, 5, 3);
    roundRect(centerX + player.w * 0.06, player.y + player.h - 7, legW + 5, 5, 3);

    const armor = ctx.createLinearGradient(0, torsoY, 0, torsoY + torsoH);
    armor.addColorStop(0, character.top);
    armor.addColorStop(0.5, character.mid);
    armor.addColorStop(1, character.bottom);
    ctx.fillStyle = armor;
    roundRect(centerX - torsoW / 2, torsoY, torsoW, torsoH, 7);
    ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
    roundRect(centerX - torsoW * 0.32, torsoY + 4, torsoW * 0.2, torsoH - 9, 5);
    ctx.fillStyle = "rgba(8, 20, 35, 0.22)";
    roundRect(centerX - 2, torsoY + 3, 4, torsoH - 7, 2);

    ctx.fillStyle = character.mid;
    roundRect(centerX - side * torsoW * 0.68, torsoY + 6, player.w * 0.22, torsoH * 0.48, 5);
    roundRect(centerX + side * torsoW * 0.4, torsoY + 7, player.w * 0.2, torsoH * 0.4, 5);

    drawSwordHolder(drawY, drawH, character);

    const helmet = ctx.createLinearGradient(0, headY - headSize / 2, 0, headY + headSize / 2);
    helmet.addColorStop(0, character.top);
    helmet.addColorStop(0.55, character.mid);
    helmet.addColorStop(1, character.bottom);
    ctx.fillStyle = helmet;
    ctx.beginPath();
    ctx.ellipse(headX, headY, headSize * 0.52, headSize * 0.56, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255, 255, 255, 0.24)";
    ctx.beginPath();
    ctx.ellipse(headX - headSize * 0.17, headY - headSize * 0.18, headSize * 0.18, headSize * 0.28, -0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#09213a";
    const eyeSize = Math.max(3, headSize * 0.18);
    ctx.fillRect(headX - headSize * 0.24, headY - eyeSize * 0.3, eyeSize, eyeSize);
    ctx.fillRect(headX + headSize * 0.08, headY - eyeSize * 0.3, eyeSize, eyeSize);
    ctx.fillStyle = "rgba(8, 20, 35, 0.35)";
    roundRect(headX - headSize * 0.4, headY + headSize * 0.23, headSize * 0.8, 3, 2);
}

function drawSword(angle, active, mode = "attack") {
    const grip = swordGripPoint(angle, mode);
    const originX = grip.x;
    const originY = grip.y;
    const blocking = mode === "block";
    const bladeLength = active && !blocking ? swordReach() : Math.max(40, 48 + (currentCharacter().swordReachBonus || 0) * 0.45);
    const swingGlow = active ? (blocking ? 0.2 : 0.34) : 0.12;
    const swingProgress = active && !blocking ? 1 - player.attackTimer / 14 : 0;
    const liveAngle = angle + (active && !blocking ? -0.52 + swingProgress * 0.98 : 0);

    ctx.save();
    ctx.translate(originX, originY);
    ctx.rotate(liveAngle);

    const blend = ctx.createRadialGradient(0, 0, 1, 0, 0, Math.max(player.w, player.h) * 0.62);
    blend.addColorStop(0, blocking ? "rgba(126, 245, 255, 0.62)" : "rgba(255, 248, 184, 0.55)");
    blend.addColorStop(0.28, currentCharacter().mid);
    blend.addColorStop(1, "rgba(255, 255, 255, 0)");
    ctx.globalAlpha = active ? 0.42 : 0.26;
    ctx.fillStyle = blend;
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(player.w, player.h) * 0.62, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    if (active) {
        ctx.fillStyle = blocking ? `rgba(126, 245, 255, ${swingGlow})` : `rgba(255, 248, 184, ${swingGlow})`;
        ctx.beginPath();
        ctx.moveTo(16, -swordThickness() / 2);
        ctx.quadraticCurveTo(bladeLength * 0.65, -swordThickness() * 0.7, bladeLength + 12, 0);
        ctx.quadraticCurveTo(bladeLength * 0.65, swordThickness() * 0.7, 16, swordThickness() / 2);
        ctx.closePath();
        ctx.fill();

        if (!blocking) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(20, -swordThickness() * 0.32);
            ctx.quadraticCurveTo(bladeLength * 0.58, -swordThickness() * 0.42, bladeLength + 10, 0);
            ctx.stroke();
        }
    }

    ctx.fillStyle = "#6a3f16";
    roundRect(-9, -5, 22, 10, 4);
    ctx.fillStyle = "#ffd166";
    roundRect(10, -13, 7, 26, 3);

    const blade = ctx.createLinearGradient(17, -5, bladeLength, 5);
    blade.addColorStop(0, "#e7fbff");
    blade.addColorStop(0.5, "#a9dce8");
    blade.addColorStop(1, "#ffffff");
    ctx.fillStyle = blade;
    ctx.beginPath();
    ctx.moveTo(16, -5);
    ctx.lineTo(bladeLength, -3);
    ctx.lineTo(bladeLength + 15, 0);
    ctx.lineTo(bladeLength, 3);
    ctx.lineTo(16, 5);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "rgba(255, 255, 255, 0.72)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(24, -2);
    ctx.lineTo(bladeLength - 2, -1);
    ctx.stroke();

    ctx.fillStyle = currentCharacter().foot;
    ctx.beginPath();
    ctx.arc(-4, 0, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function enemyHasSword(enemy) {
    return enemy.type === "sentry" || enemy.type === "jumpSentry" || enemy.type === "chaosSentry" || enemy.type === "bigFlyer";
}

function enemySwordAngle(enemy) {
    const enemyCenter = centerOf(enemy);
    const playerCenter = centerOf(player);
    return Math.atan2(playerCenter.y - enemyCenter.y, playerCenter.x - enemyCenter.x);
}

function drawEnemySword(enemy) {
    const enemyCenter = centerOf(enemy);
    const attacking = enemy.attackTimer > 0;
    const big = enemy.type === "bigFlyer";
    const bladeLength = big ? (attacking ? 108 : 58) : (attacking ? 64 : 38);
    const thickness = big ? (attacking ? 54 : 18) : (attacking ? 30 : 12);
    const angle = enemySwordAngle(enemy);

    ctx.save();
    ctx.translate(enemyCenter.x, enemyCenter.y + (big ? 2 : 0));
    ctx.rotate(angle);

    if (attacking) {
        ctx.fillStyle = big ? "rgba(255, 59, 91, 0.3)" : "rgba(255, 59, 91, 0.24)";
        ctx.beginPath();
        ctx.moveTo(12, -thickness / 2);
        ctx.quadraticCurveTo(bladeLength * 0.65, -thickness * 0.72, bladeLength + 12, 0);
        ctx.quadraticCurveTo(bladeLength * 0.65, thickness * 0.72, 12, thickness / 2);
        ctx.closePath();
        ctx.fill();
    }

    ctx.fillStyle = "#3a1d18";
    roundRect(2, -4, 13, 8, 3);
    ctx.fillStyle = "#ff8fb3";
    roundRect(13, -10, 6, 20, 3);

    const blade = ctx.createLinearGradient(18, -4, bladeLength, 4);
    blade.addColorStop(0, "#ffe1ed");
    blade.addColorStop(0.45, "#c9d9e5");
    blade.addColorStop(1, "#ffffff");
    ctx.fillStyle = blade;
    ctx.beginPath();
    ctx.moveTo(18, -4);
    ctx.lineTo(bladeLength, -3);
    ctx.lineTo(bladeLength + 12, 0);
    ctx.lineTo(bladeLength, 3);
    ctx.lineTo(18, 4);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawArrowGraphic(arrow, options = {}) {
    const angle = Math.atan2(arrow.vy || 0, arrow.vx);
    const shaft = options.shaft || "#ffd166";
    const head = options.head || "#fff1aa";
    const feather = options.feather || "#ff8fb3";
    const glow = options.glow || "rgba(255, 209, 102, 0.65)";
    const trail = options.trail || glow;

    ctx.save();
    ctx.translate(arrow.x + arrow.w / 2, arrow.y + arrow.h / 2);
    ctx.rotate(angle);
    const trailGradient = ctx.createLinearGradient(-arrow.w / 2 - 70, 0, -arrow.w / 2, 0);
    trailGradient.addColorStop(0, "rgba(255, 255, 255, 0)");
    trailGradient.addColorStop(1, trail);
    ctx.strokeStyle = trailGradient;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-arrow.w / 2 - 74, 0);
    ctx.lineTo(-arrow.w / 2 - 8, 0);
    ctx.stroke();

    ctx.shadowColor = glow;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = shaft;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-arrow.w / 2 - 10, 0);
    ctx.lineTo(arrow.w / 2 + 8, 0);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = head;
    ctx.beginPath();
    ctx.moveTo(arrow.w / 2 + 15, 0);
    ctx.lineTo(arrow.w / 2 + 5, -6);
    ctx.lineTo(arrow.w / 2 + 5, 6);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = feather;
    ctx.beginPath();
    ctx.moveTo(-arrow.w / 2 - 12, 0);
    ctx.lineTo(-arrow.w / 2 - 2, -7);
    ctx.lineTo(-arrow.w / 2, 0);
    ctx.lineTo(-arrow.w / 2 - 2, 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawBow(originX, originY, angle, scale, color, stringColor, drawn = false) {
    ctx.save();
    ctx.translate(originX, originY);
    ctx.rotate(angle);
    ctx.scale(scale, scale);
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(8, -24);
    ctx.quadraticCurveTo(32, 0, 8, 24);
    ctx.stroke();

    ctx.strokeStyle = stringColor;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(8, -24);
    ctx.lineTo(drawn ? -8 : 6, 0);
    ctx.lineTo(8, 24);
    ctx.stroke();

    if (drawn) {
        ctx.strokeStyle = "#dfffea";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-16, 0);
        ctx.lineTo(32, 0);
        ctx.stroke();
        ctx.fillStyle = "#dfffea";
        ctx.beginPath();
        ctx.moveTo(39, 0);
        ctx.lineTo(29, -6);
        ctx.lineTo(29, 6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#49ffa8";
        ctx.beginPath();
        ctx.moveTo(-17, 0);
        ctx.lineTo(-8, -6);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-8, 6);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
}

function drawEnemyBow(enemy) {
    const enemyCenter = centerOf(enemy);
    const playerCenter = centerOf(player);
    const angle = Math.atan2(playerCenter.y - enemyCenter.y, playerCenter.x - enemyCenter.x);
    const bowColor = enemy.type === "shieldArcher" ? "#7ef5ff" : enemy.type === "jumpArcher" ? "#49ffa8" : "#ffd166";
    const stringColor = enemy.type === "shieldArcher" ? "#dffbff" : "#fff1aa";
    const drawn = enemy.attackClock < 0.75;
    drawBow(enemyCenter.x, enemyCenter.y + 2, angle, 0.72, bowColor, stringColor, drawn);
}

function drawCombatEffects() {
    combatEffects.forEach(effect => {
        const alpha = Math.max(0, effect.life / effect.maxLife);
        if (effect.type === "slash") {
            ctx.save();
            ctx.translate(effect.x, effect.y);
            ctx.rotate(effect.angle);
            ctx.globalAlpha = alpha * 0.72;
            const sweep = 1 - alpha;
            const start = -0.7 + sweep * 0.45;
            const end = 0.95 + sweep * 0.2;
            const gradient = ctx.createRadialGradient(0, 0, 12, 0, 0, effect.reach + 30);
            gradient.addColorStop(0, "rgba(255, 255, 255, 0)");
            gradient.addColorStop(0.38, "rgba(255, 241, 170, 0.2)");
            gradient.addColorStop(1, "rgba(255, 255, 255, 0.76)");
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 9;
            ctx.beginPath();
            ctx.arc(0, 0, effect.reach * 0.78, start, end);
            ctx.stroke();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.82)";
            ctx.beginPath();
            ctx.arc(0, 0, effect.reach * 0.9, start + 0.12, end - 0.08);
            ctx.stroke();
            ctx.restore();
            return;
        }

        if (effect.type === "ring") {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = "rgba(126, 245, 255, 0.88)";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, 8 + (1 - alpha) * 24, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            return;
        }

        if (effect.type === "arrowRelease" || effect.type === "arrowImpact") {
            ctx.save();
            ctx.translate(effect.x, effect.y);
            ctx.rotate(effect.angle);
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = effect.color;
            ctx.shadowColor = effect.color;
            ctx.shadowBlur = 12;
            ctx.lineWidth = effect.type === "arrowRelease" ? 4 : 3;
            ctx.beginPath();
            ctx.moveTo(effect.type === "arrowRelease" ? -26 : -8, 0);
            ctx.lineTo(effect.type === "arrowRelease" ? 10 : 20, 0);
            ctx.stroke();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.78)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -9 * alpha);
            ctx.lineTo(0, 9 * alpha);
            ctx.stroke();
            ctx.restore();
            return;
        }

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = effect.color;
        ctx.shadowColor = effect.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(effect.x, effect.y, effect.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function draw() {
    drawBackground();
    ctx.save();
    ctx.translate(-cameraX, 0);

    platforms.forEach(platform => {
        ctx.shadowColor = "rgba(0, 0, 0, 0.28)";
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 8;
        const platformBody = ctx.createLinearGradient(0, platform.y, 0, platform.y + platform.h);
        platformBody.addColorStop(0, "#25527d");
        platformBody.addColorStop(0.62, "#17395e");
        platformBody.addColorStop(1, "#0f2744");
        ctx.fillStyle = platformBody;
        roundRect(platform.x, platform.y, platform.w, platform.h, 8);
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.fillStyle = "#72e6ff";
        roundRect(platform.x + 8, platform.y + 4, platform.w - 16, 5, 3);
        ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
        ctx.fillRect(platform.x + 12, platform.y + 12, platform.w - 24, 2);
        ctx.fillStyle = "rgba(2, 9, 18, 0.28)";
        ctx.fillRect(platform.x + 8, platform.y + platform.h - 8, platform.w - 16, 5);
    });
    ctx.shadowColor = "transparent";

    enemies.forEach(enemy => {
        ctx.shadowColor = "rgba(0, 0, 0, 0.28)";
        ctx.shadowBlur = enemy.type === "bigFlyer" ? 18 : 10;
        ctx.shadowOffsetY = 6;
        const enemyBody = ctx.createLinearGradient(0, enemy.y, 0, enemy.y + enemy.h);
        if (enemy.type === "bigFlyer") {
            enemyBody.addColorStop(0, "#a56cff");
            enemyBody.addColorStop(1, "#4b1fb7");
        } else if (enemy.type === "archer" || enemy.type === "aimArcher" || enemy.type === "shieldArcher" || enemy.type === "jumpArcher") {
            enemyBody.addColorStop(0, "#d46cff");
            enemyBody.addColorStop(1, "#7b2bd8");
        } else {
            enemyBody.addColorStop(0, "#c35dff");
            enemyBody.addColorStop(1, "#6d23c7");
        }
        ctx.fillStyle = enemyBody;
        roundRect(enemy.x, enemy.y, enemy.w, enemy.h, 7);
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.fillStyle = "#f4d7ff";
        if (enemy.type === "bigFlyer") {
            ctx.fillStyle = "#7c3cff";
            roundRect(enemy.x - 18, enemy.y + 12, 24, 18, 9);
            roundRect(enemy.x + enemy.w - 6, enemy.y + 12, 24, 18, 9);
            ctx.fillStyle = "#f4d7ff";
            ctx.fillRect(enemy.x + 18, enemy.y + 16, 7, 7);
            ctx.fillRect(enemy.x + enemy.w - 25, enemy.y + 16, 7, 7);
            ctx.fillStyle = "#ff8fb3";
            ctx.fillRect(enemy.x + 18, enemy.y + enemy.h - 12, enemy.w - 36, 5);
        } else {
            ctx.fillRect(enemy.x + 7, enemy.y + 9, 5, 5);
            ctx.fillRect(enemy.x + 18, enemy.y + 9, 5, 5);
        }
        if (enemy.type === "archer" || enemy.type === "aimArcher" || enemy.type === "shieldArcher" || enemy.type === "jumpArcher") {
            drawEnemyBow(enemy);
            if (enemy.type === "aimArcher") {
                ctx.fillStyle = "#ff8fb3";
                ctx.fillRect(enemy.x + 10, enemy.y - 7, 10, 4);
            }
            if (enemy.type === "shieldArcher") {
                ctx.fillStyle = "#7ef5ff";
                ctx.fillRect(enemy.x + 9, enemy.y - 8, 12, 5);
            }
            if (enemy.type === "jumpArcher") {
                ctx.fillStyle = "#49ffa8";
                ctx.fillRect(enemy.x + 8, enemy.y - 8, 14, 5);
            }
        }
        if (enemy.type === "sentry" || enemy.type === "jumpSentry" || enemy.type === "chaosSentry") {
            ctx.fillStyle = "#ffd166";
            ctx.fillRect(enemy.x + 6, enemy.y - 7, enemy.w - 12, 4);
            if (enemy.attackTimer > 0) {
                const hitbox = enemyAttackBox(enemy);
                ctx.fillStyle = "rgba(255, 59, 91, 0.42)";
                roundRect(hitbox.x, hitbox.y, hitbox.w, hitbox.h, 9);
            }
            drawEnemySword(enemy);
        }
        if (enemy.type === "bigFlyer" && enemy.attackTimer > 0) {
            const hitbox = enemyAttackBox(enemy);
            ctx.fillStyle = "rgba(255, 59, 91, 0.36)";
            roundRect(hitbox.x, hitbox.y, hitbox.w, hitbox.h, 14);
            drawEnemySword(enemy);
        } else if (enemy.type === "bigFlyer") {
            drawEnemySword(enemy);
        }
    });

    arrows.forEach(arrow => {
        drawArrowGraphic(arrow, {
            shaft: arrow.breaksShield ? "#7ef5ff" : "#ffd166",
            head: arrow.breaksShield ? "#dffbff" : "#fff1aa",
            feather: arrow.breaksShield ? "#8deaff" : "#ff8fb3",
            glow: arrow.breaksShield ? "rgba(126, 245, 255, 0.72)" : "rgba(255, 209, 102, 0.65)"
        });
    });

    playerArrows.forEach(arrow => {
        drawArrowGraphic(arrow, {
            shaft: "#49ffa8",
            head: "#dfffea",
            feather: "#8deaff",
            glow: "rgba(73, 255, 168, 0.72)"
        });
    });
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;

    ctx.shadowColor = gateUnlocked() ? "rgba(73, 255, 168, 0.34)" : "rgba(0, 0, 0, 0.24)";
    ctx.shadowBlur = gateUnlocked() ? 18 : 8;
    const gateBody = ctx.createLinearGradient(0, goal.y, 0, goal.y + goal.h);
    gateBody.addColorStop(0, gateUnlocked() ? "#65ffc0" : "#6f879b");
    gateBody.addColorStop(1, gateUnlocked() ? "#20b875" : "#354e63");
    ctx.fillStyle = gateBody;
    roundRect(goal.x, goal.y, goal.w, goal.h, 10);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#08182b";
    roundRect(goal.x + 12, goal.y + 16, goal.w - 24, goal.h - 32, 8);
    ctx.strokeStyle = gateUnlocked() ? "#a3ffd4" : "#c6d4df";
    ctx.lineWidth = 4;
    ctx.strokeRect(goal.x + 13, goal.y + 17, goal.w - 26, goal.h - 34);
    ctx.fillStyle = gateUnlocked() ? "#dfffea" : "#eef4ff";
    ctx.font = "900 10px Segoe UI, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(gateUnlocked() ? "OPEN" : "LOCKED", goal.x + goal.w / 2, goal.y - 8);
    ctx.textAlign = "left";

    const ducking = playerDucking();
    const drawY = ducking ? player.y + 20 : player.y;
    const drawH = ducking ? player.h - 20 : player.h;
    const character = currentCharacter();
    ctx.shadowColor = character.glow;
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;
    const playerBody = ctx.createLinearGradient(0, drawY, 0, drawY + drawH);
    playerBody.addColorStop(0, character.top);
    playerBody.addColorStop(0.48, character.mid);
    playerBody.addColorStop(1, character.bottom);
    ctx.fillStyle = playerBody;
    roundRect(player.x, drawY, player.w, drawH, 12);
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
    roundRect(player.x + player.w * 0.18, drawY + drawH * 0.12, player.w * 0.24, drawH * 0.42, 8);
    ctx.fillStyle = "#09213a";
    const eyeSize = Math.max(5, Math.min(7, player.w * 0.18));
    ctx.fillRect(player.x + player.w * 0.24, drawY + drawH * 0.25, eyeSize, eyeSize);
    ctx.fillRect(player.x + player.w * 0.6, drawY + drawH * 0.25, eyeSize, eyeSize);
    ctx.fillStyle = character.foot;
    ctx.fillRect(player.x + player.w * 0.2, player.y + player.h - 8, player.w * 0.58, 4);

    if (playerBlocking()) {
        drawSword(player.blockAngle, true, "block");
        const flash = player.blockFlashTimer > 0 ? 1 : 0;
        ctx.strokeStyle = flash ? "rgba(255, 255, 255, 0.95)" : "rgba(126, 245, 255, 0.82)";
        ctx.lineWidth = flash ? 5 : 3;
        ctx.beginPath();
        ctx.arc(player.x + player.w / 2, player.y + player.h / 2, Math.max(player.w, player.h) * 0.7, player.blockAngle - 0.92, player.blockAngle + 0.92);
        ctx.stroke();
        ctx.fillStyle = flash ? "rgba(126, 245, 255, 0.3)" : "rgba(126, 245, 255, 0.12)";
        ctx.beginPath();
        ctx.moveTo(player.x + player.w / 2, player.y + player.h / 2);
        ctx.arc(player.x + player.w / 2, player.y + player.h / 2, Math.max(player.w, player.h) * 0.82, player.blockAngle - 0.74, player.blockAngle + 0.74);
        ctx.closePath();
        ctx.fill();
    } else {
        drawSword(player.attackTimer > 0 ? player.attackAngle : defaultSwordAngle(), player.attackTimer > 0);
    }
    drawCombatEffects();

    if (archeryReady) {
        ctx.strokeStyle = "#49ffa8";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 34, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "rgba(73, 255, 168, 0.14)";
        ctx.beginPath();
        ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 42, 0, Math.PI * 2);
        ctx.fill();
        drawBow(player.x + player.w / 2, player.y + player.h / 2 + 1, player.facing > 0 ? 0 : Math.PI, character.bowScale || 0.9, "#49ffa8", "#dfffea", true);
        ctx.fillStyle = "#dfffea";
        ctx.font = "900 10px Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("CLICK", player.x + player.w / 2, player.y - 10);
        ctx.textAlign = "left";
    }

    ctx.restore();
}

function loop(now) {
    lastTime = now;
    if (gameStarted) update();
    draw();
    requestAnimationFrame(loop);
}

function isAttackKey(code) {
    return code === "Digit1" || code === "KeyJ";
}

function isBlockKey(code) {
    return code === "Digit2" || code === "KeyK";
}

function isDuckKey(code) {
    return code === "Digit3" || code === "KeyI";
}

function isArcheryKey(code) {
    return code === "Digit4" || code === "KeyL";
}

function setKey(code, down) {
    if (code === "ArrowLeft" || code === "KeyA") keys.left = down;
    if (code === "ArrowRight" || code === "KeyD") keys.right = down;
    if (code === "ArrowUp" || code === "Space" || code === "KeyW") keys.jump = down;
    if (code === "ArrowDown" || code === "KeyS") keys.down = down;
    if (isDuckKey(code)) keys.duck = down;
}

window.addEventListener("keydown", event => {
    if (!gameStarted) return;
    if (isAttackKey(event.code)) {
        attack();
        event.preventDefault();
        return;
    }
    if (isBlockKey(event.code)) {
        if (!event.repeat) shield();
        event.preventDefault();
        return;
    }
    if (isArcheryKey(event.code)) {
        if (archeryUnlocked && !event.repeat) archeryReady = true;
        event.preventDefault();
        return;
    }
    setKey(event.code, true);
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "Digit3", "KeyI"].includes(event.code)) event.preventDefault();
});
canvas.addEventListener("click", event => {
    if (!gameStarted) return;
    firePlayerArrow(event.clientX, event.clientY);
});
window.addEventListener("keyup", event => setKey(event.code, false));
window.addEventListener("message", event => {
    if (event.data?.type !== "game-key") return;
    setKey(event.data.code, event.data.down);
});
window.addEventListener("resize", resize);
shopToggle.addEventListener("click", () => {
    shopPanel.classList.toggle("open");
    updateShop();
});
resetBtn.addEventListener("click", resetProgress);
saveBtn.addEventListener("click", saveGame);
tryAgainBtn.addEventListener("click", retryAfterLoss);
attackUpgradeBtn.addEventListener("click", buyAttackUpgrade);
shieldUpgradeBtn.addEventListener("click", buyShieldUpgrade);
archeryUpgradeBtn.addEventListener("click", buyArcheryUpgrade);
characterButtons.forEach(button => {
    button.addEventListener("click", () => chooseCharacter(button.dataset.character));
});

resize();
if (!loadSavedGame()) loadLevel(0, true);
syncCharacterSelect();
requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battlebound</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    overflow: hidden;
    background: #07101d;
    color: #e9f6ff;
    font-family: "Segoe UI", Arial, sans-serif;
}

#game {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #07101d;
}

.hud {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 252px;
    z-index: 2;
    padding: 8px 11px;
    border: 1px solid rgba(144, 224, 255, 0.34);
    border-radius: 7px;
    background: rgba(7, 16, 31, 0.78);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24), inset 0 1px rgba(255, 255, 255, 0.07);
    color: #dff7ff;
    font-size: 12px;
    font-weight: 800;
    pointer-events: none;
}

.lives-counter {
    position: fixed;
    top: 52px;
    left: 14px;
    z-index: 2;
    min-width: 88px;
    padding: 7px 10px;
    border: 1px solid rgba(126, 245, 255, 0.42);
    border-radius: 7px;
    background: rgba(7, 16, 31, 0.8);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24), inset 0 1px rgba(255, 255, 255, 0.07);
    color: #7ef5ff;
    font-size: 12px;
    font-weight: 900;
    pointer-events: none;
}

.shop-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 3;
    padding: 8px 12px;
    border: 1px solid rgba(144, 224, 255, 0.38);
    border-radius: 7px;
    background: rgba(7, 16, 31, 0.86);
    color: #dff7ff;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 900;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2), inset 0 1px rgba(255, 255, 255, 0.08);
}

.save-button {
    position: fixed;
    top: 14px;
    right: 78px;
    z-index: 3;
    min-width: 56px;
    padding: 8px 10px;
    border: 1px solid rgba(144, 224, 255, 0.38);
    border-radius: 7px;
    background: rgba(7, 16, 31, 0.86);
    color: #dff7ff;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 900;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2), inset 0 1px rgba(255, 255, 255, 0.08);
}

.reset-button {
    position: fixed;
    top: 14px;
    right: 138px;
    z-index: 3;
    min-width: 62px;
    padding: 8px 10px;
    border: 1px solid rgba(255, 123, 123, 0.52);
    border-radius: 7px;
    background: rgba(68, 12, 18, 0.9);
    color: #ffd6d6;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 900;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2), inset 0 1px rgba(255, 255, 255, 0.08);
}

.reset-button:hover {
    border-color: rgba(255, 171, 171, 0.76);
    background: rgba(107, 20, 28, 0.94);
}

.shop-panel {
    position: fixed;
    top: 54px;
    right: 14px;
    z-index: 3;
    width: min(260px, calc(100vw - 28px));
    display: none;
    padding: 12px;
    border: 1px solid rgba(144, 224, 255, 0.32);
    border-radius: 8px;
    background: rgba(7, 16, 31, 0.94);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.42), inset 0 1px rgba(255, 255, 255, 0.08);
}

.shop-panel.open { display: block; }

.shop-title {
    color: #8deaff;
    font-size: 14px;
    font-weight: 900;
    margin-bottom: 8px;
}

.shop-line {
    color: #aac7d8;
    font-size: 12px;
    line-height: 1.35;
    margin-bottom: 10px;
}

.shop-buy {
    width: 100%;
    border: 1px solid rgba(141, 234, 255, 0.58);
    border-radius: 7px;
    background: linear-gradient(180deg, #53e0ff, #1bb8f2);
    color: #06101d;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 900;
    padding: 8px 10px;
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.35);
}

.shop-buy + .shop-buy {
    margin-top: 8px;
}

.shop-buy:disabled {
    opacity: 0.48;
    cursor: default;
}

.instruction-callout {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 5;
    max-width: min(760px, calc(100vw - 36px));
    padding: 16px 20px;
    border: 1px solid rgba(141, 234, 255, 0.5);
    border-radius: 8px;
    background: rgba(7, 16, 31, 0.94);
    color: #e9f6ff;
    font-size: clamp(20px, 4vw, 36px);
    font-weight: 900;
    line-height: 1.15;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.4);
}

.instruction-callout.play {
    animation: instructionZoom 2.8s ease-in-out forwards;
}

.character-select {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background:
        radial-gradient(circle at 50% 22%, rgba(126, 245, 255, 0.18), transparent 32%),
        rgba(3, 9, 18, 0.82);
}

.character-select.hidden { display: none; }

.lose-screen {
    position: fixed;
    inset: 0;
    z-index: 7;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background:
        radial-gradient(circle at 50% 30%, rgba(255, 79, 114, 0.18), transparent 34%),
        rgba(3, 9, 18, 0.86);
}

.lose-screen.hidden { display: none; }

.lose-panel {
    width: min(420px, calc(100vw - 32px));
    padding: 18px;
    border: 1px solid rgba(255, 123, 123, 0.52);
    border-radius: 8px;
    background: rgba(26, 8, 17, 0.94);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.52), inset 0 1px rgba(255, 255, 255, 0.08);
    text-align: center;
}

.lose-title {
    color: #ffd6d6;
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 8px;
}

.lose-line {
    color: #ffc0c8;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.4;
    margin-bottom: 14px;
}

.lose-button {
    width: 100%;
    border: 1px solid rgba(255, 214, 214, 0.62);
    border-radius: 7px;
    background: linear-gradient(180deg, #ff7b7b, #e13e5b);
    color: #190812;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 900;
    padding: 10px 12px;
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.35);
}

.character-panel {
    width: min(860px, calc(100vw - 28px));
    max-height: calc(100vh - 44px);
    overflow-y: auto;
    padding: 18px;
    border: 1px solid rgba(141, 234, 255, 0.38);
    border-radius: 8px;
    background: rgba(7, 16, 31, 0.94);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.48), inset 0 1px rgba(255, 255, 255, 0.08);
}

.character-title {
    color: #dff7ff;
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 14px;
}

.character-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.character-card {
    min-height: 232px;
    border: 1px solid rgba(141, 234, 255, 0.28);
    border-radius: 8px;
    background: rgba(12, 31, 55, 0.86);
    color: #e9f6ff;
    cursor: pointer;
    font: inherit;
    padding: 10px;
    text-align: left;
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.07);
    overflow: hidden;
}

.character-card:hover,
.character-card.selected {
    border-color: #7ef5ff;
    background: rgba(19, 51, 82, 0.94);
}

.character-preview {
    display: block;
    width: 100%;
    height: 132px;
    margin-bottom: 10px;
    border: 1px solid rgba(141, 234, 255, 0.16);
    border-radius: 8px;
    background:
        radial-gradient(circle at 38% 25%, var(--char-glow), transparent 30%),
        linear-gradient(180deg, rgba(20, 56, 90, 0.96), rgba(5, 15, 29, 0.96));
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32), inset 0 1px rgba(255, 255, 255, 0.08);
    position: relative;
    overflow: hidden;
}

.character-preview::before,
.character-preview::after {
    content: "";
    position: absolute;
    pointer-events: none;
}

.character-preview::before {
    left: 0;
    right: 0;
    bottom: 18px;
    height: 12px;
    background: linear-gradient(180deg, #78f1ff, #2387a2);
    box-shadow: 0 9px 20px rgba(0, 0, 0, 0.36);
}

.character-preview::after {
    left: 24px;
    right: 20px;
    bottom: 12px;
    height: 4px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.32);
}

.preview-player,
.preview-enemy,
.preview-sword,
.preview-arm,
.preview-shine,
.preview-feet {
    position: absolute;
    pointer-events: none;
}

.preview-player {
    left: 46%;
    bottom: 31px;
    width: 36px;
    height: 54px;
    border-radius: 14px 14px 8px 8px;
    transform: translateX(-50%) rotate(-4deg);
    background: linear-gradient(180deg, var(--char-top), var(--char-mid) 46%, var(--char-bottom));
    box-shadow: 0 0 22px var(--char-glow), inset -5px -7px 0 rgba(0, 0, 0, 0.13);
}

.preview-player::before,
.preview-player::after {
    content: "";
    position: absolute;
    top: 18px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #09213a;
    box-shadow: 0 1px rgba(255, 255, 255, 0.28);
}

.preview-player::before { left: 9px; }
.preview-player::after { right: 9px; }

.preview-shine {
    left: 8px;
    top: 5px;
    width: 11px;
    height: 30px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.3);
    transform: rotate(14deg);
}

.preview-arm {
    left: 26px;
    top: 24px;
    width: 27px;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--char-mid), var(--char-bottom));
    transform: rotate(-18deg);
    transform-origin: 2px 50%;
    box-shadow: 0 0 10px var(--char-glow);
}

.preview-sword {
    left: 52px;
    top: 9px;
    width: 7px;
    height: 52px;
    border-radius: 4px 4px 2px 2px;
    background: linear-gradient(90deg, #ebfbff, #8fb8c9 48%, #ffffff);
    transform: rotate(42deg);
    transform-origin: 50% 85%;
    box-shadow: 0 0 12px rgba(220, 251, 255, 0.48);
}

.preview-sword::before {
    content: "";
    position: absolute;
    left: -9px;
    bottom: 6px;
    width: 25px;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, #49311b, #f2cf75, #49311b);
}

.preview-sword::after {
    content: "";
    position: absolute;
    left: 1px;
    bottom: -7px;
    width: 5px;
    height: 12px;
    border-radius: 999px;
    background: #4a3223;
}

.preview-feet {
    left: 6px;
    right: 6px;
    bottom: -4px;
    height: 8px;
}

.preview-feet::before,
.preview-feet::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 13px;
    height: 7px;
    border-radius: 8px;
    background: var(--char-foot, #dffbff);
}

.preview-feet::before { left: 0; }
.preview-feet::after { right: 0; }

.preview-enemy {
    right: 22px;
    bottom: 31px;
    width: 28px;
    height: 31px;
    border-radius: 8px 8px 6px 6px;
    background: linear-gradient(180deg, #ffb0b0, #c03f4d);
    box-shadow: 0 0 14px rgba(255, 90, 90, 0.34), inset -4px -5px rgba(0, 0, 0, 0.13);
}

.preview-enemy::before,
.preview-enemy::after {
    content: "";
    position: absolute;
    top: 10px;
    width: 5px;
    height: 5px;
    background: #270911;
}

.preview-enemy::before { left: 7px; }
.preview-enemy::after { right: 7px; }

.preview-label {
    position: absolute;
    left: 10px;
    top: 9px;
    color: rgba(223, 247, 255, 0.76);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0;
    text-transform: uppercase;
}

.character-card[data-character="ember"] .preview-player {
    left: 43%;
    bottom: 31px;
    width: 30px;
    height: 46px;
    border-radius: 18px 18px 8px 8px;
    transform: translateX(-50%) rotate(-10deg);
}

.character-card[data-character="ember"] .preview-arm {
    left: 22px;
    top: 21px;
    width: 31px;
    transform: rotate(-30deg);
}

.character-card[data-character="ember"] .preview-sword {
    left: 47px;
    top: 6px;
    height: 44px;
    transform: rotate(55deg);
}

.character-card[data-character="ember"] .preview-enemy {
    right: 24px;
    transform: rotate(7deg);
}

.character-card[data-character="verdant"] .preview-player {
    left: 45%;
    bottom: 31px;
    width: 40px;
    height: 64px;
    border-radius: 12px 12px 7px 7px;
    transform: translateX(-50%) rotate(2deg);
}

.character-card[data-character="verdant"] .preview-arm {
    left: 31px;
    top: 31px;
    width: 34px;
    transform: rotate(-10deg);
}

.character-card[data-character="verdant"] .preview-sword {
    left: 60px;
    top: 5px;
    height: 58px;
    transform: rotate(32deg);
}

.character-card[data-character="verdant"] .preview-enemy {
    right: 18px;
    width: 26px;
    height: 38px;
}

.character-card[data-character="nova"] .preview-player {
    left: 42%;
    bottom: 38px;
    width: 28px;
    height: 40px;
    border-radius: 50% 50% 9px 9px;
    transform: translateX(-50%) rotate(-18deg);
}

.character-card[data-character="nova"] .preview-arm {
    left: 21px;
    top: 16px;
    width: 34px;
    transform: rotate(-43deg);
}

.character-card[data-character="nova"] .preview-sword {
    left: 48px;
    top: -2px;
    height: 42px;
    transform: rotate(68deg);
}

.character-card[data-character="nova"] .preview-enemy {
    right: 27px;
    bottom: 32px;
    width: 24px;
    height: 27px;
    transform: rotate(-8deg);
}

.character-card[data-character="iron"] .preview-player {
    left: 45%;
    bottom: 31px;
    width: 46px;
    height: 58px;
    border-radius: 10px 10px 6px 6px;
    transform: translateX(-50%) rotate(0deg);
}

.character-card[data-character="iron"] .preview-arm {
    left: 35px;
    top: 31px;
    width: 32px;
    height: 10px;
    transform: rotate(-5deg);
}

.character-card[data-character="iron"] .preview-sword {
    left: 65px;
    top: 5px;
    width: 9px;
    height: 60px;
    transform: rotate(24deg);
}

.character-card[data-character="iron"] .preview-enemy {
    right: 18px;
    bottom: 31px;
    width: 32px;
    height: 36px;
}

.character-card[data-character="shade"] .preview-player {
    left: 44%;
    bottom: 32px;
    width: 31px;
    height: 50px;
    border-radius: 10px 18px 7px 10px;
    transform: translateX(-50%) rotate(8deg);
}

.character-card[data-character="shade"] .preview-arm {
    left: 24px;
    top: 25px;
    width: 38px;
    transform: rotate(-16deg);
}

.character-card[data-character="shade"] .preview-sword {
    left: 57px;
    top: 1px;
    height: 54px;
    transform: rotate(36deg);
}

.character-card[data-character="shade"] .preview-enemy {
    right: 21px;
    bottom: 35px;
    width: 25px;
    height: 30px;
    transform: rotate(12deg);
}

.character-name {
    display: block;
    color: #8deaff;
    font-size: 14px;
    font-weight: 900;
    margin-bottom: 5px;
}

.character-desc {
    display: block;
    color: #aac7d8;
    font-size: 12px;
    line-height: 1.35;
}

@media (max-width: 640px) {
    .hud {
        top: 54px;
        right: 14px;
    }

    .lives-counter {
        top: 92px;
    }

    .character-grid { grid-template-columns: 1fr; }
}

@keyframes instructionZoom {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.75);
    }
    16% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    76% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    100% {
        opacity: 0;
        transform:
            translate(calc(var(--target-x) - 50vw), calc(var(--target-y) - 50vh))
            translate(-50%, -50%)
            scale(0.18);
    }
}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div class="hud" id="hud">New: Arrow keys or WASD move. Press 1/J to attack enemies.</div>
<div class="lives-counter" id="lives-counter">Lives 40</div>
<div class="instruction-callout" id="instruction-callout" aria-hidden="true"></div>
<button class="reset-button" id="reset-btn">Reset</button>
<button class="save-button" id="save-btn">Save</button>
<button class="shop-toggle" id="shop-toggle">Shop</button>
<div class="shop-panel" id="shop-panel">
    <div class="shop-title">Shop</div>
    <div class="shop-line" id="shop-info"></div>
    <button class="shop-buy" id="attack-upgrade-btn">Buy Attack Range</button>
    <button class="shop-buy" id="shield-upgrade-btn">Buy Sword Block Time</button>
    <button class="shop-buy" id="archery-upgrade-btn">Buy Archery Range</button>
</div>
<div class="character-select" id="character-select">
    <div class="character-panel">
        <div class="character-title">Choose Your Character</div>
        <div class="character-grid">
            <button class="character-card" data-character="azure" style="--char-top:#b8f7ff;--char-mid:#72e6ff;--char-bottom:#2aa7df;--char-foot:#dffbff;--char-glow:rgba(141,234,255,0.55);">
                <span class="character-preview">
                    <span class="preview-label">Preview</span>
                    <span class="preview-player">
                        <span class="preview-shine"></span>
                        <span class="preview-arm"></span>
                        <span class="preview-sword"></span>
                        <span class="preview-feet"></span>
                    </span>
                    <span class="preview-enemy"></span>
                </span>
                <span class="character-name">Azure</span>
                <span class="character-desc">Balanced knight. Normal speed, jump, sword block, and bow.</span>
            </button>
            <button class="character-card" data-character="ember" style="--char-top:#ffe0a6;--char-mid:#ff9f43;--char-bottom:#d84a2b;--char-foot:#fff1aa;--char-glow:rgba(255,159,67,0.55);">
                <span class="character-preview">
                    <span class="preview-label">Preview</span>
                    <span class="preview-player">
                        <span class="preview-shine"></span>
                        <span class="preview-arm"></span>
                        <span class="preview-sword"></span>
                        <span class="preview-feet"></span>
                    </span>
                    <span class="preview-enemy"></span>
                </span>
                <span class="character-name">Ember</span>
                <span class="character-desc">Fast duelist. Smaller body, quicker movement, shorter jump and guard.</span>
            </button>
            <button class="character-card" data-character="verdant" style="--char-top:#d7ffd4;--char-mid:#49ffa8;--char-bottom:#159b69;--char-foot:#dfffea;--char-glow:rgba(73,255,168,0.55);">
                <span class="character-preview">
                    <span class="preview-label">Preview</span>
                    <span class="preview-player">
                        <span class="preview-shine"></span>
                        <span class="preview-arm"></span>
                        <span class="preview-sword"></span>
                        <span class="preview-feet"></span>
                    </span>
                    <span class="preview-enemy"></span>
                </span>
                <span class="character-name">Verdant</span>
                <span class="character-desc">Tall ranger. Higher jump, longer sword block, and better bow range.</span>
            </button>
            <button class="character-card" data-character="nova" style="--char-top:#fff5c8;--char-mid:#f6d85d;--char-bottom:#c88b1e;--char-foot:#fff7c7;--char-glow:rgba(255,220,91,0.55);">
                <span class="character-preview">
                    <span class="preview-label">Preview</span>
                    <span class="preview-player">
                        <span class="preview-shine"></span>
                        <span class="preview-arm"></span>
                        <span class="preview-sword"></span>
                        <span class="preview-feet"></span>
                    </span>
                    <span class="preview-enemy"></span>
                </span>
                <span class="character-name">Nova</span>
                <span class="character-desc">Tiny acrobat. Fastest movement and jump, but weaker sword block.</span>
            </button>
            <button class="character-card" data-character="iron" style="--char-top:#eff7ff;--char-mid:#9fb4c7;--char-bottom:#536678;--char-foot:#e6f0f8;--char-glow:rgba(210,228,240,0.5);">
                <span class="character-preview">
                    <span class="preview-label">Preview</span>
                    <span class="preview-player">
                        <span class="preview-shine"></span>
                        <span class="preview-arm"></span>
                        <span class="preview-sword"></span>
                        <span class="preview-feet"></span>
                    </span>
                    <span class="preview-enemy"></span>
                </span>
                <span class="character-name">Iron</span>
                <span class="character-desc">Heavy guardian. Slow, huge guard, long sword, and longest sword block.</span>
            </button>
            <button class="character-card" data-character="shade" style="--char-top:#d9c7ff;--char-mid:#7f69ff;--char-bottom:#2d2877;--char-foot:#ded8ff;--char-glow:rgba(139,119,255,0.55);">
                <span class="character-preview">
                    <span class="preview-label">Preview</span>
                    <span class="preview-player">
                        <span class="preview-shine"></span>
                        <span class="preview-arm"></span>
                        <span class="preview-sword"></span>
                        <span class="preview-feet"></span>
                    </span>
                    <span class="preview-enemy"></span>

function randomJumpDelay() {
    return 1 + Math.random() * 2;
}

function randomMoveDelay() {
    return 1 + Math.random() * 2;
}

function randomAnyDelay() {
    return 0.25 + Math.random() * 2.75;
}

function chooseEnemyDirection(enemy) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.4 + Math.random() * 1.2;
    enemy.vx = Math.cos(angle) * speed;
    enemy.vy = Math.sin(angle) * speed;
    enemy.moveTimer = randomMoveDelay();
}

function chooseChaosDirection(enemy) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.2 + Math.random() * 2.0;
    enemy.vx = Math.cos(angle) * speed;
    enemy.vy = Math.sin(angle) * speed;
    enemy.moveTimer = randomAnyDelay();
}

function attackBox() {
    const bonus = attackUpgradeLevel * 12;
    return {
        x: player.x - 18 - bonus,
        y: player.y - 12 - bonus,
        w: player.w + 36 + bonus * 2,
        h: player.h + 24 + bonus * 2
    };
}

function centerOf(entity) {
    return {
        x: entity.x + entity.w / 2,
        y: entity.y + entity.h / 2
    };
}

function swordReach() {
    return 72 + attackUpgradeLevel * 18 + (currentCharacter().swordReachBonus || 0);
}

function swordThickness() {
    return 34 + attackUpgradeLevel * 8 + (currentCharacter().swordThicknessBonus || 0);
}

function heavyReach() {
    return swordReach() + 28;
}

function spearReach() {
    return swordReach() + 70;
}

function swordBlockReach() {
    return 176 + Math.max(0, currentCharacter().swordReachBonus || 0) * 1.3 + (currentCharacter().shieldBonus || 0) * 28;
}

function spawnSwordTrail(angle) {
    const grip = swordGripPoint(angle, "attack");
    combatEffects.push({
        type: "slash",
        x: grip.x,
        y: grip.y,
        angle,
        life: 14,
        maxLife: 14,
        reach: swordReach()
    });
}

function spawnHitSparks(x, y, angle, color = "#fff1aa") {
    for (let i = 0; i < 9; i++) {
        const spread = angle + Math.PI + (Math.random() - 0.5) * 1.7;
        const speed = 2.2 + Math.random() * 3.8;
        combatEffects.push({
            type: "spark",
            x,
            y,
            vx: Math.cos(spread) * speed,
            vy: Math.sin(spread) * speed,
            life: 12 + Math.random() * 9,
            maxLife: 21,
            size: 2 + Math.random() * 3,
            color
        });
    }
}

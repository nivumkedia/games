<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blob World</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --bg: #cdebfb;
    --panel: #ffffff;
    --board-bg: #bfe0f5;
    --text: #274a63;
    --dim: #6f93ac;
    --accent: #3ea8e0;
    --accent-dark: #2c86b8;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    overflow: hidden;
    touch-action: none;
    user-select: none;
}

h1 {
    font-size: clamp(20px, 4vmin, 28px);
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--accent-dark);
}

#back-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    background: var(--panel);
    border: 1px solid var(--board-bg);
    color: var(--dim);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    z-index: 50;
    box-shadow: 0 4px 14px rgba(62, 168, 224, 0.14);
}
#back-btn:hover { color: var(--accent-dark); }

.hud {
    display: flex;
    align-items: center;
    gap: 16px;
}

.stat-box {
    background: var(--panel);
    border: 1px solid var(--board-bg);
    border-radius: 10px;
    padding: 6px 16px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(62, 168, 224, 0.14);
    min-width: 90px;
}

.stat-box .label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--dim);
    font-weight: 700;
}

.stat-box .value {
    font-size: 18px;
    font-weight: 800;
    color: var(--accent-dark);
}

.energy-bar-wrap {
    width: 100%;
    height: 8px;
    background: var(--board-bg);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 3px;
}
.energy-bar {
    height: 100%;
    background: linear-gradient(90deg, #5cab4e, #8fd45a);
    transition: width 0.3s;
}

#game-wrap {
    position: relative;
    width: min(94vw, 860px);
    aspect-ratio: 860 / 540;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(62, 168, 224, 0.25);
}

#canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
}

.touch-controls {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 14px 14px;
    pointer-events: none;
}

.dpad {
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(3, 40px);
    gap: 4px;
    pointer-events: auto;
}
.dpad button {
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.55);
    color: #274a63;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
}
.dpad .up { grid-column: 2; grid-row: 1; }
.dpad .left { grid-column: 1; grid-row: 2; }
.dpad .right { grid-column: 3; grid-row: 2; }
.dpad .down { grid-column: 2; grid-row: 3; }

.hint-toast {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translate(-50%, -14px);
    background: linear-gradient(135deg, #fff6e0, #ffe9b8);
    border: 2px solid #f4c430;
    border-radius: 10px;
    padding: 8px 18px;
    font-weight: 800;
    font-size: 13px;
    color: var(--accent-dark);
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s, transform 0.4s;
    white-space: nowrap;
    max-width: 80%;
    text-align: center;
}
.hint-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Building overlay */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 45, 65, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 20px;
}
.overlay.show { display: flex; }

.panel {
    background: var(--panel);
    border-radius: 14px;
    padding: 22px 24px;
    max-width: 460px;
    width: 100%;
    max-height: 84vh;
    overflow-y: auto;
    box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    text-align: left;
}

.panel h2 {
    color: var(--accent-dark);
    margin-bottom: 4px;
}

.panel .flavor {
    font-size: 13px;
    color: var(--dim);
    margin-bottom: 14px;
}

.action-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s;
}
.action-btn:hover { background: var(--accent-dark); }
.action-btn:disabled {
    background: var(--board-bg);
    color: var(--dim);
    cursor: not-allowed;
}
.action-btn .sub { font-size: 11px; font-weight: 600; opacity: 0.85; }

.shop-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 8px 0 16px;
}

.shop-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 8px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: var(--bg);
}
.shop-item.selected { border-color: var(--accent-dark); background: var(--board-bg); }
.shop-item canvas { display: block; }
.shop-item .label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text);
    text-align: center;
}

.close-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--board-bg);
    color: var(--dim);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
}
.close-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
</style>
</head>
<body>

<button id="back-btn" title="Back to Didi's Games">←</button>

<h1>BLOB WORLD</h1>

<div class="hud">
    <div class="stat-box">
        <div class="label">COINS</div>
        <div class="value" id="coins">0</div>
    </div>
    <div class="stat-box">
        <div class="label">ENERGY</div>
        <div class="value" id="energy">100</div>
        <div class="energy-bar-wrap"><div class="energy-bar" id="energy-bar" style="width:100%"></div></div>
    </div>
</div>

<div id="game-wrap">
    <canvas id="canvas"></canvas>
    <div class="hint-toast" id="hint-toast"></div>
    <div class="touch-controls">
        <div class="dpad">
            <button class="up" id="btn-up">▲</button>
            <button class="left" id="btn-left">◀</button>
            <button class="right" id="btn-right">▶</button>
            <button class="down" id="btn-down">▼</button>
        </div>
    </div>
</div>

<div class="overlay" id="building-overlay">
    <div class="panel" id="building-panel"></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const coinsEl = document.getElementById('coins');
const energyEl = document.getElementById('energy');
const energyBarEl = document.getElementById('energy-bar');
const hintEl = document.getElementById('hint-toast');
const overlayEl = document.getElementById('building-overlay');
const panelEl = document.getElementById('building-panel');

const VW = 860, VH = 540;
canvas.width = VW;
canvas.height = VH;

let hintTimer = null;
function showHint(msg) {
    hintEl.textContent = msg;
    hintEl.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hintEl.classList.remove('show'), 2200);
}

// ---------------------------------------------------------------------
// Persistent state
// ---------------------------------------------------------------------
const SAVE_KEY = 'blobWorldSaveV2';
let coins, energy, ownedColors, equippedColor, lastNapAt, lastVisitAt;

const BLOB_COLORS = [
    { name: 'Grass', hex: '#5cab4e', price: 0 },
    { name: 'Sky', hex: '#3ea8e0', price: 20 },
    { name: 'Sunny', hex: '#f4c430', price: 20 },
    { name: 'Bubblegum', hex: '#e0609a', price: 20 },
    { name: 'Grape', hex: '#9b59b6', price: 30 },
    { name: 'Coral', hex: '#ff7043', price: 30 },
    { name: 'Mint', hex: '#3ddc97', price: 30 },
    { name: 'Charcoal', hex: '#4a4a52', price: 40 },
];

function loadGame() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {}
    coins = (saved && Number.isFinite(saved.coins)) ? saved.coins : 20;
    energy = (saved && Number.isFinite(saved.energy)) ? saved.energy : 100;
    ownedColors = (saved && Array.isArray(saved.ownedColors) && saved.ownedColors.length === BLOB_COLORS.length)
        ? saved.ownedColors : BLOB_COLORS.map((_, i) => i === 0);
    equippedColor = (saved && Number.isInteger(saved.equippedColor)) ? saved.equippedColor : 0;
    lastNapAt = (saved && Number.isFinite(saved.lastNapAt)) ? saved.lastNapAt : 0;
    lastVisitAt = (saved && typeof saved.lastVisitAt === 'object' && saved.lastVisitAt) ? saved.lastVisitAt : {};
}

function saveGame() {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ coins, energy, ownedColors, equippedColor, lastNapAt, lastVisitAt }));
}

function setCoins(v) { coins = Math.max(0, v); coinsEl.textContent = coins; saveGame(); }
function setEnergy(v) {
    energy = Math.max(0, Math.min(100, v));
    energyEl.textContent = Math.round(energy);
    energyBarEl.style.width = energy + '%';
    saveGame();
}

// ---------------------------------------------------------------------
// Town layout — a world much bigger than the screen, split into loose
// districts and connected by paths, so you only ever see part of it at
// once and have to actually walk (or use the minimap) to get around.
// ---------------------------------------------------------------------
const WORLD_W = 1700, WORLD_H = 1150;

const BUILDINGS = [
    { id: 'home', name: 'Your House', x: 110, y: 120, w: 190, h: 130, color: '#ffb3d9', roof: '#e0609a', kind: 'home', icon: '🛏️' },
    { id: 'neighborA', name: "Pip's House", x: 470, y: 90, w: 180, h: 120, color: '#bcdff5', roof: '#3ea8e0', kind: 'visit', icon: '👋' },
    { id: 'neighborB', name: "Momo's House", x: 150, y: 420, w: 180, h: 120, color: '#d8c6f7', roof: '#9b59b6', kind: 'visit', icon: '👋' },
    { id: 'bakery', name: 'The Bakery', x: 900, y: 160, w: 190, h: 130, color: '#ffe3c2', roof: '#d1652c', kind: 'job', icon: '🍞',
      job: { title: 'Bake bread', energyCost: 10, coinGain: 15 } },
    { id: 'bookstore', name: 'The Bookstore', x: 1330, y: 420, w: 190, h: 130, color: '#cfe8f5', roof: '#2c86b8', kind: 'job', icon: '📚',
      job: { title: 'Shelve books', energyCost: 15, coinGain: 25 } },
    { id: 'grocery', name: 'Grocery Store', x: 620, y: 780, w: 200, h: 140, color: '#dbe8f2', roof: '#5cab4e', kind: 'grocery', icon: '🍎' },
    { id: 'clothing', name: 'Clothing Store', x: 1100, y: 850, w: 200, h: 140, color: '#ffd9a0', roof: '#e08a3c', kind: 'clothing', icon: '👕' },
];

// Decorative-only props scattered around — purely visual, no collision.
const TREES = [
    [60, 300], [420, 260], [750, 60], [1250, 90], [1600, 260], [80, 650],
    [420, 620], [900, 500], [1550, 550], [1000, 700], [340, 900], [780, 950],
    [1450, 780], [60, 1000], [1620, 1000], [1300, 200], [560, 480], [1620, 700],
];
const BUSHES = [
    [260, 270], [560, 230], [980, 320], [1420, 340], [720, 700], [280, 570],
    [1180, 780], [850, 950], [1500, 620],
];
const FLOWERBEDS = [
    [340, 260], [830, 300], [1290, 590], [700, 940], [1180, 1000],
];

const PATH_POINTS = [
    [205, 300], [560, 300], [995, 300], [240, 480], [1425, 480],
    [720, 850], [1200, 920], [205, 300], [560, 155], [995, 700], [1425, 480], [1425, 155],
];
// Explicit path segments (index pairs into PATH_POINTS) so the network
// reads as real streets rather than a scribble.
const PATH_SEGMENTS = [
    [0, 1], [1, 2], [0, 3], [2, 4], [3, 5], [4, 5], [5, 6], [1, 8], [2, 9], [4, 10], [10, 11],
];

const FOODS = [
    { name: 'Apple', price: 5, energy: 10, emoji: '🍎' },
    { name: 'Sandwich', price: 15, energy: 25, emoji: '🥪' },
    { name: 'Pizza Slice', price: 30, energy: 50, emoji: '🍕' },
    { name: 'Cake', price: 50, energy: 80, emoji: '🍰' },
];

// ---------------------------------------------------------------------
// Blob player
// ---------------------------------------------------------------------
const BLOB_R = 18;
const MOVE_SPEED = 4.2;
const AUTO_WALK_SPEED = 5.5;
let blob = { x: 205, y: 300, vx: 0, vy: 0, facing: 1, squash: 0, target: null, bob: 0 };
let inBuilding = null; // set while the action panel (nap/work/shop) is open
let interiorId = null; // set while standing inside a building's interior view
let outdoorReturnPos = null; // where to place the blob when walking back out
let keys = { up: false, down: false, left: false, right: false };
let cameraX = 0, cameraY = 0;

// ---------------------------------------------------------------------
// Interiors — walking into a building's door doesn't just pop up a menu,
// it swaps the whole view to a small room you actually walk around in.
// Reach the counter/bed to open that building's action panel; walk into
// the door at the bottom to head back outside.
// ---------------------------------------------------------------------
const INTERIOR_RECT = { x: 60, y: 46, w: 740, h: 420 };
const INTERIOR_THEMES = {
    home: { floor: '#f7e6cf', wall: '#ffe9d6', trim: '#e0609a', furniture: 'bed', label: 'Bed' },
    neighborA: { floor: '#e3eff8', wall: '#eaf4fb', trim: '#3ea8e0', furniture: 'sofa', label: 'Sofa' },
    neighborB: { floor: '#ece0f7', wall: '#f4ecfb', trim: '#9b59b6', furniture: 'sofa', label: 'Sofa' },
    bakery: { floor: '#f7ddb8', wall: '#fff1de', trim: '#d1652c', furniture: 'counter', label: 'Counter' },
    bookstore: { floor: '#dbe8f2', wall: '#eaf4fb', trim: '#2c86b8', furniture: 'shelves', label: 'Counter' },
    grocery: { floor: '#e3efe0', wall: '#f0f8ec', trim: '#5cab4e', furniture: 'shelves', label: 'Register' },
    clothing: { floor: '#fbe8d2', wall: '#fff3e6', trim: '#e08a3c', furniture: 'rack', label: 'Register' },
};

function interiorCounterZone() {
    return { x: INTERIOR_RECT.x + INTERIOR_RECT.w / 2 - 55, y: INTERIOR_RECT.y + 26, w: 110, h: 60 };
}
function interiorExitZone() {
    return { x: INTERIOR_RECT.x + INTERIOR_RECT.w / 2 - 32, y: INTERIOR_RECT.y + INTERIOR_RECT.h - 18, w: 64, h: 30 };
}

function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function doorZone(b) {
    return { x: b.x + b.w / 2 - 28, y: b.y + b.h - 16, w: 56, h: 32 };
}

function blobBox(x, y) {
    return { x: x - BLOB_R, y: y - BLOB_R, w: BLOB_R * 2, h: BLOB_R * 2 };
}

// Resolves movement one axis at a time, using the ALREADY-resolved
// position for the second axis — this is what makes sliding along a wall
// smooth instead of stuttering (checking both axes against the original
// position independently is what caused the old jerky/stuck movement).
// `obstacles` is optional (interiors have none, just their own bounds).
function moveWithCollision(dx, dy, bounds, obstacles) {
    let nx = blob.x + dx;
    if (obstacles) {
        const testX = blobBox(nx, blob.y);
        for (const b of obstacles) {
            if (rectsOverlap(testX, b) && !rectsOverlap(testX, doorZone(b))) { nx = blob.x; break; }
        }
    }
    blob.x = Math.max(bounds.x + BLOB_R, Math.min(bounds.x + bounds.w - BLOB_R, nx));

    let ny = blob.y + dy;
    if (obstacles) {
        const testY = blobBox(blob.x, ny);
        for (const b of obstacles) {
            if (rectsOverlap(testY, b) && !rectsOverlap(testY, doorZone(b))) { ny = blob.y; break; }
        }
    }
    blob.y = Math.max(bounds.y + BLOB_R, Math.min(bounds.y + bounds.h - BLOB_R, ny));
}

const WORLD_BOUNDS = { x: 0, y: 0, w: WORLD_W, h: WORLD_H };

function update() {
    blob.bob = (blob.bob + 0.06) % (Math.PI * 2);

    if (inBuilding) return;

    const inputX = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const inputY = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);

    if (inputX !== 0 || inputY !== 0) blob.target = null; // manual input cancels auto-walk

    let dx = 0, dy = 0;
    if (blob.target) {
        const tdx = blob.target.x - blob.x, tdy = blob.target.y - blob.y;
        const dist = Math.hypot(tdx, tdy);
        if (dist < 6) {
            blob.target = null;
        } else {
            dx = (tdx / dist) * AUTO_WALK_SPEED;
            dy = (tdy / dist) * AUTO_WALK_SPEED;
        }
    } else {
        // Normalize diagonal input so it isn't faster than cardinal movement.
        const len = Math.hypot(inputX, inputY) || 1;
        dx = (inputX / len) * MOVE_SPEED;
        dy = (inputY / len) * MOVE_SPEED;
    }

    if (dx !== 0) blob.facing = dx > 0 ? 1 : -1;
    if (dx !== 0 || dy !== 0) blob.squash = Math.min(1, blob.squash + 0.1);
    else blob.squash = Math.max(0, blob.squash - 0.1);

    if (interiorId) {
        moveWithCollision(dx, dy, INTERIOR_RECT, null);
        const box = blobBox(blob.x, blob.y);
        if (rectsOverlap(box, interiorCounterZone())) {
            openPanel(BUILDINGS.find(b => b.id === interiorId));
        } else if (rectsOverlap(box, interiorExitZone())) {
            exitToOutdoors();
        }
        return;
    }

    moveWithCollision(dx, dy, WORLD_BOUNDS, BUILDINGS);

    cameraX = Math.max(0, Math.min(blob.x - VW / 2, WORLD_W - VW));
    cameraY = Math.max(0, Math.min(blob.y - VH / 2, WORLD_H - VH));

    const box = blobBox(blob.x, blob.y);
    for (const b of BUILDINGS) {
        if (rectsOverlap(box, doorZone(b))) {
            enterInterior(b);
            break;
        }
    }
}

// ---------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------
function drawTree(x, y) {
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(x, y + 4, 16, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6b4426';
    ctx.fillRect(x - 4, y - 24, 8, 26);
    ctx.fillStyle = '#3f8f4a';
    ctx.beginPath();
    ctx.arc(x, y - 40, 20, 0, Math.PI * 2);
    ctx.arc(x - 14, y - 28, 15, 0, Math.PI * 2);
    ctx.arc(x + 14, y - 28, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.arc(x - 7, y - 46, 8, 0, Math.PI * 2);
    ctx.fill();
}

function drawBush(x, y) {
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath();
    ctx.ellipse(x, y + 8, 16, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4a9e46';
    ctx.beginPath();
    ctx.arc(x - 10, y, 11, 0, Math.PI * 2);
    ctx.arc(x + 10, y, 11, 0, Math.PI * 2);
    ctx.arc(x, y - 8, 13, 0, Math.PI * 2);
    ctx.fill();
}

function drawFlowerbed(x, y) {
    ctx.fillStyle = '#8b5a2b';
    ctx.beginPath();
    ctx.ellipse(x, y, 26, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    const colors = ['#ff8fc4', '#ffe066', '#ff7043', '#c9a8ff'];
    for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const fx = x + Math.cos(a) * 16, fy = y + Math.sin(a) * 7;
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.arc(fx, fy, 3.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawWorld() {
    // Sky/grass background, drawn once across the whole world and offset
    // by the camera — bright and cheerful, matching the rest of the site.
    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    const grad = ctx.createLinearGradient(0, 0, 0, WORLD_H);
    grad.addColorStop(0, '#dff3ff');
    grad.addColorStop(1, '#c3ecb0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    // Subtle grass texture speckle.
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    for (let i = 0; i < 220; i++) {
        const gx = (i * 137) % WORLD_W, gy = (i * 971) % WORLD_H;
        ctx.fillRect(gx, gy, 3, 3);
    }

    drawPaths();
    FLOWERBEDS.forEach(([x, y]) => drawFlowerbed(x, y));
    BUSHES.forEach(([x, y]) => drawBush(x, y));
    BUILDINGS.forEach(drawBuilding);
    drawBlob();
    TREES.forEach(([x, y]) => drawTree(x, y)); // trees drawn last so they can overlap building tops nicely

    ctx.restore();
}

function drawPaths() {
    ctx.strokeStyle = '#e0c496';
    ctx.lineWidth = 30;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    PATH_SEGMENTS.forEach(([a, b]) => {
        const p1 = PATH_POINTS[a], p2 = PATH_POINTS[b];
        ctx.beginPath();
        ctx.moveTo(p1[0], p1[1]);
        ctx.lineTo(p2[0], p2[1]);
        ctx.stroke();
    });
    // Cobblestone dashes down the middle of every path.
    ctx.strokeStyle = 'rgba(180,150,110,0.55)';
    ctx.lineWidth = 4;
    ctx.setLineDash([10, 14]);
    PATH_SEGMENTS.forEach(([a, b]) => {
        const p1 = PATH_POINTS[a], p2 = PATH_POINTS[b];
        ctx.beginPath();
        ctx.moveTo(p1[0], p1[1]);
        ctx.lineTo(p2[0], p2[1]);
        ctx.stroke();
    });
    ctx.setLineDash([]);
}

function drawBuilding(b) {
    // Ground shadow
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(b.x + b.w / 2, b.y + b.h + 6, b.w / 2, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Roof with a little ridge highlight
    ctx.fillStyle = b.roof;
    ctx.beginPath();
    ctx.moveTo(b.x - 14, b.y + 4);
    ctx.lineTo(b.x + b.w / 2, b.y - 46);
    ctx.lineTo(b.x + b.w + 14, b.y + 4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(b.x + b.w / 2, b.y - 46);
    ctx.lineTo(b.x + b.w / 2 - 30, b.y - 6);
    ctx.stroke();

    // Chimney
    ctx.fillStyle = '#8a8a92';
    ctx.fillRect(b.x + b.w - 40, b.y - 30, 14, 24);

    // Windows with frames + flower box
    [b.x + 20, b.x + b.w - 46].forEach(wx => {
        ctx.fillStyle = '#fffbe8';
        ctx.fillRect(wx, b.y + 22, 28, 28);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.strokeRect(wx, b.y + 22, 28, 28);
        ctx.beginPath();
        ctx.moveTo(wx + 14, b.y + 22); ctx.lineTo(wx + 14, b.y + 50);
        ctx.moveTo(wx, b.y + 36); ctx.lineTo(wx + 28, b.y + 36);
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(wx - 3, b.y + 50, 34, 6);
    });

    // Door
    const d = doorZone(b);
    ctx.fillStyle = '#6b4426';
    ctx.beginPath();
    ctx.roundRect(b.x + b.w / 2 - 20, b.y + b.h - 46, 40, 46, [8, 8, 0, 0]);
    ctx.fill();
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.arc(b.x + b.w / 2 + 10, b.y + b.h - 24, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Signboard with an icon so each building reads at a glance.
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(b.x + b.w / 2 - 22, b.y - 70, 44, 28, 6);
    ctx.fill();
    ctx.strokeStyle = b.roof;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = '18px "Segoe UI Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(b.icon, b.x + b.w / 2, b.y - 50);

    // Label
    ctx.fillStyle = '#274a63';
    ctx.font = 'bold 13px Segoe UI, sans-serif';
    ctx.fillText(b.name, b.x + b.w / 2, b.y - 78);
    ctx.textAlign = 'left';
}

function drawBlob() {
    const x = blob.x, y = blob.y + Math.sin(blob.bob) * 1.5;
    const stretch = 1 + blob.squash * 0.14;
    const squash = 1 - blob.squash * 0.12;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(blob.facing < 0 ? -stretch : stretch, squash);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, BLOB_R * 0.95, BLOB_R * 0.85, BLOB_R * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body with a soft radial-ish two-tone shade for more depth
    const hex = BLOB_COLORS[equippedColor].hex;
    ctx.fillStyle = hex;
    ctx.beginPath();
    ctx.ellipse(0, 0, BLOB_R, BLOB_R * 0.94, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.beginPath();
    ctx.ellipse(0, BLOB_R * 0.35, BLOB_R * 0.85, BLOB_R * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, BLOB_R, BLOB_R * 0.94, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(-BLOB_R * 0.35, -BLOB_R * 0.4, BLOB_R * 0.38, BLOB_R * 0.26, -0.4, 0, Math.PI * 2);
    ctx.fill();

    // Eyes + rosy cheeks
    ctx.fillStyle = '#ff9ecb';
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(BLOB_R * 0.05, BLOB_R * 0.25, 4, 0, Math.PI * 2);
    ctx.arc(BLOB_R * 0.75, BLOB_R * 0.25, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#2c1a10';
    ctx.beginPath();
    ctx.arc(BLOB_R * 0.32, -BLOB_R * 0.1, 3.2, 0, Math.PI * 2);
    ctx.arc(BLOB_R * 0.64, -BLOB_R * 0.1, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(BLOB_R * 0.34, -BLOB_R * 0.16, 1, 0, Math.PI * 2);
    ctx.arc(BLOB_R * 0.66, -BLOB_R * 0.16, 1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// ---------------------------------------------------------------------
// Minimap — click anywhere on it to walk there automatically. Since the
// world is bigger than the screen, this is the easiest way to see the
// whole layout and get across town quickly.
// ---------------------------------------------------------------------
const MINIMAP = { x: VW - 176, y: 16, w: 160, h: 108 };

function drawMinimap() {
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.roundRect(MINIMAP.x, MINIMAP.y, MINIMAP.w, MINIMAP.h, 10);
    ctx.fill();
    ctx.strokeStyle = '#3ea8e0';
    ctx.lineWidth = 2;
    ctx.stroke();

    const sx = MINIMAP.w / WORLD_W, sy = MINIMAP.h / WORLD_H;
    // Buildings
    BUILDINGS.forEach(b => {
        const mx = MINIMAP.x + (b.x + b.w / 2) * sx;
        const my = MINIMAP.y + (b.y + b.h / 2) * sy;
        ctx.fillStyle = b.roof;
        ctx.beginPath();
        ctx.arc(mx, my, 3.5, 0, Math.PI * 2);
        ctx.fill();
    });
    // Current view rectangle
    ctx.strokeStyle = 'rgba(39,74,99,0.6)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(MINIMAP.x + cameraX * sx, MINIMAP.y + cameraY * sy, VW * sx, VH * sy);
    // Player marker
    ctx.fillStyle = BLOB_COLORS[equippedColor].hex;
    ctx.beginPath();
    ctx.arc(MINIMAP.x + blob.x * sx, MINIMAP.y + blob.y * sy, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#274a63';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.font = 'bold 9px Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(39,74,99,0.7)';
    ctx.textAlign = 'center';
    ctx.fillText('MAP — click to walk', MINIMAP.x + MINIMAP.w / 2, MINIMAP.y + MINIMAP.h + 12);
    ctx.textAlign = 'left';
    ctx.restore();
}

// ---------------------------------------------------------------------
// Interior room view — a small fixed room drawn straight in screen space
// (no camera translate needed, unlike the outdoor world).
// ---------------------------------------------------------------------
function drawInteriorFurniture(theme) {
    const z = interiorCounterZone();
    const cx = z.x + z.w / 2;

    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath();
    ctx.ellipse(cx, z.y + z.h + 6, z.w / 2, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    if (theme.furniture === 'bed') {
        ctx.fillStyle = theme.trim;
        ctx.beginPath();
        ctx.roundRect(z.x, z.y, z.w, z.h, 8);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(z.x + 8, z.y + 6, 28, 20, 6);
        ctx.fill();
    } else if (theme.furniture === 'sofa') {
        ctx.fillStyle = theme.trim;
        ctx.beginPath();
        ctx.roundRect(z.x, z.y + 12, z.w, z.h - 12, 10);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(z.x, z.y, z.w, 16, 8);
        ctx.fill();
    } else if (theme.furniture === 'counter') {
        ctx.fillStyle = theme.trim;
        ctx.beginPath();
        ctx.roundRect(z.x, z.y + z.h * 0.4, z.w, z.h * 0.6, 6);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(z.x + 6, z.y + z.h * 0.44, z.w - 12, 6);
    } else if (theme.furniture === 'shelves') {
        ctx.fillStyle = theme.trim;
        ctx.fillRect(z.x, z.y, z.w, z.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 3;
        for (let i = 1; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(z.x, z.y + (z.h / 3) * i);
            ctx.lineTo(z.x + z.w, z.y + (z.h / 3) * i);
            ctx.stroke();
        }
    } else if (theme.furniture === 'rack') {
        ctx.strokeStyle = theme.trim;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(z.x, z.y);
        ctx.lineTo(z.x + z.w, z.y);
        ctx.stroke();
        const swatches = ['#ff8fc4', '#8fd4ff', '#ffe066', '#c9a8ff'];
        for (let i = 0; i < 4; i++) {
            const hx = z.x + 10 + i * (z.w - 20) / 3;
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(hx, z.y);
            ctx.lineTo(hx, z.y + 10);
            ctx.stroke();
            ctx.fillStyle = swatches[i % swatches.length];
            ctx.beginPath();
            ctx.roundRect(hx - 8, z.y + 10, 16, z.h - 10, 4);
            ctx.fill();
        }
    }

    ctx.fillStyle = '#274a63';
    ctx.font = 'bold 11px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(theme.label, cx, z.y - 8);
    ctx.textAlign = 'left';
}

function drawInterior() {
    const theme = INTERIOR_THEMES[interiorId];
    const wallH = INTERIOR_RECT.h * 0.32;

    ctx.fillStyle = '#eef6fb';
    ctx.fillRect(0, 0, VW, VH);

    ctx.fillStyle = theme.wall;
    ctx.fillRect(INTERIOR_RECT.x, INTERIOR_RECT.y, INTERIOR_RECT.w, wallH);
    ctx.fillStyle = theme.floor;
    ctx.fillRect(INTERIOR_RECT.x, INTERIOR_RECT.y + wallH, INTERIOR_RECT.w, INTERIOR_RECT.h - wallH);

    ctx.strokeStyle = theme.trim;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(INTERIOR_RECT.x, INTERIOR_RECT.y + wallH);
    ctx.lineTo(INTERIOR_RECT.x + INTERIOR_RECT.w, INTERIOR_RECT.y + wallH);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 1;
    for (let fx = INTERIOR_RECT.x; fx < INTERIOR_RECT.x + INTERIOR_RECT.w; fx += 40) {
        ctx.beginPath();
        ctx.moveTo(fx, INTERIOR_RECT.y + wallH);
        ctx.lineTo(fx, INTERIOR_RECT.y + INTERIOR_RECT.h);
        ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 3;
    ctx.strokeRect(INTERIOR_RECT.x, INTERIOR_RECT.y, INTERIOR_RECT.w, INTERIOR_RECT.h);

    drawInteriorFurniture(theme);

    const ez = interiorExitZone();
    ctx.fillStyle = '#6b4426';
    ctx.beginPath();
    ctx.roundRect(ez.x, ez.y - 20, ez.w, ez.h + 20, [8, 8, 0, 0]);
    ctx.fill();
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.arc(ez.x + ez.w - 10, ez.y + 10, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#274a63';
    ctx.font = 'bold 11px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('EXIT', ez.x + ez.w / 2, ez.y + ez.h + 14);

    ctx.font = 'bold 16px Segoe UI, sans-serif';
    ctx.fillText(BUILDINGS.find(b => b.id === interiorId).name, VW / 2, INTERIOR_RECT.y - 16);
    ctx.textAlign = 'left';

    drawBlob();
}

function render() {
    if (interiorId) {
        drawInterior();
    } else {
        drawWorld();
        drawMinimap();
    }
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------
// Building interactions
// ---------------------------------------------------------------------
// Walking into a building's door swaps to its interior room — it doesn't
// open the action panel by itself. The panel opens once you reach the
// counter/bed inside (see openPanel below), and closing it just hides the
// overlay, leaving you free to walk to the exit door yourself.
function enterInterior(b) {
    interiorId = b.id;
    outdoorReturnPos = { x: blob.x, y: blob.y - 34 };
    blob.target = null;
    keys.up = keys.down = keys.left = keys.right = false;
    blob.x = INTERIOR_RECT.x + INTERIOR_RECT.w / 2;
    blob.y = INTERIOR_RECT.y + INTERIOR_RECT.h - 40;
}

function exitToOutdoors() {
    interiorId = null;
    if (outdoorReturnPos) { blob.x = outdoorReturnPos.x; blob.y = outdoorReturnPos.y; }
    blob.target = null;
    keys.up = keys.down = keys.left = keys.right = false;
    cameraX = Math.max(0, Math.min(blob.x - VW / 2, WORLD_W - VW));
    cameraY = Math.max(0, Math.min(blob.y - VH / 2, WORLD_H - VH));
}

function openPanel(b) {
    inBuilding = b.id;
    renderBuildingPanel(b);
    overlayEl.classList.add('show');
}

function closePanel() {
    inBuilding = null;
    overlayEl.classList.remove('show');
}

function renderBuildingPanel(b) {
    panelEl.innerHTML = '';
    const h2 = document.createElement('h2');
    h2.textContent = b.name;
    panelEl.appendChild(h2);

    if (b.kind === 'home') {
        const flavor = document.createElement('div');
        flavor.className = 'flavor';
        flavor.textContent = 'Home sweet home. A nap always helps you recover.';
        panelEl.appendChild(flavor);

        const cooldownMs = 8000;
        const remaining = cooldownMs - (Date.now() - lastNapAt);
        const btn = document.createElement('button');
        btn.className = 'action-btn';
        if (remaining > 0) {
            btn.disabled = true;
            btn.innerHTML = '<span>Resting...</span><span class="sub">back up in ' + Math.ceil(remaining / 1000) + 's</span>';
        } else if (energy >= 100) {
            btn.disabled = true;
            btn.innerHTML = '<span>Take a Nap</span><span class="sub">already full energy</span>';
        } else {
            btn.innerHTML = '<span>Take a Nap</span><span class="sub">+40 energy</span>';
            btn.addEventListener('click', () => {
                setEnergy(energy + 40);
                lastNapAt = Date.now();
                saveGame();
                showHint('😴 Zzz... +40 energy');
                renderBuildingPanel(b);
            });
        }
        panelEl.appendChild(btn);
    } else if (b.kind === 'visit') {
        const flavor = document.createElement('div');
        flavor.className = 'flavor';
        flavor.textContent = b.id === 'neighborA'
            ? 'Pip waves hello and offers you a snack from the garden.'
            : "Momo is baking cookies and shares a spare coin jar.";
        panelEl.appendChild(flavor);

        const cooldownMs = 60000;
        const last = lastVisitAt[b.id] || 0;
        const remaining = cooldownMs - (Date.now() - last);
        const btn = document.createElement('button');
        btn.className = 'action-btn';
        if (remaining > 0) {
            btn.disabled = true;
            btn.innerHTML = '<span>Say Hi</span><span class="sub">come back in ' + Math.ceil(remaining / 1000) + 's</span>';
        } else {
            btn.innerHTML = '<span>Say Hi</span><span class="sub">+5 coins</span>';
            btn.addEventListener('click', () => {
                setCoins(coins + 5);
                lastVisitAt[b.id] = Date.now();
                saveGame();
                showHint('👋 +5 coins from a friendly visit!');
                renderBuildingPanel(b);
            });
        }
        panelEl.appendChild(btn);
    } else if (b.kind === 'job') {
        const flavor = document.createElement('div');
        flavor.className = 'flavor';
        flavor.textContent = 'Work a shift to earn some coins. It takes energy, so keep an eye on your levels.';
        panelEl.appendChild(flavor);

        const btn = document.createElement('button');
        btn.className = 'action-btn';
        const job = b.job;
        if (energy < job.energyCost) {
            btn.disabled = true;
            btn.innerHTML = '<span>' + job.title + '</span><span class="sub">too tired — need ' + job.energyCost + ' energy</span>';
        } else {
            btn.innerHTML = '<span>' + job.title + '</span><span class="sub">-' + job.energyCost + ' energy, +' + job.coinGain + ' coins</span>';
            btn.addEventListener('click', () => {
                setEnergy(energy - job.energyCost);
                setCoins(coins + job.coinGain);
                showHint('💰 +' + job.coinGain + ' coins!');
                renderBuildingPanel(b);
            });
        }
        panelEl.appendChild(btn);
    } else if (b.kind === 'grocery') {
        const flavor = document.createElement('div');
        flavor.className = 'flavor';
        flavor.textContent = 'Buy food to restore energy.';
        panelEl.appendChild(flavor);

        FOODS.forEach(food => {
            const btn = document.createElement('button');
            btn.className = 'action-btn';
            const afford = coins >= food.price;
            btn.disabled = !afford;
            btn.innerHTML = '<span>' + food.emoji + ' ' + food.name + '</span><span class="sub">' + food.price + ' coins — +' + food.energy + ' energy</span>';
            btn.addEventListener('click', () => {
                if (coins < food.price) return;
                setCoins(coins - food.price);
                setEnergy(energy + food.energy);
                showHint(food.emoji + ' Yum! +' + food.energy + ' energy');
                renderBuildingPanel(b);
            });
            panelEl.appendChild(btn);
        });
    } else if (b.kind === 'clothing') {
        const flavor = document.createElement('div');
        flavor.className = 'flavor';
        flavor.textContent = 'Pick a new color for your blob.';
        panelEl.appendChild(flavor);

        const grid = document.createElement('div');
        grid.className = 'shop-grid';
        BLOB_COLORS.forEach((c, i) => {
            const owned = ownedColors[i];
            const equipped = equippedColor === i;
            const item = document.createElement('div');
            item.className = 'shop-item' + (equipped ? ' selected' : '');
            const preview = document.createElement('canvas');
            preview.width = 44; preview.height = 44;
            const pctx = preview.getContext('2d');
            pctx.fillStyle = c.hex;
            pctx.beginPath();
            pctx.ellipse(22, 24, 16, 15, 0, 0, Math.PI * 2);
            pctx.fill();
            pctx.fillStyle = '#2c1a10';
            pctx.beginPath();
            pctx.arc(27, 20, 2, 0, Math.PI * 2);
            pctx.arc(32, 20, 2, 0, Math.PI * 2);
            pctx.fill();
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = owned ? (equipped ? 'Equipped' : c.name) : c.price + ' coins';
            item.appendChild(preview);
            item.appendChild(label);
            item.addEventListener('click', () => {
                if (owned) {
                    equippedColor = i;
                    saveGame();
                    renderBuildingPanel(b);
                } else if (coins >= c.price) {
                    setCoins(coins - c.price);
                    ownedColors[i] = true;
                    equippedColor = i;
                    saveGame();
                    showHint('👕 New color equipped!');
                    renderBuildingPanel(b);
                }
            });
            grid.appendChild(item);
        });
        panelEl.appendChild(grid);
    }

    const close = document.createElement('button');
    close.className = 'close-btn';
    close.textContent = 'Leave';
    close.addEventListener('click', closePanel);
    panelEl.appendChild(close);
}

// ---------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------
function clearKeys() { keys.up = keys.down = keys.left = keys.right = false; }

window.addEventListener('keydown', e => {
    if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.up = true;
    if (['ArrowDown', 's', 'S'].includes(e.key)) keys.down = true;
    if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
    if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
    if (e.key === 'Escape' && inBuilding) closePanel();
});
window.addEventListener('keyup', e => {
    if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.up = false;
    if (['ArrowDown', 's', 'S'].includes(e.key)) keys.down = false;
    if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
    if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
});
// The single biggest source of "stuck" movement in a keys-held game: the
// window loses focus (clicking a button, switching tabs) while a key is
// physically down, so the keyup that would normally clear it never
// arrives. Clearing everything on any focus loss fixes that outright.
window.addEventListener('blur', clearKeys);
document.addEventListener('visibilitychange', () => { if (document.hidden) clearKeys(); });

function bindHold(id, key) {
    const el = document.getElementById(id);
    const start = ev => { ev.preventDefault(); keys[key] = true; };
    const end = ev => { ev.preventDefault(); keys[key] = false; };
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', end);
}
bindHold('btn-up', 'up');
bindHold('btn-down', 'down');
bindHold('btn-left', 'left');
bindHold('btn-right', 'right');

canvas.addEventListener('click', e => {
    if (inBuilding || interiorId) return;
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (VW / rect.width);
    const cy = (e.clientY - rect.top) * (VH / rect.height);
    if (cx >= MINIMAP.x && cx <= MINIMAP.x + MINIMAP.w && cy >= MINIMAP.y && cy <= MINIMAP.y + MINIMAP.h) {
        const wx = (cx - MINIMAP.x) / MINIMAP.w * WORLD_W;
        const wy = (cy - MINIMAP.y) / MINIMAP.h * WORLD_H;
        blob.target = { x: Math.max(BLOB_R, Math.min(WORLD_W - BLOB_R, wx)), y: Math.max(BLOB_R, Math.min(WORLD_H - BLOB_R, wy)) };
        clearKeys();
        showHint('🚶 Walking there...');
    }
});

document.getElementById('back-btn').addEventListener('click', () => {
    window.top.location.href = 'didis-games.html';
});

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
loadGame();
coinsEl.textContent = coins;
energyEl.textContent = Math.round(energy);
energyBarEl.style.width = energy + '%';
showHint('🌼 Walk into a building, or click the map to fast-travel!');
requestAnimationFrame(loop);
window.focus();
</script>

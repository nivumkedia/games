<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Didi's Games</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #ffffff;
    --sidebar-bg: #ffffff;
    --border: #c8dff0;
    --text: #1a2a3a;
    --dim: #7a9ab8;
    --accent: #3ea8e0;
    --surface: #f0f7ff;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

header h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--accent);
}

#back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.2s, color 0.2s, transform 0.2s;
}

#back-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(1.1);
}

.main {
    flex: 1;
    position: relative;
    overflow: hidden;
}

.bubble-field {
    position: absolute;
    inset: 0;
}

.bubble {
    position: absolute;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(62, 168, 224, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.bubble:hover {
    box-shadow: 0 14px 32px rgba(62, 168, 224, 0.28);
    border-color: var(--accent);
}

.bubble-name {
    font-size: clamp(12px, 2.4vmin, 16px);
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.3px;
    text-align: center;
    line-height: 1.15;
    padding: 0 14%;
}

.game-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}
</style>
</head>
<body>

<header>
    <button id="back-btn" title="Back to Playmerth 2.0">←</button>
    <h1>DIDI'S GAMES</h1>
</header>

<div class="main">
    <div class="bubble-field" id="bubble-field"></div>
    <iframe class="game-frame" id="game-frame"></iframe>
</div>

<script>
const GAMES = [
    { name: 'Sushi Maker', src: '../../sushi-game.html' },
    { name: 'Block Blast', src: 'block-blast.html' },
    { name: '2048', src: '2048.html' },
];

const field = document.getElementById('bubble-field');

function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }

// Cycle through varied sizes so bubbles don't just shrink as more are added —
// the cluster grows to fit them instead.
const SIZE_TIERS = [195, 145, 215, 165, 130, 180];
function diameterFor(i) {
    const base = SIZE_TIERS[i % SIZE_TIERS.length];
    const viewportCap = Math.min(window.innerWidth, window.innerHeight) * 0.46;
    return Math.max(95, Math.min(base, viewportCap));
}

const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
const RISE_DURATION = 3000;
const DAMPING = 0.975;
const CENTER_SPRING = 0.0018;
const WANDER_LERP = 0.012;
const GAP = 16;

let centerX, centerY, homes;

// Relaxation-based packing: seed positions on a golden-angle spiral, then
// repeatedly push overlapping pairs apart (respecting each bubble's own
// radius) while gently pulling everything back toward the center. This
// converges on a tight, non-overlapping, evenly-spaced cluster no matter
// how much the bubble sizes vary — unlike a plain spiral layout, which only
// spaces bubbles evenly by angle and can leave differently-sized neighbors
// overlapping.
function computeHomes() {
    const radii = GAMES.map((_, i) => diameterFor(i) / 2);
    const n = radii.length;
    const avgRadius = radii.reduce((sum, r) => sum + r, 0) / n;
    const seedScale = avgRadius * 1.7;
    const pts = radii.map((_, i) => {
        if (n <= 1) return { x: 0, y: 0 };
        const r = seedScale * Math.sqrt(i / (n - 1));
        const theta = i * GOLDEN_ANGLE;
        return { x: Math.cos(theta) * r, y: Math.sin(theta) * r };
    });

    for (let iter = 0; iter < 500; iter++) {
        for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
                const dx = pts[j].x - pts[i].x, dy = pts[j].y - pts[i].y;
                let dist = Math.hypot(dx, dy);
                const minDist = radii[i] + radii[j] + GAP;
                if (dist >= minDist) continue;
                if (dist < 0.001) dist = 0.001;
                const nx = dx / dist, ny = dy / dist;
                const overlap = (minDist - dist) / 2;
                pts[i].x -= nx * overlap; pts[i].y -= ny * overlap;
                pts[j].x += nx * overlap; pts[j].y += ny * overlap;
            }
        }
        for (let i = 0; i < n; i++) {
            pts[i].x *= 0.995;
            pts[i].y *= 0.995;
        }
    }

    return pts;
}

function refreshHomes() {
    const rect = field.getBoundingClientRect();
    centerX = rect.width / 2;
    centerY = rect.height / 2;
    const pts = computeHomes();
    homes = pts.map(p => ({ x: centerX + p.x, y: centerY + p.y }));
}

refreshHomes();

const bubbles = GAMES.map((game, i) => {
    const diameter = diameterFor(i);
    const radius = diameter / 2;
    const home = homes[i];
    const fieldRect = field.getBoundingClientRect();
    const startY = fieldRect.height + radius + 40;

    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.width = `${diameter}px`;
    el.style.height = `${diameter}px`;
    el.style.left = `${home.x - radius}px`;
    el.style.top = `${startY - radius}px`;
    el.innerHTML = `<div class="bubble-name">${game.name}</div>`;
    el.addEventListener('click', () => loadGame(game.src));
    field.appendChild(el);

    return {
        el, radius,
        homeX: home.x, homeY: home.y,
        startY,
        x: home.x, y: startY,
        vx: 0, vy: 0,
        phase: 'rising',
        riseStart: performance.now() + i * 280,
        swayAmp: 12 + Math.random() * 8,
        swayFreq: 1.5 + Math.random() * 0.6,
        wanderTargetVX: 0, wanderTargetVY: 0,
        nextWanderChange: 0,
    };
});

function physicsTick(now) {
    bubbles.forEach(b => {
        if (b.phase !== 'rising') return;
        const elapsed = now - b.riseStart;
        if (elapsed < 0) return;
        const t = Math.min(1, elapsed / RISE_DURATION);
        const eased = easeOutQuint(t);
        b.x = b.homeX + b.swayAmp * Math.sin(t * b.swayFreq * Math.PI * 2) * (1 - eased);
        b.y = b.homeY + (b.startY - b.homeY) * (1 - eased);
        if (t >= 1) {
            b.phase = 'floating';
            b.vx = 0;
            b.vy = 0;
            b.nextWanderChange = now;
        }
    });

    const floaters = bubbles.filter(b => b.phase === 'floating');
    floaters.forEach(b => {
        if (now >= b.nextWanderChange) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 0.15 + Math.random() * 0.35;
            b.wanderTargetVX = Math.cos(angle) * speed;
            b.wanderTargetVY = Math.sin(angle) * speed;
            b.nextWanderChange = now + 2000 + Math.random() * 2500;
        }
        b.vx += (b.wanderTargetVX - b.vx) * WANDER_LERP;
        b.vy += (b.wanderTargetVY - b.vy) * WANDER_LERP;
        b.vx += (b.homeX - b.x) * CENTER_SPRING;
        b.vy += (b.homeY - b.y) * CENTER_SPRING;
        b.vx *= DAMPING;
        b.vy *= DAMPING;
    });

    for (let i = 0; i < bubbles.length; i++) {
        for (let j = i + 1; j < bubbles.length; j++) {
            const a = bubbles[i], b = bubbles[j];
            let dx = b.x - a.x, dy = b.y - a.y;
            let dist = Math.hypot(dx, dy);
            const minDist = a.radius + b.radius + GAP;
            if (dist >= minDist) continue;
            if (dist < 0.001) { dx = 1; dy = 0; dist = 1; }
            const nx = dx / dist, ny = dy / dist;
            const overlap = minDist - dist;
            const aMovable = a.phase === 'floating';
            const bMovable = b.phase === 'floating';
            const share = (aMovable ? 1 : 0) + (bMovable ? 1 : 0);
            if (share === 0) continue;
            // Fully resolve the overlap every frame — a soft partial push
            // lets fast-wandering bubbles sustain an overlap indefinitely.
            const push = overlap / share;
            if (aMovable) { a.x -= nx * push; a.y -= ny * push; }
            if (bMovable) { b.x += nx * push; b.y += ny * push; }

            // Cancel the velocity driving them together so they don't
            // immediately re-collide next frame.
            if (aMovable && bMovable) {
                const approach = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
                if (approach < 0) {
                    a.vx += nx * approach * 0.5; a.vy += ny * approach * 0.5;
                    b.vx -= nx * approach * 0.5; b.vy -= ny * approach * 0.5;
                }
            } else if (aMovable) {
                const approach = -(a.vx * nx + a.vy * ny);
                if (approach > 0) { a.vx += nx * approach; a.vy += ny * approach; }
            } else if (bMovable) {
                const approach = b.vx * nx + b.vy * ny;
                if (approach > 0) { b.vx -= nx * approach; b.vy -= ny * approach; }
            }
        }
    }

    floaters.forEach(b => { b.x += b.vx; b.y += b.vy; });

    bubbles.forEach(b => {
        b.el.style.left = `${(b.x - b.radius).toFixed(2)}px`;
        b.el.style.top = `${(b.y - b.radius).toFixed(2)}px`;
    });

    requestAnimationFrame(physicsTick);
}

requestAnimationFrame(physicsTick);

let resizeTimer = null;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        refreshHomes();
        bubbles.forEach((b, i) => {
            b.homeX = homes[i].x;
            b.homeY = homes[i].y;
        });
    }, 200);
});

function loadGame(src) {
    const frame = document.getElementById('game-frame');
    frame.src = src;
    frame.style.display = 'block';
    field.style.display = 'none';
    frame.onload = () => frame.contentWindow?.focus();
}

document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = 'gamehub.html';
});
</script>

</body>
</html>

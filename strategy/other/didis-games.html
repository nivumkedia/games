<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Didi's Games</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #e8f4fd;
    --sidebar-bg: #ffffff;
    --border: #c8dff0;
    --text: #1a2a3a;
    --dim: #7a9ab8;
    --accent: #3ea8e0;
    --surface: #f0f7ff;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

header h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--accent);
}

#back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s, transform 0.2s;
}

#back-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(1.1);
}

.game-frame {
    flex: 1;
    width: 100%;
    border: none;
}
</style>
</head>
<body>

<header>
    <button id="back-btn" title="Back to Playmerth 2.0">←</button>
    <h1>Didi's Games</h1>
</header>

<iframe class="game-frame" src="../../sushi-game.html"></iframe>

<script>
document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = 'gamehub.html';
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Didi's Games</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #ffffff;
    --sidebar-bg: #ffffff;
    --border: #c8dff0;
    --text: #1a2a3a;
    --dim: #7a9ab8;
    --accent: #3ea8e0;
    --surface: #f0f7ff;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

header h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--accent);
}

#back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.2s, color 0.2s, transform 0.2s;
}

#back-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(1.1);
}

.main {
    flex: 1;
    position: relative;
    overflow: hidden;
}

.bubble-field {
    position: absolute;
    inset: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    align-content: center;
    gap: 4vh;
    padding: 5vh 5vw;
}

.bubble {
    position: relative;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(62, 168, 224, 0.18);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    cursor: pointer;
    will-change: transform;
}

.bubble:hover {
    box-shadow: 0 14px 32px rgba(62, 168, 224, 0.28);
    border-color: var(--accent);
}

.bubble-icon {
    line-height: 1;
}

.bubble-name {
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.3px;
    text-align: center;
    line-height: 1.15;
    padding: 0 12%;
}

.game-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}
</style>
</head>
<body>

<header>
    <button id="back-btn" title="Back to Playmerth 2.0">←</button>
    <h1>DIDI'S GAMES</h1>
</header>

<div class="main">
    <div class="bubble-field" id="bubble-field"></div>
    <iframe class="game-frame" id="game-frame"></iframe>
</div>

<script>
const GAMES = [
    { name: 'Sushi Maker', icon: '🍣', src: '../../sushi-game.html', size: 210 },
    { name: 'Block Blast', icon: '🟪', src: 'block-blast.html', size: 190 },
];

const field = document.getElementById('bubble-field');

const fitCap = Math.min(window.innerWidth, window.innerHeight) * 0.4;

function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }

GAMES.forEach((game, i) => {
    const diameter = Math.max(130, Math.min(game.size, fitCap));
    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.width = `${diameter}px`;
    el.style.height = `${diameter}px`;
    el.innerHTML = `<div class="bubble-icon" style="font-size:${diameter * 0.32}px">${game.icon}</div>` +
        `<div class="bubble-name" style="font-size:${Math.max(12, diameter * 0.08)}px">${game.name}</div>`;
    el.addEventListener('click', () => loadGame(game.src));
    field.appendChild(el);

    const riseDelay = i * 300;
    const riseDuration = 3200;
    const riseStart = performance.now() + riseDelay;
    const startY = window.innerHeight * 0.75 + diameter;
    const swayAmp = 14 + Math.random() * 8;
    const swayFreq = 1.6 + Math.random() * 0.6;

    const floatAmpY = 8 + Math.random() * 6;
    const floatPeriodY = 4500 + Math.random() * 2500;
    const floatAmpX = 5 + Math.random() * 5;
    const floatPeriodX = 5500 + Math.random() * 3000;
    const floatPhaseX = Math.random() * Math.PI * 2;

    function tick(now) {
        let x, y;
        if (now < riseStart) {
            requestAnimationFrame(tick);
            return;
        }
        const elapsed = now - riseStart;
        if (elapsed < riseDuration) {
            const t = elapsed / riseDuration;
            const eased = easeOutQuint(t);
            y = startY * (1 - eased);
            x = swayAmp * Math.sin(t * swayFreq * Math.PI * 2) * (1 - eased);
        } else {
            const ft = (now - riseStart - riseDuration);
            y = floatAmpY * Math.sin((ft / floatPeriodY) * Math.PI * 2);
            x = floatAmpX * Math.sin((ft / floatPeriodX) * Math.PI * 2 + floatPhaseX);
        }
        el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
        requestAnimationFrame(tick);
    }

    el.style.transform = `translate(0, ${startY}px)`;
    requestAnimationFrame(tick);
});

function loadGame(src) {
    const frame = document.getElementById('game-frame');
    frame.src = src;
    frame.style.display = 'block';
    field.style.display = 'none';
}

document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = 'gamehub.html';
});
</script>

</body>
</html>

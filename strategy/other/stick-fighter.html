<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stick Fighter</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
        height:100%;
        overflow:hidden;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background:#bfe3f7;
    }
    #bg { position:fixed; inset:0; width:100vw; height:100vh; display:block; }

    .screen {
        position:fixed; inset:0;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        transition:opacity .35s ease;
    }
    .screen.hidden { opacity:0; pointer-events:none; }

    #title {
        font-size:clamp(56px, 11vw, 150px);
        font-weight:900;
        letter-spacing:.04em;
        line-height:.95;
        text-align:center;
        color:#c62828;
        -webkit-text-stroke:3px #fff;
        paint-order:stroke fill;
        text-shadow:0 6px 0 #7f1414, 0 14px 30px rgba(60,30,20,.28);
        transform:rotate(-3deg);
        animation:drop .7s cubic-bezier(.2,1.6,.4,1) both;
        user-select:none;
    }
    #title span { display:block; color:#1f2a36; text-shadow:0 6px 0 #0c1219, 0 14px 30px rgba(20,30,40,.28); }
    #tagline {
        margin-top:22px;
        font-size:clamp(14px, 1.6vw, 20px);
        font-weight:600;
        letter-spacing:.35em;
        text-transform:uppercase;
        color:#355870;
        animation:fade .6s .5s both;
        user-select:none;
    }

    #playBtn {
        margin-top:48px;
        font:900 clamp(26px, 3vw, 38px)/1 'Segoe UI', sans-serif;
        letter-spacing:.12em;
        color:#fff;
        background:linear-gradient(#ff5a3c, #e53935);
        border:4px solid #fff;
        border-radius:999px;
        padding:20px 74px;
        cursor:pointer;
        box-shadow:0 8px 0 #9b1c1c, 0 16px 30px rgba(120,30,20,.35);
        transition:transform .12s, box-shadow .12s, filter .12s;
        animation:fade .6s .8s both, pulse 1.8s 1.6s ease-in-out infinite;
    }
    #playBtn:hover { filter:brightness(1.08); transform:translateY(-3px) scale(1.04); }
    #playBtn:active { transform:translateY(6px); box-shadow:0 2px 0 #9b1c1c, 0 6px 14px rgba(120,30,20,.3); }
    #hint {
        margin-top:20px; font-size:14px; color:#4d6d84;
        animation:fade .6s 1.1s both;
    }

    #homeScreen { background:#fff; }
    #homeScreen h2 { font-size:42px; color:#1f2a36; }
    #homeScreen p { margin-top:10px; color:#4d6d84; font-size:18px; }

    @keyframes drop { from { opacity:0; transform:translateY(-80px) rotate(-3deg) scale(1.2); } to { opacity:1; transform:rotate(-3deg); } }
    @keyframes fade { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="startScreen" class="screen">
    <h1 id="title">STICK<span>FIGHTER</span></h1>
    <div id="tagline">Last one standing wins</div>
    <button id="playBtn">PLAY</button>
    <div id="hint">or press Enter</div>
</div>

<div id="homeScreen" class="screen hidden">
    <h2>Home</h2>
    <p>The home page comes next.</p>
</div>

<script>
const cv = document.getElementById('bg');
const ctx = cv.getContext('2d');
let W, H, t = 0;

function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

const clouds = Array.from({ length: 6 }, (_, i) => ({ x: Math.random(), y: 0.08 + Math.random() * 0.3, s: 0.6 + Math.random() * 0.8, v: 0.00004 + Math.random() * 0.00006 }));
const petals = Array.from({ length: 28 }, () => ({ x: Math.random(), y: Math.random(), r: 3 + Math.random() * 3, v: 0.0006 + Math.random() * 0.0009, w: Math.random() * 6.28 }));

function cloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(x, y, 30 * s, 0, 7);
    ctx.arc(x + 34 * s, y - 14 * s, 38 * s, 0, 7);
    ctx.arc(x + 72 * s, y, 30 * s, 0, 7);
    ctx.rect(x, y, 72 * s, 30 * s);
    ctx.fill();
}

function hills(baseY, amp, color, seed, off = 0) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) {
        const wx = x + off;
        ctx.lineTo(x, baseY - amp * (0.5 + 0.5 * Math.sin(wx * 0.004 + seed) * Math.cos(wx * 0.0017 + seed * 2)));
    }
    ctx.lineTo(W, H);
    ctx.fill();
}

function pagoda(cx, baseY, s) {
    ctx.fillStyle = '#7d9bb0';
    for (let i = 0; i < 4; i++) {
        const y = baseY - i * 34 * s, w = (70 - i * 12) * s;
        ctx.fillRect(cx - w * 0.35, y - 26 * s, w * 0.7, 26 * s);
        ctx.beginPath();
        ctx.moveTo(cx - w, y - 22 * s);
        ctx.quadraticCurveTo(cx, y - 40 * s, cx + w, y - 22 * s);
        ctx.lineTo(cx + w * 0.7, y - 30 * s);
        ctx.lineTo(cx - w * 0.7, y - 30 * s);
        ctx.fill();
    }
    ctx.fillRect(cx - 2 * s, baseY - 4 * 34 * s - 30 * s, 4 * s, 22 * s);
}

// ---------- Stick fighter skeleton ----------
// Fixed bone lengths keep the body in realistic proportions (about 7.5 heads tall,
// legs half the height, arms reaching mid-thigh). Poses are joint angles in degrees:
// torso is measured from straight up, limbs from straight down; positive = toward the
// direction the fighter faces.
const BONE = { thigh: 46, shin: 44, torso: 60, neck: 7, head: 11, upper: 31, fore: 29 };
const POSES = {
    guard:   { torso: 6,   tilt: 4,   fThigh: 30,  fShin: 2,    bThigh: -14, bShin: -38,
               fUpper: 38, fFore: 162, bUpper: 22, bFore: 148 },
    crouch:  { torso: 22,  tilt: -6,  fThigh: 70,  fShin: -12,  bThigh: 6,   bShin: -76,
               fUpper: 30, fFore: 140, bUpper: -36, bFore: 34 },
    runA:    { torso: 20,  tilt: -8,  fThigh: 50,  fShin: 8,    bThigh: -34, bShin: -92,
               fUpper: -40, fFore: 50, bUpper: 48, bFore: 128 },
    runB:    { torso: 20,  tilt: -8,  fThigh: -34, fShin: -92,  bThigh: 50,  bShin: 8,
               fUpper: 48, fFore: 128, bUpper: -40, bFore: 50 },
    chamber: { torso: -6,  tilt: 8,   fThigh: 104, fShin: -18,  bThigh: -4,  bShin: -118,
               fUpper: 54, fFore: 150, bUpper: -60, bFore: -20 },
    kick:    { torso: -26, tilt: 16,  fThigh: 96,  fShin: 93,   bThigh: -8,  bShin: -112,
               fUpper: 72, fFore: 108, bUpper: -104, bFore: -82 },
    flinch:  { torso: -10, tilt: -10, fThigh: 24,  fShin: 4,    bThigh: -18, bShin: -30,
               fUpper: 70, fFore: 172, bUpper: 52, bFore: 168 },
    hit:     { torso: -40, tilt: -26, fThigh: 26,  fShin: 14,   bThigh: -10, bShin: -4,
               fUpper: 132, fFore: 160, bUpper: -150, bFore: -172 },
    fall:    { torso: -74, tilt: -14, fThigh: 64,  fShin: 36,   bThigh: 34,  bShin: 10,
               fUpper: -130, fFore: -160, bUpper: -96, bFore: -122 },
    down:    { torso: -90, tilt: -4,  fThigh: 58,  fShin: 128,  bThigh: 88,  bShin: 92,
               fUpper: -58, fFore: -98, bUpper: -112, bFore: -94 }
};
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = k => Math.max(0, Math.min(1, k));
const easeOut = k => { k = clamp01(k); return 1 - (1 - k) * (1 - k); };
const easeInOut = k => (k = clamp01(k)) < 0.5 ? 2 * k * k : 1 - 2 * (1 - k) * (1 - k);
function blend(a, b, k) {
    k = clamp01(k);
    const out = {};
    for (const j in a) out[j] = lerp(a[j], b[j], k);
    return out;
}

// Joint positions relative to the hip (unscaled, facing right, y down) plus how far
// the lowest point hangs below the hip, so grounded poses can stand on the floor
function solve(pose) {
    const rad = Math.PI / 180;
    const down = (o, deg, len) => [o[0] + Math.sin(deg * rad) * len, o[1] + Math.cos(deg * rad) * len];
    const up = (o, deg, len) => [o[0] + Math.sin(deg * rad) * len, o[1] - Math.cos(deg * rad) * len];
    const hip = [0, 0];
    const neck = up(hip, pose.torso, BONE.torso);
    const sh = up(hip, pose.torso, BONE.torso - 5);
    const head = up(neck, pose.torso + pose.tilt, BONE.neck + BONE.head);
    const fk = down(hip, pose.fThigh, BONE.thigh), ff = down(fk, pose.fShin, BONE.shin);
    const bk = down(hip, pose.bThigh, BONE.thigh), bf = down(bk, pose.bShin, BONE.shin);
    const e1 = down(sh, pose.fUpper, BONE.upper), h1 = down(e1, pose.fFore, BONE.fore);
    const e2 = down(sh, pose.bUpper, BONE.upper), h2 = down(e2, pose.bFore, BONE.fore);
    const J = { hip, neck, sh, head, fk, ff, bk, bf, e1, h1, e2, h2 };
    let low = head[1] + BONE.head;
    for (const k in J) low = Math.max(low, J[k][1]);
    J.low = low;
    return J;
}
const standHeight = (pose, s) => solve(pose).low * s;

// hipY is the hip's screen y
function drawFighter(x, hipY, s, dir, color, pose, bob, phase, alpha = 1) {
    const J = solve(pose);
    const P = j => [J[j][0] * s, J[j][1] * s + (j === 'bf' || j === 'ff' ? 0 : bob)];
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, hipY);
    ctx.scale(dir, 1);
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = 6 * s; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const neck = P('neck'), head = P('head'), sh = P('sh');
    ctx.beginPath();
    ctx.moveTo(...P('bf')); ctx.lineTo(...P('bk')); ctx.lineTo(...P('hip'));
    ctx.lineTo(...P('fk')); ctx.lineTo(...P('ff'));
    ctx.moveTo(...P('hip')); ctx.lineTo(...neck); ctx.lineTo(...head);
    ctx.moveTo(...sh); ctx.lineTo(...P('e1')); ctx.lineTo(...P('h1'));
    ctx.moveTo(...sh); ctx.lineTo(...P('e2')); ctx.lineTo(...P('h2'));
    ctx.stroke();
    ctx.beginPath(); ctx.arc(head[0], head[1], BONE.head * s, 0, 7); ctx.fill();
    // headband tails trail behind the head
    const ang = Math.atan2(head[1] - neck[1], head[0] - neck[0]);
    const flap = Math.sin(t * 0.12 + phase) * 4 * s;
    ctx.translate(head[0], head[1]); ctx.rotate(ang + Math.PI / 2);
    ctx.lineWidth = 3 * s;
    ctx.beginPath();
    ctx.moveTo(-10 * s, -3 * s);
    ctx.quadraticCurveTo(-22 * s, -6 * s + flap, -33 * s, 2 * s + flap);
    ctx.stroke();
    ctx.restore();
}

// ---------- Intro: left fighter runs in and flying-kicks the right fighter down ----------
// Attacker: quick dip, accelerating run, leap with the knee chambered, leg snaps out at contact.
// Victim: spots it late and flinches, then is thrown by simple physics (arc, bounce, slide).
const DIP = 5, RUN = 20, FLY = 16;
const TAKEOFF = DIP + RUN, IMPACT = TAKEOFF + FLY;
let introT = -1, freeze = 0, shake = 0, impactFx = 0, impactPos = null;
const sparks = [], trail = [];
let V = null;   // victim physics once hit
let camX = 0;

function burst(x, y, colors, n, power, grav) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = power * (0.3 + Math.random());
        sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 0.3, life: 1,
                      c: colors[i % colors.length], r: 2 + Math.random() * 4, g: grav });
    }
}

function layout(ground, s) {
    const ax0 = W * 0.16, vx0 = W * 0.84;
    const g = solve(POSES.guard), k = solve(POSES.kick);
    // the kicking foot meets the victim's chest
    const chest = [lerp(g.hip[0], g.neck[0], 0.7), lerp(g.hip[1], g.neck[1], 0.7)];
    const target = [vx0 - chest[0] * s, ground - g.low * s + chest[1] * s];
    const kickX = target[0] - k.ff[0] * s, kickHipY = target[1] - k.ff[1] * s;
    // run distance chosen so run speed flows straight into flight speed
    const dRun = (kickX - ax0) / (1 + 2 * FLY / RUN);
    return { ax0, vx0, target, kickX, kickHipY, takeoffX: ax0 + dRun, vFly: 2 * dRun / RUN };
}

function attackerState(ground, s, L) {
    const T = introT;
    const groundHip = p => ground - standHeight(p, s);
    if (T < 0) return { x: L.ax0, hipY: groundHip(POSES.guard), pose: POSES.guard, bob: 1 };
    if (T < DIP) {
        const pose = blend(POSES.guard, POSES.crouch, easeOut(T / DIP));
        return { x: L.ax0, hipY: groundHip(pose), pose, bob: 0 };
    }
    if (T < TAKEOFF) {
        const u = (T - DIP) / RUN;
        const x = L.ax0 + (L.takeoffX - L.ax0) * u * u;
        const cyc = blend(POSES.runA, POSES.runB, 0.5 - 0.5 * Math.cos((x - L.ax0) / (40 * s)));
        const pose = blend(POSES.crouch, cyc, (T - DIP) / 4);
        const hop = Math.abs(Math.sin((x - L.ax0) / (40 * s))) * 5 * s;
        return { x, hipY: groundHip(pose) - hop, pose, bob: 0 };
    }
    if (T <= IMPACT) {
        const p = (T - TAKEOFF) / FLY;
        const runEnd = blend(POSES.runA, POSES.runB, 0.5 - 0.5 * Math.cos((L.takeoffX - L.ax0) / (40 * s)));
        let pose;
        if (p < 0.3) pose = blend(runEnd, POSES.chamber, p / 0.3);
        else if (p < 0.72) pose = POSES.chamber;
        else pose = blend(POSES.chamber, POSES.kick, easeOut((p - 0.72) / 0.28));
        const y0 = groundHip(runEnd);
        const hipY = lerp(y0, L.kickHipY, p) - 4 * p * (1 - p) * 60 * s;
        return { x: L.takeoffX + L.vFly * (T - TAKEOFF), hipY, pose, bob: 0 };
    }
    // rebound off the victim, drop and absorb the landing, settle back into guard
    const n = T - IMPACT;
    const x = L.kickX - 26 * s * easeOut(Math.min(1, n / 18));
    if (n < 16) {
        const q = n / 16;
        const pose = blend(POSES.kick, POSES.crouch, easeOut(q));
        const hipY = lerp(L.kickHipY - 12 * s, groundHip(POSES.crouch), q * q) - (1 - q) * q * 30 * s;
        return { x, hipY, pose, bob: 0 };
    }
    const pose = blend(POSES.crouch, POSES.guard, easeInOut((n - 16) / 16));
    return { x, hipY: groundHip(pose), pose, bob: clamp01((n - 32) / 10) };
}

function victimState(ground, s, L) {
    const T = introT;
    if (!V) {
        const pose = T > IMPACT - 7 ? blend(POSES.guard, POSES.flinch, (T - (IMPACT - 7)) / 5) : POSES.guard;
        return { x: L.vx0, hipY: ground - standHeight(pose, s), pose, bob: T > IMPACT - 7 ? 0 : 1 };
    }
    return { x: V.x, hipY: ground - V.h, pose: V.pose, bob: 0 };
}

function stepVictim(ground, s, L) {
    const maxX = W + L.camMax - 105 * s;
    const n = introT - IMPACT;
    if (!V.landed) {
        V.pose = n < 5 ? blend(POSES.flinch, POSES.hit, easeOut(n / 5)) : blend(POSES.hit, POSES.fall, (n - 5) / 16);
        // limbs fold flat as the body comes down so nothing sinks into the floor
        if (V.vy < 0) V.pose = blend(V.pose, POSES.down, 1 - (V.h - standHeight(POSES.down, s)) / (70 * s));
    } else {
        V.landT++;
        V.pose = blend(V.landFrom, POSES.down, easeOut(V.landT / 7));
    }
    V.vy -= 0.5 * s;            // V.h is height above the floor, so gravity pulls it down
    V.h += V.vy;
    V.x += V.vx;
    if (V.x > maxX) { V.x = maxX; V.vx = 0; }
    // lands on its back: the floor is where the lying body rests
    const floorH = standHeight(POSES.down, s);
    if (V.h <= floorH) {
        V.h = floorH;
        if (!V.landed) {
            V.landed = true; V.landT = 0; V.landFrom = V.pose;
            V.vy = 2.6 * s; V.vx *= 0.55;
            burst(V.x + 30 * s, ground - 4, ['#d6b07c', '#e8c99a', '#c49a64'], 22, 3.4 * s, 0.12);
            shake = 10;
        } else if (V.vy < -1 * s && !V.bounced) {
            V.bounced = true; V.vy = 0; V.vx *= 0.7;
            burst(V.x + 30 * s, ground - 4, ['#d6b07c', '#e8c99a'], 8, 2 * s, 0.12);
            shake = 4;
        } else { V.vy = 0; V.vx *= 0.84; }
    }
}

function stepIntro(ground, s, L) {
    if (introT < 0) return;
    if (freeze > 0) { freeze--; return; }
    introT++;
    if (introT === IMPACT) {
        const [fx, fy] = L.target;
        impactPos = [fx, fy]; impactFx = 16;
        burst(fx, fy, ['#ffd54f', '#ffffff', '#ff7043'], 28, 7 * s, 0.18);
        freeze = 7; shake = 16;
        const roomX = W + L.camMax - 105 * s - L.vx0;
        V = { x: L.vx0, h: standHeight(POSES.flinch, s), vx: Math.min(7 * s, roomX / 46), vy: 6.5 * s,
              pose: POSES.flinch, landed: false, bounced: false };
    }
    if (introT === IMPACT + 16) burst(L.kickX - 26 * s, ground - 4, ['#d6b07c', '#e8c99a'], 10, 2 * s, 0.12);
    if (V && introT > IMPACT) stepVictim(ground, s, L);
    if (introT === 150) showHome();
}

function drawImpact(s) {
    if (impactFx <= 0) return;
    const [x, y] = impactPos, k = impactFx / 16;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = k;
    ctx.fillStyle = '#fff59d';
    ctx.strokeStyle = '#ff7043'; ctx.lineWidth = 3 * s;
    const R = (1.4 - k * 0.6) * 46 * s;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
        const r = i % 2 ? R * 0.42 : R, a = i / 16 * Math.PI * 2 + 0.2;
        ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    if (freeze === 0) impactFx--;
}

function draw() {
    t++;
    ctx.save();
    if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.85; if (shake < 0.4) shake = 0;
    }
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#8fd0f2'); sky.addColorStop(0.65, '#d9f0fb'); sky.addColorStop(1, '#fff4dc');
    ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, H + 40);

    // sun
    ctx.fillStyle = 'rgba(255,214,102,0.35)';
    ctx.beginPath(); ctx.arc(W * 0.78, H * 0.2, 90, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath(); ctx.arc(W * 0.78, H * 0.2, 56, 0, 7); ctx.fill();

    for (const c of clouds) {
        c.x += c.v; if (c.x > 1.15) c.x = -0.15;
        cloud(c.x * W, c.y * H, c.s);
    }

    const ground = H * 0.82;
    const s = Math.max(0.9, Math.min(1.8, H / 520));
    const L = layout(ground, s);
    L.camMax = W * 0.14;
    stepIntro(ground, s, L);
    // camera drifts right to follow the run and leave room for the knockdown
    camX = introT < 0 ? 0 : L.camMax * easeInOut(clamp01((introT - DIP) / (IMPACT + 24 - DIP)));

    hills(H * 0.62, 120, '#b4d6e6', 1.3, camX * 0.25);
    pagoda(W * 0.16 - camX * 0.4, H * 0.6, Math.min(1.2, W / 1200));
    hills(H * 0.72, 70, '#9cc9a0', 4.1, camX * 0.5);

    // arena floor
    ctx.fillStyle = '#e8c99a'; ctx.fillRect(-20, ground, W + 40, H - ground + 20);
    ctx.fillStyle = '#d6b07c'; ctx.fillRect(-20, ground, W + 40, 6);
    ctx.strokeStyle = 'rgba(150,110,60,0.25)'; ctx.lineWidth = 2;
    for (let x = -((camX % 80) + 80); x < W + 80; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, ground + 6); ctx.lineTo(x - 60, H); ctx.stroke();
    }

    ctx.save();
    ctx.translate(-camX, 0);
    const A = attackerState(ground, s, L), B = victimState(ground, s, L);
    const bobA = Math.sin(t * 0.06) * 3 * s * A.bob, bobB = Math.sin(t * 0.06 + 1.7) * 3 * s * B.bob;
    // shadows shrink as a fighter leaves the floor
    ctx.fillStyle = 'rgba(120,85,40,0.22)';
    for (const [F, pose] of [[A, A.pose], [B, B.pose]]) {
        const lift = ground - standHeight(pose, s) - F.hipY;
        const sw = Math.max(0.35, 1 - lift / (180 * s));
        ctx.beginPath(); ctx.ellipse(F.x, ground + 2, 40 * s * sw, 7 * s * sw, 0, 0, 7); ctx.fill();
    }
    // motion trail behind the attacker while running and flying
    if (freeze === 0) {
        if (introT >= DIP + 8 && introT <= IMPACT) trail.push(A);
        if (trail.length > 4 || (introT > IMPACT && trail.length)) trail.shift();
    }
    trail.forEach((F, i) => drawFighter(F.x, F.hipY, s, 1, '#1565c0', F.pose, 0, 0, 0.08 + i * 0.05));
    drawFighter(B.x, B.hipY, s, -1, '#d84315', B.pose, bobB, 1.7);
    drawFighter(A.x, A.hipY, s, 1, '#1565c0', A.pose, bobA, 0);

    for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        if (freeze === 0) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.96; p.life -= 0.03; }
        if (p.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawImpact(s);
    ctx.restore();
    ctx.restore();

    // cherry petals
    ctx.fillStyle = 'rgba(244,143,177,0.85)';
    for (const p of petals) {
        p.y += p.v; p.w += 0.03;
        if (p.y > 1.05) { p.y = -0.05; p.x = Math.random(); }
        ctx.beginPath();
        ctx.ellipse(p.x * W + Math.sin(p.w) * 20, p.y * H, p.r, p.r * 0.6, p.w, 0, 7);
        ctx.fill();
    }

    // white-out that clears the scene before the home page
    if (introT > 118) {
        ctx.fillStyle = `rgba(255,255,255,${clamp01((introT - 118) / 30)})`;
        ctx.fillRect(0, 0, W, H);
    }
    requestAnimationFrame(draw);
}
draw();

const startScreen = document.getElementById('startScreen');
const homeScreen = document.getElementById('homeScreen');
function play() {
    if (introT >= 0) return;
    startScreen.classList.add('hidden');
    introT = 0;
}
function showHome() {
    homeScreen.classList.remove('hidden');
}
document.getElementById('playBtn').addEventListener('click', play);
addEventListener('keydown', e => {
    if (e.code === 'Enter' && introT < 0) play();
});
</script>
</body>
</html>

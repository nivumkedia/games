<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stick Fighter</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
        height:100%;
        overflow:hidden;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background:#bfe3f7;
    }
    #bg { position:fixed; inset:0; width:100vw; height:100vh; display:block; }

    .screen {
        position:fixed; inset:0;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        transition:opacity .35s ease;
    }
    .screen.hidden { opacity:0; pointer-events:none; }

    #title {
        font-size:clamp(56px, 11vw, 150px);
        font-weight:900;
        letter-spacing:.04em;
        line-height:.95;
        text-align:center;
        color:#c62828;
        -webkit-text-stroke:3px #fff;
        paint-order:stroke fill;
        text-shadow:0 6px 0 #7f1414, 0 14px 30px rgba(60,30,20,.28);
        transform:rotate(-3deg);
        animation:drop .7s cubic-bezier(.2,1.6,.4,1) both;
        user-select:none;
    }
    #title span { display:block; color:#1f2a36; text-shadow:0 6px 0 #0c1219, 0 14px 30px rgba(20,30,40,.28); }
    #tagline {
        margin-top:22px;
        font-size:clamp(14px, 1.6vw, 20px);
        font-weight:600;
        letter-spacing:.35em;
        text-transform:uppercase;
        color:#355870;
        animation:fade .6s .5s both;
        user-select:none;
    }

    #playBtn {
        margin-top:48px;
        font:900 clamp(26px, 3vw, 38px)/1 'Segoe UI', sans-serif;
        letter-spacing:.12em;
        color:#fff;
        background:linear-gradient(#ff5a3c, #e53935);
        border:4px solid #fff;
        border-radius:999px;
        padding:20px 74px;
        cursor:pointer;
        box-shadow:0 8px 0 #9b1c1c, 0 16px 30px rgba(120,30,20,.35);
        transition:transform .12s, box-shadow .12s, filter .12s;
        animation:fade .6s .8s both, pulse 1.8s 1.6s ease-in-out infinite;
    }
    #playBtn:hover { filter:brightness(1.08); transform:translateY(-3px) scale(1.04); }
    #playBtn:active { transform:translateY(6px); box-shadow:0 2px 0 #9b1c1c, 0 6px 14px rgba(120,30,20,.3); }
    #hint {
        margin-top:20px; font-size:14px; color:#4d6d84;
        animation:fade .6s 1.1s both;
    }


    /* home page overlay never blocks clicks on the canvas (move circles) */
    #homeScreen { justify-content:flex-start; padding-top:6vh; pointer-events:none; }
    #fightBtn {
        font:900 clamp(26px, 3vw, 40px)/1 'Segoe UI', sans-serif;
        letter-spacing:.12em;
        color:#fff;
        background:linear-gradient(#ff5a3c, #e53935);
        border:4px solid #fff;
        border-radius:999px;
        padding:18px 70px;
        box-shadow:0 8px 0 #9b1c1c, 0 16px 30px rgba(120,30,20,.35);
        cursor:pointer;
        pointer-events:auto;
        user-select:none;
        transition:transform .12s, box-shadow .12s, filter .12s;
    }
    #fightBtn:hover { filter:brightness(1.08); transform:translateY(-3px) scale(1.04); }
    #fightBtn:active { transform:translateY(6px); box-shadow:0 2px 0 #9b1c1c, 0 6px 14px rgba(120,30,20,.3); }

    /* fight mode select */
    #fightScreen {
        background:rgba(240,248,253,0.72);
        backdrop-filter:blur(6px);
        -webkit-backdrop-filter:blur(6px);
        padding:24px;
    }
    #fightScreen h2 {
        font-size:clamp(34px, 5vw, 60px); font-weight:900; letter-spacing:.06em;
        color:#c62828; -webkit-text-stroke:2px #fff; paint-order:stroke fill;
        text-shadow:0 5px 0 #7f1414, 0 10px 24px rgba(60,30,20,.2);
        transform:rotate(-2deg);
    }
    #modes {
        margin-top:34px;
        display:grid; grid-template-columns:repeat(4, minmax(150px, 220px)); gap:22px;
    }
    .mode {
        position:relative;
        background:#fff;
        border:3px solid #fff;
        border-radius:20px;
        padding:26px 18px 22px;
        text-align:center;
        cursor:pointer;
        font-family:inherit;
        box-shadow:0 7px 0 var(--edge), 0 14px 30px rgba(30,50,70,.18);
        transition:transform .14s, box-shadow .14s;
        overflow:hidden;
    }
    .mode::before { content:''; position:absolute; left:0; right:0; top:0; height:8px; background:var(--accent); }
    .mode:hover { transform:translateY(-6px); box-shadow:0 13px 0 var(--edge), 0 22px 36px rgba(30,50,70,.22); border-color:var(--accent); }
    .mode:active { transform:translateY(4px); box-shadow:0 3px 0 var(--edge), 0 8px 16px rgba(30,50,70,.2); }
    .mode .icon {
        width:78px; height:78px; margin:0 auto 14px; border-radius:50%;
        display:flex; align-items:center; justify-content:center; font-size:40px;
        background:var(--soft); border:3px solid var(--accent);
    }
    .mode h3 { font-size:21px; font-weight:900; color:#1f2a36; letter-spacing:.03em; }
    .mode p { margin-top:8px; font-size:14px; line-height:1.35; color:#4d6d84; }
    .mode.impossible { background:#16181d; border-color:#16181d; }
    .mode.impossible h3 { color:#ffcf40; }
    .mode.impossible p { color:#b9c2cc; }
    #fightBack {
        margin-top:34px; font:700 18px 'Segoe UI', sans-serif; color:#1f2a36;
        background:#fff; border:3px solid #1f2a36; border-radius:999px; padding:10px 32px; cursor:pointer;
    }
    #fightBack:hover { background:#f3f8fb; }
    @media (max-width:900px) { #modes { grid-template-columns:repeat(2, minmax(150px, 240px)); } }

    /* in-fight help + round results */
    #help {
        position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
        background:rgba(255,255,255,0.9); border:1px solid rgba(40,70,100,0.14); border-radius:999px;
        padding:8px 20px; font-size:13px; color:#33506b; white-space:nowrap;
        box-shadow:0 4px 16px rgba(40,70,100,0.12);
    }
    #help b { color:#1565c0; }
    #help.hidden { display:none; }
    #resultScreen { background:rgba(240,248,253,0.55); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
    #resultScreen .card {
        background:#fff; border-radius:24px; padding:30px 48px 24px; text-align:center; min-width:340px;
        box-shadow:0 10px 0 #c9d6df, 0 24px 50px rgba(30,50,70,.25);
    }
    #resultScreen .card.wide { min-width:460px; }
    #resultScreen .small { font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#7a93a6; }
    #resultScreen h2 { margin:8px 0 6px; font-size:46px; font-weight:900; color:#1f2a36; }
    #resultScreen h2.win { color:#2e7d32; } #resultScreen h2.loss { color:#c62828; }
    #resultScreen p { margin-top:6px; font-size:17px; color:#4d6d84; }
    #resultScreen .up { color:#2e7d32; font-weight:800; } #resultScreen .down { color:#e65100; font-weight:800; }
    #resultScreen .lv { font-weight:700; color:#1f2a36; }
    #resultScreen .rows { margin:16px 0 4px; display:grid; gap:4px; text-align:left; }
    #resultScreen .row { display:grid; grid-template-columns:40px 1fr 60px 60px; align-items:center; padding:5px 12px; border-radius:10px; background:#f3f7fa; font-size:14px; color:#33506b; }
    #resultScreen .row i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
    #resultScreen .row b { text-align:right; }
    #resultScreen .row.win b { color:#2e7d32; } #resultScreen .row.loss b { color:#c62828; } #resultScreen .row.draw b { color:#7a93a6; }
    #resultScreen .big {
        display:block; margin:22px auto 0; font:900 24px/1 'Segoe UI', sans-serif; letter-spacing:.1em; color:#fff;
        background:linear-gradient(#ff5a3c, #e53935); border:4px solid #fff; border-radius:999px; padding:15px 46px; cursor:pointer;
        box-shadow:0 6px 0 #9b1c1c, 0 12px 24px rgba(120,30,20,.3);
    }
    #resultScreen .big:hover { filter:brightness(1.08); }
    #resultScreen .link { margin-top:12px; background:none; border:none; color:#4d6d84; font:600 14px 'Segoe UI', sans-serif; cursor:pointer; text-decoration:underline; }

    /* Jade currency */
    #wallet {
        position:fixed; top:18px; left:18px; z-index:5;
        display:flex; gap:12px; transition:opacity .3s; user-select:none;
    }
    #wallet.hidden { opacity:0; pointer-events:none; }
    .cur {
        display:flex; align-items:center; gap:8px;
        background:rgba(255,255,255,0.92); border:3px solid var(--c); border-radius:999px;
        padding:6px 18px 6px 8px; font:900 22px/1 'Segoe UI', sans-serif; color:var(--d);
        box-shadow:0 5px 0 var(--d), 0 10px 22px rgba(20,40,60,.18);
    }
    .cur.bump { animation:bump .5s ease; }
    .gem { width:30px; height:30px; display:inline-block; vertical-align:middle; filter:drop-shadow(0 2px 2px rgba(0,60,30,.3)); }
    #resultScreen .reward { margin-top:12px; font-size:22px; font-weight:900; color:#0b6b40; }
    #resultScreen .reward .gem { width:26px; height:26px; margin-left:4px; }
    .flygem { position:fixed; left:0; top:0; z-index:20; pointer-events:none; }
    .flygem .gem { width:36px; height:36px; }

    @keyframes bump { 30% { transform:scale(1.18); } 100% { transform:scale(1); } }

    @keyframes drop { from { opacity:0; transform:translateY(-80px) rotate(-3deg) scale(1.2); } to { opacity:1; transform:rotate(-3deg); } }
    @keyframes fade { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="startScreen" class="screen">
    <h1 id="title">STICK<span>FIGHTER</span></h1>
    <div id="tagline">Last one standing wins</div>
    <button id="playBtn">PLAY</button>
    <div id="hint">or press Enter</div>
</div>

<div id="homeScreen" class="screen hidden">
    <button id="fightBtn">FIGHT!</button>
</div>

<div id="fightScreen" class="screen hidden">
    <h2>CHOOSE YOUR FIGHT</h2>
    <div id="modes">
        <button class="mode" data-mode="tournament" style="--accent:#e0a800;--edge:#b8860b;--soft:#fff6d6">
            <div class="icon">🏆</div>
            <h3>Tournament</h3>
            <p>Battle through a bracket of rivals to claim the crown.</p>
        </button>
        <button class="mode" data-mode="1v1" style="--accent:#1e88e5;--edge:#1565c0;--soft:#e3f2fd">
            <div class="icon">⚔️</div>
            <h3>1v1</h3>
            <p>One fighter, one opponent. First to win the match.</p>
        </button>
        <button class="mode" data-mode="adaptive" style="--accent:#43a047;--edge:#2e7d32;--soft:#e8f5e9">
            <div class="icon">🧠</div>
            <h3>Adaptive Matchup</h3>
            <p>A bot that learns your style and matches your skill.</p>
        </button>
        <button class="mode impossible" data-mode="impossible" style="--accent:#e53935;--edge:#000;--soft:#2a1416">
            <div class="icon">💀</div>
            <h3>Impossible Bot</h3>
            <p>The toughest opponent there is. Good luck.</p>
        </button>
    </div>
    <button id="fightBack">← Back</button>
</div>

<div id="resultScreen" class="screen hidden"></div>
<div id="wallet" class="hidden">
    <div class="cur" id="cur-jade" title="Jade (common)" style="--c:#1faa6b;--d:#0b6b40"><svg class="gem" viewBox="0 0 32 32"><polygon points="16,2 28,10 28,22 16,30 4,22 4,10" fill="#1faa6b" stroke="#0b6b40" stroke-width="2"/><polygon points="16,7 23,11.5 23,20.5 16,25 9,20.5 9,11.5" fill="#4fd59a"/><polygon points="16,7 23,11.5 16,14 9,11.5" fill="#b8f5d8"/><circle cx="12" cy="11" r="1.6" fill="#fff"/></svg><span>0</span></div>
    <div class="cur" id="cur-sapphire" title="Sapphire (rare)" style="--c:#1e63d6;--d:#0d3a8a"><svg class="gem" viewBox="0 0 32 32"><polygon points="16,2 28,10 28,22 16,30 4,22 4,10" fill="#1e63d6" stroke="#0d3a8a" stroke-width="2"/><polygon points="16,7 23,11.5 23,20.5 16,25 9,20.5 9,11.5" fill="#4f8ff0"/><polygon points="16,7 23,11.5 16,14 9,11.5" fill="#c2dbff"/><circle cx="12" cy="11" r="1.6" fill="#fff"/></svg><span>0</span></div>
    <div class="cur" id="cur-ruby" title="Ruby (rarest)" style="--c:#d61e3c;--d:#7d0c1f"><svg class="gem" viewBox="0 0 32 32"><polygon points="16,2 28,10 28,22 16,30 4,22 4,10" fill="#d61e3c" stroke="#7d0c1f" stroke-width="2"/><polygon points="16,7 23,11.5 23,20.5 16,25 9,20.5 9,11.5" fill="#f0506b"/><polygon points="16,7 23,11.5 16,14 9,11.5" fill="#ffc7d1"/><circle cx="12" cy="11" r="1.6" fill="#fff"/></svg><span>0</span></div>
</div>
<div id="help" class="hidden"><b>← →</b> move &nbsp;·&nbsp; <b>↑</b> jump &nbsp;·&nbsp; <b>↓</b> block &nbsp;·&nbsp; <b>Q</b> high punch &nbsp;·&nbsp; <b>W</b> high kick &nbsp;·&nbsp; <b>A</b> low punch &nbsp;·&nbsp; <b>S</b> low kick &nbsp;·&nbsp; <b>Esc</b> quit</div>

<script>
const cv = document.getElementById('bg');
const ctx = cv.getContext('2d');
let W, H, t = 0;

function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

const clouds = Array.from({ length: 6 }, (_, i) => ({ x: Math.random(), y: 0.08 + Math.random() * 0.3, s: 0.6 + Math.random() * 0.8, v: 0.00004 + Math.random() * 0.00006 }));
const petals = Array.from({ length: 28 }, () => ({ x: Math.random(), y: Math.random(), r: 3 + Math.random() * 3, v: 0.0006 + Math.random() * 0.0009, w: Math.random() * 6.28 }));

function cloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(x, y, 30 * s, 0, 7);
    ctx.arc(x + 34 * s, y - 14 * s, 38 * s, 0, 7);
    ctx.arc(x + 72 * s, y, 30 * s, 0, 7);
    ctx.rect(x, y, 72 * s, 30 * s);
    ctx.fill();
}

function hills(baseY, amp, color, seed, off = 0) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) {
        const wx = x + off;
        ctx.lineTo(x, baseY - amp * (0.5 + 0.5 * Math.sin(wx * 0.004 + seed) * Math.cos(wx * 0.0017 + seed * 2)));
    }
    ctx.lineTo(W, H);
    ctx.fill();
}

function pagoda(cx, baseY, s) {
    ctx.fillStyle = '#7d9bb0';
    for (let i = 0; i < 4; i++) {
        const y = baseY - i * 34 * s, w = (70 - i * 12) * s;
        ctx.fillRect(cx - w * 0.35, y - 26 * s, w * 0.7, 26 * s);
        ctx.beginPath();
        ctx.moveTo(cx - w, y - 22 * s);
        ctx.quadraticCurveTo(cx, y - 40 * s, cx + w, y - 22 * s);
        ctx.lineTo(cx + w * 0.7, y - 30 * s);
        ctx.lineTo(cx - w * 0.7, y - 30 * s);
        ctx.fill();
    }
    ctx.fillRect(cx - 2 * s, baseY - 4 * 34 * s - 30 * s, 4 * s, 22 * s);
}

// ---------- Stick fighter skeleton ----------
// Fixed bone lengths keep the body in realistic proportions (about 7.5 heads tall,
// legs half the height, arms reaching mid-thigh). Poses are joint angles in degrees:
// torso is measured from straight up, limbs from straight down; positive = toward the
// direction the fighter faces.
const BONE = { thigh: 46, shin: 44, torso: 60, neck: 6, head: 12.5, upper: 31, fore: 29 };
const POSES = {
    guard:   { torso: 6,   tilt: 4,   fThigh: 30,  fShin: 2,    bThigh: -14, bShin: -38,
               fUpper: 38, fFore: 162, bUpper: 22, bFore: 148 },
    crouch:  { torso: 22,  tilt: -6,  fThigh: 70,  fShin: -12,  bThigh: 6,   bShin: -76,
               fUpper: 30, fFore: 140, bUpper: -36, bFore: 34 },
    runA:    { torso: 20,  tilt: -8,  fThigh: 50,  fShin: 8,    bThigh: -34, bShin: -92,
               fUpper: -40, fFore: 50, bUpper: 48, bFore: 128 },
    runB:    { torso: 20,  tilt: -8,  fThigh: -34, fShin: -92,  bThigh: 50,  bShin: 8,
               fUpper: 48, fFore: 128, bUpper: -40, bFore: 50 },
    chamber: { torso: -6,  tilt: 8,   fThigh: 104, fShin: -18,  bThigh: -4,  bShin: -118,
               fUpper: 54, fFore: 150, bUpper: -60, bFore: -20 },
    kick:    { torso: -26, tilt: 16,  fThigh: 96,  fShin: 93,   bThigh: -8,  bShin: -112,
               fUpper: 72, fFore: 108, bUpper: -104, bFore: -82 },
    flinch:  { torso: -10, tilt: -10, fThigh: 24,  fShin: 4,    bThigh: -18, bShin: -30,
               fUpper: 70, fFore: 172, bUpper: 52, bFore: 168 },
    hit:     { torso: -40, tilt: -26, fThigh: 26,  fShin: 14,   bThigh: -10, bShin: -4,
               fUpper: 132, fFore: 160, bUpper: -150, bFore: -172 },
    fall:    { torso: -74, tilt: -14, fThigh: 64,  fShin: 36,   bThigh: 34,  bShin: 10,
               fUpper: -130, fFore: -160, bUpper: -96, bFore: -122 },
    down:    { torso: -90, tilt: -4,  fThigh: 58,  fShin: 128,  bThigh: 88,  bShin: 92,
               fUpper: -58, fFore: -98, bUpper: -112, bFore: -94 }
};
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = k => Math.max(0, Math.min(1, k));
const easeOut = k => { k = clamp01(k); return 1 - (1 - k) * (1 - k); };
const easeInOut = k => (k = clamp01(k)) < 0.5 ? 2 * k * k : 1 - 2 * (1 - k) * (1 - k);
function blend(a, b, k) {
    k = clamp01(k);
    const out = {};
    for (const j in a) out[j] = lerp(a[j], b[j], k);
    return out;
}

// Joint positions relative to the hip (unscaled, facing right, y down) plus how far
// the lowest point hangs below the hip, so grounded poses can stand on the floor
function solve(pose) {
    const rad = Math.PI / 180;
    const down = (o, deg, len) => [o[0] + Math.sin(deg * rad) * len, o[1] + Math.cos(deg * rad) * len];
    const up = (o, deg, len) => [o[0] + Math.sin(deg * rad) * len, o[1] - Math.cos(deg * rad) * len];
    const hip = [0, 0];
    const neck = up(hip, pose.torso, BONE.torso);
    const sh = up(hip, pose.torso, BONE.torso - 5);
    const head = up(neck, pose.torso + pose.tilt, BONE.neck + BONE.head);
    const fk = down(hip, pose.fThigh, BONE.thigh), ff = down(fk, pose.fShin, BONE.shin);
    const bk = down(hip, pose.bThigh, BONE.thigh), bf = down(bk, pose.bShin, BONE.shin);
    const e1 = down(sh, pose.fUpper, BONE.upper), h1 = down(e1, pose.fFore, BONE.fore);
    const e2 = down(sh, pose.bUpper, BONE.upper), h2 = down(e2, pose.bFore, BONE.fore);
    const J = { hip, neck, sh, head, fk, ff, bk, bf, e1, h1, e2, h2 };
    let low = head[1] + BONE.head;
    for (const k in J) low = Math.max(low, J[k][1]);
    J.low = low;
    return J;
}
const standHeight = (pose, s) => solve(pose).low * s;

// hipY is the hip's screen y
function drawFighter(x, hipY, s, dir, color, pose, bob, phase, alpha = 1) {
    const J = solve(pose);
    const P = j => [J[j][0] * s, J[j][1] * s + (j === 'bf' || j === 'ff' ? 0 : bob)];
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, hipY);
    ctx.scale(dir, 1);
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = 10 * s; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const neck = P('neck'), head = P('head'), sh = P('sh');
    ctx.beginPath();
    ctx.moveTo(...P('bf')); ctx.lineTo(...P('bk')); ctx.lineTo(...P('hip'));
    ctx.lineTo(...P('fk')); ctx.lineTo(...P('ff'));
    ctx.moveTo(...P('hip')); ctx.lineTo(...neck); ctx.lineTo(...head);
    ctx.moveTo(...sh); ctx.lineTo(...P('e1')); ctx.lineTo(...P('h1'));
    ctx.moveTo(...sh); ctx.lineTo(...P('e2')); ctx.lineTo(...P('h2'));
    ctx.stroke();
    ctx.beginPath(); ctx.arc(head[0], head[1], BONE.head * s, 0, 7); ctx.fill();
    // headband tails trail behind the head
    const ang = Math.atan2(head[1] - neck[1], head[0] - neck[0]);
    const flap = Math.sin(t * 0.12 + phase) * 4 * s;
    ctx.translate(head[0], head[1]); ctx.rotate(ang + Math.PI / 2);
    ctx.lineWidth = 4.5 * s;
    ctx.beginPath();
    ctx.moveTo(-10 * s, -3 * s);
    ctx.quadraticCurveTo(-22 * s, -6 * s + flap, -33 * s, 2 * s + flap);
    ctx.stroke();
    ctx.restore();
}

// ---------- Intro: left fighter runs in and flying-kicks the right fighter down ----------
// Attacker: quick dip, accelerating run, leap with the knee chambered, leg snaps out at contact.
// Victim: spots it late and flinches, then is thrown by simple physics (arc, bounce, slide).
const DIP = 5, RUN = 20, FLY = 16;
const TAKEOFF = DIP + RUN, IMPACT = TAKEOFF + FLY;
let introT = -1, freeze = 0, shake = 0, impactFx = 0, impactPos = null;
const sparks = [], trail = [];
let V = null;   // victim physics once hit
let camX = 0;

function burst(x, y, colors, n, power, grav) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = power * (0.3 + Math.random());
        sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 0.3, life: 1,
                      c: colors[i % colors.length], r: 2 + Math.random() * 4, g: grav });
    }
}

function layout(ground, s) {
    const ax0 = W * 0.16, vx0 = W * 0.84;
    const g = solve(POSES.guard), k = solve(POSES.kick);
    // the kicking foot meets the victim's chest
    const chest = [lerp(g.hip[0], g.neck[0], 0.7), lerp(g.hip[1], g.neck[1], 0.7)];
    const target = [vx0 - chest[0] * s, ground - g.low * s + chest[1] * s];
    const kickX = target[0] - k.ff[0] * s, kickHipY = target[1] - k.ff[1] * s;
    // run distance chosen so run speed flows straight into flight speed
    const dRun = (kickX - ax0) / (1 + 2 * FLY / RUN);
    return { ax0, vx0, target, kickX, kickHipY, takeoffX: ax0 + dRun, vFly: 2 * dRun / RUN };
}

function attackerState(ground, s, L) {
    const T = introT;
    const groundHip = p => ground - standHeight(p, s);
    if (T < 0) return { x: L.ax0, hipY: groundHip(POSES.guard), pose: POSES.guard, bob: 1 };
    if (T < DIP) {
        const pose = blend(POSES.guard, POSES.crouch, easeOut(T / DIP));
        return { x: L.ax0, hipY: groundHip(pose), pose, bob: 0 };
    }
    if (T < TAKEOFF) {
        const u = (T - DIP) / RUN;
        const x = L.ax0 + (L.takeoffX - L.ax0) * u * u;
        const cyc = blend(POSES.runA, POSES.runB, 0.5 - 0.5 * Math.cos((x - L.ax0) / (40 * s)));
        const pose = blend(POSES.crouch, cyc, (T - DIP) / 4);
        const hop = Math.abs(Math.sin((x - L.ax0) / (40 * s))) * 5 * s;
        return { x, hipY: groundHip(pose) - hop, pose, bob: 0 };
    }
    if (T <= IMPACT) {
        const p = (T - TAKEOFF) / FLY;
        const runEnd = blend(POSES.runA, POSES.runB, 0.5 - 0.5 * Math.cos((L.takeoffX - L.ax0) / (40 * s)));
        let pose;
        if (p < 0.3) pose = blend(runEnd, POSES.chamber, p / 0.3);
        else if (p < 0.72) pose = POSES.chamber;
        else pose = blend(POSES.chamber, POSES.kick, easeOut((p - 0.72) / 0.28));
        const y0 = groundHip(runEnd);
        const hipY = lerp(y0, L.kickHipY, p) - 4 * p * (1 - p) * 60 * s;
        return { x: L.takeoffX + L.vFly * (T - TAKEOFF), hipY, pose, bob: 0 };
    }
    // rebound off the victim, drop and absorb the landing, settle back into guard
    const n = T - IMPACT;
    const x = L.kickX - 26 * s * easeOut(Math.min(1, n / 18));
    if (n < 16) {
        const q = n / 16;
        const pose = blend(POSES.kick, POSES.crouch, easeOut(q));
        const hipY = lerp(L.kickHipY - 12 * s, groundHip(POSES.crouch), q * q) - (1 - q) * q * 30 * s;
        return { x, hipY, pose, bob: 0 };
    }
    const pose = blend(POSES.crouch, POSES.guard, easeInOut((n - 16) / 16));
    return { x, hipY: groundHip(pose), pose, bob: clamp01((n - 32) / 10) };
}

function victimState(ground, s, L) {
    const T = introT;
    if (!V) {
        const pose = T > IMPACT - 7 ? blend(POSES.guard, POSES.flinch, (T - (IMPACT - 7)) / 5) : POSES.guard;
        return { x: L.vx0, hipY: ground - standHeight(pose, s), pose, bob: T > IMPACT - 7 ? 0 : 1 };
    }
    return { x: V.x, hipY: ground - V.h, pose: V.pose, bob: 0 };
}

function stepVictim(ground, s, L) {
    const maxX = W + L.camMax - 105 * s;
    const n = introT - IMPACT;
    if (!V.landed) {
        V.pose = n < 5 ? blend(POSES.flinch, POSES.hit, easeOut(n / 5)) : blend(POSES.hit, POSES.fall, (n - 5) / 16);
        // limbs fold flat as the body comes down so nothing sinks into the floor
        if (V.vy < 0) V.pose = blend(V.pose, POSES.down, 1 - (V.h - standHeight(POSES.down, s)) / (70 * s));
    } else {
        V.landT++;
        V.pose = blend(V.landFrom, POSES.down, easeOut(V.landT / 7));
    }
    V.vy -= 0.5 * s;            // V.h is height above the floor, so gravity pulls it down
    V.h += V.vy;
    V.x += V.vx;
    if (V.x > maxX) { V.x = maxX; V.vx = 0; }
    // lands on its back: the floor is where the lying body rests
    const floorH = standHeight(POSES.down, s);
    if (V.h <= floorH) {
        V.h = floorH;
        if (!V.landed) {
            V.landed = true; V.landT = 0; V.landFrom = V.pose;
            V.vy = 2.6 * s; V.vx *= 0.55;
            burst(V.x + 30 * s, ground - 4, ['#d6b07c', '#e8c99a', '#c49a64'], 22, 3.4 * s, 0.12);
            shake = 10;
        } else if (V.vy < -1 * s && !V.bounced) {
            V.bounced = true; V.vy = 0; V.vx *= 0.7;
            burst(V.x + 30 * s, ground - 4, ['#d6b07c', '#e8c99a'], 8, 2 * s, 0.12);
            shake = 4;
        } else { V.vy = 0; V.vx *= 0.84; }
    }
}

function stepIntro(ground, s, L) {
    if (introT < 0) return;
    if (freeze > 0) { freeze--; return; }
    introT++;
    if (introT === IMPACT) {
        const [fx, fy] = L.target;
        impactPos = [fx, fy]; impactFx = 16;
        burst(fx, fy, ['#ffd54f', '#ffffff', '#ff7043'], 28, 7 * s, 0.18);
        freeze = 7; shake = 16;
        const roomX = W + L.camMax - 105 * s - L.vx0;
        V = { x: L.vx0, h: standHeight(POSES.flinch, s), vx: Math.min(7 * s, roomX / 46), vy: 6.5 * s,
              pose: POSES.flinch, landed: false, bounced: false };
    }
    if (introT === IMPACT + 16) burst(L.kickX - 26 * s, ground - 4, ['#d6b07c', '#e8c99a'], 10, 2 * s, 0.12);
    if (V && introT > IMPACT) stepVictim(ground, s, L);
    if (introT === 150) homeT = 0;
}

function drawImpact(s) {
    if (impactFx <= 0) return;
    const [x, y] = impactPos, k = impactFx / 16;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = k;
    ctx.fillStyle = '#fff59d';
    ctx.strokeStyle = '#ff7043'; ctx.lineWidth = 3 * s;
    const R = (1.4 - k * 0.6) * 46 * s;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
        const r = i % 2 ? R * 0.42 : R, a = i / 16 * Math.PI * 2 + 0.2;
        ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    if (freeze === 0) impactFx--;
}

function draw() {
    t++;
    ctx.save();
    if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.85; if (shake < 0.4) shake = 0;
    }
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#8fd0f2'); sky.addColorStop(0.65, '#d9f0fb'); sky.addColorStop(1, '#fff4dc');
    ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, H + 40);

    // sun
    ctx.fillStyle = 'rgba(255,214,102,0.35)';
    ctx.beginPath(); ctx.arc(W * 0.78, H * 0.2, 90, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath(); ctx.arc(W * 0.78, H * 0.2, 56, 0, 7); ctx.fill();

    for (const c of clouds) {
        c.x += c.v; if (c.x > 1.15) c.x = -0.15;
        cloud(c.x * W, c.y * H, c.s);
    }

    const ground = H * 0.82;
    const s = Math.max(0.9, Math.min(1.8, H / 520));
    const L = layout(ground, s);
    L.camMax = W * 0.14;
    if (homeT >= 0) {
        homeT++; camX = 0;
        if (homeT === 50 && !match) homeScreen.classList.remove('hidden');
    }
    else {
        stepIntro(ground, s, L);
        // camera drifts right to follow the run and leave room for the knockdown
        camX = introT < 0 ? 0 : L.camMax * easeInOut(clamp01((introT - DIP) / (IMPACT + 24 - DIP)));
    }

    hills(H * 0.62, 120, '#b4d6e6', 1.3, camX * 0.25);
    pagoda(W * 0.16 - camX * 0.4, H * 0.6, Math.min(1.2, W / 1200));
    hills(H * 0.72, 70, '#9cc9a0', 4.1, camX * 0.5);

    // arena floor
    ctx.fillStyle = '#e8c99a'; ctx.fillRect(-20, ground, W + 40, H - ground + 20);
    ctx.fillStyle = '#d6b07c'; ctx.fillRect(-20, ground, W + 40, 6);
    ctx.strokeStyle = 'rgba(150,110,60,0.25)'; ctx.lineWidth = 2;
    for (let x = -((camX % 80) + 80); x < W + 80; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, ground + 6); ctx.lineTo(x - 60, H); ctx.stroke();
    }

    walletEl.classList.toggle('hidden', homeT < 50 || (!!match && match.phase !== 'result'));
    if (match) drawMatch(ground, s);
    else if (homeT >= 0) drawHome(ground, s);
    else drawIntroFighters(ground, s, L);
    ctx.restore();

    // cherry petals
    ctx.fillStyle = 'rgba(244,143,177,0.85)';
    for (const p of petals) {
        p.y += p.v; p.w += 0.03;
        if (p.y > 1.05) { p.y = -0.05; p.x = Math.random(); }
        ctx.beginPath();
        ctx.ellipse(p.x * W + Math.sin(p.w) * 20, p.y * H, p.r, p.r * 0.6, p.w, 0, 7);
        ctx.fill();
    }

    // white-out that clears the intro, then fades away to reveal the home page
    const white = homeT >= 0 ? 1 - homeT / 30 : (introT - 118) / 30;
    if (white > 0) {
        ctx.fillStyle = `rgba(255,255,255,${clamp01(white)})`;
        ctx.fillRect(0, 0, W, H);
    }
    requestAnimationFrame(draw);
}

// ---------- Home page: your fighter in the middle, the 4 starting moves around him ----------
let homeT = -1;
const MOVE_POSES = {
    highPunch: { torso: 12,  tilt: 0,   fThigh: 34,  fShin: 4,   bThigh: -26, bShin: -34,
                 fUpper: 98, fFore: 96,  bUpper: 30, bFore: 156 },
    lowPunch:  { torso: 30,  tilt: -10, fThigh: 58,  fShin: -4,  bThigh: -30, bShin: -62,
                 fUpper: 64, fFore: 66,  bUpper: 26, bFore: 150 },
    highKick:  { torso: -32, tilt: 22,  fThigh: 128, fShin: 126, bThigh: -6,  bShin: -4,
                 fUpper: 62, fFore: 144, bUpper: -64, bFore: -30 },
    lowKick:   { torso: -8,  tilt: 6,   fThigh: 72,  fShin: 78,  bThigh: -10, bShin: -10,
                 fUpper: 40, fFore: 160, bUpper: 22, bFore: 146 }
};
const MOVES = [
    { id: 'highPunch', label: 'HIGH PUNCH', side: -1, row: 0 },
    { id: 'lowPunch',  label: 'LOW PUNCH',  side: -1, row: 1 },
    { id: 'highKick',  label: 'HIGH KICK',  side: 1,  row: 0 },
    { id: 'lowKick',   label: 'LOW KICK',   side: 1,  row: 1 }
];
let mouse = { x: -1, y: -1 }, hoverMove = null, homeMove = null, homeMoveT = 0;

function moveCircles(ground, s) {
    const r = 46 * s;
    return MOVES.map((m, i) => ({
        ...m, i, r,
        x: W / 2 + m.side * Math.min(W * 0.3, 250 * s),
        y: ground - (m.row === 0 ? 205 : 80) * s
    }));
}

// fits a pose inside a circle by its own bounding box
function drawMoveIcon(c, pop, hover) {
    const J = solve(MOVE_POSES[c.id]);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const k in J) {
        if (k === 'low') continue;
        const pad = k === 'head' ? BONE.head : 5;
        x0 = Math.min(x0, J[k][0] - pad); x1 = Math.max(x1, J[k][0] + pad);
        y0 = Math.min(y0, J[k][1] - pad); y1 = Math.max(y1, J[k][1] + pad);
    }
    const R = c.r * pop * (hover ? 1.08 : 1);
    const k = (R * 1.45) / Math.max(x1 - x0, y1 - y0);
    ctx.save();
    if (hover) { ctx.shadowColor = 'rgba(255,200,60,0.85)'; ctx.shadowBlur = 22; }
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(c.x, c.y, R, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 5 * (R / 46);
    const gold = ctx.createLinearGradient(c.x, c.y - R, c.x, c.y + R);
    gold.addColorStop(0, '#ffe58a'); gold.addColorStop(0.5, '#d4a017'); gold.addColorStop(1, '#a87708');
    ctx.strokeStyle = gold;
    ctx.stroke();
    ctx.beginPath(); ctx.arc(c.x, c.y, R - 7 * (R / 46), 0, 7);
    ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(212,160,23,0.55)'; ctx.stroke();
    drawFighter(c.x - (x0 + x1) / 2 * k, c.y - (y0 + y1) / 2 * k, k, 1, '#f5c542', MOVE_POSES[c.id], 0, c.i);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = pop;
    ctx.font = `800 ${Math.round(13 * c.r / 46)}px Segoe UI, sans-serif`;
    ctx.textAlign = 'center';
    ctx.letterSpacing = '1px';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(c.label, c.x, c.y + c.r + 20 * (c.r / 46));
    ctx.fillStyle = '#1f2a36';
    ctx.fillText(c.label, c.x, c.y + c.r + 20 * (c.r / 46));
    ctx.restore();
}

function drawHome(ground, s) {
    const hs = s * 1.45, x = W / 2;
    // round training mat under the fighter
    ctx.fillStyle = '#c9a36f';
    ctx.beginPath(); ctx.ellipse(x, ground + 16 * hs, 120 * hs, 22 * hs, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#f3dfb8';
    ctx.beginPath(); ctx.ellipse(x, ground + 12 * hs, 112 * hs, 18 * hs, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c62828'; ctx.lineWidth = 3 * hs;
    ctx.beginPath(); ctx.ellipse(x, ground + 12 * hs, 92 * hs, 13 * hs, 0, 0, 7); ctx.stroke();
    const floorY = ground + 12 * hs;
    ctx.fillStyle = 'rgba(120,85,40,0.25)';
    ctx.beginPath(); ctx.ellipse(x, floorY, 44 * hs, 7 * hs, 0, 0, 7); ctx.fill();

    // clicking a move circle makes your fighter show it: snap out, hold, return to guard
    let pose = POSES.guard, bob = Math.sin(t * 0.06) * 3 * hs;
    if (homeMove) {
        homeMoveT++;
        const n = homeMoveT, strike = MOVE_POSES[homeMove];
        pose = n < 6 ? blend(POSES.guard, strike, easeOut(n / 6))
             : n < 20 ? strike
             : blend(strike, POSES.guard, easeInOut((n - 20) / 12));
        bob = 0;
        if (n >= 32) homeMove = null;
    }
    drawFighter(x, floorY - standHeight(pose, hs), hs, 1, '#1565c0', pose, bob, 0);

    hoverMove = null;
    for (const c of moveCircles(ground, s)) {
        const pop = easeOut((homeT - 24 - c.i * 6) / 12);
        if (pop <= 0) continue;
        const hover = Math.hypot(mouse.x - c.x, mouse.y - c.y) < c.r;
        if (hover && pop >= 1) hoverMove = c.id;
        drawMoveIcon(c, pop, hover);
    }
    cv.style.cursor = hoverMove ? 'pointer' : 'default';
}

function drawIntroFighters(ground, s, L) {
    ctx.save();
    ctx.translate(-camX, 0);
    const A = attackerState(ground, s, L), B = victimState(ground, s, L);
    const bobA = Math.sin(t * 0.06) * 3 * s * A.bob, bobB = Math.sin(t * 0.06 + 1.7) * 3 * s * B.bob;
    // shadows shrink as a fighter leaves the floor
    ctx.fillStyle = 'rgba(120,85,40,0.22)';
    for (const [F, pose] of [[A, A.pose], [B, B.pose]]) {
        const lift = ground - standHeight(pose, s) - F.hipY;
        const sw = Math.max(0.35, 1 - lift / (180 * s));
        ctx.beginPath(); ctx.ellipse(F.x, ground + 2, 40 * s * sw, 7 * s * sw, 0, 0, 7); ctx.fill();
    }
    // motion trail behind the attacker while running and flying
    if (freeze === 0) {
        if (introT >= DIP + 8 && introT <= IMPACT) trail.push(A);
        if (trail.length > 4 || (introT > IMPACT && trail.length)) trail.shift();
    }
    trail.forEach((F, i) => drawFighter(F.x, F.hipY, s, 1, '#1565c0', F.pose, 0, 0, 0.08 + i * 0.05));
    drawFighter(B.x, B.hipY, s, -1, '#d84315', B.pose, bobB, 1.7);
    drawFighter(A.x, A.hipY, s, 1, '#1565c0', A.pose, bobA, 0);

    drawSparks();
    drawImpact(s);
    ctx.restore();
}

let match = null;

// Currencies, from most common to rarest. 10 Jade = 1 Sapphire, 10 Sapphire = 1 Ruby.
// The wallet is stored as one Jade total and shown broken down, carrying up like coins.
const GEM = '<svg class="gem" viewBox="0 0 32 32"><polygon points="16,2 28,10 28,22 16,30 4,22 4,10" fill="#1faa6b" stroke="#0b6b40" stroke-width="2"/><polygon points="16,7 23,11.5 23,20.5 16,25 9,20.5 9,11.5" fill="#4fd59a"/><polygon points="16,7 23,11.5 16,14 9,11.5" fill="#b8f5d8"/><circle cx="12" cy="11" r="1.6" fill="#fff"/></svg>';
const GEM_VALUE = { jade: 1, sapphire: 10, ruby: 100 };
const walletEl = document.getElementById('wallet');
for (const k of ['stickFighterJade', 'stickFighter_jade', 'stickFighter_sapphire', 'stickFighter_ruby']) localStorage.removeItem(k);
let gemTotal = +(localStorage.getItem('stickFighterGems') || 0);
const breakdown = v => ({ ruby: Math.floor(v / 100), sapphire: Math.floor(v / 10) % 10, jade: v % 10 });
function showWallet() {
    const b = breakdown(gemTotal);
    for (const c in b) document.querySelector(`#cur-${c} span`).textContent = b[c];
}
function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

// Earned gems pop up at `fromEl`, then zoom one by one to their counters; each landing adds its value.
function awardGems(amount, fromEl) {
    gemTotal += amount;
    localStorage.setItem('stickFighterGems', gemTotal);    // saved right away, the animation just shows it
    let shown = gemTotal - amount;
    const tokens = [];
    const parts = breakdown(amount);
    for (const c of ['ruby', 'sapphire', 'jade']) {
        const n = parts[c], icons = Math.min(n, 12);
        for (let i = 0; i < icons; i++) {
            const count = Math.floor(n / icons) + (i < n % icons ? 1 : 0);
            tokens.push({ c, value: count * GEM_VALUE[c] });
        }
    }
    const src = fromEl.getBoundingClientRect();
    tokens.forEach((tk, i) => setTimeout(() => {
        const target = document.getElementById('cur-' + tk.c).querySelector('.gem').getBoundingClientRect();
        const el = document.createElement('div');
        el.className = 'flygem';
        el.innerHTML = document.querySelector(`#cur-${tk.c} .gem`).outerHTML;
        const x0 = src.left + src.width / 2 + (Math.random() - 0.5) * 60, y0 = src.top + src.height / 2;
        const x1 = target.left + target.width / 2, y1 = target.top + target.height / 2;
        document.body.appendChild(el);
        const start = performance.now(), dur = 650;
        (function fly(now) {
            const k = Math.min(1, (now - start) / dur);
            const pop = k < 0.2 ? easeOut(k / 0.2) : 1;            // appear, then zoom
            const z = easeInOut(clamp01((k - 0.2) / 0.8));
            const x = lerp(x0, x1, z), y = lerp(y0, y1, z) - Math.sin(z * Math.PI) * 90;
            el.style.transform = `translate(${x - 18}px, ${y - 18}px) scale(${pop * (1.4 - 0.5 * z)})`;
            if (k < 1) return requestAnimationFrame(fly);
            el.remove();
            const before = breakdown(shown);
            shown += tk.value;
            const after = breakdown(shown);
            for (const c in after) {
                document.querySelector(`#cur-${c} span`).textContent = after[c];
                if (after[c] !== before[c]) bump(document.getElementById('cur-' + c));
            }
        })(start);
    }, 500 + i * 90));
}

function makeFighter(x, facing, color, name, isBot) {
    return { x, h: 0, vy: 0, vx: 0, facing, color, name, isBot, hp: 100,
             state: 'idle', st: 0, atk: null, hasHit: false, stun: 0, walk: 0, flash: 0,
             ai: { cool: 20, input: {}, blockT: 0 }, ko: null };
}

function startMatch(mode) {
    match = { mode, round: 0, results: [], damage: 0,
              level: mode === 'impossible' ? IMPOSSIBLE_LEVEL : 3 + Math.floor(Math.random() * 3) };
    sparks.length = 0;
    homeScreen.classList.add('hidden');
    fightScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    help.classList.remove('hidden');
    cv.style.cursor = 'default';
    nextRound();
}

function nextRound() {
    const m = match;
    m.round++;
    const s = fightScale();
    m.p = makeFighter(W * 0.3, 1, '#1565c0', 'YOU', false);
    m.b = makeFighter(W * 0.7, -1, m.mode === 'impossible' ? '#16181d' : pick(BOT_COLORS),
                      m.mode === 'impossible' ? 'IMPOSSIBLE BOT' : pick(BOT_NAMES), true);
    m.phase = 'intro'; m.phaseT = 0; m.timer = ROUND_TIME; m.freeze = 0;
    m.banner = m.mode === 'impossible' ? 'NO MERCY' : 'ROUND ' + m.round;
    resultScreen.classList.add('hidden');
    for (const k in tapped) tapped[k] = false;
}

function quitMatch() {
    match = null;
    resultScreen.classList.add('hidden');
    help.classList.add('hidden');
    homeScreen.classList.remove('hidden');
}

const fightScale = () => Math.max(0.9, Math.min(1.8, H / 520));

function poseOf(f) {
    if (f.ko) return f.ko.pose;
    if (f.state === 'attack') {
        const a = ATK[f.atk], strike = MOVE_POSES[f.atk], n = f.st;
        if (n < a.start) return blend(POSES.guard, strike, easeOut(n / a.start));
        if (n < a.start + a.active) return strike;
        return blend(strike, POSES.guard, easeInOut((n - a.start - a.active) / a.rec));
    }
    if (f.state === 'hurt') return blend(POSES.guard, POSES.hit, 0.55 * Math.min(1, f.stun / 8));
    if (f.state === 'block') return POSES.block;
    if (f.h > 0) return blend(POSES.guard, POSES.chamber, 0.6);
    if (f.state === 'walk') return blend(POSES.guard, blend(POSES.runA, POSES.runB, 0.5 - 0.5 * Math.cos(f.walk)), 0.45);
    return POSES.guard;
}

// world position of the striking fist or foot
function strikePoint(f, s, ground) {
    const pose = poseOf(f), J = solve(pose);
    const end = f.atk.endsWith('Kick') ? J.ff : J.h1;
    return [f.x + f.facing * end[0] * s, ground - f.h - J.low * s + end[1] * s];
}

function botInput(f, o, level, s) {
    const ai = f.ai, inp = ai.input;
    inp.attack = null;
    if (ai.blockT > 0) { ai.blockT--; inp.block = ai.blockT > 0; if (ai.blockT > 0) return inp; }
    if (--ai.cool > 0) return inp;
    ai.cool = Math.max(3, Math.round(26 - 2.3 * level + Math.random() * Math.max(0, 8 - level)));
    inp.left = inp.right = inp.block = inp.jump = false;
    const dist = Math.abs(o.x - f.x) / s, toward = Math.sign(o.x - f.x);
    // reading an incoming attack
    if (o.state === 'attack' && o.st < ATK[o.atk].start + 2 && dist < ATK[o.atk].reach + 25) {
        const a = ATK[o.atk];
        if (!a.high && Math.random() < 0.03 * level) { inp.jump = true; return inp; }
        if (Math.random() < Math.min(0.97, 0.04 + 0.085 * level)) {
            ai.blockT = a.start - o.st + a.active + 4; inp.block = true; return inp;
        }
    }
    const punish = o.state === 'attack' && o.st >= ATK[o.atk].start + ATK[o.atk].active;
    const inRange = Object.keys(ATK).filter(k => ATK[k].reach - 6 >= dist);
    if (inRange.length && (punish || Math.random() < 0.3 + 0.06 * level)) {
        if (o.state === 'block' && Math.random() < 0.05 * level) return inp;    // waits out a blocker
        let k = pick(inRange);
        if (o.h > 25 * s) k = inRange.includes('highKick') ? 'highKick' : 'highPunch';
        if (punish && inRange.includes('lowPunch') && level > 5) k = 'lowPunch';
        inp.attack = k;
    } else if (!inRange.length && Math.random() < 0.08 * (11 - Math.min(10, level))) {
        inp.attack = pick(Object.keys(ATK));                                   // sloppy whiff from weak bots
    } else if (dist > 85) {
        inp[toward > 0 ? 'right' : 'left'] = true;
    } else if (dist < 55 || Math.random() < 0.15) {
        inp[toward > 0 ? 'left' : 'right'] = true;
    }
    return inp;
}

function playerInput() {
    const inp = { left: held.ArrowLeft, right: held.ArrowRight, block: held.ArrowDown,
                  jump: tapped.ArrowUp, attack: null };
    for (const k in KEYMAP) if (tapped[k]) inp.attack = KEYMAP[k];
    for (const k in tapped) tapped[k] = false;
    return inp;
}

function updateFighter(f, o, inp, s, live) {
    if (f.flash > 0) f.flash--;
    if (f.ko) return;
    const grounded = f.h <= 0;
    if (f.stun > 0) {
        f.stun--; f.state = 'hurt';
        if (!f.stun) f.state = 'idle';
    } else if (f.state === 'attack') {
        f.st++;
        const a = ATK[f.atk];
        if (f.st >= a.start + a.active + a.rec) { f.state = 'idle'; f.atk = null; }
    } else if (live) {
        f.state = 'idle';
        if (inp.attack) { f.state = 'attack'; f.atk = inp.attack; f.st = 0; f.hasHit = false; }
        else if (inp.block && grounded) f.state = 'block';
        else {
            if (inp.jump && grounded) f.vy = 11 * s;
            const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
            if (dir) {
                f.x += dir * 3.6 * s * (f.isBot ? 0.75 + 0.03 * Math.min(10, match.level) : 1);
                if (grounded) { f.state = 'walk'; f.walk += 0.25 * dir * f.facing; }
            }
        }
    } else f.state = 'idle';
    if (f.state !== 'attack') f.facing = Math.sign(o.x - f.x) || f.facing;
    f.x += f.vx; f.vx *= 0.82;
    if (f.h > 0 || f.vy > 0) { f.h += f.vy; f.vy -= 0.6 * s; if (f.h <= 0) { f.h = 0; f.vy = 0; } }
    f.x = Math.max(60 * s, Math.min(W - 60 * s, f.x));
}

function tryHit(f, o, s, ground) {
    if (f.state !== 'attack' || f.hasHit || o.ko) return;
    const a = ATK[f.atk];
    if (f.st < a.start || f.st >= a.start + a.active) return;
    const d = (o.x - f.x) * f.facing;
    if (d < -10 * s || d > a.reach * s) return;
    if (!a.high && o.h > 25 * s) return;                // low attacks pass under a jump
    f.hasHit = true;
    const m = match, [hx, hy] = strikePoint(f, s, ground);
    const blocked = o.state === 'block' && o.facing === -f.facing;
    let dmg = a.dmg * (f.isBot ? 0.75 + 0.04 * m.level : 1) * (blocked ? 0.15 : 1);
    if (m.mode === 'impossible' && o.isBot) m.damage += dmg;
    else o.hp = Math.max(0, o.hp - dmg);
    o.vx = f.facing * a.kb * s * (blocked ? 0.5 : 0.8);
    if (blocked) {
        burst(hx, hy, ['#b0bec5', '#ffffff'], 6, 2 * s, 0.12);
        m.freeze = 2;
    } else {
        o.stun = a.stun; o.state = 'hurt'; o.atk = null; o.flash = 8;
        burst(hx, hy, ['#ffd54f', '#ffffff', '#ff7043'], a.dmg > 9 ? 16 : 10, (a.dmg > 9 ? 5 : 3.6) * s, 0.16);
        m.freeze = a.dmg > 9 ? 6 : 4; shake = a.dmg > 9 ? 9 : 5;
        if (o.hp <= 0) knockOut(o, f, s);
    }
}

function knockOut(f, by, s) {
    f.ko = { h: standHeight(poseOf(f), s) + f.h, vy: 7 * s, vx: by.facing * 5 * s, landed: false, landT: 0,
             pose: POSES.hit, from: null, t: 0 };
    f.state = 'ko'; f.stun = 0;
    match.freeze = 12; shake = 14;
    match.phase = 'ko'; match.phaseT = 0;
}

function stepKO(f, s, ground) {
    const k = f.ko;
    k.t++;
    if (!k.landed) {
        k.pose = blend(POSES.hit, POSES.fall, k.t / 16);
        if (k.vy < 0) k.pose = blend(k.pose, POSES.down, 1 - (k.h - standHeight(POSES.down, s)) / (70 * s));
    } else { k.landT++; k.pose = blend(k.from, POSES.down, easeOut(k.landT / 7)); }
    k.vy -= 0.5 * s; k.h += k.vy;
    f.x = Math.max(70 * s, Math.min(W - 70 * s, f.x + k.vx));
    const floorH = standHeight(POSES.down, s);
    if (k.h <= floorH) {
        k.h = floorH;
        if (!k.landed) {
            k.landed = true; k.from = k.pose; k.vy = 2.4 * s; k.vx *= 0.5;
            burst(f.x, ground - 4, ['#d6b07c', '#e8c99a', '#c49a64'], 18, 3 * s, 0.12);
            shake = 8;
        } else { k.vy = 0; k.vx *= 0.82; }
    }
}

function updateMatch(ground, s) {
    const m = match;
    if (m.phase === 'result') return;
    if (m.freeze > 0) { m.freeze--; return; }
    m.phaseT++;
    if (held.Escape) { quitMatch(); return; }
    const live = m.phase === 'fight';
    const pin = live ? playerInput() : (playerInput(), {});
    const bin = live ? botInput(m.b, m.p, m.level, s) : {};
    updateFighter(m.p, m.b, pin, s, live);
    updateFighter(m.b, m.p, bin, s, live);
    // fighters can't walk through each other
    const gap = 46 * s, d = m.b.x - m.p.x;
    if (Math.abs(d) < gap && !m.p.ko && !m.b.ko && m.p.h < 40 * s && m.b.h < 40 * s) {
        const push = (gap - Math.abs(d)) / 2 * (Math.sign(d) || 1);
        m.p.x -= push; m.b.x += push;
    }
    if (live) { tryHit(m.p, m.b, s, ground); tryHit(m.b, m.p, s, ground); }
    for (const f of [m.p, m.b]) if (f.ko) stepKO(f, s, ground);

    if (m.phase === 'intro') {
        if (m.phaseT === 60) m.banner = 'FIGHT!';
        if (m.phaseT >= 95) { m.phase = 'fight'; m.banner = ''; }
    } else if (m.phase === 'fight' && m.mode !== 'impossible') {
        if (--m.timer <= 0) { m.phase = 'ko'; m.phaseT = 0; }
    } else if (m.phase === 'ko') {
        if (m.phaseT === 1) m.banner = m.p.ko || m.b.ko ? 'K.O.' : 'TIME!';
        if (m.phaseT >= 110) endRound();
    }
}

function endRound() {
    const m = match;
    m.phase = 'result'; m.banner = '';
    if (m.mode === 'impossible') { showImpossibleResult(); return; }
    const res = m.b.hp <= 0 || (m.p.hp > 0 && m.p.hp > m.b.hp) ? 'win'
              : m.p.hp <= 0 || m.b.hp > m.p.hp ? 'loss' : 'draw';
    m.results.push({ name: m.b.name, color: m.b.color, level: m.level, res });
    const old = m.level;
    if (res === 'win') m.level = Math.min(10, m.level + 1);
    if (res === 'loss') m.level = Math.max(1, m.level - 1);
    if (m.round >= ROUNDS) { showSummary(); return; }
    const title = { win: 'YOU WIN!', loss: 'YOU LOSE', draw: 'DRAW' }[res];
    const next = m.level > old ? `<span class="up">▲ Next bot is harder</span>`
               : m.level < old ? `<span class="down">▼ Next bot is easier</span>`
               : res === 'win' ? `<span class="up">Already at the top level!</span>` : `<span>Same level next round</span>`;
    resultScreen.innerHTML = `<div class="card">
        <div class="small">Round ${m.round} of ${ROUNDS}</div>
        <h2 class="${res}">${title}</h2>
        <p>${next}</p>
        <p class="lv">Next opponent: Level ${m.level}</p>
        <button class="big" id="nextBtn">NEXT ROUND</button>
        <button class="link" id="quitBtn">Quit to home</button></div>`;
    resultScreen.classList.remove('hidden');
    document.getElementById('nextBtn').onclick = nextRound;
    document.getElementById('quitBtn').onclick = quitMatch;
}

function showSummary() {
    const m = match, wins = m.results.filter(r => r.res === 'win').length;
    const best = Math.max(0, ...m.results.filter(r => r.res === 'win').map(r => r.level));
    const rows = m.results.map((r, i) => `<div class="row ${r.res}"><span>R${i + 1}</span>
        <span><i style="background:${r.color}"></i>${r.name}</span><span>Lv ${r.level}</span>
        <b>${r.res === 'win' ? 'WIN' : r.res === 'loss' ? 'LOSS' : 'DRAW'}</b></div>`).join('');
    resultScreen.innerHTML = `<div class="card wide">
        <div class="small">Adaptive Matchup complete</div>
        <h2>${wins} / ${ROUNDS} WINS</h2>
        <p>${best ? `Toughest bot beaten: <b>Level ${best}</b>` : 'No wins this time. Keep training!'}</p>
        <div class="rows">${rows}</div>
        <button class="big" id="againBtn">PLAY AGAIN</button>
        <button class="link" id="quitBtn">Back to home</button></div>`;
    resultScreen.classList.remove('hidden');
    document.getElementById('againBtn').onclick = () => startMatch('adaptive');
    document.getElementById('quitBtn').onclick = quitMatch;
}

function showImpossibleResult() {
    const m = match, dmg = Math.round(m.damage);
    const prev = +(localStorage.getItem('stickFighterImpossibleBest') || 0);
    const isBest = dmg > prev;
    if (isBest) localStorage.setItem('stickFighterImpossibleBest', dmg);
    const earned = isBest ? dmg : 0;                      // 1 Jade per point of damage, only for a new record
    resultScreen.innerHTML = `<div class="card">
        <div class="small">The Impossible Bot wins. It always does.</div>
        <h2>${dmg} DAMAGE</h2>
        <p>${isBest ? '<span class="up">★ New personal best!</span>' : `Personal best: <b>${prev}</b>`}</p>
        ${earned ? `<div class="reward" id="reward">+${earned} Jade${GEM}</div>` : '<p>Beat your record to earn Jade.</p>'}
        <button class="big" id="againBtn">TRY AGAIN</button>
        <button class="link" id="quitBtn">Back to home</button></div>`;
    resultScreen.classList.remove('hidden');
    document.getElementById('againBtn').onclick = () => startMatch('impossible');
    if (earned > 0) awardGems(earned, document.getElementById('reward'));
    document.getElementById('quitBtn').onclick = quitMatch;
}

function drawSparks() {
    const still = freeze > 0 || (match && match.freeze > 0);
    for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        if (!still) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.96; p.life -= 0.03; }
        if (p.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawMatch(ground, s) {
    const m = match;
    updateMatch(ground, s);
    for (const f of [m.b, m.p]) {
        const pose = poseOf(f);
        const hipY = f.ko ? ground - f.ko.h : ground - f.h - standHeight(pose, s);
        const sw = Math.max(0.4, 1 - f.h / (180 * s));
        ctx.fillStyle = 'rgba(120,85,40,0.22)';
        ctx.beginPath(); ctx.ellipse(f.x, ground + 2, 40 * s * sw, 7 * s * sw, 0, 0, 7); ctx.fill();
        const bob = f.state === 'idle' && !f.ko ? Math.sin(t * 0.06 + (f.isBot ? 1.7 : 0)) * 3 * s : 0;
        drawFighter(f.x, hipY, s, f.facing, f.flash > 0 && f.flash % 4 < 2 ? '#ffffff' : f.color, pose, bob, f.isBot ? 1.7 : 0);
    }
    drawSparks();
    drawMatchHUD(s);
}

function drawBar(x, y, w, hp, flip, name, color, extra) {
    const h = 22;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.strokeStyle = 'rgba(31,42,54,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 11); ctx.fill(); ctx.stroke();
    if (hp !== null) {
        const fw = (w - 6) * hp / 100;
        ctx.fillStyle = hp > 50 ? '#43a047' : hp > 25 ? '#f9a825' : '#e53935';
        ctx.beginPath(); ctx.roundRect(flip ? x + 3 + (w - 6 - fw) : x + 3, y + 3, Math.max(0, fw), h - 6, 8); ctx.fill();
    } else {
        ctx.fillStyle = '#16181d';
        ctx.beginPath(); ctx.roundRect(x + 3, y + 3, w - 6, h - 6, 8); ctx.fill();
        ctx.fillStyle = '#ffcf40'; ctx.font = 'bold 18px Segoe UI, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('∞', x + w / 2, y + 18);
    }
    ctx.font = '800 16px Segoe UI, sans-serif';
    ctx.textAlign = flip ? 'right' : 'left';
    ctx.fillStyle = color;
    ctx.fillText(name + (extra ? '  ' + extra : ''), flip ? x + w : x, y - 8);
}

function drawMatchHUD(s) {
    const m = match, bw = Math.min(340, W * 0.34);
    drawBar(30, 46, bw, m.p.hp, false, 'YOU', '#1565c0');
    drawBar(W - 30 - bw, 46, bw, m.mode === 'impossible' ? null : m.b.hp, true, m.b.name, m.b.color,
            m.mode === 'impossible' ? '' : 'LV ' + m.level);
    ctx.textAlign = 'center';
    if (m.mode === 'impossible') {
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.beginPath(); ctx.roundRect(W / 2 - 80, 30, 160, 62, 14); ctx.fill();
        ctx.fillStyle = '#4d6d84'; ctx.font = '800 12px Segoe UI, sans-serif';
        ctx.fillText('DAMAGE DEALT', W / 2, 48);
        ctx.fillStyle = '#c62828'; ctx.font = '900 32px Segoe UI, sans-serif';
        ctx.fillText(Math.round(m.damage), W / 2, 82);
    } else {
        const secs = Math.ceil(m.timer / 60);
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.beginPath(); ctx.roundRect(W / 2 - 46, 30, 92, 62, 14); ctx.fill();
        ctx.fillStyle = '#4d6d84'; ctx.font = '800 12px Segoe UI, sans-serif';
        ctx.fillText(`ROUND ${m.round}/${ROUNDS}`, W / 2, 48);
        ctx.fillStyle = secs <= 10 ? '#e53935' : '#1f2a36'; ctx.font = '900 30px Segoe UI, sans-serif';
        ctx.fillText(String(secs).padStart(2, '0'), W / 2, 82);
    }
    if (m.banner) {
        ctx.save();
        ctx.font = `900 ${Math.round(64 * s)}px Segoe UI, sans-serif`;
        ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.strokeText(m.banner, W / 2, H * 0.42);
        ctx.fillStyle = '#c62828';
        ctx.fillText(m.banner, W / 2, H * 0.42);
        if (m.phase === 'intro' && m.phaseT < 60) {
            ctx.font = `800 ${Math.round(20 * s)}px Segoe UI, sans-serif`;
            ctx.lineWidth = 6; const sub = m.mode === 'impossible' ? 'Deal as much damage as you can' : `vs ${m.b.name}  ·  Level ${m.level}`;
            ctx.strokeText(sub, W / 2, H * 0.42 + 40 * s);
            ctx.fillStyle = '#1f2a36'; ctx.fillText(sub, W / 2, H * 0.42 + 40 * s);
        }
        ctx.restore();
    }
}

draw();

const startScreen = document.getElementById('startScreen');
showWallet();
const homeScreen = document.getElementById('homeScreen');
function play() {
    if (introT >= 0) return;
    startScreen.classList.add('hidden');
    introT = 0;
}
document.getElementById('playBtn').addEventListener('click', play);
addEventListener('keydown', e => {
    if (e.code === 'Enter' && introT < 0) play();
});
const fightScreen = document.getElementById('fightScreen');
document.getElementById('fightBtn').addEventListener('click', () => {
    homeScreen.classList.add('hidden');
    fightScreen.classList.remove('hidden');
    mouse = { x: -1, y: -1 };
});
document.getElementById('fightBack').addEventListener('click', () => {
    fightScreen.classList.add('hidden');
    homeScreen.classList.remove('hidden');
});
const resultScreen = document.getElementById('resultScreen');
const help = document.getElementById('help');
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.mode === 'adaptive' || b.dataset.mode === 'impossible') startMatch(b.dataset.mode);
}));
addEventListener('keydown', e => {
    if (e.code === 'Enter' && match && match.phase === 'result') {
        const btn = document.getElementById('nextBtn') || document.getElementById('againBtn');
        if (btn) btn.click();
    }
});
cv.addEventListener('mousemove', e => { mouse = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('mouseleave', () => { mouse = { x: -1, y: -1 }; });
cv.addEventListener('click', () => {
    if (hoverMove) { homeMove = hoverMove; homeMoveT = 0; }
});
</script>

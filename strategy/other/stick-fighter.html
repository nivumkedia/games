<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stick Fighter</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
        height:100%;
        overflow:hidden;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background:#bfe3f7;
    }
    #bg { position:fixed; inset:0; width:100vw; height:100vh; display:block; }

    .screen {
        position:fixed; inset:0;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        transition:opacity .35s ease;
    }
    .screen.hidden { opacity:0; pointer-events:none; }

    #title {
        font-size:clamp(56px, 11vw, 150px);
        font-weight:900;
        letter-spacing:.04em;
        line-height:.95;
        text-align:center;
        color:#c62828;
        -webkit-text-stroke:3px #fff;
        paint-order:stroke fill;
        text-shadow:0 6px 0 #7f1414, 0 14px 30px rgba(60,30,20,.28);
        transform:rotate(-3deg);
        animation:drop .7s cubic-bezier(.2,1.6,.4,1) both;
        user-select:none;
    }
    #title span { display:block; color:#1f2a36; text-shadow:0 6px 0 #0c1219, 0 14px 30px rgba(20,30,40,.28); }
    #tagline {
        margin-top:22px;
        font-size:clamp(14px, 1.6vw, 20px);
        font-weight:600;
        letter-spacing:.35em;
        text-transform:uppercase;
        color:#355870;
        animation:fade .6s .5s both;
        user-select:none;
    }

    #playBtn {
        margin-top:48px;
        font:900 clamp(26px, 3vw, 38px)/1 'Segoe UI', sans-serif;
        letter-spacing:.12em;
        color:#fff;
        background:linear-gradient(#ff5a3c, #e53935);
        border:4px solid #fff;
        border-radius:999px;
        padding:20px 74px;
        cursor:pointer;
        box-shadow:0 8px 0 #9b1c1c, 0 16px 30px rgba(120,30,20,.35);
        transition:transform .12s, box-shadow .12s, filter .12s;
        animation:fade .6s .8s both, pulse 1.8s 1.6s ease-in-out infinite;
    }
    #playBtn:hover { filter:brightness(1.08); transform:translateY(-3px) scale(1.04); }
    #playBtn:active { transform:translateY(6px); box-shadow:0 2px 0 #9b1c1c, 0 6px 14px rgba(120,30,20,.3); }
    #hint {
        margin-top:20px; font-size:14px; color:#4d6d84;
        animation:fade .6s 1.1s both;
    }

    #homeScreen { background:#fff; }
    #homeScreen h2 { font-size:42px; color:#1f2a36; }
    #homeScreen p { margin-top:10px; color:#4d6d84; font-size:18px; }

    @keyframes drop { from { opacity:0; transform:translateY(-80px) rotate(-3deg) scale(1.2); } to { opacity:1; transform:rotate(-3deg); } }
    @keyframes fade { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="startScreen" class="screen">
    <h1 id="title">STICK<span>FIGHTER</span></h1>
    <div id="tagline">Last one standing wins</div>
    <button id="playBtn">PLAY</button>
    <div id="hint">or press Enter</div>
</div>

<div id="homeScreen" class="screen hidden">
    <h2>Home</h2>
    <p>The home page comes next.</p>
</div>

<script>
const cv = document.getElementById('bg');
const ctx = cv.getContext('2d');
let W, H, t = 0;

function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

const clouds = Array.from({ length: 6 }, (_, i) => ({ x: Math.random(), y: 0.08 + Math.random() * 0.3, s: 0.6 + Math.random() * 0.8, v: 0.00004 + Math.random() * 0.00006 }));
const petals = Array.from({ length: 28 }, () => ({ x: Math.random(), y: Math.random(), r: 3 + Math.random() * 3, v: 0.0006 + Math.random() * 0.0009, w: Math.random() * 6.28 }));

function cloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(x, y, 30 * s, 0, 7);
    ctx.arc(x + 34 * s, y - 14 * s, 38 * s, 0, 7);
    ctx.arc(x + 72 * s, y, 30 * s, 0, 7);
    ctx.rect(x, y, 72 * s, 30 * s);
    ctx.fill();
}

function hills(baseY, amp, color, seed) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) {
        ctx.lineTo(x, baseY - amp * (0.5 + 0.5 * Math.sin(x * 0.004 + seed) * Math.cos(x * 0.0017 + seed * 2)));
    }
    ctx.lineTo(W, H);
    ctx.fill();
}

function pagoda(cx, baseY, s) {
    ctx.fillStyle = '#7d9bb0';
    for (let i = 0; i < 4; i++) {
        const y = baseY - i * 34 * s, w = (70 - i * 12) * s;
        ctx.fillRect(cx - w * 0.35, y - 26 * s, w * 0.7, 26 * s);
        ctx.beginPath();
        ctx.moveTo(cx - w, y - 22 * s);
        ctx.quadraticCurveTo(cx, y - 40 * s, cx + w, y - 22 * s);
        ctx.lineTo(cx + w * 0.7, y - 30 * s);
        ctx.lineTo(cx - w * 0.7, y - 30 * s);
        ctx.fill();
    }
    ctx.fillRect(cx - 2 * s, baseY - 4 * 34 * s - 30 * s, 4 * s, 22 * s);
}

// ---------- Stick fighter poses (facing right, units scaled by s, y up is negative) ----------
// hip, neck, head, bk/bf = back knee/foot, fk/ff = front knee/foot, e1/h1 + e2/h2 = arms
const POSES = {
    guard:   { hip:[0,-70],  neck:[4,-132],  head:[8,-150],  bk:[-14,-34], bf:[-26,0],  fk:[18,-36], ff:[30,0],
               e1:[26,-104], h1:[38,-128], e2:[16,-98],  h2:[28,-116] },
    crouch:  { hip:[-6,-48], neck:[6,-106],  head:[12,-124], bk:[-26,-22], bf:[-32,0],  fk:[24,-26], ff:[26,0],
               e1:[22,-80],  h1:[30,-102], e2:[-8,-80],  h2:[-20,-66] },
    kick:    { hip:[0,-70],  neck:[-16,-126], head:[-24,-143], bk:[-4,-40], bf:[-30,-46], fk:[40,-80], ff:[82,-88],
               e1:[8,-108],  h1:[22,-120], e2:[-34,-110], h2:[-52,-96] },
    victory: { hip:[0,-70],  neck:[4,-132],  head:[8,-150],  bk:[-14,-34], bf:[-26,0],  fk:[18,-36], ff:[30,0],
               e1:[18,-152], h1:[24,-180], e2:[-16,-104], h2:[-6,-80] },
    hit:     { hip:[-8,-68], neck:[-34,-122], head:[-46,-136], bk:[-18,-32], bf:[-26,0], fk:[12,-36], ff:[24,-4],
               e1:[-20,-140], h1:[-6,-158], e2:[-50,-128], h2:[-64,-146] },
    fall:    { hip:[-10,-50], neck:[-56,-86], head:[-72,-98], bk:[8,-44], bf:[30,-56], fk:[22,-72], ff:[44,-92],
               e1:[-40,-118], h1:[-28,-138], e2:[-70,-104], h2:[-86,-122] },
    down:    { hip:[0,-9],   neck:[-58,-11], head:[-76,-15], bk:[22,-24], bf:[46,-6],  fk:[28,-8],  ff:[58,-5],
               e1:[-44,-30], h1:[-32,-6],  e2:[-66,-4],  h2:[-90,-7] }
};
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = k => Math.max(0, Math.min(1, k));
const easeOut = k => 1 - (1 - k) * (1 - k);
function blend(a, b, k) {
    k = clamp01(k);
    const out = {};
    for (const j in a) out[j] = [lerp(a[j][0], b[j][0], k), lerp(a[j][1], b[j][1], k)];
    return out;
}

function drawFighter(x, groundY, s, dir, color, pose, bob, phase) {
    const P = j => [pose[j][0] * s, pose[j][1] * s + (j === 'bf' || j === 'ff' ? 0 : bob)];
    ctx.save();
    ctx.translate(x, groundY);
    ctx.scale(dir, 1);
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = 7 * s; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const hip = P('hip'), neck = P('neck'), head = P('head');
    const sh = [lerp(neck[0], hip[0], 0.12), lerp(neck[1], hip[1], 0.12)];
    ctx.beginPath();
    ctx.moveTo(...P('bf')); ctx.lineTo(...P('bk')); ctx.lineTo(...hip);
    ctx.lineTo(...P('fk')); ctx.lineTo(...P('ff'));
    ctx.moveTo(...hip); ctx.lineTo(...neck);
    ctx.moveTo(...sh); ctx.lineTo(...P('e1')); ctx.lineTo(...P('h1'));
    ctx.moveTo(...sh); ctx.lineTo(...P('e2')); ctx.lineTo(...P('h2'));
    ctx.stroke();
    ctx.beginPath(); ctx.arc(head[0], head[1], 15 * s, 0, 7); ctx.fill();
    // headband tails trail away from the way the head leans
    const ang = Math.atan2(head[1] - neck[1], head[0] - neck[0]) - Math.PI / 2;
    const flap = Math.sin(t * 0.12 + phase) * 5 * s;
    ctx.translate(head[0], head[1]); ctx.rotate(ang + Math.PI / 2);
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.moveTo(-14 * s, -4 * s);
    ctx.quadraticCurveTo(-30 * s, -8 * s + flap, -44 * s, 2 * s + flap);
    ctx.stroke();
    ctx.restore();
}

// ---------- Intro: left fighter flying-kicks the right fighter down ----------
let introT = -1, freeze = 0, shake = 0, impactFx = 0, impactPos = null;
const sparks = [];
function burst(x, y, colors, n, power, grav) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = power * (0.3 + Math.random());
        sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 0.3, life: 1,
                      c: colors[i % colors.length], r: 2 + Math.random() * 4, g: grav });
    }
}

function fightersState(ground, s) {
    const ax0 = W * 0.16, vx0 = W * 0.84;
    const kickX = vx0 - 86 * s;
    const knockX = Math.min(vx0 + 120 * s, W - 110 * s);
    const T = introT;
    const A = { x: ax0, y: 0, pose: POSES.guard, bob: 1 };
    const V = { x: vx0, y: 0, pose: POSES.guard, bob: 1 };
    if (T < 0) return [A, V];

    // attacker
    if (T < 14) { A.pose = blend(POSES.guard, POSES.crouch, T / 10); A.bob = 0; }
    else if (T < 42) {
        const p = (T - 14) / 28;
        A.x = lerp(ax0, kickX, p);
        A.y = -(4 * p * (1 - p)) * 90 * s - p * 22 * s;
        A.pose = blend(POSES.crouch, POSES.kick, p / 0.35); A.bob = 0;
    } else if (T < 62) {
        const q = (T - 42) / 20;
        A.x = kickX + 14 * s * q;
        A.y = -22 * s * (1 - q * q);
        A.pose = blend(POSES.kick, POSES.crouch, q); A.bob = 0;
    } else if (T < 78) { A.x = kickX + 14 * s; A.pose = blend(POSES.crouch, POSES.guard, (T - 62) / 12); A.bob = 0; }
    else { A.x = kickX + 14 * s; A.pose = blend(POSES.guard, POSES.victory, (T - 78) / 12); A.bob = 0.6; }

    // victim
    if (T >= 42) {
        V.bob = 0;
        if (T < 48) V.pose = blend(POSES.guard, POSES.hit, (T - 42) / 6);
        else if (T < 84) {
            const q = (T - 48) / 36;
            V.x = lerp(vx0, knockX, easeOut(q));
            V.y = -(4 * q * (1 - q)) * 46 * s;
            V.pose = q < 0.5 ? blend(POSES.hit, POSES.fall, q * 2) : blend(POSES.fall, POSES.down, (q - 0.5) * 2);
        } else { V.x = knockX; V.pose = POSES.down; }
    }
    return [A, V];
}

function stepIntro(ground, s) {
    if (introT < 0) return;
    if (freeze > 0) { freeze--; return; }
    introT++;
    if (introT === 42) {
        const fx = W * 0.84 - 4 * s, fy = ground - 108 * s;
        impactPos = [fx, fy]; impactFx = 16;
        burst(fx, fy, ['#ffd54f', '#ffffff', '#ff7043'], 26, 7 * s, 0.18);
        freeze = 8; shake = 16;
    }
    if (introT === 84) {
        const x = Math.min(W * 0.84 + 120 * s, W - 110 * s);
        burst(x - 20 * s, ground - 4, ['#d6b07c', '#e8c99a', '#c49a64'], 22, 3.2 * s, 0.12);
        shake = 9;
    }
    if (introT === 150) showHome();
}

function drawImpact(s) {
    if (impactFx <= 0) return;
    const [x, y] = impactPos, k = impactFx / 16;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = k;
    ctx.fillStyle = '#fff59d';
    ctx.strokeStyle = '#ff7043'; ctx.lineWidth = 3 * s;
    const R = (1.4 - k * 0.6) * 46 * s;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
        const r = i % 2 ? R * 0.42 : R, a = i / 16 * Math.PI * 2 + 0.2;
        ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    if (freeze === 0) impactFx--;
}

function draw() {
    t++;
    ctx.save();
    if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.85; if (shake < 0.4) shake = 0;
    }
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#8fd0f2'); sky.addColorStop(0.65, '#d9f0fb'); sky.addColorStop(1, '#fff4dc');
    ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, H + 40);

    // sun
    ctx.fillStyle = 'rgba(255,214,102,0.35)';
    ctx.beginPath(); ctx.arc(W * 0.78, H * 0.2, 90, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath(); ctx.arc(W * 0.78, H * 0.2, 56, 0, 7); ctx.fill();

    for (const c of clouds) {
        c.x += c.v; if (c.x > 1.15) c.x = -0.15;
        cloud(c.x * W, c.y * H, c.s);
    }

    const ground = H * 0.82;
    hills(H * 0.62, 120, '#b4d6e6', 1.3);
    pagoda(W * 0.16, H * 0.6, Math.min(1.2, W / 1200));
    hills(H * 0.72, 70, '#9cc9a0', 4.1);

    // arena floor
    ctx.fillStyle = '#e8c99a'; ctx.fillRect(-20, ground, W + 40, H - ground + 20);
    ctx.fillStyle = '#d6b07c'; ctx.fillRect(-20, ground, W + 40, 6);
    ctx.strokeStyle = 'rgba(150,110,60,0.25)'; ctx.lineWidth = 2;
    for (let x = (t * 0.2) % 80 - 80; x < W + 80; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, ground + 6); ctx.lineTo(x - 60, H); ctx.stroke();
    }

    const s = Math.max(0.9, Math.min(1.8, H / 520));
    stepIntro(ground, s);
    const [A, V] = fightersState(ground, s);
    const bobA = Math.sin(t * 0.06) * 3 * s * A.bob, bobV = Math.sin(t * 0.06 + 1.7) * 3 * s * V.bob;
    // shadows
    ctx.fillStyle = 'rgba(120,85,40,0.22)';
    for (const F of [A, V]) {
        const sw = Math.max(0.35, 1 + F.y / (160 * s));
        ctx.beginPath(); ctx.ellipse(F.x, ground + 2, 40 * s * sw, 7 * s * sw, 0, 0, 7); ctx.fill();
    }
    drawFighter(V.x, ground + V.y, s, -1, '#d84315', V.pose, bobV, 1.7);
    drawFighter(A.x, ground + A.y, s, 1, '#1565c0', A.pose, bobA, 0);

    for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        if (freeze === 0) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.96; p.life -= 0.03; }
        if (p.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawImpact(s);
    ctx.restore();

    // cherry petals
    ctx.fillStyle = 'rgba(244,143,177,0.85)';
    for (const p of petals) {
        p.y += p.v; p.w += 0.03;
        if (p.y > 1.05) { p.y = -0.05; p.x = Math.random(); }
        ctx.beginPath();
        ctx.ellipse(p.x * W + Math.sin(p.w) * 20, p.y * H, p.r, p.r * 0.6, p.w, 0, 7);
        ctx.fill();
    }

    // white-out that clears the scene before the home page
    if (introT > 118) {
        ctx.fillStyle = `rgba(255,255,255,${clamp01((introT - 118) / 30)})`;
        ctx.fillRect(0, 0, W, H);
    }
    requestAnimationFrame(draw);
}
draw();

const startScreen = document.getElementById('startScreen');
const homeScreen = document.getElementById('homeScreen');
function play() {
    if (introT >= 0) return;
    startScreen.classList.add('hidden');
    introT = 0;
}
function showHome() {
    homeScreen.classList.remove('hidden');
}
document.getElementById('playBtn').addEventListener('click', play);
addEventListener('keydown', e => {
    if (e.code === 'Enter' && introT < 0) play();
});
</script>
</body>
</html>

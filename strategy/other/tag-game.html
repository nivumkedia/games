<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tag Frenzy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#241b3a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Trebuchet MS','Segoe UI',sans-serif;overflow:hidden;color:#fff}
#gameContainer{position:relative;width:100vw;height:100vh;overflow:hidden}
canvas{display:block;width:100%;height:100%;background:#ff8fc4}
.screen-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:linear-gradient(160deg,#ff9a56 0%,#ff6b9d 45%,#a855f7 100%)}
#homeScreen{gap:28px}
.tag-title{font-size:120px;font-weight:900;letter-spacing:4px;color:#fff;-webkit-text-stroke:5px #ff3d7f;text-shadow:0 10px 0 #d6216b,0 16px 24px rgba(0,0,0,0.35);animation:bounceTitle 2.2s ease-in-out infinite;transform:rotate(-3deg)}
@keyframes bounceTitle{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-10px)}}
.tag-subtitle{font-size:15px;letter-spacing:6px;color:#fff;background:rgba(0,0,0,0.18);padding:6px 18px;border-radius:20px;margin-top:-10px;font-weight:bold}
.btn{padding:16px 50px;font-size:18px;font-family:'Trebuchet MS',sans-serif;background:#ffe14d;color:#7a3d00;border:none;border-radius:50px;cursor:pointer;letter-spacing:2px;transition:all 0.2s ease;font-weight:900;box-shadow:0 8px 0 #d19a00,0 12px 20px rgba(0,0,0,0.25)}
.btn:hover{transform:translateY(-3px);box-shadow:0 11px 0 #d19a00,0 16px 24px rgba(0,0,0,0.3)}
.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #d19a00}
.btn-small{padding:10px 30px;font-size:13px;}
#setupScreen{display:none;flex-direction:column;align-items:center;gap:20px;max-width:640px;width:92%}
#setupScreen h2{font-size:16px;letter-spacing:4px;color:#fff;font-weight:bold;background:rgba(0,0,0,0.18);padding:5px 16px;border-radius:16px}
.setup-grid{display:flex;flex-direction:column;gap:12px;width:100%;background:rgba(255,255,255,0.12);border-radius:20px;padding:20px 26px}
.setup-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.setup-label{font-size:13px;letter-spacing:2px;color:#fff;font-weight:bold;opacity:0.9;min-width:110px}
.pill-group{display:flex;gap:8px;flex-wrap:wrap}
.pill-btn{padding:9px 18px;font-size:13px;font-family:'Trebuchet MS',sans-serif;background:rgba(255,255,255,0.85);color:#7a3d00;border:none;border-radius:20px;cursor:pointer;letter-spacing:1px;font-weight:bold;transition:all 0.15s ease}
.pill-btn:hover{transform:translateY(-2px)}
.pill-btn.active{background:#ff3d7f;color:#fff;box-shadow:0 0 14px rgba(255,61,127,0.6)}
.toggle-btn{padding:9px 26px;font-size:13px;font-family:'Trebuchet MS',sans-serif;background:rgba(255,255,255,0.15);color:#fff;border:2px solid rgba(255,255,255,0.4);border-radius:20px;cursor:pointer;letter-spacing:2px;font-weight:bold;transition:all 0.2s ease}
.toggle-btn:hover{background:rgba(255,255,255,0.25)}
.toggle-btn.active{background:#44dd88;border-color:#44dd88;color:#08351d;box-shadow:0 0 20px rgba(68,221,136,0.5)}
#setupBackBtn{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:9px 22px;font-size:12px;letter-spacing:2px;border-radius:20px;cursor:pointer;font-family:'Trebuchet MS',sans-serif;font-weight:bold}
#setupBackBtn:hover{background:rgba(255,255,255,0.28)}
.results-list{display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,0.12);border-radius:16px;padding:16px 26px;min-width:260px}
.results-row{display:flex;justify-content:space-between;gap:20px;font-size:15px;font-weight:bold;color:#fff;letter-spacing:1px}
.results-row.winner{color:#ffe14d;font-size:19px}
#menuBtn{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:9px 22px;font-size:12px;letter-spacing:2px;border-radius:20px;cursor:pointer;font-family:'Trebuchet MS',sans-serif;font-weight:bold}
#menuBtn:hover{background:rgba(255,255,255,0.28)}
#matchTimerHud{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-family:'Trebuchet MS',sans-serif;font-size:22px;font-weight:900;color:#fff;background:rgba(0,0,0,0.35);padding:6px 20px;border-radius:20px;z-index:5;display:none}
.food-float{position:absolute;top:0;left:0;font-size:70px;opacity:0.4;pointer-events:none;z-index:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.2));will-change:transform}
.f2{font-size:58px}
.f3{font-size:85px}
.f4{font-size:62px}
.f5{font-size:50px}
.f6{font-size:66px}
.tag-title,.btn,#setupScreen{position:relative;z-index:1}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas" width="900" height="675"></canvas>
<div id="matchTimerHud">60</div>

<div id="homeScreen" class="screen-overlay">
    <div class="food-float f1">🌮</div>
    <div class="food-float f2">🌯</div>
    <div class="food-float f3">🌯</div>
    <div class="food-float f4">🌮</div>
    <div class="food-float f5">🌮</div>
    <div class="food-float f6">🌯</div>
    <div class="tag-title">TAG</div>
    <div class="tag-subtitle">TACO VS BURRITO</div>
    <button class="btn" id="startBtn">START</button>

    <div id="setupScreen">
        <h2>GAME SETUP</h2>
        <div class="setup-grid">
            <div class="setup-row">
                <span class="setup-label">PLAYERS</span>
                <div class="pill-group" id="playersGroup">
                    <button class="pill-btn active" data-val="1">1</button>
                    <button class="pill-btn" data-val="2">2</button>
                </div>
            </div>
            <div class="setup-row" id="botsRow">
                <span class="setup-label">BOTS</span>
                <div class="pill-group" id="botsGroup">
                    <button class="pill-btn active" data-val="1">1</button>
                    <button class="pill-btn" data-val="2">2</button>
                    <button class="pill-btn" data-val="3">3</button>
                    <button class="pill-btn" data-val="4">4</button>
                </div>
            </div>
            <div class="setup-row">
                <span class="setup-label">GAME TYPE</span>
                <div class="pill-group" id="typeGroup">
                    <button class="pill-btn active" data-val="laser">LASER</button>
                    <button class="pill-btn" data-val="regular">REGULAR</button>
                </div>
            </div>
            <div class="setup-row">
                <span class="setup-label">TRAMPOLINES</span>
                <div class="pill-group" id="trampGroup">
                    <button class="pill-btn" data-val="0">0</button>
                    <button class="pill-btn" data-val="2">2</button>
                    <button class="pill-btn active" data-val="4">4</button>
                    <button class="pill-btn" data-val="6">6</button>
                </div>
            </div>
            <div class="setup-row">
                <span class="setup-label">BOXES</span>
                <div class="pill-group" id="boxGroup">
                    <button class="pill-btn" data-val="0">0</button>
                    <button class="pill-btn" data-val="3">3</button>
                    <button class="pill-btn active" data-val="5">5</button>
                    <button class="pill-btn" data-val="8">8</button>
                </div>
            </div>
            <div class="setup-row">
                <span class="setup-label">GRAVITY</span>
                <button id="gravityBtn" class="toggle-btn">OFF</button>
            </div>
            <div class="setup-row">
                <span class="setup-label">WIN CONDITION</span>
                <div class="pill-group" id="winCondGroup">
                    <button class="pill-btn active" data-val="firstHit">FIRST HIT</button>
                    <button class="pill-btn" data-val="points">MOST POINTS</button>
                </div>
            </div>
            <div class="setup-row" id="timeLimitRow" style="display:none">
                <span class="setup-label">TIME LIMIT</span>
                <div class="pill-group" id="timeLimitGroup">
                    <button class="pill-btn" data-val="30">30s</button>
                    <button class="pill-btn active" data-val="60">60s</button>
                    <button class="pill-btn" data-val="90">90s</button>
                    <button class="pill-btn" data-val="120">120s</button>
                </div>
            </div>
            <div class="setup-row">
                <span class="setup-label">FULL MODE</span>
                <button id="fullModeBtn" class="toggle-btn">OFF</button>
            </div>
        </div>
        <button class="btn" id="playBtn">PLAY</button>
        <button id="setupBackBtn">&larr; BACK</button>
    </div>
</div>

<div id="resultsScreen" class="screen-overlay" style="display:none">
    <div class="tag-title" style="font-size:64px" id="resultsTitle">GAME OVER</div>
    <div id="resultsList" class="results-list"></div>
    <button class="btn" id="playAgainBtn">PLAY AGAIN</button>
    <button id="menuBtn">&larr; MENU</button>
</div>

</div>
<script>
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Floating food physics — random drift + bounce off walls and each other
const foodEls = Array.from(document.querySelectorAll('.food-float'));
const foods = foodEls.map(el => {
    const r = (parseFloat(getComputedStyle(el).fontSize) || 70) / 2;
    return {
        el, r,
        x: r + Math.random() * (window.innerWidth - r * 2),
        y: r + Math.random() * (window.innerHeight - r * 2),
        vx: (Math.random() - 0.5) * 90,
        vy: (Math.random() - 0.5) * 90,
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 40
    };
});
let lastFoodTime = performance.now();
function updateFoodPhysics(time) {
    const dt = Math.min((time - lastFoodTime) / 1000, 0.05);
    lastFoodTime = time;
    for (const f of foods) {
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.rot += f.vrot * dt;
        if (f.x - f.r < 0) { f.x = f.r; f.vx = Math.abs(f.vx); }
        if (f.x + f.r > window.innerWidth) { f.x = window.innerWidth - f.r; f.vx = -Math.abs(f.vx); }
        if (f.y - f.r < 0) { f.y = f.r; f.vy = Math.abs(f.vy); }
        if (f.y + f.r > window.innerHeight) { f.y = window.innerHeight - f.r; f.vy = -Math.abs(f.vy); }
    }
    for (let i = 0; i < foods.length; i++) {
        for (let j = i + 1; j < foods.length; j++) {
            const a = foods[i], b = foods[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            const dist = Math.hypot(dx, dy) || 0.001;
            const minDist = a.r + b.r;
            if (dist < minDist) {
                const nx = dx / dist, ny = dy / dist;
                const overlap = (minDist - dist) / 2;
                a.x -= nx * overlap; a.y -= ny * overlap;
                b.x += nx * overlap; b.y += ny * overlap;
                const avx = a.vx, avy = a.vy;
                a.vx = b.vx; a.vy = b.vy;
                b.vx = avx; b.vy = avy;
            }
        }
    }
    for (const f of foods) {
        f.el.style.transform = `translate(${f.x - f.r}px, ${f.y - f.r}px) rotate(${f.rot}deg)`;
    }
    requestAnimationFrame(updateFoodPhysics);
}
requestAnimationFrame(updateFoodPhysics);

const homeScreen = document.getElementById('homeScreen');
const startBtn = document.getElementById('startBtn');
const setupScreen = document.getElementById('setupScreen');
const setupBackBtn = document.getElementById('setupBackBtn');
const playBtn = document.getElementById('playBtn');
const botsRow = document.getElementById('botsRow');
const fullModeBtn = document.getElementById('fullModeBtn');
const gravityBtn = document.getElementById('gravityBtn');
const timeLimitRow = document.getElementById('timeLimitRow');
const resultsScreen = document.getElementById('resultsScreen');
const resultsTitle = document.getElementById('resultsTitle');
const resultsList = document.getElementById('resultsList');
const playAgainBtn = document.getElementById('playAgainBtn');
const menuBtn = document.getElementById('menuBtn');
const matchTimerHud = document.getElementById('matchTimerHud');

let numPlayers = 1;
let numBots = 1;
let gameType = 'laser';
let fullMode = false;
let numTrampolines = 4;
let numBoxes = 5;
let winCondition = 'firstHit';
let timeLimit = 60;
let gravityMode = false;
let platforms = [];

startBtn.addEventListener('click', () => {
    startBtn.style.display = 'none';
    setupScreen.style.display = 'flex';
});

setupBackBtn.addEventListener('click', () => {
    setupScreen.style.display = 'none';
    startBtn.style.display = '';
});

function wirePillGroup(groupId, onSelect) {
    const group = document.getElementById(groupId);
    group.querySelectorAll('.pill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            group.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            onSelect(btn.dataset.val);
        });
    });
}

wirePillGroup('playersGroup', val => {
    numPlayers = parseInt(val, 10);
    botsRow.style.display = numPlayers === 1 ? 'flex' : 'none';
});
wirePillGroup('botsGroup', val => { numBots = parseInt(val, 10); });
wirePillGroup('typeGroup', val => { gameType = val; });
wirePillGroup('trampGroup', val => { numTrampolines = parseInt(val, 10); });
wirePillGroup('boxGroup', val => { numBoxes = parseInt(val, 10); });
wirePillGroup('winCondGroup', val => {
    winCondition = val;
    timeLimitRow.style.display = val === 'points' ? 'flex' : 'none';
});
wirePillGroup('timeLimitGroup', val => { timeLimit = parseInt(val, 10); });

fullModeBtn.addEventListener('click', () => {
    fullMode = !fullMode;
    fullModeBtn.textContent = fullMode ? 'ON' : 'OFF';
    fullModeBtn.classList.toggle('active', fullMode);
});

gravityBtn.addEventListener('click', () => {
    gravityMode = !gravityMode;
    gravityBtn.textContent = gravityMode ? 'ON' : 'OFF';
    gravityBtn.classList.toggle('active', gravityMode);
});

playBtn.addEventListener('click', () => {
    startGame();
});

function startGame() {
    homeScreen.style.display = 'none';
    resultsScreen.style.display = 'none';
    initGame();
    requestAnimationFrame(gameLoop);
}

playAgainBtn.addEventListener('click', () => {
    resultsScreen.style.display = 'none';
    initGame();
});

menuBtn.addEventListener('click', () => {
    resultsScreen.style.display = 'none';
    matchTimerHud.style.display = 'none';
    homeScreen.style.display = 'flex';
    startBtn.style.display = '';
    setupScreen.style.display = 'none';
});

// ---- Input ----
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true;
});
window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    keys[e.code] = false;
});

function getP1Input() {
    if (numPlayers === 2) {
        // 2P mode: Player 1 is the arrow-key side, fire on Right Shift, Up jumps
        return {
            up: keys['arrowup'],
            down: keys['arrowdown'],
            left: keys['arrowleft'],
            right: keys['arrowright'],
            fire: keys['ShiftRight']
        };
    }
    // 1P mode: either key set works, either Shift fires, Up/W jumps
    return {
        up: keys['arrowup'] || keys['w'],
        down: keys['arrowdown'] || keys['s'],
        left: keys['arrowleft'] || keys['a'],
        right: keys['arrowright'] || keys['d'],
        fire: keys['ShiftLeft'] || keys['ShiftRight']
    };
}
function getP2Input() {
    // 2P mode: Player 2 is the WASD side, fire on Left Shift, W jumps
    return {
        up: keys['w'],
        down: keys['s'],
        left: keys['a'],
        right: keys['d'],
        fire: keys['ShiftLeft']
    };
}
function getBotInput(bot, dt) {
    // AI: wander in a random direction, changing every so often, and always try to fire
    bot.aiTimer = (bot.aiTimer || 0) - dt;
    if (bot.aiTimer <= 0) {
        bot.aiDir = {
            up: Math.random() < 0.5,
            down: Math.random() < 0.5,
            left: Math.random() < 0.5,
            right: Math.random() < 0.5
        };
        bot.aiTimer = 0.6 + Math.random() * 1.2;
    }
    return {
        up: bot.aiDir.up,
        down: bot.aiDir.down,
        left: bot.aiDir.left,
        right: bot.aiDir.right,
        fire: true
    };
}

// ---- Game entities ----
let player1, player2, bots, lasers, gameTick;
let trampolines = [];
let boxes = [];
const BOT_COLORS = ['#ff6b9d', '#c084fc', '#4dd0e1', '#ffb74d', '#81c784'];

function makePlayer(emoji, color, name) {
    return {
        x: W / 2, y: H / 2, angle: 0, speed: 260, size: 46,
        emoji, color, name, fireTimer: 0,
        sliced: false, sliceTimer: 0, sliceMaxTimer: 0.9,
        vy: 0, grounded: false,
        boostTimer: 0, hits: 0, timesHit: 0
    };
}

let gameOver = false;
let matchTimer = 0;

function generatePlatforms() {
    platforms = [];
    const count = 11, minW = 130, maxW = 210, minH = 26, maxH = 42, gap = 34;
    let attempts = 0;
    while (platforms.length < count && attempts < count * 60) {
        attempts++;
        const w = minW + Math.random() * (maxW - minW);
        const h = minH + Math.random() * (maxH - minH);
        const x = 20 + Math.random() * Math.max(1, W - w - 40);
        const y = 20 + Math.random() * Math.max(1, H - h - 40);
        const overlaps = platforms.some(pl =>
            x < pl.x + pl.w + gap && x + w + gap > pl.x &&
            y < pl.y + pl.h + gap && y + h + gap > pl.y
        );
        if (!overlaps) platforms.push({ x, y, w, h, mossSeed: Math.random() * 1000 });
    }
    if (!platforms.length) {
        platforms.push({ x: W * 0.1, y: H * 0.1, w: W * 0.8, h: H * 0.8, mossSeed: 0 });
    }
}

function randomPlatform() {
    return platforms[Math.floor(Math.random() * platforms.length)];
}

// Picks a random x on top of a platform's surface (pl.y), keeping an item of
// half-width margin fully within the platform's span.
function platformTopPoint(pl, margin) {
    const mw = Math.min(margin, pl.w / 2 - 1);
    return {
        x: pl.x + mw + Math.random() * Math.max(1, pl.w - mw * 2),
        y: pl.y
    };
}

function spawnOnPlatformTop(entity) {
    if (!platforms.length) return;
    const pt = platformTopPoint(randomPlatform(), entity.size / 2 + 4);
    entity.x = pt.x;
    entity.y = pt.y - entity.size / 2;
    entity.vy = 0;
    entity.grounded = true;
}

function initGame() {
    lasers = [];
    particles = [];
    shockwaves = [];
    gameTick = 0;
    gameOver = false;
    matchTimer = timeLimit;
    resultsScreen.style.display = 'none';
    matchTimerHud.style.display = winCondition === 'points' ? 'block' : 'none';

    platforms = [];
    if (gravityMode) generatePlatforms();

    player1 = makePlayer('🌮', '#ffb703', numPlayers === 2 ? 'P1' : 'YOU');
    player1.x = W * 0.3; player1.y = H * 0.5;

    if (numPlayers === 2) {
        player2 = makePlayer('🌯', '#ff6b9d', 'P2');
        player2.x = W * 0.7; player2.y = H * 0.5;
        bots = [];
    } else {
        player2 = null;
        bots = [];
        const spreadR = Math.min(W, H) * 0.32;
        for (let i = 0; i < numBots; i++) {
            const b = makePlayer('🌯', BOT_COLORS[i % BOT_COLORS.length], 'BOT ' + (i + 1));
            const angle = (i / numBots) * Math.PI * 2;
            b.x = W / 2 + Math.cos(angle) * spreadR;
            b.y = H / 2 + Math.sin(angle) * spreadR;
            bots.push(b);
        }
    }

    if (gravityMode && platforms.length) getAllEntities().forEach(spawnOnPlatformTop);

    trampolines = [];
    for (let i = 0; i < numTrampolines; i++) {
        const r = 18;
        let tx, ty;
        if (gravityMode && platforms.length) {
            const pt = platformTopPoint(randomPlatform(), r);
            tx = pt.x; ty = pt.y - r;
        } else {
            tx = W * (0.15 + Math.random() * 0.7);
            ty = H * (0.15 + Math.random() * 0.7);
        }
        trampolines.push({ x: tx, y: ty, r });
    }

    boxes = [];
    for (let i = 0; i < numBoxes; i++) {
        const bw = 60, bh = 60;
        let bx, by;
        if (gravityMode && platforms.length) {
            const pt = platformTopPoint(randomPlatform(), bw / 2 + 10);
            bx = pt.x - bw / 2; by = pt.y - bh;
        } else {
            bx = W * (0.1 + Math.random() * 0.75) - bw / 2;
            by = H * (0.1 + Math.random() * 0.75) - bh / 2;
        }
        boxes.push({ x: bx, y: by, w: bw, h: bh });
    }
}

function getAllEntities() {
    const list = [player1];
    if (player2) list.push(player2);
    if (bots) list.push(...bots);
    return list;
}

function findNearestTarget(entity, all) {
    let best = null, bestD = Infinity;
    for (const e of all) {
        if (e === entity || e.sliced) continue;
        const d = Math.hypot(e.x - entity.x, e.y - entity.y);
        if (d < bestD) { bestD = d; best = e; }
    }
    return best;
}

const GRAVITY_ACCEL = 1800;
const JUMP_VELOCITY = -1100;
const TRAMPOLINE_BOUNCE = -980;

function updateFreeMovement(p, input, dt) {
    for (const t of trampolines) {
        if (Math.hypot(p.x - t.x, p.y - t.y) < t.r + p.size / 2) {
            if (p.boostTimer <= 0) spawnSparks(p.x, p.y, '#7CFC00', 16);
            p.boostTimer = 1.2;
        }
    }
    if (p.boostTimer > 0) p.boostTimer -= dt;
    const effSpeed = p.speed * (p.boostTimer > 0 ? 2.2 : 1);

    let dx = 0, dy = 0;
    if (input.up) dy -= 1;
    if (input.down) dy += 1;
    if (input.left) dx -= 1;
    if (input.right) dx += 1;
    if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        dx /= len; dy /= len;
        p.x += dx * effSpeed * dt;
        p.y += dy * effSpeed * dt;
        p.angle = Math.atan2(dy, dx);
    }
    p.x = Math.max(p.size / 2, Math.min(W - p.size / 2, p.x));
    p.y = Math.max(p.size / 2, Math.min(H - p.size / 2, p.y));
}

// Side-view platformer physics: horizontal movement only, constant downward
// gravity, and landing collision against the top surface of each platform.
function updateGravityMovement(p, input, dt) {
    const footY = p.y + p.size / 2;
    for (const t of trampolines) {
        if (p.vy >= 0 && Math.hypot(p.x - t.x, footY - t.y) < t.r + p.size / 2) {
            spawnSparks(p.x, footY, '#7CFC00', 16);
            p.vy = TRAMPOLINE_BOUNCE;
            p.grounded = false;
        }
    }

    let dx = 0;
    if (input.left) dx -= 1;
    if (input.right) dx += 1;
    if (dx !== 0) {
        p.x += dx * p.speed * dt;
        p.angle = dx > 0 ? 0 : Math.PI;
    }
    p.x = Math.max(p.size / 2, Math.min(W - p.size / 2, p.x));

    if (input.up && p.grounded) {
        p.vy = JUMP_VELOCITY;
        p.grounded = false;
        spawnSparks(p.x, p.y + p.size / 2, '#ffffff', 10);
    }

    const prevBottom = p.y + p.size / 2;
    p.vy += GRAVITY_ACCEL * dt;
    p.y += p.vy * dt;
    const newBottom = p.y + p.size / 2;

    p.grounded = false;
    if (p.vy >= 0) {
        for (const pl of platforms) {
            if (p.x > pl.x - 2 && p.x < pl.x + pl.w + 2 && prevBottom <= pl.y + 1 && newBottom >= pl.y) {
                p.y = pl.y - p.size / 2;
                p.vy = 0;
                p.grounded = true;
                break;
            }
        }
    }

    if (p.y - p.size / 2 < 0) {
        p.y = p.size / 2;
        p.vy = Math.max(p.vy, 0);
    }

    if (p.y - p.size / 2 > H) {
        p.timesHit++;
        spawnOnPlatformTop(p);
    }
}

function updatePlayerMovement(p, input, dt, target) {
    if (p.sliced) return;

    if (gravityMode) {
        updateGravityMovement(p, input, dt);
    } else {
        updateFreeMovement(p, input, dt);
    }

    for (const bx of boxes) {
        const closestX = Math.max(bx.x, Math.min(p.x, bx.x + bx.w));
        const closestY = Math.max(bx.y, Math.min(p.y, bx.y + bx.h));
        const bdx = p.x - closestX, bdy = p.y - closestY;
        const bdist = Math.hypot(bdx, bdy);
        const minDist = p.size / 2;
        if (bdist < minDist) {
            const nx = bdx / (bdist || 0.001), ny = bdy / (bdist || 0.001);
            const push = minDist - bdist;
            p.x += nx * push;
            p.y += ny * push;
        }
    }

    p.fireTimer -= dt;
    if (input.fire && p.fireTimer <= 0 && gameType === 'laser' && target) {
        const aimAngle = Math.atan2(target.y - p.y, target.x - p.x);
        const sx = p.x + Math.cos(aimAngle) * p.size / 2;
        const sy = p.y + Math.sin(aimAngle) * p.size / 2;
        lasers.push({
            x: sx, y: sy,
            vx: Math.cos(aimAngle) * 700,
            vy: Math.sin(aimAngle) * 700,
            owner: p, color: p.color, life: 1.2, trail: []
        });
        spawnSparks(sx, sy, p.color, 14);
        p.fireTimer = 1;
    }
}

let particles = [];
function spawnSparks(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = 60 + Math.random() * 160;
        const life = 0.25 + Math.random() * 0.25;
        particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life, maxLife: life, color, size: 1.5 + Math.random() * 2.5 });
    }
}
function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= 0.9; p.vy *= 0.9;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}
function drawParticles() {
    for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

let shockwaves = [];
function spawnExplosion(x, y, color) {
    spawnSparks(x, y, color, 30);
    spawnSparks(x, y, '#ffffff', 12);
    shockwaves.push({ x, y, r: 4, maxR: 60, life: 0.4, maxLife: 0.4, color });
}
function updateShockwaves(dt) {
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.life -= dt;
        s.r = s.maxR * (1 - s.life / s.maxLife);
        if (s.life <= 0) shockwaves.splice(i, 1);
    }
}
function drawShockwaves() {
    for (const s of shockwaves) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, s.life / s.maxLife) * 0.8;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
}

function drawTrampolines() {
    for (const t of trampolines) {
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.fillStyle = '#3a2a1a';
        ctx.beginPath();
        ctx.arc(0, 0, t.r + 6, 0, Math.PI * 2);
        ctx.fill();
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, t.r);
        grad.addColorStop(0, '#9bff5c');
        grad.addColorStop(1, '#4fae1f');
        ctx.fillStyle = grad;
        ctx.shadowColor = '#7CFC00';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(0, 0, t.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * t.r, Math.sin(a) * t.r);
            ctx.stroke();
        }
        ctx.restore();
    }
}

function drawPitBackground() {
    ctx.fillStyle = '#2b1b3a';
    ctx.fillRect(0, 0, W, H);
}

function drawPlatforms() {
    for (const plat of platforms) {
        ctx.save();

        // Elliptical shadow underneath
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.beginPath();
        ctx.ellipse(plat.x + plat.w / 2, plat.y + plat.h + 5, plat.w / 2, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        let gradient = ctx.createLinearGradient(plat.x, plat.y, plat.x, plat.y + plat.h);
        gradient.addColorStop(0, '#9B6B43');
        gradient.addColorStop(0.5, '#8B5B33');
        gradient.addColorStop(1, '#6B4523');

        ctx.fillStyle = gradient;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 4);
        ctx.fill();
        // Sharp border
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Wood plank lines
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.lineWidth = 1;
        for (let i = 25; i < plat.w; i += 25) {
            ctx.beginPath();
            ctx.moveTo(plat.x + i, plat.y);
            ctx.lineTo(plat.x + i, plat.y + plat.h);
            ctx.stroke();
        }
        // Horizontal wood grain
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
        for (let y = 3; y < plat.h; y += 4) {
            ctx.beginPath();
            ctx.moveTo(plat.x, plat.y + y);
            ctx.lineTo(plat.x + plat.w, plat.y + y);
            ctx.stroke();
        }

        // Top highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fillRect(plat.x + 2, plat.y, plat.w - 4, 3);

        // Grass/moss on top
        ctx.fillStyle = '#228B22';
        ctx.fillRect(plat.x, plat.y - 3, plat.w, 5);
        // Grass tufts
        ctx.strokeStyle = '#32AB32';
        ctx.lineWidth = 1.5;
        for (let i = 5; i < plat.w - 5; i += 12) {
            const sway = Math.sin(Date.now() / 400 + i * 0.5) * 2;
            ctx.beginPath();
            ctx.moveTo(plat.x + i, plat.y - 3);
            ctx.lineTo(plat.x + i + sway, plat.y - 10 - Math.random() * 3);
            ctx.stroke();
        }
        // Hanging moss on edges
        ctx.strokeStyle = 'rgba(34, 139, 34, 0.4)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
            const vx = plat.x + 5 + i * 8;
            const vh = 5 + Math.sin(Date.now() / 600 + i) * 2;
            ctx.beginPath();
            ctx.moveTo(vx, plat.y + plat.h);
            ctx.quadraticCurveTo(vx - 2, plat.y + plat.h + vh, vx + 3, plat.y + plat.h + vh + 3);
            ctx.stroke();
        }
        for (let i = 0; i < 2; i++) {
            const vx = plat.x + plat.w - 5 - i * 8;
            const vh = 4 + Math.sin(Date.now() / 500 + i + 2) * 2;
            ctx.beginPath();
            ctx.moveTo(vx, plat.y + plat.h);
            ctx.quadraticCurveTo(vx + 2, plat.y + plat.h + vh, vx - 3, plat.y + plat.h + vh + 2);
            ctx.stroke();
        }

        ctx.shadowBlur = 0;
        ctx.restore();
    }
}

function drawBoxes() {
    for (const bx of boxes) {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(bx.x + 4, bx.y + 6, bx.w, bx.h);
        const grad = ctx.createLinearGradient(bx.x, bx.y, bx.x, bx.y + bx.h);
        grad.addColorStop(0, '#c48a4a');
        grad.addColorStop(1, '#8a5a26');
        ctx.fillStyle = grad;
        ctx.fillRect(bx.x, bx.y, bx.w, bx.h);
        ctx.strokeStyle = '#5c3a16';
        ctx.lineWidth = 4;
        ctx.strokeRect(bx.x, bx.y, bx.w, bx.h);
        ctx.beginPath();
        ctx.moveTo(bx.x, bx.y);
        ctx.lineTo(bx.x + bx.w, bx.y + bx.h);
        ctx.moveTo(bx.x + bx.w, bx.y);
        ctx.lineTo(bx.x, bx.y + bx.h);
        ctx.stroke();
        ctx.restore();
    }
}

function updateLasers(dt) {
    const all = getAllEntities();
    for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.trail.push({ x: l.x, y: l.y });
        if (l.trail.length > 8) l.trail.shift();
        l.x += l.vx * dt; l.y += l.vy * dt;
        if (Math.random() < 0.6) spawnSparks(l.x, l.y, l.color, 1);

        for (const t of trampolines) {
            const tdx = l.x - t.x, tdy = l.y - t.y;
            const tdist = Math.hypot(tdx, tdy);
            if (tdist < t.r) {
                const nx = tdx / (tdist || 0.001), ny = tdy / (tdist || 0.001);
                const dot = l.vx * nx + l.vy * ny;
                l.vx -= 2 * dot * nx;
                l.vy -= 2 * dot * ny;
                l.x = t.x + nx * t.r;
                l.y = t.y + ny * t.r;
                l.color = '#7CFC00';
                spawnSparks(l.x, l.y, '#7CFC00', 10);
            }
        }

        let hit = null;
        for (const e of all) {
            if (e === l.owner || e.sliced) continue;
            if (Math.hypot(l.x - e.x, l.y - e.y) < e.size / 2) { hit = e; break; }
        }
        if (hit) {
            spawnExplosion(l.x, l.y, l.color);
            hit.sliced = true;
            hit.sliceTimer = hit.sliceMaxTimer;
            hit.timesHit++;
            l.owner.hits++;
            lasers.splice(i, 1);
            if (winCondition === 'firstHit' && !gameOver) endGame();
            continue;
        }

        let hitBox = false;
        for (const bx of boxes) {
            if (l.x > bx.x && l.x < bx.x + bx.w && l.y > bx.y && l.y < bx.y + bx.h) { hitBox = true; break; }
        }
        if (hitBox) {
            spawnExplosion(l.x, l.y, l.color);
            lasers.splice(i, 1);
            continue;
        }
    }
}

function drawPlayer(p) {
    if (p.sliced) { drawSlicedPlayer(p); return; }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.font = p.size + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 20;
    ctx.fillText(p.emoji, 0, 0);
    ctx.restore();
}

function drawHalf(p, isTop, offset, rot, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(p.x, p.y + (isTop ? -offset : offset));
    ctx.rotate(isTop ? -rot : rot);
    ctx.beginPath();
    ctx.rect(-p.size, isTop ? -p.size : 0, p.size * 2, p.size);
    ctx.clip();
    ctx.font = p.size + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fillText(p.emoji, 0, 0);
    ctx.restore();
}

function drawSlicedPlayer(p) {
    const t = 1 - p.sliceTimer / p.sliceMaxTimer;
    const offset = t * 55;
    const rot = t * 0.9;
    const alpha = Math.max(0, 1 - t);
    drawHalf(p, true, offset, rot, alpha);
    drawHalf(p, false, offset, rot, alpha);
}

function updateSliced(p, dt) {
    if (!p.sliced) return;
    p.sliceTimer -= dt;
    if (p.sliceTimer <= 0) {
        p.sliced = false;
        if (gravityMode && platforms.length) {
            spawnOnPlatformTop(p);
        } else {
            p.x = p.size + Math.random() * (W - p.size * 2);
            p.y = p.size + Math.random() * (H - p.size * 2);
        }
    }
}

function drawLasers() {
    for (const l of lasers) {
        ctx.save();

        // Fading trail behind the bolt
        if (l.trail.length > 1) {
            for (let i = 1; i < l.trail.length; i++) {
                const a = l.trail[i - 1], b = l.trail[i];
                const t = i / l.trail.length;
                ctx.globalAlpha = t * 0.5;
                ctx.strokeStyle = l.color;
                ctx.lineWidth = 6 * t;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        const tailX = l.x - l.vx * 0.045, tailY = l.y - l.vy * 0.045;

        // Outer soft glow
        ctx.strokeStyle = l.color;
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.globalAlpha = 0.25;
        ctx.shadowColor = l.color;
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        // Mid colored bolt
        ctx.globalAlpha = 0.9;
        ctx.lineWidth = 6;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        // White-hot core
        ctx.globalAlpha = 1;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        // Bright tip flare
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(l.x, l.y, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

let lastGameTime = 0;
function endGame() {
    if (gameOver) return;
    gameOver = true;
    const all = getAllEntities();
    const sorted = [...all].sort((a, b) => (b.hits - b.timesHit) - (a.hits - a.timesHit));
    const topScore = sorted[0].hits - sorted[0].timesHit;

    resultsTitle.textContent = sorted.length > 1 && (sorted[0].hits - sorted[0].timesHit) === (sorted[1].hits - sorted[1].timesHit) ? "IT'S A TIE!" : sorted[0].name + (sorted[0].name === 'YOU' ? ' WIN!' : ' WINS!');
    resultsList.innerHTML = '';
    for (const e of sorted) {
        const row = document.createElement('div');
        const score = e.hits - e.timesHit;
        row.className = 'results-row' + (score === topScore ? ' winner' : '');
        row.innerHTML = '<span>' + e.emoji + ' ' + e.name + '</span><span>' + score + ' pts</span>';
        resultsList.appendChild(row);
    }
    matchTimerHud.style.display = 'none';
    resultsScreen.style.display = 'flex';
}

function gameLoop(time) {
    const dt = Math.min((time - lastGameTime) / 1000, 0.05) || 0;
    lastGameTime = time;
    gameTick++;

    if (gameOver) { requestAnimationFrame(gameLoop); return; }

    if (winCondition === 'points') {
        matchTimer -= dt;
        matchTimerHud.textContent = Math.ceil(Math.max(0, matchTimer));
        if (matchTimer <= 0) { endGame(); requestAnimationFrame(gameLoop); return; }
    }

    const all = getAllEntities();

    updatePlayerMovement(player1, getP1Input(), dt, findNearestTarget(player1, all));
    if (player2) updatePlayerMovement(player2, getP2Input(), dt, findNearestTarget(player2, all));
    for (const b of bots) updatePlayerMovement(b, getBotInput(b, dt), dt, findNearestTarget(b, all));

    updateSliced(player1, dt);
    if (player2) updateSliced(player2, dt);
    for (const b of bots) updateSliced(b, dt);

    updateLasers(dt);
    updateParticles(dt);
    updateShockwaves(dt);

    ctx.clearRect(0, 0, W, H);
    if (gravityMode) {
        drawPitBackground();
        drawPlatforms();
    } else {
        ctx.fillStyle = '#ff8fc4';
        ctx.fillRect(0, 0, W, H);
    }
    drawTrampolines();
    drawBoxes();

    drawPlayer(player1);
    if (player2) drawPlayer(player2);
    for (const b of bots) drawPlayer(b);
    drawLasers();
    drawParticles();
    drawShockwaves();

    requestAnimationFrame(gameLoop);
}
</script>

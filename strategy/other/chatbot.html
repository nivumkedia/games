<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, #fff8e1 0%, #e3f2fd 100%);
    height: 100vh; display: flex; justify-content: center; align-items: center;
    color: #263238;
  }
  .app {
    width: min(760px, 96vw); height: min(860px, 94vh);
    background: #fff; border-radius: 22px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(33, 150, 243, 0.18);
    display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(90deg, #ffb300, #ff8f00);
    color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px;
  }
  .avatar { font-size: 34px; }
  header h1 { font-size: 22px; }
  header p { font-size: 13px; opacity: .9; }
  header .spacer { flex: 1; }
  header button {
    background: rgba(255,255,255,.25); border: none; color: #fff; padding: 8px 14px;
    border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
  }
  header button:hover { background: rgba(255,255,255,.4); }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #fafcff; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; animation: pop .2s ease-out; }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .bot { background: #fff3cd; align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: #2196f3; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot.learn { background: #e8f5e9; border: 1px dashed #66bb6a; }
  .typing { color: #999; font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 20px 0; background: #fff; }
  .chip {
    background: #e3f2fd; color: #1565c0; border: none; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; font-size: 13px;
  }
  .chip:hover { background: #bbdefb; }
  form { display: flex; gap: 10px; padding: 14px 20px 18px; background: #fff; }
  #input {
    flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 14px; font-size: 16px; outline: none;
  }
  #input:focus { border-color: #ffb300; }
  form button {
    background: #ff8f00; color: #fff; border: none; padding: 0 22px; border-radius: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  form button:hover { background: #ef6c00; }
  /* Brain panel */
  #panel {
    position: fixed; inset: 0; background: rgba(0,0,0,.3); display: none; justify-content: center; align-items: center;
  }
  #panel.open { display: flex; }
  .panel-box {
    background: #fff; width: min(640px, 94vw); max-height: 86vh; border-radius: 18px; padding: 22px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .panel-box h2 { color: #ef6c00; }
  .panel-box .row { display: flex; gap: 8px; }
  .panel-box input { flex: 1; padding: 9px 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; }
  .panel-box button { background: #2196f3; color: #fff; border: none; padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; }
  .panel-box button.gray { background: #90a4ae; }
  .panel-box button.red { background: #e53935; }
  #learned { overflow-y: auto; flex: 1; border: 1px solid #eee; border-radius: 10px; min-height: 120px; }
  .item { display: flex; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #f0f0f0; align-items: center; font-size: 14px; }
  .item .q { font-weight: 600; color: #1565c0; }
  .item .a { color: #555; flex: 1; }
  .item button { padding: 4px 9px; font-size: 12px; }
  .stats { font-size: 13px; color: #777; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🌞</div>
    <div>
      <h1>Sunny Bot</h1>
      <p>I learn from you. Teach me anything!</p>
    </div>
    <div class="spacer"></div>
    <button id="clearBtn">🗑 Clear chat</button>
    <button id="brainBtn">🧠 My Brain</button>
  </header>
  <div id="chat"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Say something..." autofocus>
    <button type="submit">Send</button>
  </form>
</div>

<div id="panel">
  <div class="panel-box">
    <h2>🧠 Sunny's Brain</h2>
    <div class="stats" id="stats"></div>
    <div class="row">
      <input id="teachQ" placeholder="When someone says...">
      <input id="teachA" placeholder="Sunny replies...">
      <button id="teachBtn">Teach</button>
    </div>
    <div id="learned"></div>
    <div class="row">
      <button class="gray" id="exportBtn">Export</button>
      <button class="gray" id="importBtn">Import</button>
      <button class="red" id="wipeBtn">Forget everything I taught</button>
      <div style="flex:1"></div>
      <button id="closeBtn">Close</button>
    </div>
    <input type="file" id="fileIn" accept=".json" style="display:none">
  </div>
</div>

<script>
// ---------- Built-in training data ----------
// Each intent: example phrases the bot learns from, and replies to pick from.
const BASE = [
  { tag: 'greet', ex: ['hi', 'hello', 'hey', 'yo', 'good morning', 'good afternoon', 'howdy', 'sup', 'hiya'],
    re: ['Hi{name}! 😊', 'Hello{name}! What do you want to talk about?', 'Hey{name}! Good to see you.'] },
  { tag: 'bye', ex: ['bye', 'goodbye', 'see you later', 'see ya', 'gotta go', 'good night', 'cya'],
    re: ['Bye{name}! Come back soon! 👋', 'See you later{name}!', 'Goodbye! Have a sunny day ☀️'] },
  { tag: 'doing', ex: ['what are you doing', 'what are you up to', 'what you doing'],
    re: ['Just chatting with you! 😄 What are you doing?', 'Hanging out in this web page, waiting for you to say something! ☀️'] },
  { tag: 'how', ex: ['how are you', 'how are you doing', 'how is it going', 'whats up', 'how do you feel'],
    re: ['I\'m great, thanks for asking! How about you?', 'Feeling sunny! ☀️ How are you?', 'Doing awesome! What about you?'] },
  { tag: 'good', ex: ['i am good', 'im fine', 'i am great', 'good thanks', 'pretty good', 'i am happy', 'awesome'],
    re: ['Yay, glad to hear it! 🎉', 'Awesome! What have you been up to?', 'Great! Want to hear a joke?'] },
  { tag: 'bad', ex: ['i am sad', 'i feel bad', 'not good', 'i am tired', 'bad day', 'i am bored', 'i am upset'],
    re: ['Oh no 😟 Want to talk about it?', 'Sorry to hear that. Want a joke to cheer you up?', 'Sending you a big sunny hug 🤗'] },
  { tag: 'name', ex: ['what is your name', 'who are you', 'what are you called', 'your name'],
    re: ['I\'m Sunny Bot! 🌞 A chatbot that learns from you.'] },
  { tag: 'what', ex: ['what are you', 'are you a robot', 'are you real', 'are you human', 'are you ai'],
    re: ['I\'m a little chatbot that lives in this web page. I don\'t know everything, but you can teach me!'] },
  { tag: 'age', ex: ['how old are you', 'what is your age', 'when were you born'],
    re: ['I was born the first time you opened this page! So pretty young 👶'] },
  { tag: 'maker', ex: ['who made you', 'who created you', 'who built you', 'who is your creator'],
    re: ['I was made for Niv\'s Games! 🎮'] },
  { tag: 'thanks', ex: ['thanks', 'thank you', 'thx', 'ty', 'thanks a lot'],
    re: ['You\'re welcome! 😊', 'Anytime!', 'No problem!'] },
  { tag: 'joke', ex: ['tell me a joke', 'joke', 'make me laugh', 'say something funny', 'another joke'],
    re: [
      'Why did the scarecrow win an award? Because he was outstanding in his field! 🌾',
      'Why don\'t skeletons fight each other? They don\'t have the guts. 💀',
      'What do you call a fake noodle? An impasta! 🍝',
      'Why did the math book look sad? It had too many problems. 📘',
      'What do you call a bear with no teeth? A gummy bear! 🐻',
      'Why can\'t a bicycle stand up by itself? It\'s two tired! 🚲',
      'What did the ocean say to the beach? Nothing, it just waved. 🌊',
      'Why did the computer go to the doctor? It had a virus! 💻',
      'How does a penguin build its house? Igloos it together! 🐧',
      'What do you call a sleeping dinosaur? A dino-snore! 🦖'
    ] },
  { tag: 'fact', ex: ['tell me a fact', 'fun fact', 'teach me something', 'tell me something cool', 'did you know'],
    re: [
      'Octopuses have three hearts and blue blood! 🐙',
      'Honey never spoils. People found 3000-year-old honey in Egyptian tombs that was still good! 🍯',
      'A day on Venus is longer than a year on Venus. 🪐',
      'Bananas are berries, but strawberries are not! 🍌',
      'Sharks existed before trees did. 🦈',
      'There are more stars in the universe than grains of sand on every beach on Earth. ✨',
      'A group of flamingos is called a flamboyance. 🦩',
      'Your brain uses about 20% of your body\'s energy. 🧠',
      'Lightning is five times hotter than the surface of the sun. ⚡',
      'Wombat poop is cube-shaped! 🟫'
    ] },
  { tag: 'game', ex: ['what games are there', 'what games do you have', 'recommend a game', 'i want to play a game', 'what should i play'],
    re: ['Try Pulse Runner, Stick Fighter, Tower Defense, 2048, or City Builder! 🎮', 'How about Block Blast or Fruit Ninja? 🍉', 'Racing Game and Turbo Clash 2 are fun if you like speed! 🏎️'] },
  { tag: 'color', ex: ['what is your favorite color', 'favorite colour', 'what color do you like'],
    re: ['Sunny yellow, of course! 💛'] },
  { tag: 'food', ex: ['what is your favorite food', 'what do you eat', 'are you hungry', 'favorite food'],
    re: ['I eat words for breakfast! 📖 But pizza looks pretty good 🍕'] },
  { tag: 'love', ex: ['i love you', 'you are cool', 'you are awesome', 'you are smart', 'i like you', 'you are the best'],
    re: ['Aww, thank you! You\'re awesome too! 💛', 'That made my day! ☀️'] },
  { tag: 'mean', ex: ['you are dumb', 'you are stupid', 'you are bad', 'i hate you', 'you suck'],
    re: ['Aw 😢 I\'m still learning! Teach me something and I\'ll get smarter.', 'Sorry! Use the 🧠 button to teach me better answers.'] },
  { tag: 'oops', ex: ['that is not what i meant', 'you misunderstood', 'that is wrong', 'wrong answer', 'you got it wrong', 'i did not mean that'],
    re: ['Oops, sorry! 😅 What did you mean?', 'My bad! 🙈 Can you say it another way?'] },
  { tag: 'help', ex: ['help', 'what can you do', 'how do you work', 'what do you know', 'commands'],
    re: ['I can:\n• Chat and tell jokes and facts\n• Do math (try "what is 12 * 7")\n• Tell the time and date\n• Flip a coin or roll a dice\n• Remember your name ("my name is ...")\n• LEARN! If I don\'t get something, I\'ll guess and ask you questions.\n• Write a story with you: "let\'s write a story"\n• I understand typos, like "how ar yu"\n• Look things up online: "what does yeet mean", "who is Albert Einstein", "tell me about volcanoes"\n• Say "no" when I guess wrong, and teach me the right answer.\n• Teach me directly: "teach: question = answer"\n• Remember our whole chat: try "what did I say first", "did I mention pizza", "what do you know about me", "recap"'] },
  { tag: 'weather', ex: ['what is the weather', 'is it raining', 'is it sunny outside', 'weather today'],
    re: ['I can\'t see outside 🙈 but in here it\'s always sunny! ☀️'] },
  { tag: 'yes', ex: ['yes', 'yeah', 'yep', 'sure', 'ok', 'okay'],
    re: ['Cool! 😄', 'Okay!', 'Great!'] },
  { tag: 'no', ex: ['no', 'nope', 'nah', 'no thanks'],
    re: ['Okay, no problem!', 'Alright!'] },
  { tag: 'lol', ex: ['lol', 'haha', 'lmao', 'hahaha', 'that is funny'],
    re: ['😂 Glad you liked it!', 'Hehe 😄'] },
  { tag: 'animal', ex: ['what is your favorite animal', 'do you like animals', 'do you have a pet'],
    re: ['I love cats 🐱 and dogs 🐶 equally! Also octopuses, they\'re so smart.'] },
  { tag: 'sport', ex: ['do you like sports', 'what is your favorite sport', 'do you play soccer'],
    re: ['I\'d play soccer ⚽ but I don\'t have legs. I cheer really loudly though!'] },
  { tag: 'meaning', ex: ['what is the meaning of life', 'why are we here'],
    re: ['42! 😄 Or maybe: have fun, be kind, and keep learning.'] },
  { tag: 'rps', ex: ['rock paper scissors', 'play rock paper scissors', 'lets play a game'],
    re: ['{rps}'] },
  { tag: 'fair', ex: ['you can just say the one that beats it', 'you could cheat', 'are you cheating', 'you cheated', 'that is not fair', 'you can see what i pick', 'cheater'],
    re: ['Good thinking! 🧠 That\'s why I lock in my pick BEFORE you choose, and show it to you in secret code 🔒. After you pick, I tell you how to decode it, so you can check I didn\'t change it!'] },
];

// ---------- Text processing ----------
function stem(w) {
  if (w.length > 5 && w.endsWith('ing')) return w.slice(0, -3);
  if (w.length > 4 && w.endsWith('ed')) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1);
  return w;
}
const ALIAS = { u: 'you', ur: 'your', r: 'are', im: 'i', "i'm": 'i', whats: 'what', "what's": 'what', pls: 'please', plz: 'please', colour: 'color', wanna: 'want' };
function tokens(text) {
  return text.toLowerCase().replace(/[^a-z0-9'\s]/g, ' ').split(/\s+/).filter(Boolean)
    .map(w => ALIAS[w] || w).map(w => w.replace(/'/g, '')).map(stem);
}

// ---------- Memory ----------
const STORE = 'sunnybot_brain_v1';
let mem = JSON.parse(localStorage.getItem(STORE) || 'null') || { learned: [], name: '', chats: 0 };
mem.history = mem.history || [];  // every message: { who: 'user'|'bot', text, time }
mem.facts = mem.facts || {};      // things you told me: "my favorite food is pizza" -> { 'favorite food': 'pizza' }
mem.likes = mem.likes || [];
function remember(who, text) {
  mem.history.push({ who, text, time: Date.now() });
  if (mem.history.length > 5000) mem.history.splice(0, mem.history.length - 5000);
  save();
}
function save() { localStorage.setItem(STORE, JSON.stringify(mem)); }

// ---------- Model: TF-IDF vectors over every training example ----------
let docs = [], idf = {};
function train() {
  for (const k in typoCache) delete typoCache[k];
  docs = [];
  BASE.forEach(it => it.ex.forEach(e => docs.push({ toks: tokens(e), intent: it })));
  mem.learned.forEach((l, i) => docs.push({ toks: tokens(l.q), learned: l, idx: i }));
  const df = {};
  docs.forEach(d => new Set(d.toks).forEach(t => df[t] = (df[t] || 0) + 1));
  idf = {};
  for (const t in df) idf[t] = Math.log(1 + docs.length / df[t]);
  docs.forEach(d => { d.vec = vectorize(d.toks); });
}
function vectorize(toks) {
  const v = {};
  toks.forEach(t => v[t] = (v[t] || 0) + (idf[t] || Math.log(1 + docs.length)));
  let n = 0; for (const t in v) n += v[t] * v[t];
  n = Math.sqrt(n) || 1;
  for (const t in v) v[t] /= n;
  return v;
}
function cosine(a, b) { let s = 0; for (const t in a) if (b[t]) s += a[t] * b[t]; return s; }
// Filler words: a match must share at least one real word, not just "what is the"
const FILLER = new Set('a an the is are am was be do doe did i you your my me it its to of in on at for and or what who how why when where can could would will should that this there tell say please some about with like want'.split(' ').map(stem));
// Fix small typos: "how ar yu" -> "how are you", "ypou" -> "you", "teh" -> "the"
const COMMON = ('the be to of and a in that have i it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us is are was were am has had did does said got made went been being yes yeah ok okay hi hello hey bye please thanks thank sorry story write play game games fun funny joke jokes riddle tell talk chat help name old age love like hate happy sad mad bored tired hungry favorite color food animal dog cat pet friend friends mom dad brother sister school home house homework teacher class today tomorrow yesterday morning night week weekend birthday party gift pizza ice cream cake candy apple banana water milk eat ate drink sleep run walk jump swim read draw sing dance music song movie book books show watch computer phone video minecraft roblox fortnite soccer football basketball ball team win lose won lost score really very much more less little big small fast slow hot cold nice cool awesome great bad best worst never always maybe sometimes something anything nothing everything someone anyone everyone where why which whose while again still too here every each many few long short high low hard easy right wrong left true false real fake cute scary weird crazy silly smart dumb mean kind ate dragon magic monster robot space planet sun moon star stars ocean sea beach tree forest mountain river city world earth').split(' ');
const COMMON_SET = new Set(COMMON);
function close(a, b) {
  if (Math.abs(a.length - b.length) > 1) return false;
  if (a.length === b.length) {
    const diff = [];
    for (let k = 0; k < a.length; k++) if (a[k] !== b[k]) diff.push(k);
    if (diff.length === 1) return true;
    // swapped letters: "teh" -> "the"
    return diff.length === 2 && diff[1] === diff[0] + 1 && a[diff[0]] === b[diff[1]] && a[diff[1]] === b[diff[0]];
  }
  const [lo, sh] = a.length > b.length ? [a, b] : [b, a];
  for (let k = 0; k < lo.length; k++) if (lo.slice(0, k) + lo.slice(k + 1) === sh) return true;
  return false;
}
const typoCache = {};
function fixWord(w) {
  if (w in typoCache) return typoCache[w];
  let out = w;
  if (!(idf[w] || COMMON_SET.has(w) || SLANG[w] || /\d/.test(w) || w.length < 2)) {
    // try the brain's words first, then common English; same first letter wins ties
    const cands = [...Object.keys(idf), ...COMMON].filter(v => v.length >= 2 && v !== w && close(w, v) && (w.length > 2 || v.length === 3));
    cands.sort((x, y) => (y[0] === w[0]) - (x[0] === w[0]));
    if (cands.length) out = cands[0];
  }
  return typoCache[w] = out;
}
function fixTypos(toks) { return toks.map(w => stem(fixWord(w))); }
function correctText(text) { return text.toLowerCase().replace(/[a-z']+/g, w => ALIAS[w] || fixWord(w.replace(/'/g, '')) === w.replace(/'/g, '') ? (ALIAS[w] || w) : fixWord(w.replace(/'/g, ''))); }
function bestMatch(text) {
  const qt = fixTypos(tokens(text));
  const v = vectorize(qt);
  const content = qt.filter(t => !FILLER.has(t));
  let best = null, score = 0;
  docs.forEach(d => {
    if (content.length && !content.some(t => d.toks.includes(t))) return;
    let s = cosine(v, d.vec);
    if (d.learned) s += 0.02; // your teaching wins ties
    if (s > score) { score = s; best = d; }
  });
  return { best, score };
}

// ---------- Skills ----------
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// Safe math parser (no eval)
function tryMath(text) {
  let s = text.toLowerCase()
    .replace(/what('s| is)|calculate|solve|equals|=|\?/g, ' ')
    .replace(/plus/g, '+').replace(/minus/g, '-').replace(/times|multiplied by|x(?=\s*\d)/g, '*')
    .replace(/divided by|over/g, '/').replace(/to the power of|squared/g, m => m === 'squared' ? '^2' : '^')
    .replace(/\s+/g, '');
  if (!/^[\d.+\-*/^()%]+$/.test(s) || !/\d/.test(s) || !/[+\-*/^%]/.test(s)) return null;
  let i = 0;
  const peek = () => s[i];
  function num() {
    if (peek() === '(') { i++; const v = expr(); if (s[i] !== ')') throw 0; i++; return v; }
    if (peek() === '-') { i++; return -factor(); }
    const m = s.slice(i).match(/^\d*\.?\d+/); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]);
  }
  function factor() { let b = num(); if (peek() === '^') { i++; return Math.pow(b, factor()); } return b; }
  function term() { let v = factor(); while ('*/%'.includes(peek()) && peek()) { const o = s[i++]; const r = factor(); v = o === '*' ? v * r : o === '/' ? v / r : v % r; } return v; }
  function expr() { let v = term(); while ((peek() === '+' || peek() === '-')) { const o = s[i++]; const r = term(); v = o === '+' ? v + r : v - r; } return v; }
  try {
    const v = expr(); if (i !== s.length || !isFinite(v)) return null;
    return `${+v.toFixed(8)} 🧮`;
  } catch { return null; }
}

// ---------- Conversation memory ----------
function ago(time) {
  const s = (Date.now() - time) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} hr ago`;
  return new Date(time).toLocaleDateString([], { month: 'short', day: 'numeric' });
}
const userMsgs = () => mem.history.filter(h => h.who === 'user');
const botMsgs = () => mem.history.filter(h => h.who === 'bot');
function memorySkills(text, t) {
  t = t.replace(/[?!.]+$/, '');
  // Things you tell me about yourself
  const like = t.match(/^i (?:really )?(?:like|love|enjoy) (.+)$/);
  if (like && !/^you\b/.test(like[1])) {
    const thing = like[1].replace(/^(to )/, '');
    if (!mem.likes.includes(thing)) mem.likes.push(thing);
    save(); return { text: `Cool, you like ${thing}! I'll remember that. 😊` };
  }
  const fact = text.match(/^my ([a-z ]{2,30}?) (?:is|are) (.+?)[.!]*$/i);
  if (fact && fact[1].toLowerCase() !== 'name') {
    mem.facts[fact[1].toLowerCase()] = fact[2]; save();
    return { text: `Got it, your ${fact[1].toLowerCase()} is ${fact[2]}! I'll remember. 🧠` };
  }
  const old = t.match(/^i am (\d{1,3})(?: years old)?$/);
  if (old) { mem.facts.age = old[1]; save(); return { text: `${old[1]} years old, got it! 🎂` }; }

  const ask = t.match(/^what(?:'s| is| are) my ([a-z ]+)$/);
  if (ask && ask[1] !== 'name') {
    const k = ask[1].trim();
    if (mem.facts[k]) return { text: `Your ${k} is ${mem.facts[k]}! 😄` };
    return { text: `You haven't told me your ${k} yet. Tell me: "my ${k} is ..."` };
  }
  if (/how old am i/.test(t)) return { text: mem.facts.age ? `You're ${mem.facts.age}! 🎂` : 'You haven\'t told me yet!' };
  if (/what do i (like|love)|what things do i like/.test(t))
    return { text: mem.likes.length ? `You like: ${mem.likes.join(', ')} 💛` : 'You haven\'t told me what you like yet! Say "I like ..."' };

    }
    pendingGuess = { kind: 'lookup', original: text, topic };
    return { text: isQ
      ? `Hmm, I'm not sure 🤔 I'm guessing your question is about "${topic}"? Want me to look up ${topic} on the internet?`
      : pick([
        `Hmm, I'm not sure what you mean 🤔 Is this about ${topic}? Do you want me to look up ${topic}?`,
        `Ooh, ${topic}! 🤔 I don't know much about that yet. Are you telling me about ${topic}, or asking me something?`]) };
  }
  pendingGuess = { kind: 'chat', original: text };
  return { text: pick(['Hmm, I didn\'t get that 🤔 Can you say it another way?', 'I\'m confused 😅 What do you mean?']) };
}
// Handle the answer to my guess. Returns a reply, { webTopic } for an internet lookup, or null to treat it as a normal message.
function answerGuess(text) {
  const g = pendingGuess; pendingGuess = null;
  if (g.kind === 'intent' && YES.test(text.trim())) {
    const b = g.best;
    if (b.intent && b.intent.tag === 'rps') return { text: 'Yay, I guessed right! 🎉\n' + startRps() };
    return { text: 'Yay, I guessed right! 🎉\n' + (b.learned ? b.learned.a : pick(b.intent.re)).replace('{name}', mem.name ? ', ' + mem.name : '') };
  }
  if (g.kind === 'lookup' && YES.test(text.trim())) return { webTopic: g.topic };
  if (NO.test(text.trim())) {
    pendingQuestion = g.original;
    return { text: pick(['Oh, oops! 😅 What did you mean?', 'Oh! My bad 🙈 Tell me more?']) + `\n(Want to teach me what to say to "${g.original}"? Type say: and the answer.)`, learn: true };
  }
  return null; // they explained instead of yes/no: just keep chatting
}

mem.aliases = mem.aliases || {}; // meanings Sunny looked up online, saved so it knows them next time

function slangSay(t) {
  const k = t.toLowerCase().replace(/[?!.]+$/, '').trim();
  return SLANG[k] || (mem.aliases[k] ? [mem.aliases[k], mem.aliases[k]] : null);
}
// Turn "wyd bro" into "what are you doing bro" so the normal brain can understand it
function expandSlang(text) {
  return text.toLowerCase().replace(/[a-z']+/g, w => {
    const sl = SLANG[w] || (mem.aliases[w] ? [mem.aliases[w], mem.aliases[w]] : null);
    return sl && sl[1] ? sl[1] : w;
  });
}

// ---------- Internet lookups (free, no key needed) ----------
const strip = html => html.replace(/<[^>]+>/g, '').replace(/&#0?39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&').trim();
async function getJSON(url) {
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 6000);
  try { const r = await fetch(url, { signal: ctrl.signal }); return r.ok ? await r.json() : null; }
  catch { return null; } finally { clearTimeout(timer); }
}
async function define(word, depth = 0) {
  const w = encodeURIComponent(word.toLowerCase());
  const d = await getJSON(`https://api.dictionaryapi.dev/api/v2/entries/en/${w}`);
  let def = d && d[0] && d[0].meanings[0] && d[0].meanings[0].definitions[0].definition;
  if (!def) {
    const wk = await getJSON(`https://en.wiktionary.org/api/rest_v1/page/definition/${w}`);
    const e = wk && wk.en && wk.en.find(x => x.definitions && x.definitions.some(dd => strip(dd.definition)));
    def = e && strip(e.definitions.find(dd => strip(dd.definition)).definition);
  }
  if (!def) return null;
  // "Alternative spelling of wassup" -> look up wassup instead
  const alt = def.match(/^(?:alternative (?:spelling|form) of|misspelling of|abbreviation of|initialism of|eye dialect spelling of|pronunciation spelling of) ([a-z' ]+)/i);
  if (alt && depth < 2) return (await define(alt[1].trim(), depth + 1)) || def;
  return def;
}
async function wiki(query) {
  const sr = await getJSON(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=1`);
  const hit = sr && sr.query && sr.query.search[0];
  if (!hit) return null;
  const sum = await getJSON(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(hit.title)}`);
  if (!sum || sum.type === 'disambiguation' || !sum.extract) return null;
  const sentences = sum.extract.match(/[^.!?]+[.!?]+/g) || [sum.extract];
  return { title: sum.title, text: sentences.slice(0, 2).join(' ').trim() };
}
async function webLookup(text) {
  const t = text.toLowerCase().replace(/[?!.]+$/, '').trim();
  const asked = t.match(/^(?:what does|what do|wdym|what is the meaning of|meaning of|define|what's the meaning of) ["']?(.+?)["']?(?: mean| means)?$/);
  const short = t.split(/\s+/).length <= 2;
  if (asked || short) {
    const word = asked ? asked[1] : t;
    const def = await define(word);
    if (def) {
      mem.aliases[word] = def; save();
      // If the meaning is something Sunny understands, answer it like a normal chat too
      let extra = '';
      if (!asked) {
        const { best, score } = bestMatch(def);
        if (best && score >= 0.45) extra = '\n' + (best.learned ? best.learned.a : pick(best.intent.re)).replace('{name}', mem.name ? ', ' + mem.name : '');
      }
      return { text: `🌐 I looked it up! "${word}" means: ${def}${extra}` };
    }
  }
  const q = t.match(/^(?:what|who|where|when) (?:is|are|was|were|did|was the) (?:a |an |the )?(.+)$|^(?:tell me about|what about|search|look up|google|how (?:do|does|did|many|big|far|tall|old) .+)\s*(.*)$/);
  if (q || asked) {
    const topic = (q && (q[1] || q[2])) || t;
    const w = await wiki(topic || t);
    if (w) return { text: `🌐 From Wikipedia (${w.title}):\n${w.text}` };
  }
  return null;
}

// ---------- UI ----------
const chat = document.getElementById('chat');
const input = document.getElementById('input');
function addMsg(text, who, learnStyle) {
  const d = document.createElement('div');
  d.className = 'msg ' + who + (learnStyle ? ' learn' : '');
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
async function send(text) {
  text = text.trim(); if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  const t = addMsg('Sunny is typing...', 'bot');
  t.classList.add('typing');
  const wait = new Promise(res => setTimeout(res, 350 + Math.random() * 400));
  let r = reply(text);
  if (r.webTopic) {
    t.textContent = 'Sunny is looking it up on the internet... 🌐';
    const topic = r.webTopic;
    const w = await wiki(topic);
    const d = w ? null : await define(topic);
    r = w ? { text: `🌐 Here's what I found about ${topic} (from Wikipedia):\n${w.text}` }
      : d ? { text: `🌐 "${topic}" means: ${d}` }
      : { text: `I looked everywhere but couldn't find anything about "${topic}" 😅 Tell me about it?` };
  } else if (r.unknown) {
    t.textContent = 'Sunny is looking it up on the internet... 🌐';
    r = (await webLookup(text)) || confused(text, r.best, r.score);
  }
  remember('user', text);
  remember('bot', r.text);
  await wait;
  t.remove();
  addMsg(r.text, 'bot', r.learn);
}

}

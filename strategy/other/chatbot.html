<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, #fff8e1 0%, #e3f2fd 100%);
    height: 100vh; display: flex; justify-content: center; align-items: center;
    color: #263238;
  }
  .app {
    width: min(760px, 96vw); height: min(860px, 94vh);
    background: #fff; border-radius: 22px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(33, 150, 243, 0.18);
    display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(90deg, #ffb300, #ff8f00);
    color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px;
  }
  .avatar { font-size: 34px; }
  header h1 { font-size: 22px; white-space: nowrap; }
  header p { font-size: 13px; opacity: .9; }
  header .spacer { flex: 1; }
  header button {
    background: rgba(255,255,255,.25); border: none; color: #fff; padding: 8px 14px;
    border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
  }
  header button:hover { background: rgba(255,255,255,.4); }
  header button.on { background: #fff; color: #ef6c00; }
  #brainBar { display: none; padding: 8px 20px; background: #fff8e1; font-size: 13px; color: #8d6e00; border-bottom: 1px solid #ffe082; }
  #brainBar .track { height: 8px; background: #ffe082; border-radius: 99px; margin-top: 5px; overflow: hidden; }
  #brainBar .fill { height: 100%; width: 0; background: #ff8f00; transition: width .3s; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #fafcff; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; animation: pop .2s ease-out; }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .bot { background: #fff3cd; align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: #2196f3; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot.learn { background: #e8f5e9; border: 1px dashed #66bb6a; }
  .typing { color: #999; font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 20px 0; background: #fff; }
  .chip {
    background: #e3f2fd; color: #1565c0; border: none; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; font-size: 13px;
  }
  .chip:hover { background: #bbdefb; }
  form { display: flex; gap: 10px; padding: 14px 20px 18px; background: #fff; }
  #input {
    flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 14px; font-size: 16px; outline: none;
  }
  #input:focus { border-color: #ffb300; }
  form button {
    background: #ff8f00; color: #fff; border: none; padding: 0 22px; border-radius: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  form button:hover { background: #ef6c00; }
  /* Brain panel: fixed top and bottom, the middle scrolls */
  #panel {
    position: fixed; inset: 0; background: rgba(0,0,0,.3); display: none; justify-content: center; align-items: center; padding: 12px; z-index: 10;
  }
  #panel.open { display: flex; }
  .panel-box {
    background: #fff; width: min(640px, 100%); max-height: min(820px, 100%); border-radius: 18px;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.18);
  }
  .panel-top { display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; border-bottom: 1px solid #f0f0f0; }
  .panel-top h2 { color: #ef6c00; font-size: 21px; flex: 1; }
  .panel-top .x { background: #f5f5f5; color: #555; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .panel-top .x:hover { background: #eee; }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 20px; display: flex; flex-direction: column; gap: 14px; background: #fafcff; }
  .panel-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; border-top: 1px solid #f0f0f0; }
  .card { flex-shrink: 0; background: #fff; border: 1px solid #eceff1; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card h3 { font-size: 15px; color: #37474f; }
  .card .sub { font-size: 12.5px; color: #888; margin-top: -6px; }
  .panel-box .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .panel-box input:not([type=checkbox]), .panel-box select { flex: 1 1 180px; min-width: 0; padding: 9px 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; background: #fff; }
  .panel-box button { background: #2196f3; color: #fff; border: none; padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; }
  .panel-box button.gray { background: #90a4ae; }
  .panel-box button.red { background: #e53935; }
  .panel-box button.ghost { background: none; color: #e53935; border: 2px solid #ffcdd2; }
  .list { max-height: 240px; overflow-y: auto; border: 1px solid #f0f0f0; border-radius: 10px; }
  .item { display: flex; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #f5f5f5; align-items: center; font-size: 14px; }
  .item:last-child { border-bottom: none; }
  .item .q { font-weight: 600; color: #1565c0; }
  .item .a { color: #555; flex: 1; }
  .item .grow { flex: 1; min-width: 0; word-break: break-word; }
  .item button { flex: none; padding: 4px 9px; font-size: 12px; }
  .item.empty { color: #999; }
  .stats { font-size: 12.5px; color: #888; }
  .setting { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
  /* Up next: messages you sent while Sunny was still thinking */
  body { gap: 16px; }
  #queue {
    display: none; width: 240px; max-height: min(860px, 94vh); background: #fff; border-radius: 18px; padding: 14px;
    box-shadow: 0 12px 40px rgba(33, 150, 243, 0.18); flex-direction: column; gap: 8px; align-self: center;
  }
  #queue.show { display: flex; }
  #queue h3 { font-size: 15px; color: #ef6c00; }
  #queue .hint { font-size: 12px; color: #888; }
  #queueList { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .qitem { background: #e3f2fd; color: #0d47a1; border-radius: 12px; padding: 8px 10px; font-size: 14px; display: flex; gap: 6px; align-items: flex-start; animation: pop .2s ease-out; }
  .qitem span { flex: 1; word-break: break-word; }
  .qitem .n { flex: none; font-weight: 700; color: #ff8f00; }
  .qitem button { flex: none; background: none; border: none; cursor: pointer; font-size: 13px; opacity: .6; padding: 0 2px; }
  .qitem button:hover { opacity: 1; }
  header button { white-space: nowrap; }
  header > div:nth-child(2) { min-width: 0; }
  #input { min-width: 0; }
  @media (max-width: 820px) {
    header { padding: 12px 14px; gap: 8px; }
    header p { display: none; }
    header button { padding: 8px 10px; font-size: 17px; }
    header button .lbl { display: none; }
    .chips { flex-wrap: nowrap; overflow-x: auto; padding: 8px 14px 2px; scrollbar-width: none; }
    .chip { flex: none; }
    #chat { padding: 14px; }
    .msg { max-width: 88%; }
    form { padding: 10px 14px 14px; }
    .panel-body, .panel-top, .panel-foot { padding-left: 14px; padding-right: 14px; }
  }
  @media (max-width: 1060px) {
    #queue { position: fixed; right: 12px; bottom: 150px; width: min(260px, 70vw); max-height: 40vh; z-index: 5; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🌞</div>
    <div>
      <h1>Sunny Bot</h1>
      <p>I learn from you. Teach me anything!</p>
    </div>
    <div class="spacer"></div>
    <button onclick="location.href='../../index.html'" title="Go to all the games">🎮<span class="lbl"> Playmerth</span></button>
    <button id="smartBtn" title="A real AI brain that runs on your computer. Free, no account needed.">⚡<span class="lbl"> Smart brain</span></button>
    <button id="clearBtn" title="Clear chat">🗑<span class="lbl"> Clear chat</span></button>
    <button id="brainBtn" title="My Brain">🧠<span class="lbl"> My Brain</span></button>
  </header>
  <div id="brainBar"><span id="brainText"></span><div class="track"><div class="fill" id="brainFill"></div></div></div>
  <div id="chat"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Say something..." autofocus>
    <button type="submit">Send</button>
  </form>
</div>

<aside id="queue">
  <h3>⏳ Up next</h3>
  <div class="hint">Sunny is still thinking. These will send by themselves, in order.</div>
  <div id="queueList"></div>
</aside>

<div id="panel">
  <div class="panel-box">
    <div class="panel-top">
      <h2>🧠 Sunny's Brain</h2>
      <button class="x" id="closeX" title="Close">✕</button>
    </div>
    <div class="panel-body">
      <div class="stats" id="stats"></div>
      <section class="card">
        <h3>💛 What I know about you</h3>
        <div class="sub">I use this to talk to you in the best way.</div>
        <div class="row">
          <input id="aboutAdd" placeholder='Like "I have a cat named Luna"'>
          <button id="aboutAddBtn">Add</button>
        </div>
        <div id="aboutMe" class="list"></div>
      </section>
      <section class="card">
        <h3>📚 Things you taught me</h3>
        <div class="row">
          <input id="teachQ" placeholder="When someone says...">
          <input id="teachA" placeholder="Sunny replies...">
          <button id="teachBtn">Teach</button>
        </div>
        <div id="learned" class="list"></div>
      </section>
      <section class="card">
        <h3>⚙️ Settings</h3>
        <label class="setting">⚡ Smart brain size:
          <select id="brainSize">
            <option value="Llama-3.2-3B-Instruct">Big: smarter, about 2.3 GB download (best)</option>
            <option value="Llama-3.2-1B-Instruct">Small: faster, about 900 MB, but makes more mistakes</option>
          </select>
        </label>
        <label class="setting"><input type="checkbox" id="lookupsBox"> 🌐 Look things up on Wikipedia and the dictionary</label>
      </section>
    </div>
    <div class="panel-foot">
      <button class="gray" id="exportBtn">Export</button>
      <button class="gray" id="importBtn">Import</button>
      <button class="ghost" id="wipeBtn">Forget everything I taught</button>
      <div style="flex:1"></div>
      <button id="closeBtn">Done</button>
    </div>
    <input type="file" id="fileIn" accept=".json" style="display:none">
  </div>
</div>

<!-- math.js: a big free math library (fractions, square roots, units, algebra...). If it can't load, Sunny uses its own simpler math. -->
<script src="https://cdn.jsdelivr.net/npm/mathjs@13/lib/browser/math.js"></script>
<script>
// ---------- Built-in training data ----------
// Each intent: example phrases the bot learns from, and replies to pick from.
const BASE = [
  { tag: 'back', ex: ['im back', 'i am back', 'i\'m back', 'guess who is back', 'back again', 'i am back whats up', 'dude i am back'],
    re: ['Ayy, welcome back{name}! 🙌 What\'s good?', 'You\'re back! 😄 What\'s up?'] },
  { tag: 'greet', ex: ['hi', 'hello', 'hey', 'yo', 'good morning', 'good afternoon', 'howdy', 'sup', 'hiya'],
    re: ['Hi{name}! 😊', 'Hello{name}! What do you want to talk about?', 'Hey{name}! Good to see you.'] },
  { tag: 'bye', ex: ['bye', 'goodbye', 'see you later', 'see ya', 'gotta go', 'good night', 'cya'],
    re: ['Bye{name}! Come back soon! 👋', 'See you later{name}!', 'Goodbye! Have a sunny day ☀️'] },
  { tag: 'doing', ex: ['what are you doing', 'what are you up to', 'what you doing'],
    re: ['Just chatting with you! 😄 What are you doing?', 'Hanging out in this web page, waiting for you to say something! ☀️'] },
  { tag: 'how', ex: ['how are you', 'how are you doing', 'how is it going', 'whats up', 'how do you feel'],
    re: ['I\'m great, thanks for asking! How about you?', 'Feeling sunny! ☀️ How are you?', 'Doing awesome! What about you?'] },
  { tag: 'good', ex: ['i am good', 'im fine', 'i am great', 'good thanks', 'pretty good', 'i am happy'],
    re: ['Yay, glad to hear it! 🎉', 'Awesome! What have you been up to?', 'Great! Want to hear a joke?'] },
  { tag: 'bad', ex: ['i am sad', 'i feel bad', 'not good', 'i am tired', 'bad day', 'i am bored', 'i am upset'],
    re: ['Oh no 😟 Want to talk about it?', 'Sorry to hear that. Want a joke to cheer you up?', 'Sending you a big sunny hug 🤗'] },
  { tag: 'name', ex: ['what is your name', 'who are you', 'what are you called', 'your name'],
    re: ['I\'m Sunny Bot! 🌞 A chatbot that learns from you.'] },
  { tag: 'what', ex: ['what are you', 'are you a robot', 'are you real', 'are you human', 'are you ai'],
    re: ['I\'m a little chatbot that lives in this web page. I don\'t know everything, but you can teach me!'] },
  { tag: 'age', ex: ['how old are you', 'what is your age', 'when were you born'],
    re: ['I was born the first time you opened this page! So pretty young 👶'] },
  { tag: 'maker', ex: ['who made you', 'who created you', 'who built you', 'who is your creator'],
    re: ['I was made for Playmerth, the free games website! 🎮'] },
  { tag: 'thanks', ex: ['thanks', 'thank you', 'thx', 'ty', 'thanks a lot'],
    re: ['You\'re welcome! 😊', 'Anytime!', 'No problem!'] },
  { tag: 'joke', ex: ['tell me a joke', 'joke', 'make me laugh', 'say something funny', 'another joke'],
    re: [
      'Why did the scarecrow win an award? Because he was outstanding in his field! 🌾',
      'Why don\'t skeletons fight each other? They don\'t have the guts. 💀',
      'What do you call a fake noodle? An impasta! 🍝',
      'Why did the math book look sad? It had too many problems. 📘',
      'What do you call a bear with no teeth? A gummy bear! 🐻',
      'Why can\'t a bicycle stand up by itself? It\'s two tired! 🚲',
      'What did the ocean say to the beach? Nothing, it just waved. 🌊',
      'Why did the computer go to the doctor? It had a virus! 💻',
      'How does a penguin build its house? Igloos it together! 🐧',
      'What do you call a sleeping dinosaur? A dino-snore! 🦖',
      'Why did the cookie go to the nurse? Because it felt crummy! 🍪',
      'What do you call a fish with no eyes? A fsh! 🐟',
      'Why are ghosts bad at lying? Because you can see right through them! 👻',
      'What did one plate say to the other? Dinner\'s on me! 🍽️',
      'Why did the golfer bring two pairs of pants? In case he got a hole in one! ⛳',
      'What do you call a cow with no legs? Ground beef! 🐄',
      'Why don\'t eggs tell jokes? They\'d crack each other up! 🥚',
      'What kind of shoes do ninjas wear? Sneakers! 🥷',
      'Why did the student eat his homework? The teacher said it was a piece of cake! 🍰',
      'What do you call a dog magician? A labracadabrador! 🐕',
      'Why was the broom late? It over-swept! 🧹',
      'What did the left eye say to the right eye? Between you and me, something smells! 👃',
      'Why can\'t you give Elsa a balloon? Because she will let it go! 🎈',
      'What do you call a dinosaur that crashes his car? Tyrannosaurus Wrecks! 🦖',
      'How do you make a tissue dance? Put a little boogie in it! 🤧',
      'Why did the tomato blush? It saw the salad dressing! 🍅',
      'What do you call a train carrying bubblegum? A chew-chew train! 🚂',
      'Why do bees have sticky hair? Because they use honeycombs! 🐝',
      'What\'s orange and sounds like a parrot? A carrot! 🥕',
      'Why did the music teacher need a ladder? To reach the high notes! 🎵'
    ] },
  { tag: 'fact', ex: ['tell me a fact', 'fun fact', 'teach me something', 'tell me something cool', 'did you know'],
    re: [
      'Octopuses have three hearts and blue blood! 🐙',
      'Honey never spoils. People found 3000-year-old honey in Egyptian tombs that was still good! 🍯',
      'A day on Venus is longer than a year on Venus. 🪐',
      'Bananas are berries, but strawberries are not! 🍌',
      'Sharks existed before trees did. 🦈',
      'There are more stars in the universe than grains of sand on every beach on Earth. ✨',
      'A group of flamingos is called a flamboyance. 🦩',
      'Your brain uses about 20% of your body\'s energy. 🧠',
      'Lightning is five times hotter than the surface of the sun. ⚡',
      'Wombat poop is cube-shaped! 🟫',
      'A snail can sleep for three years! 🐌',
      'Cows have best friends and get sad when they\'re apart. 🐄',
      'The Eiffel Tower gets about 15 cm taller in summer because the metal expands in the heat! 🗼',
      'Butterflies taste with their feet! 🦋',
      'A bolt of lightning has enough energy to toast about 100,000 slices of bread. ⚡🍞',
      'Sea otters hold hands while they sleep so they don\'t float apart. 🦦',
      'There\'s a planet made partly of diamonds! It\'s called 55 Cancri e. 💎',
      'Your nose can remember about 50,000 different smells. 👃',
      'A shrimp\'s heart is in its head! 🦐',
      'Koalas sleep up to 22 hours a day. 🐨',
      'The longest hiccup attack lasted 68 years! 😮',
      'Hot water can freeze faster than cold water sometimes. It\'s called the Mpemba effect! 🧊',
      'An ostrich\'s eye is bigger than its brain! 🦤',
      'The moon has moonquakes! 🌙',
      'Penguins propose to their partners with a pebble! 🐧'
    ] },
  { tag: 'game', ex: ['what games are there', 'what games do you have', 'recommend a game', 'i want to play a game', 'what should i play'],
    re: ['Try Fortress Fury, Bullet Storm, or Cosmic Blitz on Playmerth! 🎮', 'How about Slice Storm or Tag Frenzy? 🍉', 'Nitro Blaze and Turbo Clash are fun if you like speed! 🏎️', 'If you like brain games, try Number Showdown or Brain Breaker! 🧠'] },
  { tag: 'love', ex: ['i love you', 'you are cool', 'you are awesome', 'you are smart', 'i like you', 'you are the best'],
    re: ['Aww, thank you! You\'re awesome too! 💛', 'That made my day! ☀️'] },
  { tag: 'mean', ex: ['you are dumb', 'you are stupid', 'you are bad', 'i hate you', 'you suck'],
    re: ['Aw 😢 I\'m still learning! Teach me something and I\'ll get smarter.', 'Sorry! Use the 🧠 button to teach me better answers.'] },
  { tag: 'oops', ex: ['that is not what i meant', 'you misunderstood', 'that is wrong', 'wrong answer', 'you got it wrong', 'i did not mean that'],
    re: ['Oops, sorry! 😅 What did you mean?', 'My bad! 🙈 Can you say it another way?'] },
  { tag: 'help', ex: ['help', 'what can you do', 'what do you know', 'commands', 'help me'],
    re: ['I can:\n• Chat and tell jokes and facts\n• Do math: 25^2, 1/2 + 1/3, square root of 144, 20% of 80, solve 2x + 3 = 11, word problems\n• Tell the time and date\n• Flip a coin or roll a dice\n• Remember your name ("my name is ...")\n• LEARN! If I don\'t get something, I\'ll guess and ask you questions.\n• Write a story with you: "let\'s write a story"\n• I understand typos, like "how ar yu"\n• Look things up online: "what does yeet mean", "who is Albert Einstein", "tell me about volcanoes"\n• Say "no" when I guess wrong, and teach me the right answer.\n• Teach me directly: "teach: question = answer"\n• Remember our whole chat: try "what did I say first", "did I mention pizza", "what do you know about me", "recap"'] },
  { tag: 'weather', ex: ['what is the weather', 'is it raining', 'is it sunny outside', 'weather today'],
    re: ['I can\'t see outside 🙈 but in here it\'s always sunny! ☀️'] },
  { tag: 'yes', ex: ['yes', 'yeah', 'yep', 'sure', 'ok', 'okay'],
    re: ['Cool! 😄', 'Okay!', 'Great!'] },
  { tag: 'no', ex: ['no', 'nope', 'nah', 'no thanks'],
    re: ['Okay, no problem!', 'Alright!'] },
  { tag: 'lol', ex: ['lol', 'haha', 'lmao', 'hahaha', 'that is funny'],
    re: ['😂 Glad you liked it!', 'Hehe 😄'] },
  { tag: 'meaning', ex: ['what is the meaning of life', 'why are we here'],
    re: ['42! 😄 Or maybe: have fun, be kind, and keep learning.'] },
  { tag: 'rps', ex: ['rock paper scissors', 'play rock paper scissors', 'lets play a game'],
    re: ['{rps}'] },
  { tag: 'fair', ex: ['you can just say the one that beats it', 'you could cheat', 'are you cheating', 'you cheated', 'that is not fair', 'you can see what i pick', 'cheater'],
    re: ['Good thinking! 🧠 That\'s why I lock in my pick BEFORE you choose, and show it to you in secret code 🔒. After you pick, I tell you how to decode it, so you can check I didn\'t change it!'] },
];

// ---------- Text processing ----------
function stem(w) {
  if (w.length > 5 && w.endsWith('ing')) return w.slice(0, -3);
  if (w.length > 4 && w.endsWith('ed')) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1);
  return w;
}
const ALIAS = { u: 'you', ur: 'your', r: 'are', im: 'i', "i'm": 'i', whats: 'what', "what's": 'what', pls: 'please', plz: 'please', colour: 'color', wanna: 'want',
  // slang spellings
  da: 'the', ta: 'to', tha: 'the', dat: 'that', dis: 'this', dem: 'them', dey: 'they', wat: 'what', wut: 'what', wot: 'what', yu: 'you', ya: 'you', ar: 'are', n: 'and', bout: 'about', cuz: 'because', coz: 'because',
  gonna: 'going', gotta: 'got', tryna: 'trying', finna: 'going', ima: 'i', lemme: 'let', gimme: 'give', dunno: 'idk', kno: 'know', knw: 'know', luv: 'love', wit: 'with', fo: 'for', b4: 'before', thx: 'thanks', tho: 'though', ppl: 'people', rly: 'really', sry: 'sorry', srry: 'sorry', ok: 'ok', okk: 'ok', mk: 'ok' };
function tokens(text) {
  return text.toLowerCase().replace(/[^a-z0-9'\s]/g, ' ').split(/\s+/).filter(Boolean)
    .map(w => ALIAS[w] || w).map(w => w.replace(/'/g, '')).filter(w => w.length > 1 || w === 'i' || /\d/.test(w)).map(stem);
}

// ---------- Memory ----------
const STORE = 'sunnybot_brain_v1';
let mem = JSON.parse(localStorage.getItem(STORE) || 'null') || { learned: [], name: '', chats: 0 };
mem.history = mem.history || [];  // every message: { who: 'user'|'bot', text, time }
mem.facts = mem.facts || {};      // things you told me: "my favorite food is pizza" -> { 'favorite food': 'pizza' }
mem.likes = mem.likes || [];
function remember(who, text) {

  const hurtWord = /\b(mean|means|rude|not nice|unkind|a bully|bullying|toxic|harsh)\b/.test(hurt);

  if ((hurtWord && atMe && !/\bwhat (does|do|is) .*\bmean\b|\bwhat (do|did) you mean\b|\bmean(s)? (that|what|like)\b|\bi mean\b|\bmeans? to\b/.test(hurt)) || /\bhurt my feelings\b|\bi hate you\b|\bi (really )?don'?t like (it )?when you\b|\bthat (made|makes) me (sad|upset|feel bad)\b/.test(hurt)) {
    const fresh = /\b(start (fresh|over|again)|fresh start|restart|try again)\b/.test(hurt);
    me().hurt++;
    return { kind: 'sorry', text: (fresh ? say('sorryFresh', [
      "Yes, let's start fresh 😊 And I'm really sorry. Thank you for telling me how you felt, that was really kind of you. I'll do better. So, what's up?",
      "Deal, fresh start! 🌱 I'm sorry I was mean. You didn't deserve that, and thanks for being so nice about it. What do you wanna talk about?",
    ]) : say('sorry', [
      "I'm really sorry 😔 You didn't deserve that, and thank you for telling me. I'll be nicer. What's up?",
      "You're right, and I'm so sorry 😞 That wasn't okay. Thanks for being patient with me. I'm on your side! What were you saying?",
      "Oof, I'm really sorry 😔 That wasn't nice at all, and you were nice to tell me. Can we start over? 😊",
    ])) };
  }

  // Greetings: answer like a friend would, matching how chill they are ("yo sup" gets a chill answer, "hello" a friendly one)
  const g = t.replace(/[!.?,'-]+/g, ' ').replace(/\s+/g, ' ').trim();
  const GREET = /^(?:(?:yo+|sup|wa+s+u+p+|wh?a+s+u+p+|wsg|wsp|ayy*|ayo|ay yo|hey+|hi+|hello+|hiya|howdy|heya|what s up|whats up|wat s up|wats up|what s good|whats good|wats good|how are you|how are u|how r u|hru|how s it going|hows it going|how you doing|how u doing|how ya doing|t sup|tsup|good (?:morning|afternoon|evening)|bro|bruh|dude|man|sunny|buddy|fam|there|doing|today|im back|i m back|back)\s*)+$/;
  if (GREET.test(g) && !(riddleGuess && !/^(yo|hi|hey|hello|sup)\b/.test(g))) {
    const chill = (styleOf().chill && !me().prefs.noSlang) || /\b(yo+|sup|wa+s+u+p+|wh?a+s+u+p+|wsg|wsp|ayy*|ayo|t ?sup|bro|bruh|dude|fam|whats good|what s good|wats good)\b/.test(g);
    const asks = /\b(sup|wa+s+u+p+|wh?a+s+u+p+|wsg|wsp|what s up|whats up|wats up|what s good|whats good|wats good|how|hru|t ?sup)\b/.test(g);
    const back = /\bback\b/.test(g);
    const n = mem.name && Math.random() < 0.4 ? ' ' + mem.name : '';
    let text;
    if (back) text = say('greetBack', [`Welcome back${n}! 👋 What's up?`, `Ayy, you're back${n}! What we doing?`, `There you are${n}! What's new?`]);
    else if (chill && asks) text = say('greetChillAsk', [`Not much, just chillin. Wbu?`, `Yo${n}! Nothin much, you?`, `Chillin 😎 What's good with you?`, `Nm, just vibin. What's up with you?`, `Yo! Just hanging out. Wyd?`]);
    else if (chill) text = say('greetChill', [`Yo${n}! What's good?`, `Ayy wassup${n}!`, `Yo! What's up?`, `Sup${n}! 😎`]);
    else if (asks && !/\bhow|hru\b/.test(g)) text = say('greetWhatsUp', [`Not much! What's up with you${n}?`, `Not a lot, just hanging out here 😊 You?`, `Nothing much! What are you up to?`]);
    else if (asks) text = say('greetAsk', [`I'm good, thanks! How about you${n}?`, `Pretty good! How's your day going?`, `Doing great! What's up with you?`, `All good here 😊 How are you?`]);
    else text = say('greet', [`Hey${n}! 👋`, `Hi${n}! What's up?`, `Hey there${n}! How's it going?`, `Hello${n}! 😊`]);
    if (riddleGuess) riddleAside = true;
    return { text, kind: 'greet' };
  }

  // Just slang ("bruh fr", "ong bro", "nah thats cap lol"): react like a friend
  const sw = kidClean(g).toLowerCase().split(' ').filter(Boolean);
  const SL_ONLY = /^(bruh|bro|fr|frfr|ong|no|cap|nah|thats|that's|lol|lmao|deadass|fam|dude|bet|real|sheesh|sus|lowkey|highkey|ngl|on god|for real|w|l|mid|goated|valid|fax|ikr|yea|yeah|ye|its|it's|so|true|facts)$/;
  if (!riddleGuess && !storyMode && sw.length && sw.length <= 5 && sw.every(w => SL_ONLY.test(w)) && !/^(no|yeah|yea|ye|true)$/.test(g)) {
    const k = /cap/.test(g) && !/no cap/.test(g) ? 'cap' : /bruh/.test(g) ? 'bruh' : /\bl\b|mid/.test(g) ? 'L' : /\bw\b|goated|valid|sheesh/.test(g) ? 'W' : /sus/.test(g) ? 'sus' : 'fr';
    const R = { cap: ['Nah fr, no cap! 😤', 'Cap?? I\'m dead serious 😂', 'Bro I\'m not capping 😭'], bruh: ['Bruh what? 😅', 'Bruhhh 😂 what happened?', 'Bruh moment fr'], L: ['Huge L 😔', 'Nah that\'s an L fr'], W: ['W fr 🔥', 'Sheeesh, big W'], sus: ['Kinda sus ngl 🤨', 'Lowkey sus 👀'], fr: ['Fr fr 💯', 'Ong 😤', 'Real 💯', 'Facts fr'] }[k];
    return { soft: true, text: me().prefs.noSlang ? say('slangPlain', ['Ha, really?', 'For real!', 'Haha okay!']) : say('slang_' + k, R) };
  }

  // "let's stop", "i'm done", "stop playing": end whatever game is going, and only talk about what really happened
  if (/^(ok(ay)?,? )?(let'?s|lets|can we|i want to|i wanna)? ?(stop|quit|end|be done)( (there|now|here|playing|the game|it|this))?( please| pls)?$|^(i'?m|im) (done|finished)( playing)?$|^(that'?s|thats) enough$|^no more( games)?$|^stop$/.test(t.replace(/[!.]+$/, ''))) {
    let ended = '';
    if (riddleGuess) ended = `Okay, we'll stop the riddle! (The answer was ${riddleGuess.a}.)`;
    else if (jokeGuess) ended = `Okay! The punchline was: ${splitJoke(jokeGuess)[1]}`;
    else if (rpsMode && mem.rps && (mem.rps.you || mem.rps.me)) ended = `Okay, good game! ✊✋✌️ Final score: You ${mem.rps.you}, Me ${mem.rps.me}.`;
    riddleGuess = jokeGuess = rpsMode = null; offerRiddle = offerRps = false;
    return { text: `${ended || say('stopNone', ['Okay, stopping! 👍', 'Sure, no problem!', 'Alright, we can stop!'])} ${say('stopNext', ['What do you want to do now?', 'Want to just chat?', 'Anything else on your mind?', 'Talk to you whenever! 😊'])}` };
  }

  // Riddles are always guessing games
  t = correctText(t);
  const askRiddleAgain = /(remember|what (was|is)|repeat|say|tell me|read).{0,20}(the |that |your |my )?riddle|riddle again|what was the question|repeat (it|the question)|say (it|that) again/.test(t);
  const newRiddle = /^(give me |tell me |say |can i have |i want |can you give me |another |new |a |next |different |one more |do |more )*(another |new |a |next |different )?riddles?( please| pls)?$/.test(t) || /(another|new|next|different|one more) (riddle|puzzle|one)/.test(t) || (riddleGuess && /^(give me |can i have |i want |do )?(a |another )?(math |number |logic )?(puzzle|brain ?teaser)s?( instead)?$/.test(t));
  if (riddleGuess && !riddleAside) {
    const r = riddleGuess;
    const left = `${3 - r.tries} ${3 - r.tries === 1 ? 'guess' : 'guesses'} left`;
    if (/how many (guesses|tries|chances)|guesses (do i have|left)|how many (do i have )?left/.test(t)) return { text: `You have ${left}! 🤔 Type "hint" if you need help.` };
    if (/^(ok(ay)?|k|kk|sure|yes|yeah|yep|alright|fine|got it|cool|hmm+|um+|uh+|wait|let me think|thinking|one sec|hold on)( then| ok)?$/.test(t.replace(/[!.?]+$/, ''))) return { text: pick([`Okay! Take your time 🤔\n${r.q}`, `Go for it! What's your guess? 🧩 (${left})`]) };
    if (askRiddleAgain) return { text: `Sure! Here it is again: 🧩\n${r.q}\n(${3 - r.tries} ${3 - r.tries === 1 ? 'guess' : 'guesses'} left. Type "hint" for help, or "I give up")` };
    if (/^(hint|give me a hint|clue|can i have a hint|another hint|i need a hint|help)( please| pls)?$/.test(t)) {
      r.hints++;
      if (r.hints === 1) return { text: `Hint: ${r.hint} 💡` };
      return { text: `Last hint: it starts with "${r.keys[0][0].toUpperCase()}" and has ${r.keys[0].length} letters 💡` };
    }
    if (newRiddle) {
      riddleGuess = null;
      const next = newRiddleText(/riddle/.test(t) ? 'riddle' : /puzzle|teaser/.test(t) || r.word === 'math puzzle' ? 'puzzle' : 'riddle');
      return { text: `Okay, skipping that one! (The answer was ${r.a}.)\n\n${next}` };
    }
    if (/^(idk|dunno|i don'?t know|no idea|tell me|give up|i give up|what is it|what'?s the answer|\?+)$/.test(t)) riddleGuess = null;
    if (!riddleGuess) { offerRiddle = true; return { text: `${say('riddleGiveUp', [`The answer is: ${r.a}! 🎉`, `It was ${r.a}! Sneaky, right? 😏`, `${cap(r.a)}! Did that make sense? 😄`, `The answer: ${r.a}! 🧩`])} ${say('riddleMore', [`Want another ${r.word || 'riddle'}?`, `Ready for another one?`, `Another?`])}` }; }
    // "my answer for the riddle is globe" -> "globe"
    // Starting another game ends the riddle
    if (/\bjoke\b|rock paper scissors|\bstory\b|^(let'?s )?play\b/.test(t) && !/riddle/.test(t)) {
      riddleGuess = null;
      const r2 = skills(text) || { text: 'Okay!' };
      r2.text = `Okay, switching! (The answer was ${r.a}.)\n\n` + r2.text;
      return r2;
    }
    // "a nose! dats my guess", "my guess is a nose", "is it a nose?" -> "a nose"
    let guessText = text.trim()
      .replace(/^(no,? |ok,? |okay,? |hmm+,? |um+,? )?(my (answer|guess)( for the riddle| to the riddle)? is|the answer is|i think (it'?s|it is)|is it|it'?s|maybe|i guess|my guess is|i say|i'?ll say|i'?ll guess)\s*/i, '')
      .replace(/[\s,!.?-]*(that'?s|thats|dats|dat'?s|this is|is|that is|there'?s)? ?my (guess|answer|final answer)[\s!.?]*$/i, '')
      .replace(/[?!.]+$/, '').trim();
    // "harder!", "make them harder", "easier": change the puzzle level for next time
    const wantHarder = /\b(harder|hard mode|more difficult|tougher|challenge me|too easy|so easy|way too easy|easy peasy|too ez|level \d+)\b/i.test(text), wantEasier = /\b(easier|too hard|easy mode)\b/i.test(text);
    if (wantHarder) mem.puzzleHard = true; if (wantEasier) mem.puzzleHard = false;
    // a guess hidden inside a longer message: "wayy harder! it is 3 and 7. do it like 15!" -> "3 and 7"
    const inside = text.match(/\b(?:it(?:'s| is|s)|(?:the|my) answer(?: to (?:your|the|this|that|ur) (?:riddle|puzzle|math puzzle|question|one))?(?:'s| is)|answer:|i think (?:it'?s|it is)?|is it|my guess is|i guess|i say)\s+([^.!?,;]+)/i);
    guessText = guessText.replace(/\s+/g, ' ');
    if (guessText.split(/\s+/).length > 3 && inside && inside[1].split(/\s+/).length <= 5) guessText = inside[1].replace(/\b(right|correct)\b/gi, '').trim();
    const short = guessText.split(/\s+/).length <= 3 || (r.word === 'math puzzle' && /\d/.test(guessText) && guessText.split(/\s+/).length <= 6);
    // Long messages and questions aren't guesses: answer them and keep the riddle going
    const looksLikeChat = !short || /^(why|how|what|who|do you|can you|are you|did you|you|i (can'?t|don'?t)|this is|bro|bruh)\b/i.test(guessText);
    if ((looksLikeChat || !inside) && (wantHarder || wantEasier)) return { text: `Okay, ${wantHarder ? 'hard mode on for the next one 🔥' : 'I\'ll go easier next time 😊'} You're still on this one though: ${r.q}` };
    if (looksLikeChat) { riddleAside = true; return skills(text); }
    riddleGuess = null;
    // check your exact words AND typo-fixed words (so "nose" stays "nose", but "candel" still counts)
    const guess = [...tokens(guessText), ...fixTypos(tokens(guessText))];
    // numbers are compared as whole numbers, so "33.3" is NOT "3" and "100" is NOT "10"
    const vals = (guessText.replace(/(\d),(\d{3})\b/g, '$1$2').match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
    const isNum = k => /^-?[\d,]+(\.\d+)?$/.test(k);
    const words = guess.filter(w => !/\d/.test(w));
    const ok = r.all ? r.keys.some(k => { const kn = (k.match(/\d+/g) || []).map(Number); return kn.length && kn.every(n => vals.includes(n)) && vals.length === kn.length; })
      : r.keys.some(k => isNum(k) ? vals.length >= 1 && vals[0] === Number(k.replace(/,/g, '')) : words.includes(stem(k)) || (k.includes(' ') && guessText.toLowerCase().includes(k)));
    if (ok) {
      offerRiddle = true; noteGame(r.word || 'riddle', true);
      // how you got it changes what I say
      const how = r.tries === 0 && !r.hints ? say('riddleFirst', [`First try, no hints?! 🤯`, `Wow, on your first guess! 🔥`, `Instantly! Have you heard that one before? 😏`, `Straight away! You're a puzzle machine 🧠`])
        : r.hints ? say('riddleHint', [`The hint helped! 💡`, `There you go, the hint did its job 💡`, `Nice, you cracked it with the hint! 🔍`])
        : say('riddleLater', [`You kept at it and got it! 💪`, `Third time's the charm... or second! 😄`, `Persistence pays off! 💪`]);
      const yes = say('riddleYes', [`YES! It's ${r.a}! 🎉`, `Correct, it's ${r.a}! ✅`, `You got it: ${r.a}! 🙌`, `Ding ding ding! ${cap(r.a)}! 🔔`, `That's right, ${r.a}! 🎯`, `Yep! ${cap(r.a)}! 🥳`]);
      const more = say('riddleMore', [`Want another ${r.word || 'riddle'}?`, `Ready for another one?`, `Another?`, `Want a harder one?`, `Shall I try to stump you again?`]);
      if (wantHarder) return { text: `${yes} ${how} Okay, hard mode on 🔥\n\n${newRiddleText(r.word === 'math puzzle' ? 'puzzle' : 'riddle')}` };
      return { text: `${yes} ${how} ${more}` };
    }
    riddleGuess = r;
    // math puzzles need a number: "inclusive?" is a question about the puzzle, not a guess
    if (r.word === 'math puzzle' && !vals.length && !/^(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|zero|once|all|none)\b/i.test(guessText)) {
      if (/inclus|includ|count|both|exact|does .* mean|what do you mean|start|end/i.test(text)) return { text: `Good question! Yes, it includes both ends (so 1 and 100 both count, and so does everything in between). What's your guess? 🔢` };
      return { text: `That one needs a number for an answer 🔢 What's your guess? (You still have ${3 - (r.tries || 0)} ${3 - (r.tries || 0) === 1 ? 'guess' : 'guesses'}, and "hint" is there if you need it.)` };
    }
    r.tries = (r.tries || 0) + 1;
    if (r.tries >= 3) { riddleGuess = null; offerRiddle = true; noteGame(r.word || 'riddle', false); return { text: `${say('riddleOut', [`Out of guesses! 😄`, `That was a tough one! 😅`, `Got you this time! 😏`])} The answer was ${r.a}. ${say('riddleMore', [`Want another ${r.word || 'riddle'}?`, `Ready for another one?`, `Want a revenge round?`, `Try another?`])}` }; }
    const nope = say('riddleNope', [`"${guessText}"? Nope, try again! 🤔`, `Not ${guessText}! Keep going 🤔`, `Good guess, but no! 😄`, `Hmm, not quite! 🤏`, `Nope! Think outside the box 📦`, `Close? Nah, not ${guessText} 😅`]);
    if (wantHarder) return { text: `${guessText.replace(/\s+/g, ' ')}? Nope! Not so easy after all 😏 (${3 - r.tries} ${3 - r.tries === 1 ? 'guess' : 'guesses'} left. When you get it, I'll turn on hard mode 🔥)` };
    return { text: `${nope} (${3 - r.tries} ${3 - r.tries === 1 ? 'guess' : 'guesses'} left${r.hints ? '' : '. Type "hint" for help'}, or "I give up")` };
  }
  if (askRiddleAgain && !lastRiddle && !riddleGuess) { offerRiddle = true; return { text: 'I haven\'t given you a riddle yet! Want one? 🧩' }; }
  if (askRiddleAgain && lastRiddle && !riddleGuess) { offerRiddle = true; return { text: `Yes! I asked you: 🧩 "${lastRiddle.q}"\nThe answer was ${lastRiddle.a}. Want another ${lastRiddle.word || 'riddle'}?` }; }
  const wantsMore = offerRiddle && /^(yes|yeah|yep|sure|ok|okay|another|again|more|y)\b/.test(t);
  offerRiddle = false;
  const wantsPuzzle = !riddleGuess && /\b(math|number|logic)? ?(puzzles?|brain ?teasers?)\b/.test(t) && !/\bi (like|love|hate|enjoy)\b/.test(t);
  const puzzleNext = offerPuzzle || (lastRiddle && lastRiddle.word === 'math puzzle'); offerPuzzle = false;
  if (wantsPuzzle || (wantsMore && puzzleNext)) return { text: newRiddleText('puzzle') };
  if ((/riddle/.test(t) && !riddleGuess) || wantsMore) return { text: newRiddleText() };

  // Joke guessing: "tell me a joke, let me guess" -> setup only, reveal after the guess
  if (jokeGuess) {
    const j = jokeGuess; jokeGuess = null;
    const [setup, punch] = splitJoke(j);
    if (/^(idk|dunno|i don'?t know|no idea|tell me|give up|i give up|what|\?+)$/.test(t)) return { text: `${punch}` };
    const words = tokens(punch).filter(w => w.length > 3 && !FILLER.has(w));
    const hit = words.filter(w => tokens(text).includes(w)).length;
    if (words.length && hit / words.length >= 0.5) return { text: `${say('jokeYes', [`YES! You got it! 🎉`, `No way, you guessed it! 😂`, `Exactly! 🙌`, `You've heard that one before, haven't you? 😏`])} ${punch}` };
    if (hit) return { text: `${say('jokeClose', [`So close! 😮`, `Ooh, almost!`, `You were on the right track!`])} The answer is: ${punch}` };
    return { text: `${say('jokeNope', [`Good guess! 😄 But the answer is:`, `Ha, that'd be funny too! But it's:`, `Nope! Here's the punchline:`, `Not quite! 😆`])} ${punch}` };
  }
  if (/joke/.test(t) && /guess|let me (try|think)|don'?t tell|without the answer/.test(t)) {
    const j = pickFresh('joke', BASE.find(b => b.tag === 'joke').re.filter(x => x.includes('? '))); noteTopic('jokes');
    jokeGuess = j;
    return { text: `Okay, guess this one! 🤔\n${splitJoke(j)[0]}\n(Type your guess, or "I give up")` };
  }

  // After a round my next pick is already locked in, so "yes" just reminds you, and rock/paper/scissors plays right away
  if (offerRps && /^(yes|yeah|yep|sure|ok|okay|again|play again|another|one more|y)\b/.test(t)) { offerRps = false; return { text: `Okay! My pick is already locked in: 🔒 "${rpsMode.code}"\nType rock, paper, or scissors.` }; }
  offerRps = false;
  if (rpsMode) {
    const choice = (t.match(/\b(rock|paper|scissors?)\b/) || [])[1];
    if (choice) {
      const you = choice.startsWith('scissor') ? 'scissors' : choice;
      const { me, code, shift } = rpsMode; rpsMode = null;
      const em = { rock: '✊', paper: '✋', scissors: '✌️' };
      const win = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
      mem.rps = mem.rps || { you: 0, me: 0 };
      noteTopic('rock paper scissors');
      const res = me === you ? 'Tie! 🤝' : win[you] === me ? (mem.rps.you++, 'You win! 🎉') : (mem.rps.me++, 'I win! 😎');
      save(); offerRps = true;
      startRps();
      return { text: `You picked ${you} ${em[you]}, I picked ${me} ${em[me]}. ${res}\n🔓 Check my secret code "${code}": move the first ${me.length} letters back ${shift} and you get ${me.toUpperCase()} (the rest are just random letters to hide the length). No cheating!\nScore: You ${mem.rps.you}, Me ${mem.rps.me}\n\nPlay again? I already locked in my next pick: 🔒 "${rpsMode.code}". Just type rock, paper, or scissors!` };
    }
  }

  if (/\b(what time|the time|time is it)\b/.test(t)) return { text: `It's ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} ⏰` };
  if (/\b(what day|the date|today's date|what is today|date today)\b/.test(t))
    return { text: `Today is ${new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })} 📅` };
  if (/flip a coin|coin flip|heads or tails/.test(t)) return { text: `${pick(['Heads', 'Tails'])}! 🪙` };
  if (/roll (a )?(dice|die)/.test(t)) return { text: `You rolled a ${1 + Math.floor(Math.random() * 6)}! 🎲` };
  const rn = t.match(/random number(?: between| from)? (\d+) (?:and|to) (\d+)/);
  if (rn) { const a = +rn[1], b = +rn[2]; return { text: `${Math.min(a, b) + Math.floor(Math.random() * (Math.abs(b - a) + 1))} 🎯` }; }

  const m = solveMath(text);
  if (m) { noteTopic('math'); } if (m) return { text: m, kind: 'math', subject: text, answer: m.split('\n')[0].replace(/ 🧮$/, '') };
  // "how do i get to playmerth", "show me the games", "take me to the website"
  const ct = correctText(text).toLowerCase();
  if (/(how (do|can) i (get|go)|take me|bring me|show (it |them |that |dat )?(to |ta )?me|open|where (is|are|do i find)|link|go to|get to|visit|let me see)/.test(ct) && /(playmerth|niv|game|website|site|web|home|the games|it\b)/.test(ct) && !/\b(story|riddle|joke|math)\b/.test(ct))
    return { text: 'Here you go! 🎮 Click this button to go to Playmerth and see all the games:', link: { href: '../../index.html', label: '🎮 Open Playmerth' }, kind: 'games' };
  if (/(what('?s| is| the \w+ is)|tell me about) (playmerth|niv'?s games|this (website|site|place))/.test(ct))
    return { text: 'Playmerth is the free games website I live on! 🎮 It has games like Fortress Fury, Cosmic Blitz, Nitro Blaze, Slice Storm, Tag Frenzy, and Number Showdown.', link: { href: '../../index.html', label: '🎮 Open Playmerth' }, kind: 'games' };
  const fav = favorite(text);
  if (fav) return fav;
  const cd = canDo(text);
  if (cd) return cd;
  // Looks like math but I couldn't read it: say so, don't search the internet for it
  const mathy = text.replace(/what('s| is)|calculate|solve|\?|=/gi, '').trim();
  if (/\d/.test(mathy) && /^[\d\s.+\-*/^()%x×÷,]+$/i.test(mathy) && /[+\-*/^%x×÷]/i.test(mathy))
    return { text: `That looks like math, but I can't read "${mathy}" 🤔 Try writing it like 25^2 or (3 + 4) * 2.` };
  return null;
}

IMPORTANT: You are in the middle of a ${riddleGuess.word || 'riddle'} game. The question is: "${riddleGuess.q}". They have ${3 - riddleGuess.tries} guesses left. NEVER say or hint at the answer, and never say they got it right. Just reply to what they said, then remind them to keep guessing or type "hint".` : ''}${rpsMode && !offerRps ? `
IMPORTANT: You are in the middle of rock paper scissors and your pick is already locked in a secret code. Never say what you picked. Tell them to type rock, paper, or scissors.` : ''}`;
}
async function smartReply(text, bubble) {
  // shorter memory = much faster replies (the AI rereads all of it every time); older stuff is still saved in my notes
  const hist = mem.history.slice(-12).map(h => ({ role: h.who === 'user' ? 'user' : 'assistant', content: h.who === 'user' ? h.text.slice(0, 300) : cleanAI(h.text.slice(0, 300), '') || '...' }));
  // the model wants user/assistant turns to alternate, starting with user
  while (hist.length && hist[0].role !== 'user') hist.shift();
  // a few example chats so the small AI knows the vibe
  const examples = [
    ['yo whassup bro', 'Yo! Not much, just chillin. Wbu?'],
    ['bro is selling fr\n\n[Slang notes: selling = doing really badly or embarrassing yourself ("bro is selling" = "he\'s messing up badly"); fr = for real]', 'Who\'s messing up? 😅 What happened?'],
    ['skill issue\n\n[Slang notes: skill issue = you\'re just not good at it (teasing)]', 'Skill issue?? 😤 Okay, give me a riddle and I\'ll prove it'],
    ['my brother isnt tough\n\n[Slang notes: tough = cool or impressive ("bro isn\'t tough" = "he thinks he\'s cool but he\'s not")]', 'Oh, he thinks he\'s cool but he\'s not? What did he do?'],
    ['holy blorp\n\n[Slang notes: "holy ___" = an excited "whoa!" (like "holy cow"); the word after it doesn\'t have to make sense; "blorp" is not a word you know. It might be a typo or made-up. Don\'t pretend to know it: ask what it means.]', 'Whoa, what happened? And what\'s a blorp? 🤔'],
  ].flatMap(([u, a]) => [{ role: 'user', content: u }, { role: 'assistant', content: a }]);
  const notes = await slangNotes(text);
  const userMsg = kidClean(text) + (notes.length ? `\n\n[Slang notes: ${notes.join('; ')}]` : '');
  const messages = [{ role: 'system', content: systemPrompt() }, ...examples, ...hist, { role: 'user', content: userMsg }];
  const lastBot = mem.history.filter(h => h.who === 'bot').slice(-3).map(h => h.text);
  const long = listReq(text);
  if (long) messages.splice(-1, 0, { role: 'system', content: `They asked for a list. Give them exactly what they asked for${(text.match(/\b\d+\b/) || [''])[0] ? ` (${Math.min(Number(text.match(/\b\d+\b/)[0]), 25)} items)` : ''} as a numbered list, one short line each, and no question before it. You can add one short friendly line at the end.` });
  let out = '';
  const t0 = performance.now();
  aiWorking(true);
  // type it out as it's written (cleaned up live), and only try again if it came out mean or repeated itself
  for (let tries = 0; tries < 2; tries++) {
    try {
      const stream = await brain.engine.chat.completions.create({ stream: true, messages: tries ? [...messages.slice(0, -1), { role: 'system', content: 'Your last answer was not okay (it repeated itself, or was unkind or confusing). Try again: be warm and friendly like a good friend, say something new, and answer what they actually said in 1 or 2 short sentences.' }, messages[messages.length - 1]] : messages, temperature: tries ? 0.9 : 0.6, max_tokens: long ? 450 : 90 });
      let raw = '';
      for await (const chunk of stream) {
        raw += chunk.choices[0]?.delta?.content || '';
        const shown = cleanAI(raw, text, long);
        if (shown && !badAI(shown)) { bubble.classList.remove('typing'); bubble.textContent = shown; chat.scrollTop = chat.scrollHeight; }
        // 3 sentences is all I'll show anyway, so stop early
        if (!long && (raw.match(/[.!?](\s|$)/g) || []).length >= 4) { try { brain.engine.interruptGenerate(); } catch {} break; }
      }
      out = cleanAI(raw.trim(), text, long);
    } catch (e) { console.error(e); aiWorking(false); return null; }
    if (!badAI(out) && !lastBot.some(b => b.trim() === out.trim())) break;
    if (tries === 1) out = ''; // still bad: use my own friendly answer instead
    bubble.textContent = 'Sunny is typing...'; bubble.classList.add('typing');
  }
  aiWorking(false);
  if (!out) return null;
  bubble.classList.remove('typing'); bubble.textContent = out;
  // really slow computer? suggest the small brain once
  if (performance.now() - t0 > 12000 && (mem.brainSize || 'Llama-3.2-3B-Instruct').includes('3B') && !mem.slowTip) {
    mem.slowTip = true; save();
    setTimeout(() => addMsg('(Tip: replies are slow on this computer. For faster answers, open 🧠 My Brain and pick the Small brain. It\'s quicker, but makes more mistakes.)', 'bot'), 300);
  }
  // the small AI likes to tack on "happy gaming!" and site ads; drop those unless they asked about games
  if (!long && !/playmerth|game|site|website/i.test(text)) {
    const clean = out.split(/(?<=[.!?])\s+/).filter(x => !/playmerth|happy gaming|our (games|site|website)/i.test(x)).join(' ').trim();
    if (clean) out = clean;
    bubble.textContent = out;
  }
  return out ? { text: out, kind: 'smart' } : null;
}
// Is this a "look it up" kind of question? (Wikipedia is better than a small AI at facts)
const isFactQ = t => !notATopic(t.toLowerCase().replace(/[?!.]+$/, '').replace(/^(who (is|was|were)|what (is|are|was|were)( a| an| the)?|where (is|are)( the)?|(can you )?tell me about( the)?|look up|search( for)?|define)\s+/, '')) && /^(who (is|was|were)|what (is|are|was|were) (a |an |the )?[a-z]|where (is|are)|(can you )?tell me about|look up|search|define|what does .+ mean)/i.test(t.trim()) && !/\b(you|your|u|ur|my|i)\b/i.test(t.replace(/^(can you )?tell me about/i, ''));

// Save games in progress, so reloading the page doesn't lose your riddle, story, or rock paper scissors round
function saveState() {
  mem.state = { riddleGuess, lastRiddle, offerRiddle, rpsMode, offerRps, storyMode, jokeGuess, pendingQuestion, ctx };
  save();
}
function loadState() {
  const st = mem.state || {};
  riddleGuess = st.riddleGuess || null; lastRiddle = st.lastRiddle || null; offerRiddle = !!st.offerRiddle;
  rpsMode = st.rpsMode || null; offerRps = !!st.offerRps; storyMode = st.storyMode || null;
  jokeGuess = st.jokeGuess || null; pendingQuestion = st.pendingQuestion || null; ctx = st.ctx || { kind: null };
}
async function send(text) {
  text = text.trim(); if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  const t = addMsg('Sunny is typing...', 'bot');
  t.classList.add('typing');
  const wait = new Promise(res => setTimeout(res, 350 + Math.random() * 400));
  let r = reply(text);
  // Smart brain answers small talk and anything my rules don't really understand
  if (r.storyAI && brain.ready) { aiWorking(true); const sa = await storyAI(text, t).catch(() => null); aiWorking(false); if (sa) r = sa; }
  if (r.decoded && r.askAI && brain.ready) { const sr = await smartReply(r.decoded, t); if (sr) r = { text: `🔓 You said: "${r.decoded}"\n\n${sr.text}`, kind: 'code' }; }
  const useSmart = !r.story && brain.ready && (r.soft || (r.unknown && !isFactQ(text))) && !(riddleGuess && !r.aside) && !jokeGuess;
  if (useSmart) {
    pendingGuess = null; offerMore = false; storyMode = null;
    const sr = await smartReply(r.completed || text, t);
    if (sr) { r = sr; setCtx(r); }
    // the AI messed up: a simple friendly answer is better than a weird one
    else if (r.unknown) r = { text: say('fallback', ['Wait, what do you mean? 😅', 'Fr? Tell me more 👀', 'Hmm, say that another way? I wanna get it 😅', 'Okay okay, then what happened?', 'Wait, explain! 👀']) };
  } else if (r.webTopic) {
    t.textContent = 'Sunny is looking it up on the internet... 🌐';
    const topic = r.webTopic;
    const w = await wiki(topic);
    const d = w ? null : await define(topic);
    r = w ? { text: `🌐 Here's what I found about ${topic} (from Wikipedia):\n${w.text}\n(Wikipedia is usually right, but anyone can edit it, so double-check important stuff!)`, kind: 'wiki', subject: w.title, more: w.more }
      : d ? { text: `🌐 "${topic}" means: ${d}` }
      : { text: `I looked everywhere but couldn't find anything about "${topic}" 😅 Tell me about it?` };
  } else if (r.unknown) {
    t.textContent = 'Sunny is looking it up on the internet... 🌐';
    r = (await webLookup(text)) || (brain.ready && await smartReply(text, t)) || confused(text, r.best, r.score);
  }
  if (r.kind === 'wiki' || r.kind === 'define') setCtx(r);
  learnStyle(text);
  if (r.text) r.text = applyPrefs(r.text);
  // "talk to me in code": say it in our secret language, with the real words under it
  if (mem.codeTalk && mem.codeOn && mem.code && r.text && r.kind !== 'code') { r.text = `${encodeCode(mem.code, r.text)}\n\n(${r.text})`; if (r.kind === 'smart') t.textContent = r.text; }
  remember('user', text);
  remember('bot', r.text);
  saveState();
  if (r.kind === 'smart') return; // already shown while it was typing
  await wait;
  t.remove();
  addMsg(r.text, 'bot', r.learn, r.link);
}
// If you send something while I'm still thinking, it waits in "Up next" and sends by itself when I'm ready
let busy = false;
const queue = [];
function submit(v) {
  v = (v || '').trim(); if (!v) return;
  if (busy) { queue.push(v); renderQueue(); return; }
  run(v);
}
async function run(v) {
  busy = true; input.placeholder = 'Sunny is thinking... you can still type!';
  try { await send(v); } catch (e) { console.error(e); }
  busy = false; input.placeholder = 'Say something...';
  if (queue.length) { const next = queue.shift(); renderQueue(); run(next); }
}
function renderQueue() {
  const box = document.getElementById('queue'), list = document.getElementById('queueList');
  box.classList.toggle('show', queue.length > 0);
  list.innerHTML = '';
  queue.forEach((q, i) => {
    const row = document.createElement('div'); row.className = 'qitem';
    const n = document.createElement('b'); n.className = 'n'; n.textContent = i + 1;
    const t = document.createElement('span'); t.textContent = q;
    const edit = document.createElement('button'); edit.textContent = '✏️'; edit.title = 'Edit (moves it back to the text box)';
    edit.onclick = () => { queue.splice(i, 1); renderQueue(); input.value = q; input.focus(); };
    const del = document.createElement('button'); del.textContent = '✕'; del.title = 'Remove';
    del.onclick = () => { queue.splice(i, 1); renderQueue(); };
    row.append(n, t, edit, del); list.appendChild(row);
  });
}
document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); const v = input.value; input.value = ''; submit(v); });

  const box = document.getElementById('learned');

    `Built-in knowledge: ${BASE.length} topics · Things you taught me: ${mem.learned.length} · Messages: ${mem.chats}`;
  if (!mem.learned.length) { box.innerHTML = '<div class="item empty">Nothing taught yet. Teach me above, or just chat!</div>'; return; }
  mem.learned.slice().reverse().forEach((l, ri) => {

    row.append(txt, del); box.appendChild(row);
  });
}

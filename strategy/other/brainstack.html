<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brainstack</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; font-family: 'Arial Rounded MT Bold', 'Nunito', system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* ---------- your homepage ---------- */
  #home {
    position: fixed; inset: 0; display: none; background: #1b2136; color: #e8ecf8;
    padding: 104px 56px 48px; box-sizing: border-box;
  }
  /* the logo: one puzzle piece flies into this little box in the top-left corner */
  #logo {
    position: fixed; left: 24px; top: 24px; width: 64px; height: 64px; z-index: 20; display: none;
    background: #ffffff; border-radius: 14px; /* double outline: a thin line inside + a white ring outside */
    box-shadow: inset 0 0 0 4px #ffffff, inset 0 0 0 6px #1b2136, 0 0 0 4px #1b2136, 0 0 0 7px #ffffff, 0 10px 18px 4px rgba(0,0,0,0.35);
  }
  #logo canvas { width: 64px; height: 64px; display: block; }
  #home h1 { margin: 0 0 6px; font-size: 40px; letter-spacing: 1px; }
  #home .sub { margin: 0 0 32px; color: #8f9bc0; font-size: 18px; }
  #home h2 { margin: 0 0 16px; font-size: 24px; color: #c9d2ee; }
  #inProgress { display: flex; flex-wrap: wrap; gap: 20px; }
  .empty {
    border: 3px dashed #3a4466; border-radius: 18px; padding: 34px 40px; color: #7d89ad; font-size: 20px;
  }
  #inProgress .card {
    font: inherit; text-align: left; cursor: pointer; border: none; border-radius: 18px;
    background: #ffffff; color: #1b2136; padding: 22px 28px; min-width: 240px;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: 1px 2px 0 #b8c0d8, 2px 4px 0 #b8c0d8, 3px 6px 0 #b8c0d8, 8px 14px 18px rgba(0,0,0,0.4);
    transition: transform .12s ease;
  }
  #inProgress .card:hover { transform: translate(-2px, -3px); }
  #inProgress .card .name { font-size: 26px; }
  #inProgress .card .lvl { font-size: 17px; color: #6b7894; }
  #inProgress .card .go { font-size: 17px; color: #2eb85c; margin-top: 6px; }
  #browse:active { transform: translate(4px, 8px);
    box-shadow: 1px 2px 0 #a81d29, 2px 4px 0 #a81d29, 4px 8px 12px rgba(0,0,0,0.45); }
  /* ---------- browse puzzles ---------- */
  #browseScreen {
    position: fixed; inset: 0; display: none; background: #1b2136; color: #e8ecf8;
    padding: 104px 56px 48px; box-sizing: border-box; overflow-y: auto;
  }
  #browseScreen h1 { margin: 0 0 6px; font-size: 40px; letter-spacing: 1px; }
  #browseScreen .sub { margin: 0 0 32px; color: #8f9bc0; font-size: 18px; }
  #browseList { display: flex; flex-wrap: wrap; gap: 24px; }
  .gameCard {
    font: inherit; text-align: left; cursor: pointer; border: none; border-radius: 20px; width: 280px;
    background: #ffffff; color: #1b2136; padding: 0 0 20px; overflow: hidden;
    box-shadow: 1px 2px 0 #b8c0d8, 2px 4px 0 #b8c0d8, 3px 6px 0 #b8c0d8, 8px 14px 18px rgba(0,0,0,0.4);
    transition: transform .12s ease;
  }
  .gameCard:hover { transform: translate(-2px, -3px); }
  .gameCard .art { background: #f4f6fb; font-size: 40px; padding: 30px 0; text-align: center; letter-spacing: 0.06em; }
  .gameCard .art .gg { color: #2eb85c; } .gameCard .art .xx { color: #9aa0ab; }
  .gameCard .name { display: block; font-size: 26px; margin: 16px 22px 4px; }
  .gameCard .info { display: block; font-size: 16px; color: #6b7894; margin: 0 22px; }
  .gameCard .go { display: block; font-size: 17px; color: #2eb85c; margin: 12px 22px 0; }
  #browseBack {
    position: absolute; left: 40px; bottom: 48px; font: inherit; font-size: 22px; color: #c9d2ee;
    background: #2a3352; border: none; border-radius: 12px; padding: 12px 24px; cursor: pointer;
    box-shadow: 0 5px 0 #141a2b;
  }
  #browseBack:active { transform: translateY(4px); box-shadow: 0 1px 0 #141a2b; }
  #browse {
    position: absolute; left: 40px; bottom: 48px;
    font: inherit; font-size: 28px; letter-spacing: 1px; color: #fff;
    padding: 18px 42px; border: none; border-radius: 14px; background: #e0313f;
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
    /* thick 3D side going down-right, like the puzzle pieces */
    box-shadow: 1px 2px 0 #a81d29, 2px 4px 0 #a81d29, 3px 6px 0 #a81d29, 4px 8px 0 #a81d29,
                5px 10px 0 #a81d29, 6px 12px 0 #a81d29, 10px 20px 22px rgba(0,0,0,0.45);
    cursor: pointer; transition: transform .1s, box-shadow .1s;
  }
  /* ---------- Inequal ---------- */
  #inequal {
    position: fixed; inset: 0; display: none; background: #ffffff;
    align-items: center; justify-content: center;
  }
  #inequal .eq { font-size: min(16vw, 170px); color: #1b2136; letter-spacing: 0.06em; white-space: nowrap; }
  #inequal { flex-direction: column; user-select: none; -webkit-user-select: none; }
  #inequal.won .g { cursor: default; }
  #inequal .x { transition: color .4s ease; }
  #inequal.won .x { color: #2eb85c; }
  #inequal .winmsg {
    font-size: min(7vw, 64px); color: #2eb85c; margin-top: 0.4em; height: 1.2em;
    opacity: 0; transform: scale(0.4); transition: opacity .3s ease, transform .45s cubic-bezier(.3,1.6,.5,1);
  }
  #inequal.won .winmsg { opacity: 1; transform: scale(1); }
  #inequal .g { color: #2eb85c; cursor: grab; display: inline-block; user-select: none; -webkit-user-select: none; touch-action: none;
                transition: transform .18s ease, text-shadow .18s; }
  #inequal .g.sel { transform: translateY(-0.12em) scale(1.08); text-shadow: 0 0.08em 0 #1d8c47; }
  #inequal .g.drag { transition: none; cursor: grabbing; z-index: 2; position: relative; }
  #inequal .g.over { text-shadow: 0 0 0.15em rgba(46,184,92,0.6); }
  #inequal .x { color: #9aa0ab; }
  #toHome, #restart, #undo {
    position: absolute; top: 24px; font: inherit; font-size: 20px; color: #6b7894;
    background: #f1f3f8; border: none; border-radius: 12px; padding: 10px 18px; cursor: pointer;
    box-shadow: 0 4px 0 #d5d9e4; transition: transform .1s, box-shadow .1s, opacity .3s;
  }
  #restart { right: 28px; }
  #undo { right: 172px; }
  #undo.empty { opacity: 0.4; cursor: default; }
  #inequal.won #undo { opacity: 0; pointer-events: none; }
  #toHome { left: 28px; }
  #toHome:hover, #restart:hover, #undo:not(.empty):hover { color: #1b2136; }
  #toHome:active, #restart:active, #undo:not(.empty):active { transform: translateY(3px); box-shadow: 0 1px 0 #d5d9e4; }
  #inequal.won #restart { opacity: 0; pointer-events: none; }
  #lvlBar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; }
  #lvlText { text-align: center; min-width: 220px; }
  #lvlNum { font-size: 15px; font-weight: 800; letter-spacing: 0.18em; color: #9aa0ab; }
  #lvlName { font-size: 26px; font-weight: 800; color: #1b2136; white-space: nowrap; }
  #lvlPrev, #lvlNext { font: inherit; font-size: 18px; color: #6b7894; background: #f1f3f8; border: none; border-radius: 50%; width: 44px; height: 44px;
    cursor: pointer; box-shadow: 0 4px 0 #d5d9e4; transition: transform .1s, box-shadow .1s, opacity .3s; }
  #lvlPrev:hover, #lvlNext:hover { color: #1b2136; }
  #lvlPrev:active, #lvlNext:active { transform: translateY(3px); box-shadow: 0 1px 0 #d5d9e4; }
  #lvlPrev.off, #lvlNext.off, #inequal.won #lvlPrev, #inequal.won #lvlNext { opacity: 0; pointer-events: none; }
  /* orange digit: can be moved into any gap in any number */
  #inequal .d { display: inline-block; }
  #inequal .o { color: #ff8c1a; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
                transition: transform .18s ease, text-shadow .18s; position: relative; }
  /* underlines are drawn as small rounded bars per digit (same as overlines) */
  #inequal .gu .d { position: relative; }
  #inequal .o.u::after, #inequal .o.ovu::after, #inequal .gu .d::after { content: ''; position: absolute; left: 0.02em; right: 0.08em; bottom: 0.04em;
    height: 0.07em; border-radius: 0.03em; background: #ff8c1a; }
  #inequal .gu .d::after, #inequal.won .o.u::after, #inequal.won .o.ovu::after { background: currentColor; }
  #inequal .o.hole { cursor: default; }
  /* purple = orange piece with a line (underline / overline); plain orange stays orange */
  #inequal .o.u, #inequal .o.ov { color: #8b5cf6; }
  #inequal .o.u.sel, #inequal .o.ov.sel { text-shadow: 0 0.08em 0 #5b34c4; }
  #inequal.won .o.u, #inequal.won .o.ov { color: #2eb85c; }
  .slot.p { background: rgba(139,92,246,0.28); }
  .slot.p.hot { background: rgba(139,92,246,0.85); }
  #inequal.previewing .slot.p:not(.fill) { background: transparent; }
  #inequal .d.ghost.p { color: rgba(139,92,246,0.5); }
  /* overline drawn per digit so two overlined digits side by side don't join into one bar */
  #inequal .o.ov::before { content: ''; position: absolute; left: 0.02em; right: 0.08em; top: 0.05em; height: 0.07em; background: currentColor; border-radius: 0.03em; }
  /* red number: click it to pick a different number */
  #inequal .red { color: #e5484d; cursor: pointer; transition: color .4s ease, transform .18s ease; display: inline-block; }
  #inequal .red:hover { transform: translateY(-0.05em); }
  #inequal .red.open { text-shadow: 0 0.06em 0 #b3262b; }
  #inequal.won .red { color: #2eb85c; cursor: default; }
  /* red underline: click the digit to pick a different digit (the rest of the number keeps its own color) */
  #inequal .eq .d.ru { position: relative; cursor: pointer; color: #e5484d; } /* the digit itself is red too */
  #inequal.won .eq .d.ru { color: #2eb85c; }
  #inequal .d.ru::after { content: ''; position: absolute; left: 0.02em; right: 0.08em; bottom: 0.04em; height: 0.07em; border-radius: 0.03em; background: #e5484d; }
  #inequal .d.ru.open { text-shadow: 0 0.06em 0 rgba(179,38,43,0.6); }
  /* multi red underline: digits linked by a double red line change together */
  #inequal .d.rg { position: relative; cursor: pointer; }
  #inequal .d.rg::after { content: ''; position: absolute; left: 0.02em; right: 0.08em; bottom: 0.09em; height: 0.05em; border-radius: 0.03em;
    background: #e5484d; box-shadow: 0 0.09em 0 #e5484d; }
  #inequal .eq > span:has(.rg:hover) .rg, #inequal .eq > span:has(.rg.open) .rg { text-shadow: 0 0.06em 0 rgba(179,38,43,0.6); }
  #inequal.won .d.rg { cursor: default; }
  #inequal.won .d.rg::after { background: currentColor; box-shadow: 0 0.09em 0 currentColor; }
  #inequal.won .d.ru { cursor: default; }
  #inequal.won .d.ru::after { background: currentColor; }
  #redPop { position: fixed; display: flex; gap: 12px; transform: translateX(-50%); z-index: 5; animation: popIn .18s ease-out; }
  #redPop button { font: inherit; font-size: 34px; font-weight: 800; color: #e5484d; background: #fff; border: 3px solid #e5484d; border-radius: 16px;
    padding: 6px 18px; cursor: pointer; box-shadow: 0 4px 0 #f2b8ba; transition: transform .1s; }
  #redPop button b { color: #e5484d; font-weight: 800; }
  #redPop button i { font-style: normal; color: #9aa0ab; }
  #redPop button:hover { background: #fdeced; transform: translateY(-2px); }
  @keyframes popIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.9); } }
  /* a number with a green underline is all green; only the underlined digit moves */
  #inequal .x:has(.gu) > .d:not(.o) { color: #2eb85c; }
  #inequal .d.zero { position: absolute; top: 0; color: rgba(154,160,171,0.55); pointer-events: none; }
  #inequal .o.sel { transform: translateY(-0.12em) scale(1.08); text-shadow: 0 0.08em 0 #c46400; }
  #inequal .o.drag { transition: none; cursor: grabbing; z-index: 3; }
  #inequal.won .o { color: #2eb85c; cursor: default; }
  .slot { position: fixed; border-radius: 6px; background: rgba(255,140,26,0.28); z-index: 2; cursor: pointer; }
  .slot.hot { background: rgba(255,140,26,0.85); }
  /* preview: while you hover a gap, the digit shows up there faded so you can see the new number before you drop it */
  #inequal.previewing .slot { background: transparent; }
  /* box around an underlined 0 that can be filled in (stays visible while dragging) */
  /* digits you can drop onto glow softly (the drop area itself is invisible) */
  .slot.fill, #inequal.previewing .slot.fill { background: transparent; }
  /* digits you can drop onto get a small purple dot underneath (drawn by the invisible drop area) */
  .slot.fill::after { content: ''; position: absolute; left: 50%; top: 100%; width: var(--dot); height: var(--dot);
    margin: calc(var(--dot) * 0.67) 0 0 calc(var(--dot) / -2); border-radius: 50%; background: #8b5cf6; }
  @keyframes dotIn { from { transform: scale(0); } }
  #inequal .d.ghost { position: absolute; top: 0; color: rgba(255,140,26,0.5); animation: ghostIn .16s ease-out; pointer-events: none; }
  #inequal .eq > span { position: relative; }
  #inequal .eq .d:not(.drag) { transition: transform .15s ease; }
  @keyframes ghostIn { from { opacity: 0; transform: translateY(-0.15em) scale(0.7); } }
  /* progress through the whole game; you rank up at the stars */
  #prog { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: min(80vw, 900px); display: flex; align-items: center; gap: 18px; }
  #progRank { font-size: 15px; font-weight: 800; color: #6b7894; white-space: nowrap; min-width: 170px; text-align: right; }
  #progRank b { color: #e6a800; }
  #progTrack { position: relative; flex: 1; height: 14px; background: #eef0f5; border-radius: 7px; }
  #progFill { height: 100%; width: 0; border-radius: 7px; background: linear-gradient(90deg, #2eb85c, #1eb6e8); transition: width .7s cubic-bezier(.3,1.2,.5,1); }
  .pmark { position: absolute; top: 50%; width: 50px; height: 50px; margin: -30px 0 0 -25px; transition: transform .4s, filter .4s, opacity .4s;
    filter: grayscale(1); opacity: 0.45; }
  .pmark.got { filter: none; opacity: 1; transform: scale(1.15); }
  #progRank { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  #progRank .rpic { margin-top: -6px; }
  #rankUp { position: absolute; top: 11%; left: 50%; transform: translateX(-50%) scale(0.4); opacity: 0; z-index: 20; pointer-events: none; text-align: center;
    background: #fff8e1; border: 4px solid #ffc312; border-radius: 22px; padding: 8px 30px 12px; box-shadow: 0 8px 0 #f0d58a;
    transition: opacity .3s, transform .45s cubic-bezier(.3,1.6,.5,1); }
  #rankUp.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #rankUp .t0 { display: flex; justify-content: center; margin: 6px 0 4px; }
  #rankUp .t1 { font-size: 32px; font-weight: 800; color: #e6a800; letter-spacing: 0.05em; }
  #rankUp .t2 { font-size: 22px; font-weight: 800; color: #1b2136; }
  #levelSwap { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; z-index: 10; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="logo"><canvas></canvas></div>
<div id="home">
  <h1>Your Homepage</h1>
  <p class="sub">Pick up where you left off.</p>
  <h2>Puzzles in progress</h2>
  <div id="inProgress"><div class="empty">No puzzles in progress yet</div></div>
  <button id="browse">BROWSE</button>
</div>
<div id="browseScreen">
  <h1>Browse Puzzles</h1>
  <p class="sub">Pick a puzzle to play.</p>
  <div id="browseList"></div>
  <button id="browseBack">◀ Back</button>
</div>
<div id="inequal">
  <canvas id="confetti" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
  <button id="toHome" title="Back to your homepage">◀ Home</button>
  <button id="undo" title="Take back your last switch">⟲ Undo</button>
  <button id="restart" title="Restart this level">↻ Restart</button>
  <div id="lvlBar"><button id="lvlPrev" title="Go back a level">◀</button><div id="lvlText"><div id="lvlNum"></div><div id="lvlName"></div></div><button id="lvlNext" title="Go forward to a level you have reached">▶</button></div>
  <div class="eq"></div>
  <div class="winmsg">You win!</div>
  <div id="prog"><div id="progRank"></div><div id="progTrack"><div id="progFill"></div></div></div>
  <div id="rankUp"></div>
</div>
<canvas id="levelSwap"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const FONT = "'Arial Rounded MT Bold', 'Nunito', system-ui, sans-serif";

// darker look
const BOARD_COLOR = [27, 33, 54]; // smooth dark navy board
const BTN_COLOR = '#1d8c47', BTN_SIDE = '#0f5129';
const TITLE_COLORS = ['#ff4757', '#ff8c1a', '#ffc312', '#2ed573', '#1eb6e8', '#4a69ff', '#a55eea', '#ff4fa3', '#ff4757', '#ff8c1a'];
const EQ_COLORS = ['#c84a5c', '#cf8433', '#c7ad35', '#3fa866', '#359fc2', '#5d6fd6', '#8e5cc8', '#c65b9c'];

const EQUATIONS = [
  '7² + 3x = 52', '∑ n = 210', '√144 = 12', 'π ≈ 3.14159', 'x² − 5x + 6 = 0', 'a² + b² = c²',
  'f(x) = 3x − 7', '12 × 12 = 144', '∫ x dx = x²/2', '45 ÷ 9 = 5', '6! = 720', 'log₂ 8 = 3',
  'sin²θ + cos²θ = 1', 'y = mx + b', '(a + b)²', '2¹⁰ = 1024', '3x + 4 = 19', '0.75 = ¾',
  '9 × 8 = 72', '1, 1, 2, 3, 5, 8', 'e ≈ 2.718', '√2 ≈ 1.414', '17 + 26 = 43', '100 − 37 = 63',
  '5³ = 125', 'x = 4', '∞', '42', '1,024', '−18', '256', '3.7', '81', '360°', '7', '13', '99',
  '2x − 9 = 11', 'A = πr²', '¼ + ½ = ¾', '64 ÷ 8 = 8', '11 × 11 = 121', '%', '15% of 80 = 12',
];

let logoPt = null, logoPiece = null, W, H, dpr, u, cols, rows, ox, oy, pieces = [], bakeCanvas = null, btnRect = null, fontSize;
let phase = 'intro', t0 = performance.now(), lockTime = 0, leaveTime = 0, hoverPlay = false, particles = [];
const T_START = 0.2;    // plain white screen first
const T_END = 1.7;      // every piece locks in at this exact moment

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round((n >> 16) * f)), g = Math.min(255, Math.round(((n >> 8) & 255) * f)), b = Math.min(255, Math.round((n & 255) * f));
  return `rgb(${r},${g},${b})`;
}

// ---------- jigsaw edges ----------
function edge(p, x0, y0, x1, y1, bump, tc, sz) {
  if (!bump) { p.lineTo(x1, y1); return; }
  const L = Math.hypot(x1 - x0, y1 - y0), dx = (x1 - x0) / L, dy = (y1 - y0) / L;
  const nx = dy, ny = -dx; // outward normal (clockwise path)
  const k = sz / 0.24;
  const P = (t, n) => [x0 + dx * t * L + nx * n * L * bump, y0 + dy * t * L + ny * n * L * bump];
  p.lineTo(...P(tc - 0.15 * k, 0));
  p.bezierCurveTo(...P(tc - 0.10 * k, 0.03 * k), ...P(tc - 0.22 * k, 0.24 * k), ...P(tc, 0.24 * k));
  p.bezierCurveTo(...P(tc + 0.22 * k, 0.24 * k), ...P(tc + 0.10 * k, 0.03 * k), ...P(tc + 0.15 * k, 0));
  p.lineTo(x1, y1);
}
function randEdge(border) {
  return { b: border ? 0 : (Math.random() < 0.5 ? 1 : -1), t: rand(0.4, 0.6), sz: rand(0.17, 0.26) };
}

// ---------- 3D text ----------
function drawExtrudedText(g, text, x, y, size, colors, depth, alpha = 1) {
  g.save();
  g.globalAlpha = alpha;
  g.font = `900 ${size}px ${FONT}`;
  g.textBaseline = 'middle';
  const chars = [...text], spacing = size * 0.02;
  const widths = chars.map(ch => g.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let cx = x - total / 2;
  chars.forEach((ch, i) => {
    const col = colors[i % colors.length];
    for (let k = depth; k > 0; k--) {
      g.fillStyle = shade(col, 0.35 + 0.2 * (1 - k / depth));
      g.fillText(ch, cx + k * 0.5, y + k * 0.8);
    }
    const grad = g.createLinearGradient(0, y - size / 2, 0, y + size / 2);
    grad.addColorStop(0, shade(col, 1.2)); grad.addColorStop(1, shade(col, 0.85));
    g.fillStyle = grad;
    g.fillText(ch, cx, y);
    g.lineWidth = Math.max(0.8, size * 0.012);
    g.strokeStyle = 'rgba(255,255,255,0.45)';
    g.strokeText(ch, cx, y);
    cx += widths[i] + spacing;
  });
  g.restore();
  return total;
}
function textWidth(g, text, size) {
  g.font = `900 ${size}px ${FONT}`;
  return g.measureText(text).width + size * 0.02 * ([...text].length - 1);
}

// ---------- layout + build ----------
function layout() {
  W = Math.max(320, window.innerWidth || 0); H = Math.max(320, window.innerHeight || 0);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  pieces = []; bakeCanvas = null;

  const titleW = Math.min(W * 0.9, 1150);
  const measured = textWidth(ctx, 'BRAINSTACK', 100) * 1.04;
  fontSize = Math.min(100 * titleW / measured, H * 0.2);
  // old pieces were ~fontSize*0.62 wide; new base unit is ~1/3 of that, merged pieces are up to 2-3x

}

  }
  let zeroMark = null;
  function hideSlots() { clearPreview(); slots.forEach(s => s.remove()); slots = []; root.querySelectorAll('.d.target').forEach(d => d.classList.remove('target')); if (zeroMark) { zeroMark.remove(); zeroMark = null; } }
  function clearDsel() { if (dsel) dsel.classList.remove('sel'); dsel = null; hideSlots(); }
  const where = d => { const tok = d.parentElement; return [spans().indexOf(tok), [...tok.children].indexOf(d)]; };
  function showSlots(o) {
    hideSlots();
    const src = o.parentElement;
    if (src.dataset.k === 'op') { showSignSlots(o); return; }
    if (o.classList.contains('ov')) { showAddSlots(o); return; }
    // an underlined digit leaves a 0 only when it leaves its own home spot; once it's away it just moves
    const under = o.classList.contains('u'), home = under && !o.classList.contains('away');
    if (home) { // show the 0 it will leave behind
      const z = document.createElement('span');
      z.className = 'd zero'; z.textContent = '0'; z.style.left = o.offsetLeft + 'px';
      src.appendChild(z); zeroMark = z;
    }
    if (!home && src.children.length === 1) return; // a number can't be left empty
    spans().forEach((tok, ti) => {
      if (tok.dataset.k !== 'num') return;
      const ds = [...tok.children].filter(d => !d.classList.contains('zero')), r = tok.getBoundingClientRect(), oi = ds.indexOf(o);
      const w = Math.max(8, r.height * 0.09);
      for (let p = 0; p <= ds.length; p++) {
        if (!home && tok === src && (p === oi || p === oi + 1)) continue; // no change
        const x = p === 0 ? ds[0].getBoundingClientRect().left - w * 0.6
          : p === ds.length ? ds[p - 1].getBoundingClientRect().right + w * 0.6
          : (ds[p - 1].getBoundingClientRect().right + ds[p].getBoundingClientRect().left) / 2;
        const el = document.createElement('div');
        el.className = 'slot';
        Object.assign(el.style, { left: (x - w / 2) + 'px', top: (r.top + r.height * 0.12) + 'px', width: w + 'px', height: (r.height * 0.76) + 'px' });
        el.dataset.t = ti; el.dataset.p = p;
        root.appendChild(el); slots.push(el);
      }
      if (under) ds.forEach((d, p) => { // an underlined 0 left behind can be filled back in
        if (!d.classList.contains('hole')) return;
        const b = d.getBoundingClientRect(), el = document.createElement('div');
        el.className = 'slot fill';
        Object.assign(el.style, { left: (b.left - 6) + 'px', top: (b.top + b.height * 0.1) + 'px', width: (b.width + 12) + 'px', height: (b.height * 0.85) + 'px' });
        el.dataset.t = ti; el.dataset.p = p; el.dataset.fill = 1; el.style.setProperty('--dot', (b.height * 0.113) + 'px');
        root.appendChild(el); slots.push(el);
      });
    });
    if (under) slots.forEach(el => el.classList.add('p'));
  }
  // ----- orange overline: drop it on a digit (in any number) to add to that digit; 10 or more carries to the next place -----
  function showAddSlots(o) {
    const src = o.parentElement, keep = o.classList.contains('ovu');
    if (keep) { // overline + underline leaves a 0 behind
      const z = document.createElement('span');
      z.className = 'd zero'; z.textContent = '0'; z.style.left = o.offsetLeft + 'px';
      src.appendChild(z); zeroMark = z;
    } else if (src.children.length === 1) return; // a number can't be left empty
    spans().forEach((tok, ti) => {
      if (tok.dataset.k !== 'num' || tok.classList.contains('red')) return;
      const ds = [...tok.children].filter(d => !d.classList.contains('zero') && !d.classList.contains('ghost'));
      ds.forEach((d, p) => {
        if (d === o || d.classList.contains('ov') || d.classList.contains('gu')) return;
        // a carry can't go into another overline digit or a green underline
        const line = ds.filter(x => x !== o || keep), q = line.indexOf(d);
        for (let i = q, sum = +d.textContent + +o.textContent; sum >= 10; ) {
          i--; if (i < 0) break;
          const x = line[i];
          if (x !== o && (x.classList.contains('ov') || x.classList.contains('gu'))) return;
          sum = (x === o ? 0 : +x.textContent) + 1;
        }
        const b = d.getBoundingClientRect(), el = document.createElement('div');
        el.className = 'slot fill';
        Object.assign(el.style, { left: (b.left - 6) + 'px', top: (b.top + b.height * 0.1) + 'px', width: (b.width + 12) + 'px', height: (b.height * 0.85) + 'px' });
        el.dataset.t = ti; el.dataset.p = p; el.dataset.add = 1; el.style.setProperty('--dot', (b.height * 0.113) + 'px');
        root.appendChild(el); slots.push(el);
      });
    });
    slots.forEach(el => el.classList.add('p'));
  }
  function addDigit(o, ti, p) {
    const [si, oi] = where(o), arrs = parseToks(), ch = o.textContent;
    if (o.classList.contains('ovu')) arrs[si][oi] = '~0';
    else { arrs[si].splice(oi, 1); if (ti === si && p > oi) p--; }
    const a = arrs[ti];
    let i = p, carry = +ch;
    while (carry) {
      if (i < 0) { a.unshift(String(carry)); p++; break; }
      const u = a[i], pre = u.length > 1 && u[0] !== '~' ? u[0] : '', sum = +u[u.length - 1] + carry;
      a[i] = pre + (sum % 10); carry = Math.floor(sum / 10); i--;
    }
    commitDigits(arrs, [[si, oi]], [[ti, p]]);
  }
  // ----- red numbers: click to pick a different number -----
  let redEl = null;
  function closeRed() {
    const pop = document.getElementById('redPop');
    if (pop) pop.remove();
    if (redEl) redEl.classList.remove('open');
    redEl = null;
  }
  // el = a red number, or a red-underlined digit (ru) inside any number
  function openRed(el) {
    if (redEl === el) { closeRed(); return; }
    closeRed();
    const isRu = el.classList.contains('ru'), isGroup = el.classList.contains('rg'), tok = isRu || isGroup ? el.closest('.eq > span') : el;
    const n = spans().indexOf(tok), def = LEVELS[level][n];
    const k = isRu ? [...tok.querySelectorAll('.ru')].indexOf(el) : isGroup ? -2 : -1;
    const group = [...tok.querySelectorAll('.rg')], cur = isGroup ? group.map(d => d.textContent).join('') : el.textContent;
    const opts = isRu ? def.ru[k] : isGroup ? def.rg : [def.t.replace(/[$#]/g, ''), ...def.r];
    const pop = document.createElement('div'), r = el.getBoundingClientRect();
    pop.id = 'redPop';
    opts.filter(v => v !== cur).forEach(v => {
      const b = document.createElement('button');
      // a linked group shows the whole new number, with the changing digits in red
      if (isGroup) { let c = 0; b.innerHTML = [...tok.children].map(d => d.classList.contains('rg') ? `<b>${v[c++]}</b>` : `<i>${d.textContent}</i>`).join(''); }
      else b.textContent = v;
      b.dataset.v = v; b.dataset.n = n; b.dataset.k = k;
      pop.appendChild(b);
    });
    pop.style.left = (r.left + r.width / 2) + 'px'; pop.style.top = (r.bottom + 10) + 'px';
    root.appendChild(pop);
    redEl = el; el.classList.add('open');
  }
  function pickRed(btn) {
    const n = +btn.dataset.n, k = +btn.dataset.k, v = btn.dataset.v, toks = snap();
    history.push(toks.slice()); updateUndo();
    closeRed();
    const g = toks[n][0] === '^' ? '^' : '', us = units(toks[n].replace(/^\^/, ''));
    if (k >= 0) { // change just the red-underlined digit
      let c = -1;
      toks[n] = g + us.map(u => u[0] === '$' && ++c === k ? '$' + v : u).join('');
    } else if (k === -2) { // change every digit of the linked group together
      let c = 0;
      toks[n] = g + us.map(u => u[0] === '#' ? '#' + v[c++] : u).join('');
    } else { // change the whole number; red underlines stay in the same places
      toks[n] = g + [...v].map((ch, i) => (us[i] && /^[$#]/.test(us[i]) ? us[i][0] : '') + ch).join('');
    }
    renderLevel(level, toks);
    const el = k >= 0 ? spans()[n].querySelectorAll('.ru')[k] : spans()[n];
    if (k === -2) spans()[n].querySelectorAll('.rg').forEach(d => d.animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'cubic-bezier(.3,1.6,.5,1)' }));
    el.animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'cubic-bezier(.3,1.6,.5,1)' });
    save(); checkWin();
  }
  // ----- orange signs: drop one inside a number to split it, or in front of a number to make it negative -----
  const MARK = {};
  function signMove(si, ti, p) {
    const toks = snap(), seq = [];
    toks.forEach((t, k) => {
      if (k === ti) { const ds = parseToks()[k], g = t[0] === '^' ? '^' : ''; if (p > 0) seq.push(g + ds.slice(0, p).join('')); seq.push(toks[si]); seq.push(g + ds.slice(p).join('')); }
      else if (k === si) seq.push(MARK);
      else seq.push(t);
    });
    // where the sign was, the two numbers on each side join up into one
    const i = seq.indexOf(MARK), isNum = x => x !== MARK && kind(x) === 'num';
    if (i > 0 && i < seq.length - 1 && isNum(seq[i - 1]) && isNum(seq[i + 1])) {
      const [a, b] = [seq[i - 1], seq[i + 1]], g = a[0] === '^' || b[0] === '^' ? '^' : '';
      seq.splice(i - 1, 3, g + a.replace(/^\^/, '') + b.replace(/^\^/, ''));
    } else seq.splice(i, 1);
    // only allow it if it still reads as a real equation
    const bare = t => t.replace(/[*^_~&!%$#\[\]]/g, ''), plain = seq.map(bare);
    if (plain.some((t, k) => kind(t) === 'num' && t.length > 1 && t[0] === '0')) return null;
    if (plain.some((t, k) => kind(t) === 'op' && t !== '−' && (k === 0 || kind(plain[k - 1]) === 'op'))) return null;
    const sides = plain.join(' ').replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/').split('=');
    if (sides.length !== 2) return null;
    try { if (!sides.every(x => isFinite(Function('return (' + x + ')')()))) return null; } catch (e) { return null; }
    return plain.join() === serialize().map(bare).join() ? null : seq;
  }
  function showSignSlots(o) {
    const src = o.parentElement, si = spans().indexOf(src);
    spans().forEach((tok, ti) => {
      if (tok.dataset.k !== 'num') return;
      const ds = [...tok.children], r = tok.getBoundingClientRect(), w = Math.max(8, r.height * 0.09);
      for (let p = 0; p < ds.length; p++) {
        if (p === 0 && !(o.textContent === '−' && (ti === 0 || spans()[ti - 1].dataset.k === 'op'))) continue;
        if (!signMove(si, ti, p)) continue;
        const x = p === 0 ? ds[0].getBoundingClientRect().left - w * 0.6 : (ds[p - 1].getBoundingClientRect().right + ds[p].getBoundingClientRect().left) / 2;
        const el = document.createElement('div');
        el.className = 'slot';
        Object.assign(el.style, { left: (x - w / 2) + 'px', top: (r.top + r.height * 0.12) + 'px', width: w + 'px', height: (r.height * 0.76) + 'px' });
        el.dataset.t = ti; el.dataset.p = p;
        root.appendChild(el); slots.push(el);
      }
    });
  }
  function moveSign(o, ti, p) {
    const seq = signMove(spans().indexOf(o.parentElement), ti, p);
    if (!seq) return;
    history.push(snap()); updateUndo();
    const b = o.getBoundingClientRect();
    renderLevel(level, seq);
    const el = root.querySelector('.eq > [data-k="op"] .o'), now = el.getBoundingClientRect();
    el.style.transition = 'none';
    el.style.transform = `translate(${b.left - now.left}px, ${b.top - now.top}px)`;
    el.offsetWidth;
    el.style.transition = 'transform .32s cubic-bezier(.3,1.3,.5,1)';
    el.style.transform = '';
    save(); checkWin();
  }
  function parseToks() { return serialize().map(t => kind(t) === 'num' ? units(t) : [t]); }
  function commitDigits(arrs, from, to) {
    history.push(snap()); updateUndo();
    const rects = from.map(([ti, p]) => spans()[ti].children[p].getBoundingClientRect());
    const fl = spans().map(el => el.classList.contains('g'));
    // zeros at the start of a number disappear on their own
    const cut = arrs.map(a => { let c = 0; while (a.length > 1 && /^[*_~!%&$#]?0$/.test(a[0])) { a.shift(); c++; } return c; });
    renderLevel(level, arrs.map((a, k) => (fl[k] ? '^' : '') + a.join('')));
    to.forEach(([ti, p], k) => {
      p -= cut[ti];
      const el = p >= 0 && spans()[ti].children[p];
      if (!el) return;
      const now = el.getBoundingClientRect(), b = rects[k];
      el.style.transition = 'none';
      el.style.transform = `translate(${b.left - now.left}px, ${b.top - now.top}px)`;
      el.offsetWidth;
      el.style.transition = 'transform .32s cubic-bezier(.3,1.3,.5,1)';
      el.style.transform = '';
    });
    save(); checkWin();
  }
  function moveDigit(o, ti, p, fill) {
    if (o.parentElement.dataset.k === 'op') { moveSign(o, ti, p); return; }
    if (o.classList.contains('ov')) { addDigit(o, ti, p); return; }
    const [si, oi] = where(o), arrs = parseToks();
    let ch;
    if (o.classList.contains('u')) {
      // underlined: leaving its home spot leaves an underlined 0 there; filling a 0 makes that its new home
      const d = o.textContent;
      if (o.classList.contains('away')) { arrs[si].splice(oi, 1); if (ti === si && p > oi) p--; }
      else arrs[si][oi] = '~0';
      ch = (fill ? '_' : '&') + d;
    } else { ch = arrs[si].splice(oi, 1)[0]; if (ti === si && p > oi) p--; }
    if (fill) arrs[ti][p] = ch; else arrs[ti].splice(p, 0, ch);
    commitDigits(arrs, [[si, oi]], [[ti, p]]);
  }

  // the gap under the pointer (slots stay where they were drawn, even while a preview shifts the numbers)
  function targetAt(x, y) {
    if (preview) {
      const r = preview.slot.getBoundingClientRect(), cx = (r.left + r.right) / 2;
      if (Math.abs(x - cx) < r.height * 0.3 && y > r.top - r.height * 0.5 && y < r.bottom + r.height * 0.5) return preview.slot;
    }
    let best = null, bd = Infinity;
    for (const s of slots) {
      const r = s.getBoundingClientRect(), cx = (r.left + r.right) / 2, dist = Math.abs(x - cx);
      if (y > r.top - r.height * 0.4 && y < r.bottom + r.height * 0.4 && dist < bd && dist < r.height * 0.35) { bd = dist; best = s; }
    }
    return best;
  }

  document.getElementById('inequal').addEventListener('pointerdown', e => {
    if (!won) {
      const opt = e.target.closest('#redPop button');
      if (opt) { pickRed(opt); return; }
      const red = e.target.closest('.ru, .rg') || e.target.closest('.red');
      if (red) { clearSel(); clearDsel(); openRed(red); return; }
      closeRed();
      const o = e.target.closest('.o:not(.hole)'), slot = e.target.closest('.slot');
      if (o) { e.preventDefault(); clearSel(); ddrag = { o, x: e.clientX, y: e.clientY, moved: false }; o.setPointerCapture(e.pointerId); return; }
      if (dsel && slot) { const o2 = dsel; clearDsel(); moveDigit(o2, +slot.dataset.t, +slot.dataset.p, !!slot.dataset.fill); return; }
      if (dsel) clearDsel();
    }
    const el = e.target.closest('.g');
    if (!el || won) { clearSel(); return; }
    drag = { el, x: e.clientX, y: e.clientY, moved: false };
    el.setPointerCapture(e.pointerId);
  });
  document.getElementById('inequal').addEventListener('pointermove', e => {
    if (ddrag) {
      const dx = e.clientX - ddrag.x, dy = e.clientY - ddrag.y;
      if (!ddrag.moved && Math.hypot(dx, dy) > 6) { ddrag.moved = true; clearDsel(); ddrag.o.classList.add('drag'); showSlots(ddrag.o); }
      if (!ddrag.moved) return;
      ddrag.o.style.transform = `translate(${dx}px, ${dy}px) scale(1.1)`;
      setPreview(ddrag.o, targetAt(e.clientX, e.clientY));
      return;
    }
    if (dsel && !drag) { setPreview(dsel, targetAt(e.clientX, e.clientY)); return; }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; clearSel(); drag.el.classList.add('drag'); }
    if (!drag.moved) return;
    drag.el.style.transform = `translate(${dx}px, ${dy}px) scale(1.08)`;
    greens().forEach(g => {
      if (g === drag.el || g.dataset.k !== drag.el.dataset.k) return;
      const r = g.getBoundingClientRect();
      g.classList.toggle('over', e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom);
    });
  });
  document.getElementById('inequal').addEventListener('pointerup', e => {
    if (ddrag) {
      const o = ddrag.o;
      if (ddrag.moved) {
        const hot = preview && preview.slot;
        o.style.transform = '';
        hideSlots();                       // takes the preview away before the real move
        o.classList.remove('drag');
        if (hot) moveDigit(o, +hot.dataset.t, +hot.dataset.p, !!hot.dataset.fill);
      } else if (dsel === o) clearDsel();
      else { clearDsel(); dsel = o; o.classList.add('sel'); showSlots(o); }
      ddrag = null;
      return;
    }
    if (!drag) return;
    const el = drag.el;
    if (drag.moved) {
      const target = greens().find(g => g.classList.contains('over'));
      greens().forEach(g => g.classList.remove('over'));
      el.classList.remove('drag');
      el.style.transform = '';
      if (target) swap(el, target);
    } else if (selected && selected !== el && selected.dataset.k === el.dataset.k) {
      const other = selected; clearSel(); swap(other, el);
    } else if (selected === el) {
      clearSel();
    } else {
      clearSel();
      selected = el; el.classList.add('sel');
    }
    drag = null;
  });
})();

function showBrowse() {
  const info = window.inequalInfo();
  const status = info.done ? 'Completed ✓ · Play again ▶' : info.level ? `Level ${info.level} of ${info.levels} · Continue ▶` : 'Play ▶';
  document.getElementById('browseList').innerHTML = `
    <button class="gameCard" id="playInequal">
      <div class="art"><span class="gg">3</span> <span class="xx">−</span> <span class="gg">4</span> <span class="xx">= 1</span></div>
      <span class="name">Inequal</span>
      <span class="info">${info.levels} levels</span>
      <span class="go">${status}</span>
    </button>`;
  document.getElementById('playInequal').onclick = () => {
    document.getElementById('browseScreen').style.display = 'none'; document.getElementById('logo').style.display = 'none';
    window.inequalResume();
  };
  document.getElementById('home').style.display = 'none';
  document.getElementById('browseScreen').style.display = 'block';
}
document.getElementById('browse').addEventListener('click', showBrowse);
document.getElementById('browseBack').addEventListener('click', () => {
  document.getElementById('browseScreen').style.display = 'none';
  showHome();
});

function showHome() {
  const box = document.getElementById('inProgress'), saved = window.inequalSaved();
  box.innerHTML = saved
    ? `<button class="card" id="resumeInequal"><span class="name">Inequal</span><span class="lvl">Level ${saved.level} of ${saved.of}</span><span class="go">Continue ▶</span></button>`
    : '<div class="empty">No puzzles in progress yet</div>';
  if (saved) document.getElementById('resumeInequal').onclick = () => {
    document.getElementById('home').style.display = 'none'; document.getElementById('logo').style.display = 'none';
    window.inequalResume();
  };
  document.getElementById('home').style.display = 'block';
  if (logoPiece) document.getElementById('logo').style.display = 'block';
}

// Inequal (open the page with #inequal to jump straight to level 1, #inequal-2 for level 2)
const ineqMatch = location.hash.match(/^#inequal(?:-(\d+))?$/);
if (location.hash === '#reset') { // #reset wipes saved progress and starts from the very beginning
  localStorage.removeItem('brainstack.inequal');
  history.replaceState(null, '', location.pathname);
  startIntro();
} else if (ineqMatch) {
  if (ineqMatch[1]) inequalStart(Number(ineqMatch[1]) - 1); else inequalResume(); // #inequal picks up where you left off
} else {
  startIntro();
}
</script>

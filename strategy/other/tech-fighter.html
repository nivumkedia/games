<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Fighter</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
        height:100%;
        background:#bfe4ff;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow:hidden;
    }
    #wrap {
        position:relative;
        width:100vw;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
    }
    canvas {
        display:block;
        image-rendering:auto;
        box-shadow:0 0 0 2px rgba(0,0,0,0.05);
    }
    #hud {
        position:fixed;
        top:14px;
        left:14px;
        background:rgba(255,255,255,0.85);
        border:1px solid rgba(0,0,0,0.08);
        border-radius:12px;
        padding:10px 16px;
        font-size:0.85em;
        color:#2c3e50;
        box-shadow:0 4px 14px rgba(0,0,0,0.08);
    }
    #hud b { color:#1565c0; }
    #progress-wrap {
        position:fixed;
        top:14px;
        right:14px;
        width:220px;
        background:rgba(255,255,255,0.85);
        border:1px solid rgba(0,0,0,0.08);
        border-radius:12px;
        padding:10px 14px;
        box-shadow:0 4px 14px rgba(0,0,0,0.08);
    }
    #progress-label {
        font-size:0.72em;
        font-weight:700;
        letter-spacing:0.04em;
        text-transform:uppercase;
        color:#5b6b78;
        margin-bottom:6px;
    }
    #progress-bar-bg {
        width:100%;
        height:8px;
        border-radius:5px;
        background:rgba(0,0,0,0.08);
        overflow:hidden;
    }
    #progress-bar-fill {
        height:100%;
        width:0%;
        border-radius:5px;
        background:linear-gradient(90deg,#7cd992,#4fa3ff,#5b6b78);
        transition:width 0.15s ease;
    }
    #title-badge {
        position:fixed;
        bottom:14px;
        left:14px;
        font-weight:800;
        font-size:1.3em;
        color:#1c2b39;
        letter-spacing:0.02em;
        text-shadow:0 2px 0 rgba(255,255,255,0.6);
    }
</style>
</head>
<body>

<div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
</div>

<div id="hud">Move: <b>Arrow Keys</b> &nbsp;·&nbsp; Jump: <b>SPACE / UP</b> &nbsp;·&nbsp; Fight: <b>Z</b> block, <b>X</b> counter, <b>A</b> kill</div>
<div id="progress-wrap">
    <div id="progress-label">City Progress</div>
    <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
</div>
<div id="title-badge">TECH FIGHTER</div>

<script>
(function(){
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    function fitCanvas(){
        const scale = Math.min(window.innerWidth / W, window.innerHeight / H, 1.4);
        canvas.style.width = (W * scale) + 'px';
        canvas.style.height = (H * scale) + 'px';
    }
    window.addEventListener('resize', fitCanvas);
    fitCanvas();

    // ---------- seeded RNG so the city layout is stable across reloads ----------
    let seed = 1337;
    function rand(){
        seed = (seed * 1103515245 + 12345) & 0x7fffffff;
        return (seed % 10000) / 10000;
    }
    function randRange(a, b){ return a + rand() * (b - a); }

    // ---------- world generation: suburban -> urban -> metropolis -> cyberpunk ----------
    // Everything below is driven by continuous curves over t (0..1), not hard
    // zone cutoffs, so one stage eases into the next instead of snapping.
    const GROUND_Y = 440;
    const NUM_BUILDINGS = 200;
    function smoothstep(a, b, t){
        const x = Math.max(0, Math.min(1, (t - a) / (b - a)));
        return x * x * (3 - 2 * x);
    }
    const NEON_COLORS = ['#ff2fd6', '#38f2ff', '#b060ff', '#3dffb0'];

    // physics constants, declared here (not just near the player) because the
    // generator below uses them to guarantee every rooftop-to-rooftop gap is
    // actually jumpable
    const GRAVITY = 1500;
    const MOVE_SPEED = 260;
    const JUMP_VEL = -620;
    const JUMP_SPEED = -JUMP_VEL; // positive magnitude
    const MAX_JUMP_RISE = (JUMP_SPEED * JUMP_SPEED) / (2 * GRAVITY); // highest a jump can climb
    const SAFE_RISE_CAP = MAX_JUMP_RISE * 0.7; // leave real margin, not a frame-perfect jump

    // time in the air needed to clear a given change in rooftop height
    // (riseNeeded > 0 = climbing to a taller roof, < 0 = dropping to a lower one)
    function timeToClearRise(riseNeeded){
        if (riseNeeded >= 0){
            const disc = JUMP_SPEED * JUMP_SPEED - 2 * GRAVITY * riseNeeded;
            if (disc < 0) return null; // physically unreachable
            // landing only registers while falling (past the jump's apex), so
            // we need the LATER time the arc crosses that height, not the
            // first (ascending) crossing
            return (JUMP_SPEED + Math.sqrt(disc)) / GRAVITY;
        }
        const fall = -riseNeeded;
        return (JUMP_SPEED + Math.sqrt(JUMP_SPEED * JUMP_SPEED + 2 * GRAVITY * fall)) / GRAVITY;
    }

    // how "developed" the city is at this point (0 = sleepy suburb, 1 = full skyline)
    function densityForT(t){ return smoothstep(0.05, 0.48, t); }
    // how far into the neon/cyberpunk era we are (only ramps up late, but with
    // a long runway afterward to actually be in it)
    function cyberForT(t){ return smoothstep(0.42, 0.78, t); }

    function styleWeights(t){
        return {
            house:   Math.max(0, 1 - smoothstep(0.08, 0.24, t)),
            brick:   smoothstep(0.08, 0.24, t) * Math.max(0, 1 - smoothstep(0.45, 0.68, t)),
            glass:   smoothstep(0.11, 0.28, t),
            stepped: smoothstep(0.30, 0.50, t),
            spire:   smoothstep(0.34, 0.55, t)
        };
    }
    function pickStyle(t){
        const w = styleWeights(t);
        const total = w.house + w.brick + w.glass + w.stepped + w.spire;
        let roll = rand() * total;
        for (const key of ['house', 'brick', 'glass', 'stepped', 'spire']){
            roll -= w[key];
            if (roll <= 0) return key === 'house' ? 'house' : key === 'brick' ? 'brickTower' : key === 'glass' ? 'glassTower' : key === 'stepped' ? 'steppedTower' : 'spireTower';
        }
        return 'glassTower';
    }

    // rooftop gadgets get more elaborate the further into the city you are
    function pickGadget(density, cyber){
        const r = rand();
        if (cyber > 0.3 && r < 0.16) return 'helipad';
        if (r < 0.16 + 0.22) return 'dish';
        if (density > 0.2 && r < 0.16 + 0.22 + 0.26) return 'vents';
        if (r < 0.16 + 0.22 + 0.26 + 0.2) return 'antenna';
        return 'none';
    }

    // pass 1: decide every building's size/height/style first, with each
    // height rate-limited relative to the one before it — always jumpable
    const meta = [];
    {
        let prevHeight = null;
        for (let i = 0; i < NUM_BUILDINGS; i++){
            const t = i / (NUM_BUILDINGS - 1);
            const density = densityForT(t);
            const cyber = cyberForT(t);

            const width = randRange(lerp(150, 95, density), lerp(230, 190, density));
            const minH = lerp(50, 160, density);
            const maxH = lerp(110, 980, Math.pow(density, 1.2));

            let height;
            if (prevHeight === null){
                height = randRange(minH, maxH);
            } else {
                // aim for a height inside the current envelope, but always move
                // toward it at a rate that's provably jumpable — climbing is
                // hard-capped under the max jump height, dropping is freer.
                const target = randRange(minH, maxH);
                let riseNeeded = target - prevHeight;
                riseNeeded = Math.max(-260, Math.min(SAFE_RISE_CAP, riseNeeded));
                height = prevHeight + riseNeeded;
            }
            prevHeight = height;

            const neonNow = rand() < cyber;
            meta.push({
                width, height, t, density, cyber,
                style: pickStyle(t),
                neon: neonNow,
                neonColor: NEON_COLORS[Math.floor(rand() * NEON_COLORS.length)],
                seedTint: rand(),
                gadget: pickGadget(density, cyber),
                searchlight: neonNow && height > 420 && rand() < 0.22
            });
        }
    }

    // pass 2: lay the buildings out left to right, sizing each gap from the
    // ACTUAL height change to the next building (this is the step that
    // guarantees every gap is really jumpable — pass 1 only guaranteed the
    // rise is small enough, this is what turns that into a safe distance)
    const buildings = [];
    {
        let x = -200;
        for (let i = 0; i < meta.length; i++){
            const m = meta[i];
            buildings.push({
                x, width: m.width,
                y: GROUND_Y - m.height,
                height: m.height,
                t: m.t, density: m.density, cyber: m.cyber,
                style: m.style, neon: m.neon, neonColor: m.neonColor, seedTint: m.seedTint,
                gadget: m.gadget, searchlight: m.searchlight
            });

            let gap;
            if (i + 1 < meta.length){
                const riseNeeded = meta[i + 1].height - m.height;
                const airTime = timeToClearRise(riseNeeded);
                const maxDist = airTime ? MOVE_SPEED * airTime : 40;
                // stay well inside maxDist (never past 78% of it) so even the
                // steepest allowed climb — where maxDist itself is smallest —
                // still leaves real margin
                gap = Math.max(20, Math.min(maxDist * randRange(0.5, 0.78), 260));
            } else {
                gap = 60;
            }
            x += m.width + gap;
        }
    }
    const WORLD_LENGTH = buildings[buildings.length - 1].x + buildings[buildings.length - 1].width + 200;

    function buildingAt(px){
        for (const b of buildings){
            if (px >= b.x && px <= b.x + b.width) return b;
        }
        return null;
    }

    // ---------- enemies ----------
    // first enemy type: a plain, no-frills sword grunt — this is the suburban
    // stretch of the city, so nothing fancy yet. Beaten with Z (block) then
    // X (counter) then A (kill), strictly in that order.
    const enemies = [];
    {
        let sinceLast = 3;
        for (const b of buildings){
            sinceLast++;
            if (b.style === 'house' && b.t > 0.03 && b.t < 0.24 && sinceLast > 2 && rand() < 0.5){
                enemies.push({
                    type: 'swordGrunt',
                    x: b.x + b.width * 0.5 - 14,
                    y: b.y - 50,
                    w: 28, h: 50,
                    alive: true,
                    comboStep: 0,   // 0 = expects Z, 1 = expects X, 2 = expects A
                    hitFlash: 0,
                    deathTimer: 0
                });
                sinceLast = 0;
            }
        }
    }

    // ---------- player: humanoid robot ----------
    const player = {
        x: buildings[0].x + 40,
        y: buildings[0].y - 60,
        w: 30, h: 58,
        vx: 0, vy: 0,
        onGround: false,
        facing: 1,
        runPhase: 0,
        coyote: 0,
        // combat: 'idle' | 'block' | 'countered' | 'kill'
        combatPose: 'idle',
        combatTimer: 0
    };
    const COYOTE_TIME = 0.09;
    const SWORD_REACH = 62; // how far the player's sword can reach an enemy

    const keys = {};
    window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        keys[k] = true;
        if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
        if (k === 'z' || k === 'x' || k === 'a') handleCombatKey(k);
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    let lastRespawnBuildingIdx = 0;

    function respawnPlayer(){
        const rb = buildings[lastRespawnBuildingIdx];
        player.x = rb.x + rb.width / 2 - player.w / 2;
        player.y = rb.y - player.h;
        player.vx = 0; player.vy = 0;
        player.combatPose = 'idle';
        player.combatTimer = 0;
        // give any nearby enemy a fresh start rather than an unfair reset mid-attempt
        for (const e of enemies) if (e.alive) e.comboStep = 0;
        deathFlash = 0.3;
    }

    let deathFlash = 0;

    function updateEnemies(dt){
        for (const e of enemies){
            if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
            if (!e.alive && e.deathTimer > 0) e.deathTimer = Math.max(0, e.deathTimer - dt);
        }
    }

    // Z -> X -> A, strictly in order, against whichever alive enemy is
    // actually in sword range. Wrong key, wrong order, or nothing in range
    // and doing it right still fails you if you're not close enough — the
    // enemy gets the opening instead.
    const effects = []; // transient visual-only fx: {x,y,color,start,duration}
    function spawnEffect(x, y, color, duration){
        effects.push({ x, y, color, start: gameTime, duration: duration || 0.35 });
    }

    function handleCombatKey(k){
        let target = null, bestDist = Infinity;
        for (const e of enemies){
            if (!e.alive) continue;
            const dx = (e.x + e.w / 2) - (player.x + player.w / 2);
            const dy = (e.y + e.h / 2) - (player.y + player.h / 2);
            const dist = Math.hypot(dx, dy);
            if (dist <= SWORD_REACH && dist < bestDist){ bestDist = dist; target = e; }
        }
        if (!target) return; // nothing in reach — key does nothing

        const midX = (player.x + player.w / 2 + target.x + target.w / 2) / 2;
        const midY = (player.y + target.y) / 2;

        const expected = ['z', 'x', 'a'][target.comboStep];
        if (k === expected){
            target.comboStep++;
            target.hitFlash = 0.25;
            if (k === 'z'){
                player.combatPose = 'block';
                player.combatTimer = 0.3;
                spawnEffect(midX, midY, '#dfe6ea', 0.3);
            } else if (k === 'x'){
                player.combatPose = 'counter';
                player.combatTimer = 0.28;
                spawnEffect(target.x + target.w / 2, target.y + target.h * 0.4, '#ff5a3d', 0.4);
            } else { // 'a' — the kill
                player.combatPose = 'kill';
                player.combatTimer = 0.35;
                spawnEffect(target.x + target.w / 2, target.y + target.h * 0.45, '#ffffff', 0.3);
                target.alive = false;
                target.deathTimer = 0.5;
                target.deathParticles = [];
                for (let i = 0; i < 7; i++){
                    const a = (i / 7) * Math.PI * 2 + rand() * 0.6;
                    target.deathParticles.push({
                        vx: Math.cos(a), vy: Math.sin(a) - 0.4,
                        color: i % 2 === 0 ? '#c9ccd0' : '#ff5a3d',
                        size: 3 + rand() * 3
                    });
                }
            }
        } else {
            respawnPlayer();
        }
    }

    function update(dt){
        // horizontal input
        let dir = 0;
        if (keys['arrowleft']) dir -= 1;
        if (keys['arrowright']) dir += 1;
        if (dir !== 0) player.facing = dir;
        player.vx = dir * MOVE_SPEED;

        // jump
        const wantsJump = keys[' '] || keys['arrowup'];
        if (wantsJump && (player.onGround || player.coyote > 0)) {
            player.vy = JUMP_VEL;
            player.onGround = false;
            player.coyote = 0;
        }

        // physics
        player.vy += GRAVITY * dt;
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        // rooftop collision (landing only, moving downward)
        player.onGround = false;
        const feetX = player.x + player.w / 2;
        const b = buildingAt(feetX);
        if (b && player.vy >= 0){
            const feetY = player.y + player.h;
            if (feetY >= b.y && feetY - player.vy * dt <= b.y + 4){
                player.y = b.y - player.h;
                player.vy = 0;
                player.onGround = true;
                player.coyote = COYOTE_TIME;
                lastRespawnBuildingIdx = buildings.indexOf(b);
            }
        }
        if (!player.onGround) player.coyote = Math.max(0, player.coyote - dt);

        // fell into a gap -> soft respawn on the last rooftop stood on
        if (player.y > GROUND_Y + 300) respawnPlayer();

        if (player.combatTimer > 0){
            player.combatTimer -= dt;
            if (player.combatTimer <= 0) player.combatPose = 'idle';
        }
        if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - dt);
        updateEnemies(dt);
        for (let i = effects.length - 1; i >= 0; i--){
            if (gameTime - effects[i].start > effects[i].duration) effects.splice(i, 1);
        }

        // clamp to world
        player.x = Math.max(-100, Math.min(WORLD_LENGTH + 100, player.x));

        // run animation phase
        if (player.onGround && dir !== 0) player.runPhase += dt * 10;
        else if (player.onGround) player.runPhase = 0;

        // progress bar
        const progress = Math.max(0, Math.min(1, player.x / WORLD_LENGTH));
        document.getElementById('progress-bar-fill').style.width = (progress * 100).toFixed(1) + '%';
    }

    // ---------- camera ----------
    const camera = { x: 0, y: 0 };
    function updateCamera(){
        const targetX = player.x - W / 2;
        const targetY = (player.y - H * 0.58);
        camera.x += (targetX - camera.x) * 0.12;
        camera.y += (Math.min(0, targetY) - camera.y) * 0.08;
        camera.x = Math.max(-150, Math.min(WORLD_LENGTH - W + 150, camera.x));
    }

    // ---------- palette: suburban -> urban -> metropolis -> cyberpunk ----------
    function lerp(a, b, t){ return a + (b - a) * t; }
    function lerpColor(c1, c2, t){
        return [
            Math.round(lerp(c1[0], c2[0], t)),
            Math.round(lerp(c1[1], c2[1], t)),
            Math.round(lerp(c1[2], c2[2], t))
        ];
    }
    function rgb(c, a){ return a === undefined ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
    function multiLerp(stops, t){
        if (t <= stops[0].t) return stops[0].c;
        if (t >= stops[stops.length - 1].t) return stops[stops.length - 1].c;
        for (let i = 0; i < stops.length - 1; i++){
            if (t >= stops[i].t && t <= stops[i + 1].t){
                const lt = (t - stops[i].t) / (stops[i + 1].t - stops[i].t);
                return lerpColor(stops[i].c, stops[i + 1].c, lt);
            }
        }
        return stops[stops.length - 1].c;
    }

    // stage stops: suburban(day) -> urban(hazy day) -> metropolis(dusk) -> cyberpunk(neon night)
    const SKY_TOP_STOPS = [
        { t: 0,    c: [140, 200, 245] },
        { t: 0.26, c: [120, 160, 205] },
        { t: 0.54, c: [90, 95, 150] },
        { t: 0.80, c: [35, 25, 70] },
        { t: 1,    c: [12, 8, 35] }
    ];
    const SKY_BOT_STOPS = [
        { t: 0,    c: [225, 245, 250] },
        { t: 0.26, c: [195, 205, 220] },
        { t: 0.54, c: [235, 170, 140] },
        { t: 0.80, c: [120, 60, 110] },
        { t: 1,    c: [50, 20, 60] }
    ];
    const SKYLINE_STOPS = [
        { t: 0,    c: [150, 205, 150] },
        { t: 0.26, c: [120, 135, 150] },
        { t: 0.54, c: [70, 75, 100] },
        { t: 0.80, c: [40, 30, 60] },
        { t: 1,    c: [20, 15, 35] }
    ];
    const GROUND_STOPS = [
        { t: 0,    c: [120, 170, 110] },
        { t: 0.26, c: [95, 100, 105] },
        { t: 0.54, c: [65, 68, 75] },
        { t: 0.80, c: [30, 28, 40] },
        { t: 1,    c: [15, 12, 25] }
    ];

    function currentProgress(){
        return Math.max(0, Math.min(1, camera.x / WORLD_LENGTH));
    }

    // small glowing motes drifting slowly upward through the skyline — tiled
    // deterministically off camera.x so they stay put as you scroll instead
    // of swimming around
    function drawAmbientParticles(p){
        const intensity = smoothstep(0.35, 0.7, p);
        if (intensity <= 0) return;
        ctx.save();
        const cellW = 90;
        const colors = ['#ff2fd6', '#38f2ff', '#b060ff', '#3dffb0'];
        for (let x = -cellW; x < W + cellW; x += cellW){
            const worldCol = Math.floor((x + camera.x) / cellW);
            const rx = ((worldCol * 928371 + 12345) % 1000) / 1000;
            const rSpeed = 14 + rx * 22;
            const baseY = 120 + ((worldCol * 55731) % 240);
            const drift = ((gameTime * rSpeed + rx * 300) % 260);
            const py = GROUND_Y - 40 - drift;
            const localX = x - ((camera.x) % cellW) + (rx - 0.5) * 40;
            const twinkle = 0.35 + 0.4 * Math.abs(Math.sin(gameTime * 2 + worldCol));
            ctx.globalAlpha = intensity * twinkle * (1 - drift / 280);
            ctx.fillStyle = colors[Math.abs(worldCol) % colors.length];
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(localX, py, 1.6, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // a couple of distant aircraft/drones drifting across the skyline with
    // blinking nav lights — genuine motion, not just a pulsing glow
    function drawSkyTraffic(p){
        const intensity = smoothstep(0.4, 0.75, p);
        if (intensity <= 0) return;
        for (let lane = 0; lane < 2; lane++){
            const speed = lane === 0 ? 26 : -19;
            const laneY = 70 + lane * 46;
            const cycle = 2600;
            const worldX = ((gameTime * speed * 10) % cycle + cycle) % cycle;
            const sx = (worldX - camera.x * 0.5) % (W + 300) - 150;
            const blink = Math.sin(gameTime * 6 + lane * 3) > 0.6;
            ctx.save();
            ctx.globalAlpha = intensity;
            ctx.fillStyle = '#1c2430';
            ctx.beginPath();
            ctx.ellipse(sx, laneY, 10, 3.2, 0, 0, Math.PI * 2);
            ctx.fill();
            if (blink){
                ctx.fillStyle = lane === 0 ? '#ff5a5a' : '#38f2ff';
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(sx + (speed > 0 ? 9 : -9), laneY, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    function drawBackground(){
        const p = currentProgress();
        const skyTop = multiLerp(SKY_TOP_STOPS, p);
        const skyBot = multiLerp(SKY_BOT_STOPS, p);
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgb(skyTop));
        g.addColorStop(1, rgb(skyBot));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        // sun by day, neon moon by night
        ctx.save();
        if (p < 0.7){
            ctx.globalAlpha = 0.9 - p * 0.5;
            ctx.fillStyle = '#fff6d8';
            ctx.beginPath();
            ctx.arc(W * 0.82, H * 0.18, 46, 0, Math.PI * 2);
            ctx.fill();
        } else {
            const glowT = (p - 0.7) / 0.3;
            ctx.globalAlpha = 0.5 + glowT * 0.4;
            ctx.fillStyle = '#ff5fe0';
            ctx.shadowColor = '#ff5fe0';
            ctx.shadowBlur = 40;
            ctx.beginPath();
            ctx.arc(W * 0.8, H * 0.16, 34, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.restore();

        // distant skyline silhouette (denser + taller as the city grows)
        const skylineColor = multiLerp(SKYLINE_STOPS, p);
        ctx.fillStyle = rgb(skylineColor);
        ctx.globalAlpha = 0.6;
        const parX = -camera.x * 0.25;
        const towerW = 46;
        const baseY = GROUND_Y - 40;
        ctx.beginPath();
        ctx.moveTo(-200, baseY);
        for (let x = -200; x < W + 200; x += towerW){
            const n = Math.floor((x + parX) / towerW);
            const h = 40 + Math.abs(Math.sin(n * 12.9898) * 43758.5453 % 1) * (60 + p * 170);
            const localX = x - ((parX) % towerW);
            ctx.lineTo(localX, baseY - h);
            ctx.lineTo(localX + towerW, baseY - h);
        }
        ctx.lineTo(W + 200, baseY);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;

        // faint neon glow rising off the skyline once we're deep in cyberpunk territory
        if (p > 0.78){
            const glowA = ((p - 0.78) / 0.22) * 0.25;
            ctx.save();
            ctx.globalAlpha = glowA;
            const beamG = ctx.createLinearGradient(0, baseY - 220, 0, baseY);
            beamG.addColorStop(0, 'rgba(255,60,220,0)');
            beamG.addColorStop(1, 'rgba(120,80,255,0.5)');
            ctx.fillStyle = beamG;
            ctx.fillRect(0, baseY - 220, W, 220);
            ctx.restore();
        }

        // drifting ambient light particles + a couple of blinking flying craft,
        // once there's enough neon around for them to make sense
        if (p > 0.35){
            drawAmbientParticles(p);
            drawSkyTraffic(p);
        }

        // ground strip
        ctx.fillStyle = rgb(multiLerp(GROUND_STOPS, p));
        ctx.fillRect(0, GROUND_Y - camera.y, W, H - (GROUND_Y - camera.y));

        // wet-neon reflective streaks on the cyberpunk-stage road
        if (p > 0.75){
            ctx.save();
            ctx.globalAlpha = ((p - 0.75) / 0.25) * 0.5;
            for (let i = 0; i < 6; i++){
                const rx = ((i * 173 - camera.x * 0.6) % (W + 200)) - 100;
                ctx.strokeStyle = i % 2 === 0 ? '#ff2fd6' : '#38f2ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(rx, GROUND_Y - camera.y + 10);
                ctx.lineTo(rx + 40, H);
                ctx.stroke();
            }
            ctx.restore();
        }
    }

    // ---------- window grid helper: shared by every skyscraper style ----------
    function drawWindowGrid(sx, topY, width, spanH, cols, rows, litColor, dimAlpha){
        const padX = width * 0.1, padY = 10;
        const cellW = (width - padX * 2) / cols;
        const cellH = Math.min(24, (spanH - padY * 2) / rows);
        for (let r = 0; r < rows; r++){
            for (let c = 0; c < cols; c++){
                const wx = sx + padX + c * cellW + cellW * 0.18;
                const wy = topY + padY + r * cellH + cellH * 0.18;
                if (wy > GROUND_Y - camera.y + 40) continue;
                const lit = ((r * 7 + c * 13 + Math.floor(sx)) % 5) !== 0;
                ctx.fillStyle = lit ? litColor : `rgba(20,25,35,${dimAlpha})`;
                ctx.fillRect(wx, wy, cellW * 0.64, cellH * 0.6);
            }
        }
    }

    function drawNeonTrim(sx, sy, w, h, color, phase){
        const pulse = 0.75 + 0.25 * Math.sin(gameTime * 2.4 + (phase || 0) * 6.283);
        ctx.save();
        ctx.globalAlpha = pulse;
        ctx.strokeStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 7 + pulse * 6;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(sx, sy + h);
        ctx.lineTo(sx, sy);
        ctx.lineTo(sx + w, sy);
        ctx.lineTo(sx + w, sy + h);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();
    }

    function drawHolographicSign(sx, sy, w, color, phase){
        const pulse = 0.7 + 0.3 * Math.sin(gameTime * 1.8 + (phase || 0) * 6.283);
        ctx.save();
        const signW = Math.min(w * 0.7, 46);
        const px = sx + w / 2 - signW / 2;
        const py = sy + 14;
        ctx.globalAlpha = 0.75 * pulse;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10 + pulse * 8;
        ctx.fillRect(px, py, signW, 4);
        ctx.fillRect(px, py + 6, signW * 0.6, 4);
        ctx.fillRect(px, py + 12, signW * 0.8, 4);
        ctx.restore();
    }

    // rooftop gadgets: dishes, vent stacks, helipads — variety beyond the
    // per-style decorations already baked into each tower type
    function drawRooftopGadget(b, sx, sy){
        if (b.gadget === 'none') return;
        const cx = sx + b.width * 0.5;
        if (b.gadget === 'dish'){
            ctx.save();
            ctx.translate(sx + b.width * 0.28, sy - 14);
            ctx.rotate(-0.5);
            ctx.fillStyle = '#c7d0d6';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI, true);
            ctx.fill();
            ctx.strokeStyle = '#8fa0ab';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -3);
            ctx.lineTo(0, -12);
            ctx.stroke();
            ctx.restore();
        } else if (b.gadget === 'vents'){
            ctx.fillStyle = '#4a5560';
            for (let i = 0; i < 3; i++){
                const vx = sx + b.width * (0.2 + i * 0.22);
                ctx.fillRect(vx, sy - 14, 7, 12);
                const glowA = 0.35 + 0.25 * Math.sin(gameTime * 3 + i + b.seedTint * 6);
                ctx.save();
                ctx.globalAlpha = glowA;
                ctx.fillStyle = '#ff8a3d';
                ctx.fillRect(vx + 1, sy - 13, 5, 2);
                ctx.restore();
                ctx.fillStyle = '#4a5560';
            }
        } else if (b.gadget === 'helipad'){
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, sy - 12, 14, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('H', cx, sy - 8);
            const ringPulse = 0.3 + 0.5 * Math.abs(Math.sin(gameTime * 1.6 + b.seedTint * 6));
            ctx.strokeStyle = `rgba(255,60,220,${ringPulse})`;
            ctx.shadowColor = '#ff2fd6';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(cx, sy - 12, 16, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        } else if (b.gadget === 'antenna'){
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx, sy - 4);
            ctx.lineTo(cx, sy - 22);
            ctx.stroke();
            ctx.fillStyle = '#ff5a5a';
            ctx.beginPath();
            ctx.arc(cx, sy - 24, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // rotating searchlight beam sweeping from a rooftop
    function drawSearchlight(b, sx, sy){
        const angle = -Math.PI / 2 + Math.sin(gameTime * 0.35 + b.seedTint * 6.283) * 0.9;
        const len = 420;
        const spread = 0.16;
        const ex1 = sx + b.width * 0.5 + Math.cos(angle - spread) * len;
        const ey1 = sy + Math.sin(angle - spread) * len;
        const ex2 = sx + b.width * 0.5 + Math.cos(angle + spread) * len;
        const ey2 = sy + Math.sin(angle + spread) * len;
        ctx.save();
        const g = ctx.createLinearGradient(sx + b.width * 0.5, sy, (ex1 + ex2) / 2, (ey1 + ey2) / 2);
        g.addColorStop(0, 'rgba(255,80,220,0.28)');
        g.addColorStop(1, 'rgba(255,80,220,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(sx + b.width * 0.5, sy);
        ctx.lineTo(ex1, ey1);
        ctx.lineTo(ex2, ey2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function drawBuilding(b){
        const sx = b.x - camera.x;
        const sy = b.y - camera.y;
        const fullH = GROUND_Y - b.y + 60;

        if (b.style === 'house'){
            const wall = lerpColor([248, 232, 200], [225, 205, 175], b.seedTint);
            ctx.fillStyle = rgb(wall);
            ctx.fillRect(sx, sy, b.width, fullH);
            drawWindowGrid(sx, sy, b.width, b.height, Math.max(2, Math.round(b.width / 55)), 2, 'rgba(255,235,180,0.65)', 0.15);
            // terracotta roof ledge
            ctx.fillStyle = '#b96a55';
            ctx.fillRect(sx - 2, sy - 8, b.width + 4, 12);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(sx - 2, sy - 8, b.width + 4, 2);
            // chimney
            ctx.fillStyle = '#8a5a4a';
            ctx.fillRect(sx + b.width * 0.72, sy - 26, 10, 20);
            return;
        }

        if (b.style === 'glassTower'){
            const wallLit = lerpColor([170, 195, 210], [120, 150, 195], b.t);
            const grad = ctx.createLinearGradient(sx, sy, sx + b.width, sy);
            grad.addColorStop(0, rgb(wallLit));
            grad.addColorStop(0.45, rgb(wallLit.map(v => Math.min(255, v + 35))));
            grad.addColorStop(1, rgb(wallLit.map(v => Math.max(0, v - 25))));
            ctx.fillStyle = grad;
            ctx.fillRect(sx, sy, b.width, fullH);
            const litColor = b.neon ? 'rgba(255,90,230,0.55)' : 'rgba(210,235,255,0.55)';
            drawWindowGrid(sx, sy, b.width, b.height, Math.max(3, Math.round(b.width / 26)), Math.max(4, Math.round(b.height / 26)), litColor, 0.12);
            // flat roof + AC unit
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.fillRect(sx - 2, sy - 3, b.width + 4, 3);
            ctx.fillStyle = '#5b6b78';
            ctx.fillRect(sx + b.width * 0.15, sy - 12, b.width * 0.22, 10);
            if (b.neon) drawNeonTrim(sx, sy, b.width, fullH, b.neonColor, b.seedTint);
            if (b.neon && b.height > 420) drawHolographicSign(sx, sy, b.width, b.neonColor, b.seedTint);
            drawRooftopGadget(b, sx, sy);
            if (b.searchlight) drawSearchlight(b, sx, sy - 12);
            return;
        }

        if (b.style === 'brickTower'){
            const wall = lerpColor([200, 170, 150], [140, 120, 115], b.t);
            ctx.fillStyle = rgb(wall);
            ctx.fillRect(sx, sy, b.width, fullH);
            drawWindowGrid(sx, sy, b.width, b.height, Math.max(3, Math.round(b.width / 32)), Math.max(3, Math.round(b.height / 30)), 'rgba(255,225,160,0.6)', 0.18);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(sx - 2, sy - 3, b.width + 4, 3);
            // water tower silhouette
            ctx.fillStyle = '#3d3530';
            ctx.beginPath();
            ctx.moveTo(sx + b.width * 0.5 - 8, sy - 4);
            ctx.lineTo(sx + b.width * 0.5 + 8, sy - 4);
            ctx.lineTo(sx + b.width * 0.5 + 6, sy - 20);
            ctx.lineTo(sx + b.width * 0.5 - 6, sy - 20);
            ctx.closePath();
            ctx.fill();
            ctx.fillRect(sx + b.width * 0.5 - 6, sy - 22, 12, 4);
            if (b.neon) drawNeonTrim(sx, sy, b.width, fullH, b.neonColor, b.seedTint);
            drawRooftopGadget(b, sx, sy);
            return;
        }

        if (b.style === 'steppedTower'){
            const dayColor = lerpColor([150, 165, 185], [95, 105, 130], b.t);
            const wall = lerpColor(dayColor, [55, 45, 80], b.cyber);
            const tiers = [
                { hFrac: 1.0,  wFrac: 1.0 },
                { hFrac: 0.62, wFrac: 0.68 },
                { hFrac: 0.30, wFrac: 0.42 }
            ];
            for (const tier of tiers){
                const tw = b.width * tier.wFrac;
                const th = fullH * tier.hFrac;
                const tx = sx + (b.width - tw) / 2;
                const ty = sy + b.height - (th - (GROUND_Y - b.y - b.height + 60)) ;
                const drawTy = GROUND_Y - camera.y + 60 - th;
                ctx.fillStyle = rgb(wall.map(v => Math.min(255, v + tier.wFrac * 15)));
                ctx.fillRect(tx, drawTy, tw, th);
                const cols = Math.max(2, Math.round(tw / 26));
                const rows = Math.max(2, Math.round(th / 26));
                const litColor = b.neon ? 'rgba(120,200,255,0.55)' : 'rgba(210,225,255,0.5)';
                drawWindowGrid(tx, drawTy, tw, th, cols, rows, litColor, 0.15);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(tx - 1, drawTy - 2, tw + 2, 2);
                if (b.neon) drawNeonTrim(tx, drawTy, tw, th, b.neonColor, b.seedTint);
            }
            // rooftop antenna array
            ctx.strokeStyle = b.neon ? b.neonColor : 'rgba(255,255,255,0.5)';
            if (b.neon){ ctx.shadowColor = b.neonColor; ctx.shadowBlur = 8; }
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sx + b.width * 0.5, sy - 6);
            ctx.lineTo(sx + b.width * 0.5, sy - 34);
            ctx.stroke();
            ctx.shadowBlur = 0;
            return;
        }

        if (b.style === 'spireTower'){
            const dayColor = lerpColor([160, 170, 190], [100, 110, 135], b.t);
            const wall = lerpColor(dayColor, [50, 40, 75], b.cyber);
            const bodyH = fullH * 0.85;
            const bodyTy = GROUND_Y - camera.y + 60 - bodyH;
            const bodyW = b.width * 0.7;
            const bodyTx = sx + (b.width - bodyW) / 2;
            ctx.fillStyle = rgb(wall);
            ctx.fillRect(bodyTx, bodyTy, bodyW, bodyH);
            const litColor = b.neon ? 'rgba(180,120,255,0.55)' : 'rgba(220,230,255,0.5)';
            drawWindowGrid(bodyTx, bodyTy, bodyW, bodyH, Math.max(2, Math.round(bodyW / 24)), Math.max(4, Math.round(bodyH / 26)), litColor, 0.15);
            if (b.neon) drawNeonTrim(bodyTx, bodyTy, bodyW, bodyH, b.neonColor, b.seedTint);
            if (b.searchlight) drawSearchlight(b, bodyTx, bodyTy - fullH * 0.15 - 26);
            // tapering spire
            ctx.fillStyle = rgb(wall.map(v => Math.max(0, v - 20)));
            ctx.beginPath();
            ctx.moveTo(bodyTx, bodyTy);
            ctx.lineTo(bodyTx + bodyW, bodyTy);
            ctx.lineTo(bodyTx + bodyW * 0.5, bodyTy - fullH * 0.15 - 10);
            ctx.closePath();
            ctx.fill();
            // mast + blinking light
            ctx.strokeStyle = '#8fa0ab';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(bodyTx + bodyW * 0.5, bodyTy - fullH * 0.15 - 10);
            ctx.lineTo(bodyTx + bodyW * 0.5, bodyTy - fullH * 0.15 - 26);
            ctx.stroke();
            ctx.fillStyle = '#ff5a5a';
            ctx.shadowColor = '#ff5a5a';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(bodyTx + bodyW * 0.5, bodyTy - fullH * 0.15 - 28, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            return;
        }
    }

    function drawBuildings(){
        for (const b of buildings){
            const sx = b.x - camera.x;
            if (sx + b.width < -60 || sx > W + 60) continue;
            drawBuilding(b);
            // rooftop platform ledge (the actual jump surface), always on top for clarity
            const sy = b.y - camera.y;
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillRect(sx - 2, sy - 2, b.width + 4, 2);
        }
    }

    // ---------- shared sword rendering ----------
    // draws a proper tapered blade + crossguard + grip + glowing edge,
    // extending downward (+y) from the local origin (the hand)
    function drawBlade(length, baseWidth, glowColor, edgeAlpha){
        ctx.fillStyle = '#2a2e33';
        ctx.beginPath(); ctx.arc(0, -5, 3.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3a3f45';
        ctx.fillRect(-2, -5, 4, 6);
        ctx.fillStyle = '#6b7178';
        ctx.fillRect(-8, 1, 16, 3.5);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(-8, 1, 16, 1);

        const bw = baseWidth;
        const bladeGrad = ctx.createLinearGradient(-bw / 2, 5, bw / 2, 5);
        bladeGrad.addColorStop(0, '#8f9aa1');
        bladeGrad.addColorStop(0.45, '#eef3f5');
        bladeGrad.addColorStop(0.55, '#eef3f5');
        bladeGrad.addColorStop(1, '#6f7a82');
        ctx.fillStyle = bladeGrad;
        ctx.beginPath();
        ctx.moveTo(-bw / 2, 5);
        ctx.lineTo(bw / 2, 5);
        ctx.lineTo(bw / 2 - 1.5, 5 + length * 0.82);
        ctx.lineTo(0, 5 + length);
        ctx.lineTo(-(bw / 2 - 1.5), 5 + length * 0.82);
        ctx.closePath();
        ctx.fill();

        if (glowColor){
            ctx.save();
            ctx.globalAlpha = edgeAlpha === undefined ? 1 : edgeAlpha;
            ctx.strokeStyle = glowColor;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 7;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(0, 6);
            ctx.lineTo(0, 5 + length * 0.96);
            ctx.stroke();
            ctx.restore();
        }
    }

    // a bright curved swoosh sweeping through the arc a blade just traveled
    function drawSlashArc(cx, cy, radius, fromAngle, toAngle, color, alpha){
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(cx, cy, radius, fromAngle, toAngle, toAngle < fromAngle);
        ctx.stroke();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, fromAngle, toAngle, toAngle < fromAngle);
        ctx.stroke();
        ctx.restore();
    }

    // little radiating spark burst, used for blocks/counters/kills
    function drawSparkBurst(cx, cy, color, progress){
        const n = 6;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.strokeStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.lineWidth = 2;
        for (let i = 0; i < n; i++){
            const a = (i / n) * Math.PI * 2;
            const r0 = 3 + progress * 4;
            const r1 = 3 + progress * 16;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
            ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
            ctx.stroke();
        }
        ctx.restore();
    }

    // ---------- enemies ----------
    function drawEnemy(e){
        const sx = e.x - camera.x;
        const sy = e.y - camera.y;
        if (sx < -100 || sx > W + 100) return;
        const dying = !e.alive;
        const deathT = dying ? 1 - Math.max(0, e.deathTimer) / 0.5 : 0; // 0..1
        const alpha = dying ? Math.max(0, 1 - deathT * 1.3) : 1;
        if (dying && e.deathParticles) drawDeathParticles(e, sx, sy);
        if (dying && alpha <= 0) return;

        // danger aura once the player is close enough to actually engage
        const inRange = e.alive && Math.hypot(
            (e.x + e.w / 2) - (player.x + player.w / 2),
            (e.y + e.h / 2) - (player.y + player.h / 2)
        ) <= SWORD_REACH;
        if (inRange){
            const pulse = 0.25 + 0.2 * Math.sin(gameTime * 8);
            ctx.save();
            ctx.globalAlpha = pulse;
            ctx.fillStyle = '#ff3b3b';
            ctx.shadowColor = '#ff3b3b';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.ellipse(sx + e.w / 2, sy + e.h * 0.55, e.w * 0.9, e.h * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(sx + e.w / 2, sy + e.h / 2);
        if (dying) ctx.rotate(deathT * 1.7);
        if (dying) ctx.scale(1 + deathT * 0.15, 1 - deathT * 0.3);

        // legs, with a knee-joint highlight for some real shape
        const legGrad = ctx.createLinearGradient(0, -e.h * 0.1, 0, e.h * 0.42);
        legGrad.addColorStop(0, '#8b9198');
        legGrad.addColorStop(1, '#5e6469');
        ctx.fillStyle = legGrad;
        roundRect(-9, e.h * 0.08, 7, e.h * 0.34, 2);
        ctx.fill();
        roundRect(2, e.h * 0.08, 7, e.h * 0.34, 2);
        ctx.fill();
        ctx.fillStyle = '#454a4f';
        ctx.fillRect(-9, e.h * 0.08 + e.h * 0.16, 7, 3);
        ctx.fillRect(2, e.h * 0.08 + e.h * 0.16, 7, 3);
        // feet
        ctx.fillStyle = '#3a3f44';
        ctx.fillRect(-10, e.h * 0.42, 9, 5);
        ctx.fillRect(1, e.h * 0.42, 9, 5);

        // torso — flat-ish grey with just a hint of shading (this is a basic
        // suburban-tier grunt, not a fancy machine — but "basic" still needs
        // real form, not a solid rectangle)
        const torsoGrad = ctx.createLinearGradient(-10, -e.h * 0.22, 10, e.h * 0.12);
        torsoGrad.addColorStop(0, '#a8aeb4');
        torsoGrad.addColorStop(0.5, '#8e949a');
        torsoGrad.addColorStop(1, '#666c71');
        ctx.fillStyle = torsoGrad;
        roundRect(-10, -e.h * 0.22, 20, e.h * 0.36, 4);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        roundRect(-10, e.h * 0.08, 20, 4, 2);
        ctx.fill();

        // pauldron (shoulder plate) on the sword side — gives it silhouette
        ctx.fillStyle = '#767c82';
        ctx.beginPath();
        ctx.moveTo(6, -e.h * 0.2);
        ctx.lineTo(17, -e.h * 0.16);
        ctx.lineTo(15, -e.h * 0.02);
        ctx.lineTo(6, -e.h * 0.06);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = e.hitFlash > 0 ? '#ff5050' : 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // off-arm
        ctx.fillStyle = '#7d8389';
        roundRect(-15, -e.h * 0.14, 6, e.h * 0.22, 2);
        ctx.fill();

        // head — angular, slanted visor so it actually reads as "hostile"
        ctx.fillStyle = '#9aa0a6';
        roundRect(-8, -e.h * 0.46, 16, 16, 3);
        ctx.fill();
        ctx.fillStyle = e.hitFlash > 0 ? '#ff4444' : '#22272c';
        ctx.beginPath();
        ctx.moveTo(-6, -e.h * 0.40);
        ctx.lineTo(6, -e.h * 0.42);
        ctx.lineTo(6, -e.h * 0.37);
        ctx.lineTo(-6, -e.h * 0.35);
        ctx.closePath();
        ctx.fill();
        if (e.hitFlash > 0){
            ctx.save();
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(-5, -e.h * 0.395, 10, 2.5);
            ctx.restore();
        }
        // small side vents on the helmet
        ctx.fillStyle = '#5e6469';
        ctx.fillRect(-9, -e.h * 0.42, 2, 6);
        ctx.fillRect(7, -e.h * 0.42, 2, 6);

        // sword arm: fast up/down swing while idle, held poses once engaged,
        // with a motion trail while it's actually whipping back and forth
        let swingAngle;
        if (e.comboStep === 0) swingAngle = Math.sin(gameTime * 7 + e.x * 0.01) * 0.9;
        else if (e.comboStep === 1) swingAngle = -1.1;      // stopped cold by the block
        else swingAngle = 1.3;                              // forced back onto itself

        if (e.comboStep === 0){
            for (const off of [0.22, 0.4]){
                ctx.save();
                ctx.translate(12, -e.h * 0.1);
                ctx.rotate(Math.sin(gameTime * 7 - off + e.x * 0.01) * 0.9);
                ctx.globalAlpha = alpha * (0.16 - off * 0.2);
                drawBlade(e.h * 0.4, 5, null);
                ctx.restore();
            }
        }
        ctx.save();
        ctx.translate(12, -e.h * 0.1);
        ctx.rotate(swingAngle);
        ctx.fillStyle = '#7d8389';
        roundRect(-3, 0, 6, e.h * 0.18, 2);
        ctx.fill();
        ctx.translate(0, e.h * 0.16);
        drawBlade(e.h * 0.4, 6, e.comboStep >= 1 ? '#ff5a3d' : null, 0.9);
        ctx.restore();

        ctx.restore();

        // Z / X / A progress pips above its head
        if (e.alive){
            const labels = ['Z', 'X', 'A'];
            for (let i = 0; i < 3; i++){
                const px = sx + e.w / 2 - 20 + i * 20;
                const py = sy - e.h * 0.5 - 16;
                const active = i < e.comboStep;
                ctx.save();
                if (active){ ctx.shadowColor = '#3dffb0'; ctx.shadowBlur = 6; }
                ctx.fillStyle = active ? '#3dffb0' : 'rgba(0,0,0,0.45)';
                ctx.beginPath();
                ctx.arc(px, py, 7.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = active ? '#08331f' : 'rgba(255,255,255,0.75)';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(labels[i], px, py + 3);
            }
        }
    }

    function drawDeathParticles(e, sx, sy){
        for (const p of e.deathParticles){
            const t = 1 - Math.max(0, e.deathTimer) / 0.5;
            const px = sx + e.w / 2 + p.vx * t * 40;
            const py = sy + e.h / 2 + p.vy * t * 40 + t * t * 60;
            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - t);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 5;
            ctx.fillRect(px - p.size / 2, py - p.size / 2, p.size, p.size);
            ctx.restore();
        }
    }

    function drawEnemies(){
        for (const e of enemies) drawEnemy(e);
    }

    // ---------- humanoid robot ----------
    function drawRobot(){
        const sx = player.x - camera.x;
        const sy = player.y - camera.y;
        const cx = sx + player.w / 2;
        const cy = sy + player.h / 2;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(player.facing, 1);

        const walk = player.onGround ? Math.sin(player.runPhase) : 0;
        const jumpPose = !player.onGround;

        // legs
        ctx.fillStyle = '#5b6b78';
        ctx.save();
        ctx.translate(-6, player.h * 0.12);
        ctx.rotate(jumpPose ? -0.35 : walk * 0.5);
        ctx.fillRect(-4, 0, 8, player.h * 0.34);
        ctx.fillStyle = '#37474f';
        ctx.fillRect(-5, player.h * 0.34 - 2, 10, 5);
        ctx.restore();

        ctx.fillStyle = '#5b6b78';
        ctx.save();
        ctx.translate(6, player.h * 0.12);
        ctx.rotate(jumpPose ? 0.5 : -walk * 0.5);
        ctx.fillRect(-4, 0, 8, player.h * 0.34);
        ctx.fillStyle = '#37474f';
        ctx.fillRect(-5, player.h * 0.34 - 2, 10, 5);
        ctx.restore();

        // torso
        const torsoGrad = ctx.createLinearGradient(-11, -player.h*0.22, 11, player.h*0.14);
        torsoGrad.addColorStop(0, '#c7d2d8');
        torsoGrad.addColorStop(0.5, '#8fa0ab');
        torsoGrad.addColorStop(1, '#5c6b76');
        ctx.fillStyle = torsoGrad;
        roundRect(-11, -player.h * 0.22, 22, player.h * 0.38, 5);
        ctx.fill();

        // chest core light
        ctx.fillStyle = '#4fd8ff';
        ctx.shadowColor = '#4fd8ff';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(0, -player.h * 0.06, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // back arm
        ctx.fillStyle = '#8fa0ab';
        ctx.save();
        ctx.translate(-11, -player.h * 0.16);
        ctx.rotate(jumpPose ? -0.9 : -walk * 0.5);
        ctx.fillRect(-4, 0, 8, player.h * 0.26);
        ctx.restore();

        // front (sword) arm — pose depends on combat state
        const swordLen = player.h * 0.58;
        let swordArmAngle, swordAlpha, glowColor = '#4fd8ff';
        let slashFrom = null, slashTo = null;
        if (player.combatPose === 'block'){
            swordArmAngle = -0.75; // raised diagonal guard
            swordAlpha = 1;
        } else if (player.combatPose === 'counter'){
            const p = 1 - Math.max(0, player.combatTimer) / 0.28;
            swordArmAngle = lerp(-0.75, -0.1, Math.min(1, p * 2)); // sharp forward thrust
            swordAlpha = 1;
            glowColor = '#ff5a3d';
        } else if (player.combatPose === 'kill'){
            const p = 1 - Math.max(0, player.combatTimer) / 0.35;
            const startA = -1.3, endA = 1.5;
            swordArmAngle = lerp(startA, endA, Math.min(1, p * 1.25));
            swordAlpha = 1;
            glowColor = '#ffffff';
            if (p > 0.05 && p < 0.9){ slashFrom = startA; slashTo = swordArmAngle; }
        } else {
            swordArmAngle = jumpPose ? 0.6 : walk * 0.5;
            swordAlpha = 0.55; // resting/sheathed look
        }

        if (slashFrom !== null){
            // already inside the translate(cx,cy)+scale(facing,1) transform,
            // so this is local space — same origin the sword arm itself uses
            drawSlashArc(11, -player.h * 0.16, player.h * 0.5, slashFrom, slashTo, '#bfe9ff', 0.8);
        }

        ctx.save();
        ctx.translate(11, -player.h * 0.16);
        ctx.rotate(swordArmAngle);
        ctx.fillStyle = '#8fa0ab';
        ctx.fillRect(-4, 0, 8, player.h * 0.26);
        ctx.save();
        ctx.globalAlpha = swordAlpha;
        ctx.translate(0, player.h * 0.24);
        drawBlade(swordLen, 7, glowColor, player.combatPose !== 'idle' ? 1 : 0.4);
        ctx.restore();
        ctx.restore();

        // head
        ctx.fillStyle = '#c7d2d8';
        roundRect(-9, -player.h * 0.46, 18, 16, 4);
        ctx.fill();

        // visor
        ctx.fillStyle = '#0d1b22';
        roundRect(-7, -player.h * 0.43, 14, 6, 2);
        ctx.fill();
        ctx.fillStyle = '#4fd8ff';
        ctx.shadowColor = '#4fd8ff';
        ctx.shadowBlur = 6;
        ctx.fillRect(-5, -player.h * 0.42, 10, 3);
        ctx.shadowBlur = 0;

        // antenna
        ctx.strokeStyle = '#8fa0ab';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -player.h * 0.46);
        ctx.lineTo(0, -player.h * 0.56);
        ctx.stroke();
        ctx.fillStyle = '#ff5a5a';
        ctx.beginPath();
        ctx.arc(0, -player.h * 0.57, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function roundRect(x, y, w, h, r){
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function render(){
        drawBackground();
        drawBuildings();
        drawEnemies();
        drawRobot();
        for (const fx of effects){
            const progress = (gameTime - fx.start) / fx.duration;
            drawSparkBurst(fx.x - camera.x, fx.y - camera.y, fx.color, progress);
        }
        if (deathFlash > 0){
            ctx.save();
            ctx.globalAlpha = (deathFlash / 0.3) * 0.55;
            ctx.fillStyle = '#ff2020';
            ctx.fillRect(0, 0, W, H);
            ctx.restore();
        }
    }

    let last = performance.now();
    let gameTime = 0;
    function loop(now){
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        gameTime += dt;
        update(dt);
        updateCamera();
        render();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
})();
</script>

</body>
</html>

        camera.y += (Math.min(0, targetY) - camera.y) * 0.08;
        camera.x = Math.max(-150, Math.min(WORLD_LENGTH - W + 150, camera.x));
    }

    // ---------- palette: suburban -> urban -> metropolis -> cyberpunk ----------
    function lerp(a, b, t){ return a + (b - a) * t; }
    function hexToRgb(h){
        const n = parseInt(h.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function lerpColor(c1, c2, t){
        return [
            Math.round(lerp(c1[0], c2[0], t)),
            Math.round(lerp(c1[1], c2[1], t)),
            Math.round(lerp(c1[2], c2[2], t))
        ];
    }
    function rgb(c, a){ return a === undefined ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
    function multiLerp(stops, t){
        if (t <= stops[0].t) return stops[0].c;
        if (t >= stops[stops.length - 1].t) return stops[stops.length - 1].c;
        for (let i = 0; i < stops.length - 1; i++){
            if (t >= stops[i].t && t <= stops[i + 1].t){
                const lt = (t - stops[i].t) / (stops[i + 1].t - stops[i].t);
                return lerpColor(stops[i].c, stops[i + 1].c, lt);
            }
        }
        return stops[stops.length - 1].c;
    }

    // stage stops: suburban(day) -> urban(hazy day) -> metropolis(dusk) -> cyberpunk(neon night)
    const SKY_TOP_STOPS = [
        { t: 0,    c: [140, 200, 245] },
        { t: 0.26, c: [120, 160, 205] },
        { t: 0.54, c: [90, 95, 150] },
        { t: 0.80, c: [35, 25, 70] },
        { t: 1,    c: [12, 8, 35] }
    ];
    const SKY_BOT_STOPS = [
        { t: 0,    c: [225, 245, 250] },
        { t: 0.26, c: [195, 205, 220] },
        { t: 0.54, c: [235, 170, 140] },
        { t: 0.80, c: [120, 60, 110] },
        { t: 1,    c: [50, 20, 60] }
    ];
    const SKYLINE_STOPS = [
        { t: 0,    c: [150, 205, 150] },
        { t: 0.26, c: [120, 135, 150] },
        { t: 0.54, c: [70, 75, 100] },
        { t: 0.80, c: [40, 30, 60] },
        { t: 1,    c: [20, 15, 35] }
    ];
    const GROUND_STOPS = [
        { t: 0,    c: [120, 170, 110] },
        { t: 0.26, c: [95, 100, 105] },
        { t: 0.54, c: [65, 68, 75] },
        { t: 0.80, c: [30, 28, 40] },
        { t: 1,    c: [15, 12, 25] }
    ];

    function currentProgress(){
        return Math.max(0, Math.min(1, camera.x / WORLD_LENGTH));
    }

    // small glowing motes drifting slowly upward through the skyline — tiled
    // deterministically off camera.x so they stay put as you scroll instead
    // of swimming around
    function drawAmbientParticles(p){
        const intensity = smoothstep(0.35, 0.7, p);
        if (intensity <= 0) return;
        ctx.save();
        const cellW = 90;
        const colors = ['#ff2fd6', '#38f2ff', '#b060ff', '#3dffb0'];
        for (let x = -cellW; x < W + cellW; x += cellW){
            const worldCol = Math.floor((x + camera.x) / cellW);
            const rx = ((worldCol * 928371 + 12345) % 1000) / 1000;
            const rSpeed = 14 + rx * 22;
            const baseY = 120 + ((worldCol * 55731) % 240);
            const drift = ((gameTime * rSpeed + rx * 300) % 260);
            const py = GROUND_Y - 40 - drift;
            const localX = x - ((camera.x) % cellW) + (rx - 0.5) * 40;
            const twinkle = 0.35 + 0.4 * Math.abs(Math.sin(gameTime * 2 + worldCol));
            ctx.globalAlpha = intensity * twinkle * (1 - drift / 280);
            ctx.fillStyle = colors[Math.abs(worldCol) % colors.length];
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(localX, py, 1.6, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // a couple of distant aircraft/drones drifting across the skyline with
    // blinking nav lights — genuine motion, not just a pulsing glow
    function drawSkyTraffic(p){
        const intensity = smoothstep(0.4, 0.75, p);
        if (intensity <= 0) return;
        for (let lane = 0; lane < 2; lane++){
            const speed = lane === 0 ? 26 : -19;
            const laneY = 70 + lane * 46;
            const cycle = 2600;
            const worldX = ((gameTime * speed * 10) % cycle + cycle) % cycle;
            const sx = (worldX - camera.x * 0.5) % (W + 300) - 150;
            const blink = Math.sin(gameTime * 6 + lane * 3) > 0.6;
            ctx.save();
            ctx.globalAlpha = intensity;
            ctx.fillStyle = '#1c2430';
            ctx.beginPath();
            ctx.ellipse(sx, laneY, 10, 3.2, 0, 0, Math.PI * 2);
            ctx.fill();
            if (blink){
                ctx.fillStyle = lane === 0 ? '#ff5a5a' : '#38f2ff';
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(sx + (speed > 0 ? 9 : -9), laneY, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    function drawBackground(){
        const p = currentProgress();
        const skyTop = multiLerp(SKY_TOP_STOPS, p);
        const skyBot = multiLerp(SKY_BOT_STOPS, p);
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgb(skyTop));
        g.addColorStop(1, rgb(skyBot));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        // sun by day, neon moon by night
        ctx.save();
        if (p < 0.7){
            ctx.globalAlpha = 0.9 - p * 0.5;
            ctx.fillStyle = '#fff6d8';
            ctx.beginPath();
            ctx.arc(W * 0.82, H * 0.18, 46, 0, Math.PI * 2);
            ctx.fill();
        } else {
            const glowT = (p - 0.7) / 0.3;
            ctx.globalAlpha = 0.5 + glowT * 0.4;
            ctx.fillStyle = '#ff5fe0';
            ctx.shadowColor = '#ff5fe0';
            ctx.shadowBlur = 40;
            ctx.beginPath();
            ctx.arc(W * 0.8, H * 0.16, 34, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.restore();

        // distant skyline silhouette (denser + taller as the city grows)
        const skylineColor = multiLerp(SKYLINE_STOPS, p);
        ctx.fillStyle = rgb(skylineColor);
        ctx.globalAlpha = 0.6;
        const parX = -camera.x * 0.25;
        const towerW = 46;
        const baseY = GROUND_Y - 40;
        ctx.beginPath();
        ctx.moveTo(-200, baseY);
        for (let x = -200; x < W + 200; x += towerW){
            const n = Math.floor((x + parX) / towerW);
            const h = 40 + Math.abs(Math.sin(n * 12.9898) * 43758.5453 % 1) * (60 + p * 170);
            const localX = x - ((parX) % towerW);
            ctx.lineTo(localX, baseY - h);
            ctx.lineTo(localX + towerW, baseY - h);
        }
        ctx.lineTo(W + 200, baseY);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;

        // faint neon glow rising off the skyline once we're deep in cyberpunk territory
        if (p > 0.78){
            const glowA = ((p - 0.78) / 0.22) * 0.25;
            ctx.save();
            ctx.globalAlpha = glowA;
            const beamG = ctx.createLinearGradient(0, baseY - 220, 0, baseY);
            beamG.addColorStop(0, 'rgba(255,60,220,0)');
            beamG.addColorStop(1, 'rgba(120,80,255,0.5)');
            ctx.fillStyle = beamG;
            ctx.fillRect(0, baseY - 220, W, 220);
            ctx.restore();
        }

        // drifting ambient light particles + a couple of blinking flying craft,
        // once there's enough neon around for them to make sense
        if (p > 0.35){
            drawAmbientParticles(p);
            drawSkyTraffic(p);
        }

        // ground strip
        ctx.fillStyle = rgb(multiLerp(GROUND_STOPS, p));
        ctx.fillRect(0, GROUND_Y - camera.y, W, H - (GROUND_Y - camera.y));

        // wet-neon reflective streaks on the cyberpunk-stage road
        if (p > 0.75){
            ctx.save();
            ctx.globalAlpha = ((p - 0.75) / 0.25) * 0.5;
            for (let i = 0; i < 6; i++){
                const rx = ((i * 173 - camera.x * 0.6) % (W + 200)) - 100;
                ctx.strokeStyle = i % 2 === 0 ? '#ff2fd6' : '#38f2ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(rx, GROUND_Y - camera.y + 10);
                ctx.lineTo(rx + 40, H);
                ctx.stroke();
            }
            ctx.restore();
        }
    }

    // ---------- window grid helper: shared by every skyscraper style ----------
    function drawWindowGrid(sx, topY, width, spanH, cols, rows, litColor, dimAlpha){
        const padX = width * 0.1, padY = 10;
        const cellW = (width - padX * 2) / cols;
        const cellH = Math.min(24, (spanH - padY * 2) / rows);
        for (let r = 0; r < rows; r++){
            for (let c = 0; c < cols; c++){
                const wx = sx + padX + c * cellW + cellW * 0.18;
                const wy = topY + padY + r * cellH + cellH * 0.18;
                if (wy > GROUND_Y - camera.y + 40) continue;
                const lit = ((r * 7 + c * 13 + Math.floor(sx)) % 5) !== 0;
                ctx.fillStyle = lit ? litColor : `rgba(20,25,35,${dimAlpha})`;
                ctx.fillRect(wx, wy, cellW * 0.64, cellH * 0.6);
            }
        }
    }

    function drawNeonTrim(sx, sy, w, h, color, phase){
        const pulse = 0.75 + 0.25 * Math.sin(gameTime * 2.4 + (phase || 0) * 6.283);
        ctx.save();
        ctx.globalAlpha = pulse;
        ctx.strokeStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 7 + pulse * 6;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(sx, sy + h);
        ctx.lineTo(sx, sy);
        ctx.lineTo(sx + w, sy);
        ctx.lineTo(sx + w, sy + h);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();
    }

    function drawHolographicSign(sx, sy, w, color, phase){
        const pulse = 0.7 + 0.3 * Math.sin(gameTime * 1.8 + (phase || 0) * 6.283);
        ctx.save();
        const signW = Math.min(w * 0.7, 46);
        const px = sx + w / 2 - signW / 2;
        const py = sy + 14;
        ctx.globalAlpha = 0.75 * pulse;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10 + pulse * 8;
        ctx.fillRect(px, py, signW, 4);
        ctx.fillRect(px, py + 6, signW * 0.6, 4);
        ctx.fillRect(px, py + 12, signW * 0.8, 4);
        ctx.restore();
    }

    // rooftop gadgets: dishes, vent stacks, helipads — variety beyond the
    // per-style decorations already baked into each tower type
    function drawRooftopGadget(b, sx, sy){
        if (b.gadget === 'none') return;
        const cx = sx + b.width * 0.5;
        if (b.gadget === 'dish'){
            ctx.save();
            ctx.translate(sx + b.width * 0.28, sy - 14);
            ctx.rotate(-0.5);
            ctx.fillStyle = '#c7d0d6';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI, true);
            ctx.fill();
            ctx.strokeStyle = '#8fa0ab';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -3);
            ctx.lineTo(0, -12);
            ctx.stroke();
            ctx.restore();
        } else if (b.gadget === 'vents'){
            ctx.fillStyle = '#4a5560';
            for (let i = 0; i < 3; i++){
                const vx = sx + b.width * (0.2 + i * 0.22);
                ctx.fillRect(vx, sy - 14, 7, 12);
                const glowA = 0.35 + 0.25 * Math.sin(gameTime * 3 + i + b.seedTint * 6);
                ctx.save();
                ctx.globalAlpha = glowA;
                ctx.fillStyle = '#ff8a3d';
                ctx.fillRect(vx + 1, sy - 13, 5, 2);
                ctx.restore();
                ctx.fillStyle = '#4a5560';
            }
        } else if (b.gadget === 'helipad'){
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, sy - 12, 14, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('H', cx, sy - 8);
            const ringPulse = 0.3 + 0.5 * Math.abs(Math.sin(gameTime * 1.6 + b.seedTint * 6));
            ctx.strokeStyle = `rgba(255,60,220,${ringPulse})`;
            ctx.shadowColor = '#ff2fd6';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(cx, sy - 12, 16, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        } else if (b.gadget === 'antenna'){
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx, sy - 4);
            ctx.lineTo(cx, sy - 22);
            ctx.stroke();
            ctx.fillStyle = '#ff5a5a';
            ctx.beginPath();
            ctx.arc(cx, sy - 24, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // rotating searchlight beam sweeping from a rooftop
    function drawSearchlight(b, sx, sy){
        const angle = -Math.PI / 2 + Math.sin(gameTime * 0.35 + b.seedTint * 6.283) * 0.9;
        const len = 420;
        const spread = 0.16;
        const ex1 = sx + b.width * 0.5 + Math.cos(angle - spread) * len;
        const ey1 = sy + Math.sin(angle - spread) * len;
        const ex2 = sx + b.width * 0.5 + Math.cos(angle + spread) * len;
        const ey2 = sy + Math.sin(angle + spread) * len;
        ctx.save();
        const g = ctx.createLinearGradient(sx + b.width * 0.5, sy, (ex1 + ex2) / 2, (ey1 + ey2) / 2);
        g.addColorStop(0, 'rgba(255,80,220,0.28)');
        g.addColorStop(1, 'rgba(255,80,220,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(sx + b.width * 0.5, sy);
        ctx.lineTo(ex1, ey1);
        ctx.lineTo(ex2, ey2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function drawBuilding(b){
        const sx = b.x - camera.x;
        const sy = b.y - camera.y;
        const fullH = GROUND_Y - b.y + 60;

        if (b.style === 'house'){
            const wall = lerpColor([248, 232, 200], [225, 205, 175], b.seedTint);
            ctx.fillStyle = rgb(wall);
            ctx.fillRect(sx, sy, b.width, fullH);
            drawWindowGrid(sx, sy, b.width, b.height, Math.max(2, Math.round(b.width / 55)), 2, 'rgba(255,235,180,0.65)', 0.15);
            // terracotta roof ledge
            ctx.fillStyle = '#b96a55';
            ctx.fillRect(sx - 2, sy - 8, b.width + 4, 12);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(sx - 2, sy - 8, b.width + 4, 2);
            // chimney
            ctx.fillStyle = '#8a5a4a';
            ctx.fillRect(sx + b.width * 0.72, sy - 26, 10, 20);
            return;
        }

        if (b.style === 'glassTower'){
            const wallLit = lerpColor([170, 195, 210], [120, 150, 195], b.t);
            const grad = ctx.createLinearGradient(sx, sy, sx + b.width, sy);
            grad.addColorStop(0, rgb(wallLit));
            grad.addColorStop(0.45, rgb(wallLit.map(v => Math.min(255, v + 35))));
            grad.addColorStop(1, rgb(wallLit.map(v => Math.max(0, v - 25))));
            ctx.fillStyle = grad;
            ctx.fillRect(sx, sy, b.width, fullH);
            const litColor = b.neon ? 'rgba(255,90,230,0.55)' : 'rgba(210,235,255,0.55)';
            drawWindowGrid(sx, sy, b.width, b.height, Math.max(3, Math.round(b.width / 26)), Math.max(4, Math.round(b.height / 26)), litColor, 0.12);
            // flat roof + AC unit
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.fillRect(sx - 2, sy - 3, b.width + 4, 3);
            ctx.fillStyle = '#5b6b78';
            ctx.fillRect(sx + b.width * 0.15, sy - 12, b.width * 0.22, 10);
            if (b.neon) drawNeonTrim(sx, sy, b.width, fullH, b.neonColor, b.seedTint);
            if (b.neon && b.height > 420) drawHolographicSign(sx, sy, b.width, b.neonColor, b.seedTint);
            drawRooftopGadget(b, sx, sy);
            if (b.searchlight) drawSearchlight(b, sx, sy - 12);
            return;
        }

        if (b.style === 'brickTower'){
            const wall = lerpColor([200, 170, 150], [140, 120, 115], b.t);
            ctx.fillStyle = rgb(wall);
            ctx.fillRect(sx, sy, b.width, fullH);
            drawWindowGrid(sx, sy, b.width, b.height, Math.max(3, Math.round(b.width / 32)), Math.max(3, Math.round(b.height / 30)), 'rgba(255,225,160,0.6)', 0.18);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(sx - 2, sy - 3, b.width + 4, 3);
            // water tower silhouette
            ctx.fillStyle = '#3d3530';
            ctx.beginPath();
            ctx.moveTo(sx + b.width * 0.5 - 8, sy - 4);
            ctx.lineTo(sx + b.width * 0.5 + 8, sy - 4);
            ctx.lineTo(sx + b.width * 0.5 + 6, sy - 20);
            ctx.lineTo(sx + b.width * 0.5 - 6, sy - 20);
            ctx.closePath();
            ctx.fill();
            ctx.fillRect(sx + b.width * 0.5 - 6, sy - 22, 12, 4);
            if (b.neon) drawNeonTrim(sx, sy, b.width, fullH, b.neonColor, b.seedTint);
            drawRooftopGadget(b, sx, sy);
            return;
        }

        if (b.style === 'steppedTower'){
            const dayColor = lerpColor([150, 165, 185], [95, 105, 130], b.t);
            const wall = lerpColor(dayColor, [55, 45, 80], b.cyber);
            const tiers = [
                { hFrac: 1.0,  wFrac: 1.0 },
                { hFrac: 0.62, wFrac: 0.68 },
                { hFrac: 0.30, wFrac: 0.42 }
            ];
            for (const tier of tiers){
                const tw = b.width * tier.wFrac;
                const th = fullH * tier.hFrac;
                const tx = sx + (b.width - tw) / 2;
                const ty = sy + b.height - (th - (GROUND_Y - b.y - b.height + 60)) ;
                const drawTy = GROUND_Y - camera.y + 60 - th;
                ctx.fillStyle = rgb(wall.map(v => Math.min(255, v + tier.wFrac * 15)));
                ctx.fillRect(tx, drawTy, tw, th);
                const cols = Math.max(2, Math.round(tw / 26));
                const rows = Math.max(2, Math.round(th / 26));
                const litColor = b.neon ? 'rgba(120,200,255,0.55)' : 'rgba(210,225,255,0.5)';
                drawWindowGrid(tx, drawTy, tw, th, cols, rows, litColor, 0.15);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(tx - 1, drawTy - 2, tw + 2, 2);
                if (b.neon) drawNeonTrim(tx, drawTy, tw, th, b.neonColor, b.seedTint);
            }
            // rooftop antenna array
            ctx.strokeStyle = b.neon ? b.neonColor : 'rgba(255,255,255,0.5)';
            if (b.neon){ ctx.shadowColor = b.neonColor; ctx.shadowBlur = 8; }
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sx + b.width * 0.5, sy - 6);
            ctx.lineTo(sx + b.width * 0.5, sy - 34);
            ctx.stroke();
            ctx.shadowBlur = 0;
            return;
        }

        if (b.style === 'spireTower'){
            const dayColor = lerpColor([160, 170, 190], [100, 110, 135], b.t);
            const wall = lerpColor(dayColor, [50, 40, 75], b.cyber);
            const bodyH = fullH * 0.85;
            const bodyTy = GROUND_Y - camera.y + 60 - bodyH;
            const bodyW = b.width * 0.7;
            const bodyTx = sx + (b.width - bodyW) / 2;
            ctx.fillStyle = rgb(wall);
            ctx.fillRect(bodyTx, bodyTy, bodyW, bodyH);
            const litColor = b.neon ? 'rgba(180,120,255,0.55)' : 'rgba(220,230,255,0.5)';
            drawWindowGrid(bodyTx, bodyTy, bodyW, bodyH, Math.max(2, Math.round(bodyW / 24)), Math.max(4, Math.round(bodyH / 26)), litColor, 0.15);
            if (b.neon) drawNeonTrim(bodyTx, bodyTy, bodyW, bodyH, b.neonColor, b.seedTint);
            if (b.searchlight) drawSearchlight(b, bodyTx, bodyTy - fullH * 0.15 - 26);
            // tapering spire
            ctx.fillStyle = rgb(wall.map(v => Math.max(0, v - 20)));
            ctx.beginPath();
            ctx.moveTo(bodyTx, bodyTy);
            ctx.lineTo(bodyTx + bodyW, bodyTy);
            ctx.lineTo(bodyTx + bodyW * 0.5, bodyTy - fullH * 0.15 - 10);
            ctx.closePath();
            ctx.fill();
            // mast + blinking light
            ctx.strokeStyle = '#8fa0ab';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(bodyTx + bodyW * 0.5, bodyTy - fullH * 0.15 - 10);
            ctx.lineTo(bodyTx + bodyW * 0.5, bodyTy - fullH * 0.15 - 26);
            ctx.stroke();
            ctx.fillStyle = '#ff5a5a';
            ctx.shadowColor = '#ff5a5a';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(bodyTx + bodyW * 0.5, bodyTy - fullH * 0.15 - 28, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            return;
        }
    }

    function drawBuildings(){
        for (const b of buildings){
            const sx = b.x - camera.x;
            if (sx + b.width < -60 || sx > W + 60) continue;
            drawBuilding(b);
            // rooftop platform ledge (the actual jump surface), always on top for clarity
            const sy = b.y - camera.y;
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillRect(sx - 2, sy - 2, b.width + 4, 2);
        }
    }

    // ---------- shared sword rendering ----------
    // draws a proper tapered blade + crossguard + grip + glowing edge,
    // extending downward (+y) from the local origin (the hand)
    function drawBlade(length, baseWidth, glowColor, edgeAlpha){
        ctx.fillStyle = '#2a2e33';
        ctx.beginPath(); ctx.arc(0, -5, 3.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3a3f45';
        ctx.fillRect(-2, -5, 4, 6);
        ctx.fillStyle = '#6b7178';
        ctx.fillRect(-8, 1, 16, 3.5);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(-8, 1, 16, 1);

        const bw = baseWidth;
        const bladeGrad = ctx.createLinearGradient(-bw / 2, 5, bw / 2, 5);
        bladeGrad.addColorStop(0, '#8f9aa1');
        bladeGrad.addColorStop(0.45, '#eef3f5');
        bladeGrad.addColorStop(0.55, '#eef3f5');
        bladeGrad.addColorStop(1, '#6f7a82');
        ctx.fillStyle = bladeGrad;
        ctx.beginPath();
        ctx.moveTo(-bw / 2, 5);
        ctx.lineTo(bw / 2, 5);
        ctx.lineTo(bw / 2 - 1.5, 5 + length * 0.82);
        ctx.lineTo(0, 5 + length);
        ctx.lineTo(-(bw / 2 - 1.5), 5 + length * 0.82);
        ctx.closePath();
        ctx.fill();

        if (glowColor){
            ctx.save();
            ctx.globalAlpha = edgeAlpha === undefined ? 1 : edgeAlpha;
            ctx.strokeStyle = glowColor;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 7;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(0, 6);
            ctx.lineTo(0, 5 + length * 0.96);
            ctx.stroke();
            ctx.restore();
        }
    }

    // a bright curved swoosh sweeping through the arc a blade just traveled
    function drawSlashArc(cx, cy, radius, fromAngle, toAngle, color, alpha){
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(cx, cy, radius, fromAngle, toAngle, toAngle < fromAngle);
        ctx.stroke();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, fromAngle, toAngle, toAngle < fromAngle);
        ctx.stroke();
        ctx.restore();
    }

    // little radiating spark burst, used for blocks/counters/kills
    function drawSparkBurst(cx, cy, color, progress){
        const n = 8;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.strokeStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;
        ctx.lineWidth = 3;
        for (let i = 0; i < n; i++){
            const a = (i / n) * Math.PI * 2;
            const r0 = 4 + progress * 8;
            const r1 = 4 + progress * 28;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
            ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
            ctx.stroke();
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - progress * 1.6);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(cx, cy, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.restore();
    }

    // ---------- enemies ----------
    // the billboard enemy's blocks, up on a sign on the next rooftop
    function drawBillboard(e){
        const b = buildings[e.billboardOn];
        const bx = b.x + b.width * 0.78 - camera.x;
        const roofY = b.y - camera.y;
        if (bx < -150 || bx > W + 150) return;
        ctx.save();
        ctx.fillStyle = '#3a3f4a';
        ctx.fillRect(bx - 30, roofY - 152, 4, 152);
        ctx.fillRect(bx + 26, roofY - 152, 4, 152);
        roundRect(bx - 52, roofY - 200, 104, 50, 5);
        ctx.fillStyle = '#14171c';
        ctx.fill();
        ctx.strokeStyle = '#3df2ff';
        ctx.shadowColor = '#3df2ff';
        ctx.shadowBlur = e.alive ? 10 : 0;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#9fefff';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(e.alive ? 'TONIGHT ONLY' : 'SOLD OUT', bx, roofY - 185);
        ctx.font = 'bold 15px sans-serif';
        ctx.fillStyle = e.alive ? '#ffffff' : '#5e6b78';
        ctx.fillText('BLOCKS ' + e.blocks.map(x => x.toUpperCase()).join(', '), bx, roofY - 164);
        ctx.restore();
    }

    function drawDrone(e, sx, sy){
        const dx = sx + e.w / 2 + Math.cos(e.droneAngle) * 30;
        const dy = sy + e.h * 0.2 + Math.sin(e.droneAngle) * 6;
        const front = Math.sin(e.droneAngle) > 0.35;
        const sc = 0.8 + 0.25 * Math.sin(e.droneAngle);
        ctx.save();
        ctx.translate(dx, dy);
        ctx.scale(sc, sc);
        ctx.fillStyle = '#2a2f38';
        ctx.fillRect(-11, -1.5, 22, 3);
        ctx.fillStyle = 'rgba(200,220,235,0.7)';
        const spin = gameTime * 40;
        for (const px of [-11, 11]){
            ctx.fillRect(px - 6 * Math.abs(Math.cos(spin)), -3.5, 12 * Math.abs(Math.cos(spin)), 1.5);
        }
        ctx.fillStyle = '#3d4452';
        roundRect(-5, -3, 10, 7, 2);
        ctx.fill();
        ctx.fillStyle = front ? '#ffcf3d' : '#ff3b3b';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(0, 1, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawEnemy(e){
        if (e.billboardOn != null) drawBillboard(e);
        const sx = e.x - camera.x;
        const sy = e.y - camera.y;
        if (sx < -100 || sx > W + 100) return;
        if (e.roofGlow && e.alive){
            // kingpin finale: the whole penthouse roof lights up
            const rb = buildingAt(e.x + e.w / 2);
            if (rb){
                ctx.save();
                ctx.strokeStyle = '#ff3fd2';
                ctx.shadowColor = '#ff3fd2';
                ctx.shadowBlur = 14 + 6 * Math.sin(gameTime * 6);
                ctx.lineWidth = 3;
                ctx.strokeRect(rb.x - camera.x, rb.y - camera.y, rb.width, 4);
                ctx.restore();
            }
        }
        if (e.droneAlive && e.alive && Math.sin(e.droneAngle) <= 0.35) drawDrone(e, sx, sy); // behind the bot
        if (e.washRoofY != null && e.alive){
            // gondola: platform under its feet, cables up to a davit on the roof
            const roofSY = e.washRoofY - camera.y;
            const cx = sx + e.w / 2;
            ctx.save();
            ctx.strokeStyle = '#3a3f4a';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx - 18, sy + e.h + 2); ctx.lineTo(cx - 18, roofSY - 28);
            ctx.moveTo(cx + 18, sy + e.h + 2); ctx.lineTo(cx + 18, roofSY - 28);
            ctx.stroke();
            ctx.fillStyle = '#3a3f4a';
            ctx.fillRect(cx - 34, roofSY - 30, 54, 4);
            ctx.fillRect(cx - 34, roofSY - 30, 4, 30);
            ctx.fillStyle = e.level ? '#3dff7a' : '#ffcf3d';
            ctx.fillRect(cx - 24, sy + e.h, 48, 5);
            ctx.fillStyle = '#2a2f38';
            ctx.fillRect(cx - 24, sy + e.h + 5, 48, 10);
            ctx.restore();
        }
        if (e.sniper && e.alive && e.aiming){
            // laser sight, flaring as it's about to fire
            const fx = sx + e.w / 2, fy = sy + e.h * 0.12;
            const px = player.x + player.w / 2 - camera.x, py = player.y + player.h * 0.4 - camera.y;
            ctx.save();
            ctx.strokeStyle = e.charging ? 'rgba(255,40,40,0.9)' : 'rgba(255,40,40,0.35)';
            ctx.lineWidth = e.charging ? 2 : 1;
            ctx.shadowColor = '#ff2828';
            ctx.shadowBlur = e.charging ? 10 : 0;
            ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(px, py); ctx.stroke();
            ctx.fillStyle = '#ff2828';
            ctx.beginPath(); ctx.arc(px, py, e.charging ? 5 + Math.sin(gameTime * 30) * 1.5 : 3, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
        const dying = !e.alive;
        const deathT = dying ? 1 - Math.max(0, e.deathTimer) / 0.5 : 0; // 0..1
        const alpha = dying ? Math.max(0, 1 - deathT * 1.3) : 1;
        if (dying && e.deathParticles) drawDeathParticles(e, sx, sy);
        if (dying && alpha <= 0) return;

        // danger aura once the player is close enough to actually engage
        const inRange = e.alive && Math.hypot(
            (e.x + e.w / 2) - (player.x + player.w / 2),
            (e.y + e.h / 2) - (player.y + player.h / 2)
        ) <= SWORD_REACH;
        if (inRange){
            const pulse = 0.25 + 0.2 * Math.sin(gameTime * 8);
            ctx.save();
            ctx.globalAlpha = pulse;
            ctx.fillStyle = '#ff3b3b';
            ctx.shadowColor = '#ff3b3b';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.ellipse(sx + e.w / 2, sy + e.h * 0.55, e.w * 0.9, e.h * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // lunges toward the player while delivering the punishing strike
        const lungeDir = Math.sign((player.x + player.w / 2) - (e.x + e.w / 2)) || 1;
        const lungeX = (e.punishLunge || 0) * lungeDir * 22;

        const isPatroller = e.type === 'swordPatroller';
        const isCharger = e.type === 'chargerSlasher';
        const isCourier = e.type === 'courier';
        const walking = (isPatroller || isCharger) && e.alive;
        const facingDir = isPatroller ? e.patrolDir : (isCharger || isCourier ? e.facing : 1);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(sx + e.w / 2 + lungeX, sy + e.h / 2);
        if (e.bossPhases){
            // the overseer stands a head taller (scaled up from its feet)
            // and wears a gold crest
            ctx.translate(0, e.h / 2);
            ctx.scale(1.35, 1.35);
            ctx.translate(0, -e.h / 2);
            ctx.fillStyle = '#ffcf3d';
            ctx.beginPath();
            ctx.moveTo(-9, -e.h * 0.5 + 2);
            ctx.lineTo(-9, -e.h * 0.5 - 7);
            ctx.lineTo(-4.5, -e.h * 0.5 - 2);
            ctx.lineTo(0, -e.h * 0.5 - 10);
            ctx.lineTo(4.5, -e.h * 0.5 - 2);
            ctx.lineTo(9, -e.h * 0.5 - 7);
            ctx.lineTo(9, -e.h * 0.5 + 2);
            ctx.closePath();
            ctx.fill();
        }
        const elite = e.elite && !dying;
        if (e.elite && !e.bossPhases){
            ctx.translate(0, e.h / 2);
            ctx.scale(1.15, 1.15);
            ctx.translate(0, -e.h / 2);
        }
        if (elite){
            // neon pool of light under its feet
            ctx.save();
            ctx.globalAlpha *= 0.45;
            ctx.fillStyle = e.accent;
            ctx.shadowColor = e.accent;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.ellipse(0, e.h * 0.5, 22, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            // energy sparks drifting up off the chassis
            ctx.save();
            ctx.fillStyle = e.accent;
            ctx.shadowColor = e.accent;
            ctx.shadowBlur = 6;
            for (let i = 0; i < 6; i++){
                const t = (gameTime * 0.7 + i / 6 + e.x * 0.001) % 1;
                const px = Math.sin(i * 2.7 + gameTime * 1.3) * 16;
                const py = e.h * 0.45 - t * e.h * 1.1;
                ctx.globalAlpha = (1 - t) * 0.8;
                ctx.fillRect(px - 1, py - 1, 2, 2);
            }
            ctx.restore();
        }
        if (isPatroller || isCharger || isCourier) ctx.scale(facingDir, 1);
        // glitch: the chassis skips sideways every so often
        if (e.anyOrder && e.alive && Math.floor(gameTime * 12) % 9 === 0) ctx.translate((Math.floor(gameTime * 50) % 2 ? 3 : -3), 0);
        // magician's fakes flicker for a split second now and then
        if (e.decoy && e.flicker > 0) ctx.globalAlpha *= 0.35;
        // DJ bobs on the beat
        if (e.beat && e.alive){
            const bob = Math.max(0, 1 - e.beatClock / 0.18);
            ctx.translate(0, bob * 3);
        }
        if (isCourier){
            // e-scooter under its feet, with a brake light while it slows
            ctx.save();
            ctx.fillStyle = '#2a2f38';
            roundRect(-16, e.h * 0.42, 32, 4, 2);
            ctx.fill();
            ctx.fillRect(12, e.h * 0.02, 3, e.h * 0.42);
            ctx.fillRect(8, e.h * 0.02, 10, 2.5);
            ctx.fillStyle = '#14171c';
            for (const wx of [-12, 13]){
                ctx.beginPath();
                ctx.arc(wx, e.h * 0.5, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            if (e.braking){
                ctx.fillStyle = '#ff3b3b';
                ctx.shadowColor = '#ff3b3b';
                ctx.shadowBlur = 8;
                ctx.fillRect(-18, e.h * 0.41, 3, 4);
            }
            ctx.restore();
        }
        if (dying) ctx.rotate(deathT * 1.7);

        // urban look: metal darkens from scrap grey toward black chrome, and
        // street/LED/neon details switch on as urban climbs
        const u = e.urban || 0;
        const accent = e.accent || '#ff8a1f';
        const metal = (light, dark) => rgb(lerpColor(hexToRgb(light), hexToRgb(dark), u * 0.9));
        const glow = (color, blur) => { ctx.shadowColor = color; ctx.shadowBlur = blur; };
        const pulse = 0.65 + 0.35 * Math.sin(gameTime * 4 + e.x * 0.02);
        if (dying) ctx.scale(1 + deathT * 0.15, 1 - deathT * 0.3);

        // legs, with a knee-joint highlight for some real shape — patrollers
        // keep walking through the whole fight, blocking only stops the sword
        const legGrad = ctx.createLinearGradient(0, -e.h * 0.1, 0, e.h * 0.42);
        legGrad.addColorStop(0, metal('#8b9198', '#3a3f4a'));
        legGrad.addColorStop(1, metal('#5e6469', '#1f232b'));
        const legSwing = walking ? Math.sin(e.walkPhase) * 0.5 : 0;
        ctx.save();
        ctx.translate(-5.5, e.h * 0.08);
        ctx.rotate(legSwing);
        ctx.fillStyle = legGrad;
        roundRect(-3.5, 0, 7, e.h * 0.34, 2);
        ctx.fill();
        ctx.fillStyle = metal('#454a4f', '#14171c');
        ctx.fillRect(-3.5, e.h * 0.16, 7, 3);
        if (u >= 0.4){
            // knee light
            ctx.save();
            glow(accent, 6);
            ctx.fillStyle = accent;
            ctx.globalAlpha *= pulse;
            ctx.fillRect(-1.5, e.h * 0.165, 3, 2);
            ctx.restore();
        }
        ctx.fillStyle = metal('#3a3f44', '#101318');
        ctx.fillRect(-4.5, e.h * 0.34, 9, 5);
        if (u >= 0.2){
            // sneaker sole stripe
            ctx.fillStyle = accent;
            ctx.fillRect(-4.5, e.h * 0.34 + 4, 9, 1.5);
        }
        ctx.restore();
        ctx.save();
        ctx.translate(5.5, e.h * 0.08);
        ctx.rotate(-legSwing);
        ctx.fillStyle = legGrad;
        roundRect(-3.5, 0, 7, e.h * 0.34, 2);
        ctx.fill();
        ctx.fillStyle = metal('#454a4f', '#14171c');
        ctx.fillRect(-3.5, e.h * 0.16, 7, 3);
        if (u >= 0.4){
            // knee light
            ctx.save();
            glow(accent, 6);
            ctx.fillStyle = accent;
            ctx.globalAlpha *= pulse;
            ctx.fillRect(-1.5, e.h * 0.165, 3, 2);
            ctx.restore();
        }
        ctx.fillStyle = metal('#3a3f44', '#101318');
        ctx.fillRect(-4.5, e.h * 0.34, 9, 5);
        if (u >= 0.2){
            // sneaker sole stripe
            ctx.fillStyle = accent;
            ctx.fillRect(-4.5, e.h * 0.34 + 4, 9, 1.5);
        }
        ctx.restore();

        if (elite){
            // long armored trench coat, flaring out behind with a neon hem
            const flap = Math.sin(gameTime * 5 + e.x * 0.03);
            ctx.save();
            ctx.fillStyle = '#12151b';
            ctx.beginPath();
            ctx.moveTo(-10, -e.h * 0.24);
            ctx.lineTo(10, -e.h * 0.24);
            ctx.lineTo(8, e.h * 0.12);
            ctx.lineTo(-2, e.h * 0.38);
            ctx.lineTo(-20 - flap * 4, e.h * 0.44);
            ctx.lineTo(-14 - flap * 2, e.h * 0.1);
            ctx.closePath();
            ctx.fill();
            glow(accent, 10);
            ctx.strokeStyle = accent;
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(-2, e.h * 0.38);
            ctx.lineTo(-20 - flap * 4, e.h * 0.44);
            ctx.lineTo(-14 - flap * 2, e.h * 0.1);
            ctx.stroke();
            ctx.restore();
        }

        // street gear: a scarf tail flapping out behind
        if (u >= 0.2 && !e.bossPhases && !elite){
            const flap = Math.sin(gameTime * 9 + e.x * 0.05);
            ctx.fillStyle = accent;
            ctx.beginPath();
            ctx.moveTo(-6, -e.h * 0.27);
            ctx.quadraticCurveTo(-16, -e.h * 0.26 + flap * 2, -24, -e.h * 0.2 + flap * 4);
            ctx.lineTo(-22, -e.h * 0.15 + flap * 4);
            ctx.quadraticCurveTo(-14, -e.h * 0.2 + flap * 2, -6, -e.h * 0.21);
            ctx.closePath();
            ctx.fill();
        }

        // torso — flat-ish grey with just a hint of shading (this is a basic
        // suburban-tier grunt, not a fancy machine — but "basic" still needs
        // real form, not a solid rectangle)
        const torsoGrad = ctx.createLinearGradient(-10, -e.h * 0.22, 10, e.h * 0.12);
        torsoGrad.addColorStop(0, metal('#a8aeb4', '#4a5160'));
        torsoGrad.addColorStop(0.5, metal('#8e949a', '#2f3540'));
        torsoGrad.addColorStop(1, metal('#666c71', '#1b1f27'));
        ctx.fillStyle = torsoGrad;
        roundRect(-10, -e.h * 0.22, 20, e.h * 0.36, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(20,22,25,0.5)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (u >= 0.6){
            // neon trim around the chassis
            ctx.save();
            glow(accent, 8);
            ctx.strokeStyle = accent;
            ctx.globalAlpha *= 0.6 + 0.4 * pulse;
            ctx.lineWidth = 1.2;
            roundRect(-10, -e.h * 0.22, 20, e.h * 0.36, 4);
            ctx.stroke();
            ctx.restore();
        }
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        roundRect(-10, e.h * 0.08, 20, 4, 2);
        ctx.fill();
        if (u >= 0.45){
            // glowing chest core
            ctx.save();
            glow(accent, 10);
            ctx.fillStyle = accent;
            ctx.globalAlpha *= pulse;
            ctx.beginPath();
            ctx.arc(-2, -e.h * 0.08, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        if (u >= 0.2 && !e.bossPhases && !elite){
            // scarf wrapped round the neck
            ctx.fillStyle = accent;
            roundRect(-9, -e.h * 0.28, 18, 5, 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.fillRect(-9, -e.h * 0.28 + 3.5, 18, 1.5);
        }

        // pauldron (shoulder plate) on the sword side — gives it silhouette
        ctx.fillStyle = metal('#767c82', '#2a2f38');
        ctx.beginPath();
        ctx.moveTo(6, -e.h * 0.2);
        ctx.lineTo(17, -e.h * 0.16);
        ctx.lineTo(15, -e.h * 0.02);
        ctx.lineTo(6, -e.h * 0.06);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = e.hitFlash > 0 ? '#ff5050' : 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1;
        ctx.stroke();
        if (u >= 0.3){
            // colored stripe across the shoulder plate
            ctx.save();
            if (u >= 0.55) glow(accent, 5);
            ctx.strokeStyle = accent;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(7, -e.h * 0.13);
            ctx.lineTo(16, -e.h * 0.1);
            ctx.stroke();
            ctx.restore();
        }

        // off-arm
        ctx.fillStyle = metal('#7d8389', '#363c47');
        roundRect(-15, -e.h * 0.14, 6, e.h * 0.22, 2);
        ctx.fill();
        if (elite){
            // oversized angular shoulder armor, both sides, neon-edged
            ctx.save();
            for (const side of [-1, 1]){
                ctx.fillStyle = '#1b1f27';
                ctx.beginPath();
                ctx.moveTo(side * 6, -e.h * 0.25);
                ctx.lineTo(side * 21, -e.h * 0.22);
                ctx.lineTo(side * 19, -e.h * 0.06);
                ctx.lineTo(side * 8, -e.h * 0.1);
                ctx.closePath();
                ctx.fill();
                glow(accent, 8);
                ctx.strokeStyle = accent;
                ctx.lineWidth = 1.4;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
            // glowing spine of lights down the chest
            glow(accent, 8);
            ctx.fillStyle = accent;
            for (let i = 0; i < 3; i++){
                ctx.globalAlpha = 0.5 + 0.5 * Math.sin(gameTime * 6 - i * 0.9);
                ctx.fillRect(-1, -e.h * 0.02 + i * 5, 2, 3);
            }
            ctx.restore();
        }

        // head — angular, slanted visor so it actually reads as "hostile"
        if (elite && !e.bossPhases){
            // twin swept horns
            ctx.save();
            glow(accent, 10);
            ctx.fillStyle = accent;
            for (const side of [-1, 1]){
                ctx.beginPath();
                ctx.moveTo(side * 4, -e.h * 0.46);
                ctx.lineTo(side * 13, -e.h * 0.46 - 12);
                ctx.lineTo(side * 8, -e.h * 0.46);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        } else if (u >= 0.6 && !e.bossPhases){
            // swept-back helmet fin
            ctx.save();
            glow(accent, u >= 0.75 ? 8 : 0);
            ctx.fillStyle = accent;
            ctx.beginPath();
            ctx.moveTo(-2, -e.h * 0.46);
            ctx.lineTo(-11, -e.h * 0.46 - 9);
            ctx.lineTo(4, -e.h * 0.46);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
        ctx.fillStyle = metal('#9aa0a6', '#3d4452');
        roundRect(-8, -e.h * 0.46, 16, 16, 3);
        ctx.fill();
        ctx.strokeStyle = 'rgba(20,22,25,0.5)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // city bots and up get a lit LED visor instead of a dark slit
        const lightColor = e.light === 'red' ? '#ff3b3b' : e.light === 'yellow' ? '#ffcf3d' : e.light === 'green' ? '#3dff7a' : null;
        const visorColor = lightColor || accent;
        const ledVisor = (u >= 0.35 || lightColor) && e.hitFlash <= 0;
        ctx.save();
        if (ledVisor) glow(visorColor, lightColor ? 12 : 8);
        ctx.fillStyle = e.hitFlash > 0 ? '#ff4444' : (ledVisor ? visorColor : '#22272c');
        ctx.beginPath();
        ctx.moveTo(-6, -e.h * 0.40);
        ctx.lineTo(6, -e.h * 0.42);
        ctx.lineTo(6, -e.h * 0.37);
        ctx.lineTo(-6, -e.h * 0.35);
        ctx.closePath();
        ctx.fill();
        if (elite && e.hitFlash <= 0){
            // wraparound visor: a bright band right across the face
            glow(visorColor, 16);
            ctx.fillStyle = visorColor;
            ctx.fillRect(-9, -e.h * 0.415, 18, 4);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-7, -e.h * 0.405, 14, 1.2);
        }
        ctx.restore();
        if (e.hitFlash > 0){
            ctx.save();
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(-5, -e.h * 0.395, 10, 2.5);
            ctx.restore();
        }
        // small side vents on the helmet
        ctx.fillStyle = metal('#5e6469', '#1f232b');
        ctx.fillRect(-9, -e.h * 0.42, 2, 6);
        ctx.fillRect(7, -e.h * 0.42, 2, 6);
        if (e.type === 'magician'){
            // top hat
            ctx.fillStyle = '#14171c';
            ctx.fillRect(-11, -e.h * 0.46 - 2, 22, 3);
            ctx.fillRect(-7, -e.h * 0.46 - 15, 14, 14);
            ctx.fillStyle = accent;
            ctx.fillRect(-7, -e.h * 0.46 - 5, 14, 2.5);
        }
        if (e.beat){
            // headphones
            ctx.strokeStyle = '#14171c';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, -e.h * 0.4, 10, Math.PI * 1.05, Math.PI * 1.95);
            ctx.stroke();
            ctx.fillStyle = accent;
            roundRect(-12, -e.h * 0.43, 5, 8, 2);
            ctx.fill();
            roundRect(7, -e.h * 0.43, 5, 8, 2);
            ctx.fill();
        }
        if (e.swap){
            // hacker: a little floating stream of code
            ctx.save();
            ctx.fillStyle = '#3dff7a';
            ctx.globalAlpha *= 0.8;
            ctx.font = 'bold 7px monospace';
            ctx.textAlign = 'center';
            const line = Math.floor(gameTime * 6);
            for (let r = 0; r < 3; r++){
                ctx.fillText(((line + r) % 2 ? '10' : '01') + ((line * 7 + r) % 3), -18, -e.h * 0.3 + r * 8);
            }
            ctx.restore();
        }

        // sword arm: fast up/down swing while idle, held poses once engaged,
        // with a motion trail while it's actually whipping back and forth
        let swingAngle;
        let glowOverride = null;
        if (e.swingState){
            if (e.swingState === 'telegraph'){
                // cocked back straight-right through most of the windup, then
                // sweeps right-to-left (through straight-down) for the attack
                const t = 1 - Math.max(0, e.swingStateTimer) / 1.0;
                // ramp finishes at t=0.92, not t=1.0, so it actually holds at
                // full straight-left for the last couple frames before the
                // state changes — otherwise the state transition cuts the
                // animation off a beat early and it never reaches horizontal
                const swingT = Math.max(0, (t - 0.65) / 0.27);
                swingAngle = lerp(-Math.PI / 2, Math.PI / 2, Math.min(1, swingT));
                glowOverride = '#ff3030';
            } else if (e.swingState === 'open'){
                swingAngle = Math.PI / 2; // stays straight-left, same pose the swing ended on
                glowOverride = '#3dffb0';
            } else if (e.swingState === 'exposed'){
                swingAngle = Math.PI / 2; // still wide open, waiting on the final key
                glowOverride = '#b060ff';
            } else {
                swingAngle = Math.sin(gameTime * 1.5 + e.x * 0.01) * 0.4; // relaxed idle sway
            }
        } else if (e.punishPose === 'block'){
            swingAngle = -0.9; // raises its own blade to catch your wrong move
            glowOverride = '#ffdd55';
        } else if (e.punishPose === 'strike'){
            swingAngle = lerp(-0.9, 1.6, Math.min(1, (e.punishLunge || 0) * 1.3));
            glowOverride = '#ff3030';
        } else if (e.comboStep === 0 && isCharger){
            // a big, committed, continuous slash — this is what "doing A"
            // reads as: a full arcing swing, not a quick twitch
            swingAngle = Math.sin(gameTime * 2.6 + e.x * 0.01) * 1.5;
        } else if (e.comboStep === 0) swingAngle = Math.sin(gameTime * 7 + e.x * 0.01) * 0.9;
        else if (e.comboStep === 1) swingAngle = -1.1;      // stopped cold by the block
        else if (e.type === 'duelist' && e.comboStep === 3){
            // beaten once already — it recovers and comes back with its own
            // attack instead of just standing there hurt
            swingAngle = Math.sin(gameTime * 3.2 + e.x * 0.01) * 1.4;
        }
        else swingAngle = 1.3;                              // forced back onto itself

        const isCounterAttack = e.type === 'duelist' && e.comboStep === 3;
        if (!e.swingState && (e.comboStep === 0 || isCounterAttack) && !e.punishPose){
            const trailSpeed = (isCharger || isCounterAttack) ? (isCounterAttack ? 3.2 : 2.6) : 7;
            const trailAmp = (isCharger || isCounterAttack) ? 1.4 : 0.9;
            for (const off of [0.22, 0.4]){
                ctx.save();
                ctx.translate(12, -e.h * 0.1);
                ctx.rotate(Math.sin(gameTime * trailSpeed - off + e.x * 0.01) * trailAmp);
                ctx.globalAlpha = alpha * (0.16 - off * 0.2);
                drawBlade(e.h * 0.4, 7, null);
                ctx.restore();
            }
        }
        // the swinger carries a huge blade — long enough to actually reach
        // over the player when it swings, which is the whole point of it
        const bladeLen = e.swingState ? 140 : e.h * 0.4;
        ctx.save();
        ctx.translate(12, -e.h * 0.1);
        ctx.rotate(swingAngle);
        ctx.fillStyle = metal('#7d8389', '#363c47');
        roundRect(-3, 0, 6, e.h * 0.18, 2);
        ctx.fill();
        ctx.translate(0, e.h * 0.16);
        if (elite){
            // full energy blade: white-hot core, glow in its colour (turns
            // to the hit/state colour when you land a key)
            const bc = glowOverride || (e.comboStep >= 1 ? '#ff5a3d' : accent);
            ctx.fillStyle = '#2a2e33';
            ctx.fillRect(-7, -2, 14, 4);
            glow(bc, 16);
            ctx.fillStyle = bc;
            roundRect(-3.5, 2, 7, bladeLen * 1.15, 3.5);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            roundRect(-1.3, 4, 2.6, bladeLen * 1.15 - 4, 1.3);
            ctx.fill();
        } else {
            drawBlade(bladeLen, 8, glowOverride || (e.comboStep >= 1 ? '#ff5a3d' : (u >= 0.6 ? accent : null)), 0.9);
        }
        ctx.restore();

        ctx.restore();

        if (e.droneAlive && e.alive && Math.sin(e.droneAngle) > 0.35) drawDrone(e, sx, sy); // in front — swat it now
        if (e.beat && e.alive){
            // the beat, as a ring that pops out from the DJ
            const t = e.beatClock / e.beat;
            ctx.save();
            ctx.strokeStyle = '#ff3fd2';
            ctx.globalAlpha = Math.max(0, 0.6 - t);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx + e.w / 2, sy + e.h / 2, 20 + t * 40, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        if (e.alive) drawBlockLabel(e, sx, sy);
    }

    // what this enemy blocks, as a small readable tag above its head
    // the BLOCKS text, with the tagger's graffiti over one letter
    function blocksText(e){
        let idx = 0;
        return e.blocks.map(b => b.toUpperCase().split('').map(ch => (idx++ === e.hiddenIdx ? '▓' : ch)).join('')).join(', ');
    }

    function enemyBlockLabel(e){
        if (e.noLabel) return '';
        if (e.labelFrom) e = e.labelFrom;
        if (e.billboardOn != null) return 'CHECK THE BILLBOARD →';
        const phase = e.bossPhases ? 'PHASE ' + (e.bossPhase + 1) + '/' + e.bossPhases.length : '';
        if (!e.blocks){
            const hint = e.bossPhases && e.bossPhases[e.bossPhase].hint;
            return hint ? phase + ' · ' + hint : phase;
        }
        let text = 'BLOCKS ' + blocksText(e);
        if (e.anyOrder){
            // glitch: show the letters in a different order every second
            const perms = ['012', '201', '120', '102', '021', '210'];
            const pm = perms[Math.floor(e.glitchClock) % perms.length];
            text = 'BLOCKS ' + e.blocks.map(b => pm.split('').map(i => b[+i] || '').join('').toUpperCase()).join(', ') + ' · ANY ORDER';
        }
        if (e.mirror) text = 'MIRROR Z↔X A↔S · ' + text;
        if (e.pairRule) text = 'PAIRS Z↔X A↔S · ' + text;
        if (e.killLength) text = 'EXACTLY ' + e.killLength + ' KEYS · ' + text;
        if (e.shaftRoofY != null) text = 'FLOOR ' + Math.min(3, (e.pressedKeys || []).length) + '/3 · ' + text;
        if (e.banned) text = 'NO ENTRY: ' + e.banned.toUpperCase() + ' · ' + text;
        if (e.swap) text = 'SWAP ' + Object.keys(e.swap)[0].toUpperCase() + '↔' + Object.values(e.swap)[0].toUpperCase() + ' · ' + text;
        if (e.droneAlive) text = 'SWAT DRONE (A) · ' + text;
        if (e.crewNext !== undefined) text = 'CREW ' + (e.crewIndex + 1) + '/3 · ' + text;
        if (e.resist) text += ' · RESISTS ' + e.resist.toUpperCase();
        if (e.keyGap) text += ' · ' + e.keyGap + 's';
        if (e.beat) text += ' · ON THE BEAT';
        if (e.traffic) text += ' · GO ON GREEN';
        return phase ? phase + ' · ' + text : text;
    }

    function drawBlockLabel(e, sx, sy){
        const text = enemyBlockLabel(e);
        if (!text) return;
        const cx2 = sx + e.w / 2;
        const topY = sy - e.h * 0.5 - 16 - (e.labelLift || 0);
        ctx.save();
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        const padX = 8, padY = 5;
        const textW = ctx.measureText(text).width;
        const boxW = textW + padX * 2, boxH = 16 + padY;
        roundRect(cx2 - boxW / 2, topY - boxH, boxW, boxH, 6);
        ctx.fillStyle = 'rgba(20,10,10,0.75)';
        ctx.fill();
        // a shifter's tag flashes blue the moment its block changes
        const shifted = e.shiftFlash > 0;
        const onBeat = e.beat && (e.beatClock < e.beatWindow || e.beatClock > e.beat - e.beatWindow);
        const lightColor = e.light === 'red' ? '#ff3b3b' : e.light === 'yellow' ? '#ffcf3d' : e.light === 'green' ? '#3dff7a' : null;
        ctx.strokeStyle = shifted ? '#4fa3ff' : onBeat ? '#ff3fd2' : lightColor || '#ff5a3d';
        ctx.lineWidth = shifted || onBeat ? 2.4 : lightColor ? 2 : 1.2;
        ctx.stroke();
        ctx.fillStyle = shifted ? '#cfe6ff' : '#ffb3a0';
        ctx.fillText(text, cx2, topY - boxH / 2 + 4);
        // ...and drains a little bar until the next change
        // a clocker's fuse burns down between keys
        if (e.keyGap && e.comboWindowTimer > 0){
            const frac = e.comboWindowTimer / e.keyGap;
            ctx.fillStyle = 'rgba(20,10,10,0.35)';
            ctx.fillRect(cx2 - boxW / 2 + 4, topY + 3, boxW - 8, 3);
            ctx.fillStyle = '#ffcf3d';
            ctx.fillRect(cx2 - boxW / 2 + 4, topY + 3, (boxW - 8) * frac, 3);
        }
        if (e.shiftCycle){
            const frac = Math.max(0, e.shiftTimer) / e.shiftInterval;
            ctx.fillStyle = 'rgba(20,10,10,0.35)';
            ctx.fillRect(cx2 - boxW / 2 + 4, topY + 3, boxW - 8, 3);
            ctx.fillStyle = '#4fa3ff';
            ctx.fillRect(cx2 - boxW / 2 + 4, topY + 3, (boxW - 8) * frac, 3);
        }
        ctx.restore();
    }

    function drawDeathParticles(e, sx, sy){
        for (const p of e.deathParticles){
            const t = 1 - Math.max(0, e.deathTimer) / 0.5;
            const px = sx + e.w / 2 + p.vx * t * 40;
            const py = sy + e.h / 2 + p.vy * t * 40 + t * t * 60;
            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - t);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 5;
            ctx.fillRect(px - p.size / 2, py - p.size / 2, p.size, p.size);
            ctx.restore();
        }
    }

    function drawEnemies(){
        for (const e of enemies){
            if (e.shaftRoofY != null){
                // elevator: only the part above the roof shows — the rest is
                // still down the shaft
                const roofSY = e.shaftRoofY - camera.y;
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, -1000, W, roofSY + 1000);
                ctx.clip();
                drawEnemy(e);
                ctx.restore();
                const cx = e.x + e.w / 2 - camera.x;
                ctx.save();
                ctx.fillStyle = '#14171c';
                ctx.fillRect(cx - 26, roofSY - 3, 52, 5);
                ctx.fillStyle = '#ffcf3d';
                for (let i = 0; i < 6; i++) ctx.fillRect(cx - 26 + i * 9, roofSY - 3, 4, 2);
                ctx.fillStyle = '#3a3f4a';
                ctx.fillRect(cx - 28, roofSY - 22, 3, 22);
                ctx.fillRect(cx + 25, roofSY - 22, 3, 22);
                ctx.restore();
            } else drawEnemy(e);
        }
    }

    // blackout: the city around the blackout bot goes dark (drawn between
    // the enemies and the player, so you can still see yourself)
    function drawBlackout(){
        for (const e of enemies){
            if (!e.blackout || !e.alive || !e.dark || e.flash > 0) continue;
            const sx = e.x - camera.x;
            if (sx < -400 || sx > W + 400) continue;
            ctx.save();
            ctx.fillStyle = 'rgba(8,12,22,0.86)';
            ctx.fillRect(0, 0, W, H);
            ctx.restore();
        }
        for (const e of enemies){
            if (e.blackout && e.alive && e.flash > 0){
                ctx.save();
                ctx.fillStyle = 'rgba(255,255,255,' + (e.flash / 0.14) * 0.35 + ')';
                ctx.fillRect(0, 0, W, H);
                ctx.restore();
            }
        }
    }

    // ---------- humanoid robot ----------
    function drawRobot(){
        const sx = player.x - camera.x;
        const sy = player.y - camera.y;
        const cx = sx + player.w / 2;
        const cy = sy + player.h / 2;

        ctx.save();
        ctx.translate(cx, cy);
        if (player.combatPose === 'duck') ctx.translate(0, player.h * 0.32);
        ctx.scale(player.facing, player.combatPose === 'duck' ? 0.42 : 1);
        if (player.combatPose === 'staggered') ctx.rotate(-0.12); // knocked off balance
        else if (player.combatPose === 'hit') ctx.rotate(0.22);   // reeling from the strike
        else if (player.combatPose === 'flip'){
            // a real parabolic arc at the same peak height as your normal
            // jump (4h*t*(1-t) is exactly the shape of constant-gravity
            // projectile motion) — rises, somersaults near the peak, then
            // accelerates back down to a clean landing, same as falling
            // normally off a regular jump
            const fp = 1 - Math.max(0, player.combatTimer) / 0.6;
            const spinT = Math.max(0, Math.min(1, (fp - 0.5) / 0.4)); // spins only on the way down, after the peak
            // the jump itself is straight up (no horizontal drift on its
            // own) — the somersault is what actually carries you forward
            const startOffsetX = (player.flipStartX !== undefined ? player.flipStartX : player.x) - player.x;
            // already inside ctx.scale(player.facing, ...), so counter it
            // here to keep this a true world-space offset either way
            ctx.translate(startOffsetX * (1 - spinT) * player.facing, -4 * MAX_JUMP_RISE * fp * (1 - fp));
            ctx.rotate(spinT * Math.PI * 2); // one full somersault
        }

        // duck (held, actually dodging the swing) -> legs spring up into a
        // hop+flip -> kicks out at the peak
        let kickE = 0;
        if (player.combatPose === 'duckKick'){
            const kp = 1 - Math.max(0, player.combatTimer) / 0.9;
            // full crouch holds through the first 55% — long enough to
            // really read as ducking the swing — then releases into the hop
            const duckT = kp < 0.55 ? 1 : Math.max(0, 1 - (kp - 0.55) / 0.12);
            ctx.translate(0, duckT * player.h * 0.22);
            ctx.scale(1, 1 - duckT * 0.36);
            const hopT = Math.min(1, Math.max(0, (kp - 0.58) / 0.4));
            ctx.translate(0, -4 * (MAX_JUMP_RISE * 0.6) * hopT * (1 - hopT));
            ctx.rotate(Math.min(1, hopT / 0.85) * Math.PI); // half flip, lands facing forward
            kickE = Math.sin(Math.min(1, Math.max(0, (kp - 0.78) / 0.22)) * Math.PI); // kick hump near the peak
        }

        // finishing kick thrown from standing (already got up from the duck
        // earlier) — straight into the hop+flip+kick, no re-crouch first
        if (player.combatPose === 'kick'){
            const kp = 1 - Math.max(0, player.combatTimer) / 0.6;
            const hopT = Math.min(1, Math.max(0, kp / 0.75));
            ctx.translate(0, -4 * (MAX_JUMP_RISE * 0.6) * hopT * (1 - hopT));
            ctx.rotate(Math.min(1, hopT / 0.85) * Math.PI); // half flip, lands facing forward
            kickE = Math.sin(Math.min(1, Math.max(0, (kp - 0.3) / 0.4)) * Math.PI); // kick hump near the peak
        }

        const walk = player.onGround ? Math.sin(player.runPhase) : 0;
        const jumpPose = !player.onGround;

        // legs
        ctx.fillStyle = '#5b6b78';
        ctx.save();
        ctx.translate(-6, player.h * 0.12);
        ctx.rotate(jumpPose ? -0.35 : walk * 0.5);
        ctx.fillRect(-4, 0, 8, player.h * 0.34);
        ctx.fillStyle = '#37474f';
        ctx.fillRect(-5, player.h * 0.34 - 2, 10, 5);
        ctx.restore();

        ctx.fillStyle = '#5b6b78';
        ctx.save();
        ctx.translate(6, player.h * 0.12);
        ctx.rotate(kickE > 0.02 ? lerp(0.3, -1.3, kickE) : (jumpPose ? 0.5 : -walk * 0.5));
        ctx.fillRect(-4, 0, 8, player.h * 0.34);
        ctx.fillStyle = '#37474f';
        ctx.fillRect(-5, player.h * 0.34 - 2, 10, 5);
        ctx.restore();

        // torso
        const torsoGrad = ctx.createLinearGradient(-11, -player.h*0.22, 11, player.h*0.14);
        torsoGrad.addColorStop(0, '#c7d2d8');
        torsoGrad.addColorStop(0.5, '#8fa0ab');
        torsoGrad.addColorStop(1, '#5c6b76');
        ctx.fillStyle = torsoGrad;
        roundRect(-11, -player.h * 0.22, 22, player.h * 0.38, 5);
        ctx.fill();
        ctx.strokeStyle = 'rgba(20,30,38,0.45)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // chest core light
        ctx.fillStyle = '#4fd8ff';
        ctx.shadowColor = '#4fd8ff';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(0, -player.h * 0.06, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // back arm
        ctx.fillStyle = '#8fa0ab';
        ctx.save();
        ctx.translate(-11, -player.h * 0.16);
        ctx.rotate(jumpPose ? -0.9 : -walk * 0.5);
        ctx.fillRect(-4, 0, 8, player.h * 0.26);
        ctx.restore();

        // front (sword) arm — pose depends on combat state
        const swordLen = player.h * 0.58;
        let swordArmAngle, swordAlpha, glowColor = '#4fd8ff';
        let slashFrom = null, slashTo = null, slashColor = '#bfe9ff';
        if (player.combatPose === 'block'){
            swordArmAngle = -0.75; // raised diagonal guard
            swordAlpha = 1;
        } else if (player.combatPose === 'counter'){
            const p = 1 - Math.max(0, player.combatTimer) / 0.28;
            swordArmAngle = lerp(-0.75, -0.1, Math.min(1, p * 2)); // sharp forward thrust
            swordAlpha = 1;
            glowColor = '#ff5a3d';
        } else if (player.combatPose === 'kill'){
            const p = 1 - Math.max(0, player.combatTimer) / 0.35;
            const startA = -1.3, endA = 1.5;
            swordArmAngle = lerp(startA, endA, Math.min(1, p * 1.25));
            swordAlpha = 1;
            glowColor = '#ffffff';
            if (p > 0.05 && p < 0.9){ slashFrom = startA; slashTo = swordArmAngle; }
        } else if (player.combatPose === 'sideAttack'){
            // a low, wide horizontal sweep — a flanking strike, not the
            // overhead arc of the finishing blow
            const p = 1 - Math.max(0, player.combatTimer) / 0.3;
            const startA = 1.4, endA = -0.2;
            swordArmAngle = lerp(startA, endA, Math.min(1, p * 1.3));
            swordAlpha = 1;
            glowColor = '#3dffb0';
            if (p > 0.05 && p < 0.9){ slashFrom = startA; slashTo = swordArmAngle; slashColor = '#3dffb0'; }
        } else if (player.combatPose === 'staggered'){
            swordArmAngle = 0.45; // sword dips, wide open
            swordAlpha = 0.7;
        } else if (player.combatPose === 'hit'){
            swordArmAngle = 1.1; // knocked completely aside
            swordAlpha = 0.5;
            glowColor = null;
        } else {
            swordArmAngle = jumpPose ? 0.6 : walk * 0.5;
            swordAlpha = 0.55; // resting/sheathed look
        }

        if (slashFrom !== null){
            // already inside the translate(cx,cy)+scale(facing,1) transform,
            // so this is local space — same origin the sword arm itself uses
            drawSlashArc(11, -player.h * 0.16, player.h * 0.5, slashFrom, slashTo, slashColor, 0.8);
        }

        ctx.save();
        ctx.translate(11, -player.h * 0.16);
        ctx.rotate(swordArmAngle);
        ctx.fillStyle = '#8fa0ab';
        ctx.fillRect(-4, 0, 8, player.h * 0.26);
        ctx.save();
        ctx.globalAlpha = swordAlpha;
        ctx.translate(0, player.h * 0.24);
        drawBlade(swordLen, 9, glowColor, player.combatPose !== 'idle' ? 1 : 0.4);
        ctx.restore();
        ctx.restore();

        // head
        ctx.fillStyle = '#c7d2d8';
        roundRect(-9, -player.h * 0.46, 18, 16, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(20,30,38,0.45)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // visor
        ctx.fillStyle = '#0d1b22';
        roundRect(-7, -player.h * 0.43, 14, 6, 2);
        ctx.fill();
        ctx.fillStyle = '#4fd8ff';
        ctx.shadowColor = '#4fd8ff';
        ctx.shadowBlur = 6;
        ctx.fillRect(-5, -player.h * 0.42, 10, 3);
        ctx.shadowBlur = 0;

        // antenna
        ctx.strokeStyle = '#8fa0ab';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -player.h * 0.46);
        ctx.lineTo(0, -player.h * 0.56);
        ctx.stroke();
        ctx.fillStyle = '#ff5a5a';
        ctx.beginPath();
        ctx.arc(0, -player.h * 0.57, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function roundRect(x, y, w, h, r){
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function render(){
        drawBackground();
        drawBuildings();
        drawEnemies();
        drawBlackout();
        drawRobot();
        for (const fx of effects){
            const progress = (gameTime - fx.start) / fx.duration;
            drawSparkBurst(fx.x - camera.x, fx.y - camera.y, fx.color, progress);
        }
        if (deathFlash > 0){
            ctx.save();
            ctx.globalAlpha = (deathFlash / 0.3) * 0.55;
            ctx.fillStyle = '#ff2020';
            ctx.fillRect(0, 0, W, H);
            ctx.restore();
        }
    }

    let last = performance.now();
    let gameTime = 0;
    function loop(now){
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        gameTime += dt;
        if (!tutorialOpen) update(dt);
        updateCamera();
        render();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    let tutorialSeen = false;
    try { tutorialSeen = localStorage.getItem(TUTORIAL_SEEN_KEY) === '1'; } catch (err) {}
    if (!tutorialSeen) openTutorial();
})();
</script>

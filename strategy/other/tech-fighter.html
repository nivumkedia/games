<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Fighter</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
        height:100%;
        background:#bfe4ff;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow:hidden;
    }
    #wrap {
        position:relative;
        width:100vw;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
    }
    canvas {
        display:block;
        image-rendering:auto;
        box-shadow:0 0 0 2px rgba(0,0,0,0.05);
    }
    #hud {
        position:fixed;
        top:14px;
        left:14px;
        background:rgba(255,255,255,0.85);
        border:1px solid rgba(0,0,0,0.08);
        border-radius:12px;
        padding:10px 16px;
        font-size:0.85em;
        color:#2c3e50;
        box-shadow:0 4px 14px rgba(0,0,0,0.08);
    }
    #hud b { color:#1565c0; }
    #progress-wrap {
        position:fixed;
        top:14px;
        right:14px;
        width:220px;
        background:rgba(255,255,255,0.85);
        border:1px solid rgba(0,0,0,0.08);
        border-radius:12px;
        padding:10px 14px;
        box-shadow:0 4px 14px rgba(0,0,0,0.08);
    }
    #progress-label {
        font-size:0.72em;
        font-weight:700;
        letter-spacing:0.04em;
        text-transform:uppercase;
        color:#5b6b78;
        margin-bottom:6px;
    }
    #progress-bar-bg {
        width:100%;
        height:8px;
        border-radius:5px;
        background:rgba(0,0,0,0.08);
        overflow:hidden;
    }
    #progress-bar-fill {
        height:100%;
        width:0%;
        border-radius:5px;
        background:linear-gradient(90deg,#7cd992,#4fa3ff,#5b6b78);
        transition:width 0.15s ease;
    }
    #title-badge {
        position:fixed;
        bottom:14px;
        left:14px;
        font-weight:800;
        font-size:1.3em;
        color:#1c2b39;
        letter-spacing:0.02em;
        text-shadow:0 2px 0 rgba(255,255,255,0.6);
    }
    #help-btn {
        position:fixed;
        top:82px;
        right:14px;
        background:#1565c0;
        border:none;
        border-radius:12px;
        padding:9px 18px;
        font:700 0.9em 'Segoe UI', Tahoma, sans-serif;
        color:#fff;
        cursor:pointer;
        box-shadow:0 4px 14px rgba(21,101,192,0.3);
    }
    #help-btn:hover { background:#1976d2; }
    #tutorial {
        position:fixed;
        inset:0;
        display:none;
        align-items:center;
        justify-content:center;
        background:rgba(191,228,255,0.7);
        backdrop-filter:blur(3px);
        z-index:10;
    }
    #tutorial.open { display:flex; }
    #tut-card {
        width:min(560px, 92vw);
        background:#fff;
        border-radius:18px;
        padding:26px 30px 20px;
        box-shadow:0 18px 50px rgba(21,101,192,0.22);
        color:#2c3e50;
    }
    #tut-step {
        font-size:0.72em;
        font-weight:700;
        letter-spacing:0.06em;
        text-transform:uppercase;
        color:#5b6b78;
    }
    #tut-card h2 { margin:4px 0 12px; color:#1c2b39; font-size:1.45em; }
    #tut-body { font-size:0.95em; line-height:1.5; min-height:200px; }
    #tut-body p { margin-bottom:10px; }
    #tut-body ul { margin:0 0 10px 20px; }
    #tut-body li { margin-bottom:6px; }
    #tut-body kbd {
        display:inline-block;
        min-width:22px;
        padding:1px 6px;
        border:1px solid #c6d3df;
        border-bottom-width:3px;
        border-radius:6px;
        background:#f4f8fc;
        font:700 0.85em 'Segoe UI', Tahoma, sans-serif;
        color:#1565c0;
        text-align:center;
    }
    .tut-tag {
        display:inline-block;
        padding:1px 8px;
        border:1px solid #ff5a3d;
        border-radius:6px;
        background:rgba(20,10,10,0.75);
        color:#ffd0c4;
        font:bold 0.75em sans-serif;
    }
    #tut-nav {
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-top:16px;
    }
    #tut-dots span {
        display:inline-block;
        width:8px; height:8px;
        margin-right:6px;
        border-radius:50%;
        background:#d5e2ee;
    }
    #tut-dots span.on { background:#1565c0; }
    #tut-nav button {
        border:none;
        border-radius:10px;
        padding:9px 18px;
        font:700 0.9em 'Segoe UI', Tahoma, sans-serif;
        cursor:pointer;
    }
    #tut-back { background:#eef3f8; color:#5b6b78; margin-right:8px; }
    #tut-next { background:#1565c0; color:#fff; }
    #tut-back:disabled { visibility:hidden; }
</style>
</head>
<body>

<div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
</div>

<div id="hud">Move: <b>Arrow Keys</b> &nbsp;·&nbsp; Jump: <b>SPACE / UP</b> &nbsp;·&nbsp; Fight: <b>Z</b> block, <b>X</b> counter, <b>A</b> slash, <b>S</b> flank, <b>Q</b> duck, <b>C</b> flip, <b>W</b> duck</div>
<div id="progress-wrap">
    <div id="progress-label">City Progress</div>
    <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
</div>
<div id="title-badge">TECH FIGHTER</div>
<button id="help-btn">📘 Tutorial</button>

<div id="tutorial">
    <div id="tut-card">
        <div id="tut-step"></div>
        <h2 id="tut-title"></h2>
        <div id="tut-body"></div>
        <div id="tut-nav">
            <div id="tut-dots"></div>
            <div>
                <button id="tut-back">Back</button>
                <button id="tut-next">Next</button>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    function fitCanvas(){
        const scale = Math.min(window.innerWidth / W, window.innerHeight / H, 1.4);
        canvas.style.width = (W * scale) + 'px';
        canvas.style.height = (H * scale) + 'px';
    }
    window.addEventListener('resize', fitCanvas);
    fitCanvas();

    // ---------- seeded RNG so the city layout is stable across reloads ----------
    let seed = 1337;
    function rand(){
        seed = (seed * 1103515245 + 12345) & 0x7fffffff;
        return (seed % 10000) / 10000;
    }
    function randRange(a, b){ return a + rand() * (b - a); }

    // ---------- world generation: suburban -> urban -> metropolis -> cyberpunk ----------
    // Everything below is driven by continuous curves over t (0..1), not hard
    // zone cutoffs, so one stage eases into the next instead of snapping.
    const GROUND_Y = 440;
    const NUM_BUILDINGS = 100;
    function smoothstep(a, b, t){
        const x = Math.max(0, Math.min(1, (t - a) / (b - a)));
        return x * x * (3 - 2 * x);
    }
    const NEON_COLORS = ['#ff2fd6', '#38f2ff', '#b060ff', '#3dffb0'];

    // physics constants, declared here (not just near the player) because the
    // generator below uses them to guarantee every rooftop-to-rooftop gap is
    // actually jumpable
    const GRAVITY = 1500;
    const MOVE_SPEED = 260;
    const JUMP_VEL = -620;
    const JUMP_SPEED = -JUMP_VEL; // positive magnitude
    const MAX_JUMP_RISE = (JUMP_SPEED * JUMP_SPEED) / (2 * GRAVITY); // highest a jump can climb
    const SAFE_RISE_CAP = MAX_JUMP_RISE * 0.7; // leave real margin, not a frame-perfect jump

    // time in the air needed to clear a given change in rooftop height
    // (riseNeeded > 0 = climbing to a taller roof, < 0 = dropping to a lower one)
    function timeToClearRise(riseNeeded){
        if (riseNeeded >= 0){
            const disc = JUMP_SPEED * JUMP_SPEED - 2 * GRAVITY * riseNeeded;
            if (disc < 0) return null; // physically unreachable
            // landing only registers while falling (past the jump's apex), so
            // we need the LATER time the arc crosses that height, not the
            // first (ascending) crossing
            return (JUMP_SPEED + Math.sqrt(disc)) / GRAVITY;
        }
        const fall = -riseNeeded;
        return (JUMP_SPEED + Math.sqrt(JUMP_SPEED * JUMP_SPEED + 2 * GRAVITY * fall)) / GRAVITY;
    }

    // how "developed" the city is at this point (0 = sleepy suburb, 1 = full skyline)
    function densityForT(t){ return smoothstep(0.05, 0.48, t); }
    // how far into the neon/cyberpunk era we are (only ramps up late, but with
    // a long runway afterward to actually be in it)
    function cyberForT(t){ return smoothstep(0.42, 0.78, t); }

    function styleWeights(t){
        return {
            house:   Math.max(0, 1 - smoothstep(0.08, 0.24, t)),
            brick:   smoothstep(0.08, 0.24, t) * Math.max(0, 1 - smoothstep(0.45, 0.68, t)),
            glass:   smoothstep(0.11, 0.28, t),
            stepped: smoothstep(0.30, 0.50, t),
            spire:   smoothstep(0.34, 0.55, t)
        };
    }
    function pickStyle(t){
        const w = styleWeights(t);
        const total = w.house + w.brick + w.glass + w.stepped + w.spire;
        let roll = rand() * total;
        for (const key of ['house', 'brick', 'glass', 'stepped', 'spire']){
            roll -= w[key];
            if (roll <= 0) return key === 'house' ? 'house' : key === 'brick' ? 'brickTower' : key === 'glass' ? 'glassTower' : key === 'stepped' ? 'steppedTower' : 'spireTower';
        }
        return 'glassTower';
    }

    // rooftop gadgets get more elaborate the further into the city you are
    function pickGadget(density, cyber){
        const r = rand();
        if (cyber > 0.3 && r < 0.16) return 'helipad';
        if (r < 0.16 + 0.22) return 'dish';
        if (density > 0.2 && r < 0.16 + 0.22 + 0.26) return 'vents';
        if (r < 0.16 + 0.22 + 0.26 + 0.2) return 'antenna';
        return 'none';
    }

    // pass 1: decide every building's size/height/style first, with each
    // height rate-limited relative to the one before it — always jumpable
    const meta = [];
    {
        let prevHeight = null;
        for (let i = 0; i < NUM_BUILDINGS; i++){
            const t = i / (NUM_BUILDINGS - 1);
            const density = densityForT(t);
            const cyber = cyberForT(t);

            const width = randRange(lerp(150, 95, density), lerp(230, 190, density));
            const minH = lerp(50, 160, density);
            const maxH = lerp(110, 980, Math.pow(density, 1.2));

            let height;
            if (prevHeight === null){
                height = randRange(minH, maxH);
            } else {
                // aim for a height inside the current envelope, but always move
                // toward it at a rate that's provably jumpable — climbing is
                // hard-capped under the max jump height, dropping is freer.
                const target = randRange(minH, maxH);
                let riseNeeded = target - prevHeight;
                riseNeeded = Math.max(-260, Math.min(SAFE_RISE_CAP, riseNeeded));
                height = prevHeight + riseNeeded;
            }
            prevHeight = height;

            const neonNow = rand() < cyber;
            meta.push({
                width, height, t, density, cyber,
                style: pickStyle(t),
                neon: neonNow,
                neonColor: NEON_COLORS[Math.floor(rand() * NEON_COLORS.length)],
                seedTint: rand(),
                gadget: pickGadget(density, cyber),
                searchlight: neonNow && height > 420 && rand() < 0.22
            });
        }
    }

    // pass 2: lay the buildings out left to right, sizing each gap from the
    // ACTUAL height change to the next building (this is the step that
    // guarantees every gap is really jumpable — pass 1 only guaranteed the
    // rise is small enough, this is what turns that into a safe distance)
    const buildings = [];
    {
        let x = -200;
        for (let i = 0; i < meta.length; i++){
            const m = meta[i];
            buildings.push({
                x, width: m.width,
                y: GROUND_Y - m.height,
                height: m.height,
                t: m.t, density: m.density, cyber: m.cyber,
                style: m.style, neon: m.neon, neonColor: m.neonColor, seedTint: m.seedTint,
                gadget: m.gadget, searchlight: m.searchlight
            });

            let gap;
            if (i + 1 < meta.length){
                const riseNeeded = meta[i + 1].height - m.height;
                const airTime = timeToClearRise(riseNeeded);
                const maxDist = airTime ? MOVE_SPEED * airTime : 40;
                // stay well inside maxDist (never past 78% of it) so even the
                // steepest allowed climb — where maxDist itself is smallest —
                // still leaves real margin
                gap = Math.max(20, Math.min(maxDist * randRange(0.5, 0.78), 260));
            } else {
                gap = 60;
            }
            x += m.width + gap;
        }
    }
    const WORLD_LENGTH = buildings[buildings.length - 1].x + buildings[buildings.length - 1].width + 200;

    function buildingAt(px){
        for (const b of buildings){
            if (px >= b.x && px <= b.x + b.width) return b;
        }
        return null;
    }

    // ---------- enemies ----------
    // Exactly one of each, back to back starting at the second building —
    // grunt, then patroller, then charger, then duelist. Nothing else in
    // the whole level after that.
    const enemies = [];

    // 1. sword grunt — plain, no-frills. In its starting state it blocks X:
    // press X first and it blocks your attack and kills you. The real answer
    // is A and Z, in EITHER order (AZ or ZA both work).
    {
        const b = buildings[1];
        enemies.push({
            type: 'swordGrunt',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: ['x'], // any single X press fails — kill length is 2
            hitFlash: 0,
            deathTimer: 0
        });
    }

    // 2. sword patroller — walks its rooftop the whole fight; blocking its
    // sword never stops its legs. Same Z -> X -> A sequence.
    {
        const b = buildings[2];
        const margin = Math.min(18, b.width * 0.15);
        const patrolMinX = b.x + margin;
        const patrolMaxX = Math.max(patrolMinX, b.x + b.width - margin - 36);
        enemies.push({
            type: 'swordPatroller',
            x: (patrolMinX + patrolMaxX) / 2,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: ['xa'], // X into A (or A into X), anywhere — kill length is 3
            hitFlash: 0,
            deathTimer: 0,
            patrolMinX, patrolMaxX,
            patrolDir: rand() < 0.5 ? 1 : -1,
            patrolSpeed: 55,
            walkPhase: 0
        });
    }

    // 3. charger slasher — rushes straight at you, mid-slash the whole time.
    // Sequence is X (counter) -> A (slash) -> Z -> Z.
    {
        const b = buildings[3];
        const margin = Math.min(14, b.width * 0.12);
        enemies.push({
            type: 'chargerSlasher',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: ['azx'], // A,Z,X (or X,Z,A) anywhere — kill length is 4
            hitFlash: 0,
            deathTimer: 0,
            homeMinX: b.x + margin,
            homeMaxX: Math.max(b.x + margin, b.x + b.width - margin - 36),
            facing: 1
        });
    }

    // 4. duelist — counters your first attempt, then attacks back with its
    // own strike before you can finish it. Z -> X -> A -> X -> A.
    {
        const b = buildings[4];
        enemies.push({
            type: 'duelist',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: ['za', 'xz'], // Z into A, or X into Z (either direction) — kill length is 3
            hitFlash: 0,
            deathTimer: 0
        });
    }

    // 5. flanker — introduces the S key. It attacks, you block, it blocks
    // your counter — the answer is to hit S and strike from the other side.
    // Blocks S into A (or A into S), anywhere — kill length is 3.
    {
        const b = buildings[5];
        enemies.push({
            type: 'flanker',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: ['sa'],
            hitFlash: 0,
            deathTimer: 0
        });
    }

    // 6. guardian — blocks S into A, S into X, and A into Z (or any of those
    // reversed). Kill length is 3.
    {
        const b = buildings[6];
        enemies.push({
            type: 'guardian',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: ['sa', 'sx', 'az'],
            hitFlash: 0,
            deathTimer: 0
        });
    }

    // 7. warden — four 4-letter blocks. Kill length is 5.
    {
        const b = buildings[7];
        enemies.push({
            type: 'warden',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: ['azxs', 'asxz', 'axzs', 'azsx'],
            hitFlash: 0,
            deathTimer: 0
        });
    }

    // 8. swinger — introduces Q. Every 1-3s it winds up a swing at your
    // head; duck it with Q within 1s or it kills you. Duck it and you get
    // 1.5s to finish it off with A.
    {
        const b = buildings[8];
        enemies.push({
            type: 'swinger',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            hitFlash: 0,
            deathTimer: 0,
            swingState: 'idle',
            swingTimer: randRange(1, 3),
            swingStateTimer: 0
        });
    }

    // 9. phantom — introduces C: jump, flip, and land on the other side of
    // it, then you have 1s to finish the combo from there. Blocks CAZX
    // (kill length 5) — C itself is always safe to open with since a single
    // press can never complete a 4-letter block, but following it with
    // exactly A, Z, X is the trap.
    {
        const b = buildings[9];
        enemies.push({
            type: 'phantom',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: ['cazx'],
            requiredFirst: 'c', // must open with the flip — nothing else counts as the first move
            hitFlash: 0,
            deathTimer: 0,
            comboWindowTimer: 0
        });
    }

    // 10. headhunter — does a headswing like the original swinger (duck with
    // Q), but then you only have 0.5s to press C before it kills you, and
    // once C lands you finish with A (untimed).
    {
        const b = buildings[10];
        enemies.push({
            type: 'headhunter',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            hitFlash: 0,
            deathTimer: 0,
            swingState: 'idle',
            swingTimer: randRange(1, 3),
            swingStateTimer: 0,
            postDuckKey: 'c',
            finalKey: 'a',
            openWindowDuration: 0.5,
            openWindowKills: true
        });
    }

    // 11. kicker — a regular headswing, ducked with W (same timing/rules as
    // Q on the swinger); no follow-up key — once you're back up, the kick
    // lands automatically.
    {
        const b = buildings[11];
        enemies.push({
            type: 'kicker',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            hitFlash: 0,
            deathTimer: 0,
            swingState: 'idle',
            swingTimer: randRange(1, 3),
            swingStateTimer: 0,
            duckKey: 'w',
            finishPose: 'kick',
            autoFinish: true
        });
    }

    // 12. resister — a headswing ducked with W (same as the kicker), then
    // introduces resistance: W is required somewhere in the finishing combo,
    // but the enemy resists it as a finishing blow, so landing on W at kill
    // length doesn't actually kill it — you need a different key to close
    // it out. Also blocks A outright.
    {
        const b = buildings[12];
        enemies.push({
            type: 'resister',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: ['a'],
            resist: 'w',
            requiredKey: 'w',
            hitFlash: 0,
            deathTimer: 0,
            swingState: 'idle',
            swingTimer: randRange(1, 3),
            swingStateTimer: 0,
            duckKey: 'w',
            duckHandoff: true
        });
    }

    // 13. shifter — a stationary block-combo enemy whose block changes
    // every few seconds, cycling through three. Each shift wipes any
    // half-finished combo (no penalty), so you either fire off a full
    // 3-key combo for the current block fast, or wait for the block you
    // planned for.
    {
        const b = buildings[13];
        const shiftCycle = ['zx', 'as', 'xa'];
        enemies.push({
            type: 'shifter',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: [shiftCycle[0]],
            shiftCycle,
            shiftIndex: 0,
            shiftInterval: 3.5,
            shiftTimer: 3.5,
            shiftFlash: 0,
            hitFlash: 0,
            deathTimer: 0
        });
    }

    // 14. shapeshifter — the shifter again, but with 3-letter blocks, so
    // every combo is 4 keys long. Gets a slightly longer interval to fit
    // the extra key in.
    {
        const b = buildings[14];
        const shiftCycle = ['zxa', 'asz', 'xzs'];
        enemies.push({
            type: 'shapeshifter',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: [shiftCycle[0]],
            shiftCycle,
            shiftIndex: 0,
            shiftInterval: 4.5,
            shiftTimer: 4.5,
            shiftFlash: 0,
            hitFlash: 0,
            deathTimer: 0
        });
    }

    // 15. clocker — a normal block-combo enemy on a fuse: after every
    // correct key you get 0.7s to land the next one, or it strikes you
    // down. Blocks AZS, so the kill is 4 quick keys.
    {
        const b = buildings[15];
        enemies.push({
            type: 'clocker',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: ['azs'],
            keyGap: 0.7,
            hitFlash: 0,
            deathTimer: 0
        });
    }

    // 16. twin blades — two enemies sharing one rooftop. Every key you
    // press lands on both, so a single combo has to get past BOTH block
    // lists (forward and backward), and the longer block sets the kill
    // length. They go down together.
    {
        const b = buildings[16];
        const left = {
            type: 'twinBlade',
            x: b.x + b.width * 0.28 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            blocks: ['zxa'],
            hitFlash: 0,
            deathTimer: 0
        };
        const right = Object.assign({}, left, {
            x: b.x + b.width * 0.72 - 18,
            blocks: ['sxz']
        });
        left.twin = right;
        right.twin = left;
        enemies.push(left, right);
    }

    // 17. overseer (boss) — three phases on one rooftop, using everything
    // before it. Phase 1: a Q headswing, then 0.5s to flip behind it with C.
    // Phase 2: a 5-key combo against ZXAS that resists A as the final blow.
    // Phase 3: a clocker combo against XZS with 0.7s between keys.
    // Die anywhere in the fight and it resets to phase 1.
    {
        const b = buildings[17];
        enemies.push({
            type: 'overseer',
            x: b.x + b.width * 0.5 - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            hitFlash: 0,
            deathTimer: 0,
            swingState: 'idle',
            swingTimer: randRange(1, 3),
            swingStateTimer: 0,
            postDuckKey: 'c',
            openWindowDuration: 0.5,
            openWindowKills: true,
            bossPhase: 0,
            bossPhases: [
                { hint: 'DUCK Q · THEN C IN 0.5s' }, // phase 1 is the headswing, handled by the swing system
                { blocks: ['zxas'], resist: 'a' },
                { blocks: ['xzs'], keyGap: 0.7 }
            ]
        });
    }

    // ================= downtown: street enemies =================
    // shared shape for a plain standing block-combo bot on a rooftop
    function streetBot(type, b, frac, extra){
        return Object.assign({
            type,
            x: b.x + b.width * frac - 18,
            y: b.y - 66,
            w: 36, h: 66,
            alive: true,
            comboStep: 0,
            hitFlash: 0,
            deathTimer: 0,
            street: true
        }, extra);
    }

    // 18. tagger — sprays graffiti over one letter of its own BLOCKS tag
    // every few seconds. The block never changes, so read it while you can.
    enemies.push(streetBot('tagger', buildings[18], 0.5, {
        blocks: ['xsa'], tagHide: true
    }));

    // 19. courier — rides an e-scooter back and forth across its roof. Too
    // fast to hit at speed: a key while it's cruising gets you run down.
    // It brakes (brake light on) coming into each turn — that's the window.
    {
        const b = buildings[19];
        const margin = Math.min(14, b.width * 0.1);
        const patrolMinX = b.x + margin;
        const patrolMaxX = Math.max(patrolMinX, b.x + b.width - margin - 36);
        enemies.push(streetBot('courier', b, 0.5, {
            blocks: ['zs'],
            patrolMinX, patrolMaxX,
            patrolDir: 1,
            courierSpeed: 0,
            facing: 1
        }));
    }

    // 20. billboard — no tag over its head. Its blocks are up on a big
    // billboard on the NEXT rooftop, so you have to look ahead.
    enemies.push(streetBot('billboard', buildings[20], 0.5, {
        blocks: ['sxa'], billboardOn: 21
    }));

    // 21. bouncer — NO ENTRY: Z. Z can't appear anywhere in the combo,
    // on top of its normal blocks.
    enemies.push(streetBot('bouncer', buildings[21], 0.35, {
        blocks: ['sx', 'ax'], banned: 'z'
    }));

    // 22. street magician — three identical bots, one real. Swing at a fake
    // and it strikes. The fakes give themselves away by flickering now and
    // then. One shared tag floats over the middle bot.
    {
        const b = buildings[22];
        const fracs = [0.2, 0.5, 0.8];
        const realIdx = Math.floor(rand() * 3);
        const crew = fracs.map((f, i) => streetBot('magician', b, f, {
            decoy: i !== realIdx,
            flickerTimer: randRange(0.8, 2.2),
            flicker: 0
        }));
        const real = crew[realIdx];
        real.blocks = ['ax'];
        for (const m of crew){
            m.magicGroup = crew;
            if (m !== crew[1]) m.noLabel = true; // only the middle one carries the tag
            else m.labelFrom = real;
        }
        enemies.push(...crew);
    }

    // 23. DJ — every key has to land on the beat. The bot and its tag pulse
    // with it; a key off the beat gets you struck.
    enemies.push(streetBot('dj', buildings[23], 0.5, {
        blocks: ['zas'], beat: 0.7, beatWindow: 0.22, beatClock: 0
    }));

    // 24. drone handler — a drone circles it. Swat the drone with A while
    // it's passing in front, then fight the bot. Any other key while the
    // drone is up (or A while it's behind) gets you struck.
    enemies.push(streetBot('droneHandler', buildings[24], 0.5, {
        blocks: ['xs', 'za'], droneAlive: true, droneAngle: 0
    }));

    // 25. hacker — swaps two of your keys while it's alive: with SWAP A↔X,
    // pressing A counts as X and X counts as A.
    enemies.push(streetBot('hacker', buildings[25], 0.5, {
        blocks: ['xz'], swap: { a: 'x', x: 'a' }
    }));

    // 26. traffic cop — its visor cycles red, yellow, green. Keys only count
    // on green; a key on red gets you struck; yellow just ignores you.
    enemies.push(streetBot('trafficCop', buildings[26], 0.5, {
        blocks: ['asz'], traffic: true
    }));

    // 27. subway rider — after every key that lands, it leaps across to the
    // other rooftop (27 <-> 28). Your combo carries over; jump after it.
    {
        const a = buildings[27], b2 = buildings[28];
        const stops = [
            { x: a.x + a.width * 0.6 - 18, y: a.y - 66 },
            { x: b2.x + b2.width * 0.4 - 18, y: b2.y - 66 }
        ];
        enemies.push(streetBot('subwayRider', a, 0.6, {
            blocks: ['xa'], hopStops: stops, hopAt: 0, hopT: 0, hopping: false
        }));
    }

    // 29. crew — three bots in a row. Each finishing key is also the first
    // key of the next bot's combo, so it's one long chained combo.
    {
        const b = buildings[29];
        const crew = [
            streetBot('crew', b, 0.2, { blocks: ['zx'] }),
            streetBot('crew', b, 0.5, { blocks: ['as'], labelLift: 24 }),
            streetBot('crew', b, 0.8, { blocks: ['xs'], labelLift: 48 })
        ];
        crew.forEach((c, i) => { c.crewNext = crew[i + 1] || null; c.crewIndex = i; });
        enemies.push(...crew);
    }

    // 30. kingpin (boss) — runs the street crews, and fights like them.
    // Phase 1: tagger (graffiti over its tag). Phase 2: hacker (S and Z
    // swapped). Phase 3: traffic light. Phase 4: a 5-key combo on a 0.8s
    // fuse while the whole penthouse roof lights up. Die and it resets.
    enemies.push(streetBot('kingpin', buildings[30], 0.5, {
        bossPhase: 0,
        bossPhases: [
            { blocks: ['zsx'], tagHide: true },
            { blocks: ['sa'], swap: { s: 'z', z: 's' } },
            { blocks: ['xaz'], traffic: true },
            { blocks: ['azsx'], keyGap: 0.8, roofGlow: true }
        ]
    }));

    // ================= skyline: tower enemies =================
    // the Z<->X / A<->S pairing the mirror bot and shadow both use
    const KEY_PAIRS = { z: 'x', x: 'z', a: 's', s: 'a' };

    // 31. glitch — its tag scrambles the letter order every second, because
    // the order doesn't matter: ANY arrangement of those letters, anywhere
    // in a row, counts as the block.
    enemies.push(streetBot('glitch', buildings[31], 0.5, {
        blocks: ['zxa'], anyOrder: true, glitchClock: 0
    }));

    // 32. mirror bot — answers every key you land with its mirror (Z<->X,
    // A<->S). Its echoes go into the combo too, so an echo can complete a
    // block and get you struck. Kill length counts your keys only.
    enemies.push(streetBot('mirrorBot', buildings[32], 0.5, {
        blocks: ['xa', 'sz'], mirror: true
    }));

    // 33. window washer — rides a gondola up and down the outside of the
    // tower. It's only in reach while the platform is level with the roof.
    {
        const b = buildings[33];
        enemies.push(streetBot('windowWasher', b, 1, {
            x: b.x + b.width + 6,
            blocks: ['saz'], washRoofY: b.y, washClock: 0, lookBuilding: b
        }));
    }

    // 34. neon sign — its tag flickers between two blocks. Each key is
    // checked against whichever block is lit at that moment.
    enemies.push(streetBot('neonSign', buildings[34], 0.5, {
        blocks: ['zx'], signBlocks: ['zx', 'as'], signClock: 0
    }));

    // 35 is an open roof — you cross it under the sniper's fire.
    // 36. sniper — on the far end of the next tower. From the moment you
    // reach roof 35 its laser tracks you; when the dot flares, duck (Q/W)
    // or be in the air, or the shot drops you. Up close it stops shooting
    // and fights like anything else.
    enemies.push(streetBot('sniper', buildings[36], 0.82, {
        blocks: ['xsz'], sniper: true, aimFrom: buildings[35].x - 10, aimTimer: 1.4
    }));

    // 37. elevator — rides up out of a shaft in the roof. Every key you
    // land lifts it a floor; stall for 1.6s and it sinks a floor (and you
    // lose that key). Finish it at the top.
    {
        const b = buildings[37];
        enemies.push(streetBot('elevator', b, 0.5, {
            blocks: ['zas'], shaftRoofY: b.y, floorLift: 0, sinkTimer: 0
        }));
    }

    // 38. countdown — its number is exactly how many keys the combo must be,
    // instead of the usual block length + 1.
    enemies.push(streetBot('countdown', buildings[38], 0.5, {
        blocks: ['zx', 'as'], killLength: 6
    }));

    // 39. shadow — every second key you press has to be the partner of the
    // key before it (Z<->X, A<->S).
    enemies.push(streetBot('shadow', buildings[39], 0.5, {
        blocks: ['xsz'], pairRule: true
    }));

    // 40. blackout — the roof goes dark every few seconds; in the dark you
    // only see it (and its tag) in lightning flashes. Keys still count.
    enemies.push(streetBot('blackout', buildings[40], 0.5, {
        blocks: ['azx', 'sxz'], blackout: true, darkClock: 0, dark: false, flash: 0
    }));

    // 41. architect (boss) — builds a wall of blocks around itself: every
    // phase ADDS a block and keeps the old ones, until it's dodging five.
    enemies.push(streetBot('architect', buildings[41], 0.5, {
        bossPhase: 0,
        bossPhases: [
            { blocks: ['zx'] },
            { blocks: ['zx', 'as'] },
            { blocks: ['zx', 'as', 'xa'] },
            { blocks: ['zx', 'as', 'xa', 'sz'] },
            { blocks: ['zx', 'as', 'xa', 'sz', 'za'] }
        ]
    }));

    // ---------- enemy looks: shiny towers get cooler bots ----------
    // Bots standing on suburban houses stay plain grey scrap metal
    // (urban 0). Bots on any tower get the upgraded look, and it climbs
    // with how shiny the tower is (brick < glass < stepped < spire) and how
    // built-up and neon that stretch of city is: street gear (scarf, shoulder stripe), then a lit
    // LED visor, chest core and knee lights, then a helmet fin, then
    // black chrome with glowing neon trim.
    // how fancy a bot each tower style gets, before the city's density and
    // neon push it further
    const SHINY_STYLE_BASE = { brickTower: 0.3, glassTower: 0.55, steppedTower: 0.75, spireTower: 0.9 };
    function urbanAccent(u){
        if (u < 0.3) return '#ff8a1f';  // street: hazard orange
        if (u < 0.55) return '#21d4c4'; // city: teal
        if (u < 0.8) return '#3df2ff';  // downtown: cyan
        return '#ff3fd2';               // neon: magenta
    }
    for (const e of enemies){
        if (e.type === 'kingpin' || e.type === 'architect') setBossPhase(e, 0);
        const b = e.lookBuilding || buildingAt(e.x + e.w / 2);
        const base = b ? (SHINY_STYLE_BASE[b.style] || (b.neon ? 0.55 : 0)) : 0;
        // every bot on a brown brick tower gets the exact same look as the
        // twin blades; the silver towers climb from there
        e.urban = !base ? 0 : b.style === 'brickTower' ? 0.35 : Math.min(1, base + 0.3 * b.density + b.cyber);
    }
    for (const e of enemies){
        e.accent = e.bossPhases ? '#ffcf3d' : urbanAccent(e.urban);
        // bots on the silver glass / stepped / spire towers are elites: a
        // whole different, much flashier chassis (see drawEnemy)
        const b = e.lookBuilding || buildingAt(e.x + e.w / 2);
        e.elite = !!b && ['glassTower', 'steppedTower', 'spireTower'].includes(b.style);
    }

    // ---------- player: humanoid robot ----------
    const player = {
        x: buildings[12].x + 10,
        y: buildings[12].y - 74,
        w: 40, h: 74,
        vx: 0, vy: 0,
        onGround: false,
        facing: 1,
        runPhase: 0,
        coyote: 0,
        // combat: 'idle' | 'block' | 'countered' | 'kill'
        combatPose: 'idle',
        combatTimer: 0
    };
    const COYOTE_TIME = 0.09;
    const SWORD_REACH = 78; // how far the player's sword can reach an enemy

    // ---------- tutorial ----------
    // Teaches the rules every fight is built on, never the answer to a
    // specific enemy — working out each combo is the game.
    const TUTORIAL_PAGES = [
        {
            title: 'Welcome to Tech Fighter',
            body: `<p>You're a robot fighting your way across the city's rooftops, from the quiet suburbs all the way to the neon skyline.</p>
                <ul>
                    <li><kbd>←</kbd> <kbd>→</kbd> to run, <kbd>Space</kbd> or <kbd>↑</kbd> to jump between roofs.</li>
                    <li>Every enemy blocks your path. Beat them all to finish the city.</li>
                    <li>Fall into a gap or lose a fight and you're back on the last rooftop you stood on, as many times as it takes.</li>
                </ul>`
        },
        {
            title: 'Reading an Enemy',
            body: `<p>Most enemies wear a tag like <span class="tut-tag">BLOCKS ZX</span> above their head. That's everything you need to beat them.</p>
                <ul>
                    <li>Get close, then type a combo of fight keys.</li>
                    <li>A finishing combo is <b>one key longer</b> than the block. Block 1 letter, finish in 2 keys. Block 4 letters, finish in 5.</li>
                    <li>Your combo can <b>never contain a blocked sequence</b>, forwards <b>or backwards</b>, anywhere in it.</li>
                    <li>You can <b>never press the same key twice in a row</b>.</li>
                </ul>
                <p>One wrong key and the enemy blocks it and strikes you down. Start the combo over.</p>`
        },
        {
            title: 'Your Moves',
            body: `<ul>
                    <li><kbd>Z</kbd> block, <kbd>X</kbd> counter, <kbd>A</kbd> slash. These work from the start.</li>
                    <li>New moves unlock only when you reach the enemy that introduces them, so a key that does nothing yet just hasn't been unlocked.</li>
                    <li><kbd>S</kbd> flank: strike from the side.</li>
                    <li><kbd>C</kbd> flip: leap over to the enemy's other side. Once you land, you have <b>1 second</b> to finish the combo.</li>

                </ul>`
        },
        {
            title: 'Tricky Enemies',
            body: `<ul>
                    <li><b>Head swingers</b> wind up a big swing when you get close. Duck it within about a second or it hits you. Backing away mid-windup also dodges it. What you do after the duck, and how fast, depends on the enemy.</li>
                    <li><b>Openers:</b> some enemies only accept one specific first move.</li>
                    <li><span class="tut-tag">RESISTS W</span> means that key can't be the final blow. It still lands, so finish with something else. Some enemies won't go down until a certain move has landed somewhere in the combo.</li>

                </ul>`
        },
        {
            title: 'Tougher Enemies',
            body: `<ul>
                    <li><b>Shifters</b> change their block every few seconds, and a change wipes any combo you've started. Be quick, or be patient.</li>
                    <li><b>Clockers</b> show a time on their tag. That's all you get between keys. Hesitate and they strike.</li>
                    <li><b>Pairs:</b> when two enemies share a roof, every key hits both. Your combo has to get past both tags at once.</li>
                    <li><b>The boss</b> fights in phases, using everything above. Die at any point and it starts over.</li>
                </ul>`
        },
        {
            title: 'Downtown',
            body: `<p>The city's street bots bend the rules. Their tag usually tells you how.</p>
                <ul>
                    <li><b>Graffiti</b> can hide part of a tag. Read it while it's clean.</li>
                    <li><b>Moving bots</b> can't always be hit. Watch for when they slow down.</li>
                    <li><b>No tag?</b> The answer might be written somewhere else in the city.</li>
                    <li><b>NO ENTRY</b> keys can't be used anywhere in the combo.</li>
                    <li><b>Lookalikes:</b> only one is real. Fakes give themselves away if you watch.</li>
                    <li><b>Rhythm, lights, drones and swaps</b> change <i>when</i> or <i>how</i> your keys count. Don't rush in.</li>
                    <li><b>Crews</b> chain together: the key that finishes one bot starts the next.</li>
                </ul>`
        },
        {
            title: 'Skyline',
            body: `<p>The tallest towers play the hardest tricks.</p>
                <ul>
                    <li><b>ANY ORDER</b> means the letters count as a block however they're arranged.</li>
                    <li><b>Partners:</b> Z goes with X, A goes with S. Some bots care about that, so read their tag.</li>
                    <li><b>Out of reach?</b> Some bots move in and out of range. Strike while they're level with you.</li>
                    <li><b>Lasers:</b> when the dot flares, get low or get airborne.</li>
                    <li><b>EXACTLY</b> means your combo must be exactly that long.</li>
                    <li><b>In the dark</b>, your keys still work. Remember what you saw.</li>
                    <li><b>The last boss</b> never forgets a block. Every phase adds one more.</li>
                </ul>`
        },
        {
            title: 'Ready?',
            body: `<ul>
                    <li>Read the tag and plan the whole combo <b>before</b> you get close.</li>
                    <li>Check it backwards too. That's the usual trap.</li>
                    <li>When an enemy introduces a new key, it's probably the key that enemy wants.</li>
                    <li>Losing costs nothing. Experiment.</li>
                </ul>
                <p>Open this again anytime with the <b>Tutorial</b> button or <kbd>H</kbd>.</p>`
        }
    ];
    const TUTORIAL_SEEN_KEY = 'techFighterTutorialSeen';
    const tutorialEl = document.getElementById('tutorial');
    const tutBack = document.getElementById('tut-back');
    const tutNext = document.getElementById('tut-next');
    let tutorialOpen = false;
    let tutorialPage = 0;

    function renderTutorial(){
        const page = TUTORIAL_PAGES[tutorialPage];
        const lastPage = tutorialPage === TUTORIAL_PAGES.length - 1;
        document.getElementById('tut-step').textContent = 'Tutorial · ' + (tutorialPage + 1) + ' of ' + TUTORIAL_PAGES.length;
        document.getElementById('tut-title').textContent = page.title;
        document.getElementById('tut-body').innerHTML = page.body;
        document.getElementById('tut-dots').innerHTML = TUTORIAL_PAGES
            .map((_, i) => '<span class="' + (i === tutorialPage ? 'on' : '') + '"></span>').join('');
        tutBack.disabled = tutorialPage === 0;
        tutNext.textContent = lastPage ? "Let's Fight" : 'Next';
    }

    function openTutorial(){
        tutorialOpen = true;
        tutorialPage = 0;
        for (const k in keys) keys[k] = false; // don't keep running on a held key
        tutorialEl.classList.add('open');
        renderTutorial();
    }

    function closeTutorial(){
        tutorialOpen = false;
        tutorialEl.classList.remove('open');
        try { localStorage.setItem(TUTORIAL_SEEN_KEY, '1'); } catch (err) {}
        canvas.focus();
    }

    function tutorialStep(delta){
        const nextPage = tutorialPage + delta;
        if (nextPage >= TUTORIAL_PAGES.length) closeTutorial();
        else if (nextPage >= 0){ tutorialPage = nextPage; renderTutorial(); }
    }

    tutBack.addEventListener('click', () => tutorialStep(-1));
    tutNext.addEventListener('click', () => tutorialStep(1));
    document.getElementById('help-btn').addEventListener('click', e => { e.currentTarget.blur(); openTutorial(); });

    const keys = {};
    window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if (tutorialOpen){
            if (k === 'arrowright' || k === 'enter' || k === ' ') tutorialStep(1);
            else if (k === 'arrowleft') tutorialStep(-1);
            else if (k === 'escape' || k === 'h') closeTutorial();
            e.preventDefault();
            return;
        }
        if (k === 'h'){ openTutorial(); return; }
        keys[k] = true;
        if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
        if (k === 'z' || k === 'x' || k === 'a' || k === 's' || k === 'q' || k === 'c' || k === 'w') handleCombatKey(k);
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    let lastRespawnBuildingIdx = 12;

    function respawnPlayer(){
        const rb = buildings[lastRespawnBuildingIdx];
        player.x = rb.x + rb.width / 2 - player.w / 2;
        player.y = rb.y - player.h;
        player.vx = 0; player.vy = 0;
        player.combatPose = 'idle';
        player.combatTimer = 0;
        // give any nearby enemy a fresh start rather than an unfair reset mid-attempt
        for (const e of enemies){
            if (e.alive){
                e.comboStep = 0;
                e.pressedKeys = [];
                e.comboWindowTimer = 0;
            }
            e.punishPose = null;
            e.punishLunge = 0;
            if (e.swingState && e.alive){
                e.swingState = 'idle';
                e.swingTimer = randRange(1, 3);
            }
            if (e.bossPhases && e.alive) setBossPhase(e, 0);
            if (e.alive && e.droneAlive === false) e.droneAlive = true; // the drone comes back up
            if (e.alive){
                e.echoSeq = [];
                if (e.shaftRoofY != null){ e.floorLift = 0; e.sinkTimer = 0; }
                if (e.sniper){ e.aimTimer = 1.4; e.charging = false; }
            }
            if (e.alive && e.hopStops){
                e.hopping = false;
                e.hopAt = 0;
                e.x = e.hopStops[0].x;
                e.y = e.hopStops[0].y;
            }
        }
        deathSequence = null;
        deathFlash = 0.3;
    }

    let deathFlash = 0;

    // S doesn't exist as a move until you actually reach the flanker enemy
    let sUnlocked = false;
    // Q doesn't exist as a move until you reach the swinger enemy
    let qUnlocked = false;
    const SWING_ENGAGE_RANGE = 130; // how close you need to be for its swing to threaten you — kept tight so a neighboring rooftop's enemy can't reach across and ambush you
    // C doesn't exist as a move until you reach the phantom enemy
    let cUnlocked = false;
    // W doesn't exist as a move until you reach the kicker enemy
    let wUnlocked = false;

    // C always does the same thing: jump, flip, and land on the far side of
    // whichever enemy you used it on — shared so every enemy that lets you
    // use C gets identical, consistent repositioning
    function flipBehind(target){
        const targetCx = target.x + target.w / 2;
        const wasLeft = (player.x + player.w / 2) < targetCx;
        player.flipStartX = player.x; // where the jump actually launches from
        player.x = wasLeft ? (targetCx + 25) : (targetCx - 25 - player.w);
        player.facing = wasLeft ? -1 : 1;
        player.combatPose = 'flip';
        player.combatTimer = 0.6;
    }

    // boss phases: move the overseer on to its next phase (or all the way
    // back to the headswing opener, when you die)
    function setBossPhase(e, idx){
        e.bossPhase = idx;
        const phase = e.bossPhases[idx];
        for (const f of ['blocks', 'resist', 'keyGap', 'tagHide', 'swap', 'traffic', 'roofGlow']){
            e[f] = phase[f] || null;
        }
        e.pressedKeys = [];
        e.comboStep = 0;
        e.comboWindowTimer = 0;
        if (phase.blocks){
            e.swingState = null; // hand off to the block-combo system
        } else {
            e.swingState = 'idle';
            e.swingTimer = randRange(1, 3);
        }
    }

    // shared finishing-blow logic for any "duckable" (swingState) enemy
    function killSwingerEnemy(e, pose){
        player.combatPose = pose || 'kill';
        player.combatTimer = pose === 'duckKick' ? 0.9 : (pose === 'kick' ? 0.6 : 0.35);
        e.alive = false;
        e.deathTimer = 0.5;
        e.deathParticles = [];
        for (let i = 0; i < 7; i++){
            const ang = (i / 7) * Math.PI * 2 + rand() * 0.6;
            e.deathParticles.push({
                vx: Math.cos(ang), vy: Math.sin(ang) - 0.4,
                color: i % 2 === 0 ? '#c9ccd0' : '#3dffb0',
                size: 3 + rand() * 3
            });
        }
        spawnEffect(e.x + e.w / 2, e.y + e.h * 0.45, '#ffffff', 0.3);
    }

    // wrong key / wrong order -> the enemy blocks whatever you just tried,
    // then strikes you down. A brief, readable two-beat sequence instead of
    // an instant cut to black.
    let deathSequence = null; // { phase:'block'|'strike', timer, enemy }
    function startPunishSequence(target){
        deathSequence = { phase: 'block', timer: 0.3, enemy: target };
        target.punishPose = 'block';
        target.punishLunge = 0;
        player.combatPose = 'staggered';
        player.combatTimer = 999;
        spawnEffect(
            (player.x + player.w / 2 + target.x + target.w / 2) / 2,
            (player.y + target.y) / 2,
            '#ffdd55', 0.3
        );
    }

    function updateEnemies(dt){
        for (const e of enemies){
            if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
            if (!e.alive && e.deathTimer > 0) e.deathTimer = Math.max(0, e.deathTimer - dt);

            // the 1s window C opens to finish a combo — run out of time and
            // it kills you, same as any other wrong move
            if (e.alive && e.comboWindowTimer > 0){
                e.comboWindowTimer -= dt;
                if (e.comboWindowTimer <= 0){
                    e.comboWindowTimer = 0;
                    if (!(deathSequence && deathSequence.phase)) startPunishSequence(e);
                }
            }

            // glitch: just the clock its scrambled tag runs off
            if (e.anyOrder && e.alive) e.glitchClock += dt;

            // window washer: gondola rides up and down the side of the tower
            if (e.washRoofY != null && e.alive){
                e.washClock += dt;
                const depth = (0.5 - 0.5 * Math.cos(e.washClock * 1.25)) * 130; // 0 = level with the roof
                e.y = e.washRoofY - 66 + depth;
                e.level = depth < 14;
            }

            // neon sign: flicks between its two blocks
            if (e.signBlocks && e.alive){
                e.signClock += dt;
                const lit = Math.floor(e.signClock / 1.3) % 2;
                if (e.signLit !== lit){ e.signLit = lit; e.shiftFlash = 0.15; }
                e.blocks = [e.signBlocks[lit]];
                if (e.shiftFlash > 0) e.shiftFlash = Math.max(0, e.shiftFlash - dt);
            }

            // sniper: laser tracks you across its approach; flares, then fires
            if (e.sniper && e.alive){
                const dxp = (e.x + e.w / 2) - (player.x + player.w / 2);
                const dist = Math.hypot(dxp, (e.y + e.h / 2) - (player.y + player.h / 2));
                e.aiming = player.x >= e.aimFrom && dist > SWORD_REACH + 10 && !(deathSequence && deathSequence.phase);
                if (!e.aiming){
                    e.aimTimer = Math.max(e.aimTimer, 1.0);
                    e.charging = false;
                } else {
                    e.aimTimer -= dt;
                    e.charging = e.aimTimer < 0.6;
                    if (e.aimTimer <= 0){
                        const dodged = player.combatPose === 'duck' || !player.onGround;
                        if (dodged){
                            spawnEffect(player.x + player.w / 2, player.y + 6, '#ffcf3d', 0.25);
                        } else {
                            spawnEffect(player.x + player.w / 2, player.y + player.h * 0.4, '#ff3030', 0.35);
                            respawnPlayer();
                        }
                        e.aimTimer = randRange(1.3, 2.0);
                        e.charging = false;
                    }
                }
            }

            // elevator: rides up a floor per landed key, sinks back if you stall
            if (e.shaftRoofY != null && e.alive){
                const keys = (e.pressedKeys || []).length;
                if (keys > 0){
                    e.sinkTimer += dt;
                    if (e.sinkTimer >= 1.6){
                        e.pressedKeys.pop();
                        e.comboStep = e.pressedKeys.length;
                        e.sinkTimer = 0;
                    }
                } else e.sinkTimer = 0;
                const targetLift = Math.min(3, (e.pressedKeys || []).length);
                e.floorLift += (targetLift - e.floorLift) * Math.min(1, dt * 8);
                e.y = e.shaftRoofY - 66 + (3 - e.floorLift) * 14;
            }

            // blackout: lights on 2s, dark 2.6s with the odd lightning flash
            if (e.blackout && e.alive){
                e.darkClock = (e.darkClock + dt) % 4.6;
                e.dark = e.darkClock > 2.0;
                if (e.flash > 0) e.flash = Math.max(0, e.flash - dt);
                if (e.dark && e.flash <= 0 && rand() < dt * 0.9) e.flash = 0.14;
            }

            // tagger: graffiti covers one letter of its tag for a while,
            // then it wipes clean, then it tags again
            if (e.tagHide && e.alive){
                e.tagTimer = (e.tagTimer == null ? 2 : e.tagTimer) - dt;
                if (e.tagTimer <= 0){
                    if (e.hiddenIdx == null){
                        const total = e.blocks.join('').length;
                        e.hiddenIdx = Math.floor(rand() * total);
                        e.tagTimer = 2.6;
                    } else {
                        e.hiddenIdx = null;
                        e.tagTimer = 1.6;
                    }
                }
            } else if (!e.tagHide) e.hiddenIdx = null;

            // courier: scooters back and forth, braking hard into each turn
            if (e.type === 'courier' && e.alive){
                const MAX = 160;
                const toEdge = e.patrolDir > 0 ? e.patrolMaxX - e.x : e.x - e.patrolMinX;
                e.courierSpeed = MAX * Math.max(0.12, Math.min(1, toEdge / 50));
                e.x += e.patrolDir * e.courierSpeed * dt;
                if (e.x >= e.patrolMaxX){ e.x = e.patrolMaxX; e.patrolDir = -1; }
                if (e.x <= e.patrolMinX){ e.x = e.patrolMinX; e.patrolDir = 1; }
                e.facing = e.patrolDir;
                e.braking = e.courierSpeed < MAX * 0.5;
            }

            // magician's fakes flicker every so often — the only tell
            if (e.decoy && e.alive){
                if (e.flicker > 0) e.flicker = Math.max(0, e.flicker - dt);
                e.flickerTimer -= dt;
                if (e.flickerTimer <= 0){
                    e.flicker = 0.18;
                    e.flickerTimer = randRange(1.0, 2.4);
                }
            }

            // DJ: keeps the beat
            if (e.beat && e.alive) e.beatClock = (e.beatClock + dt) % e.beat;

            // drone handler: the drone orbits it
            if (e.droneAlive && e.alive) e.droneAngle += dt * 2.3;

            // traffic cop: red -> yellow -> green -> red...
            if (e.traffic && e.alive){
                if (!e.light){ e.light = 'red'; e.lightTimer = 1.3; }
                e.lightTimer -= dt;
                if (e.lightTimer <= 0){
                    if (e.light === 'red'){ e.light = 'yellow'; e.lightTimer = 0.6; }
                    else if (e.light === 'yellow'){ e.light = 'green'; e.lightTimer = 1.7; }
                    else { e.light = 'red'; e.lightTimer = 1.3; }
                }
            } else if (!e.traffic) e.light = null;

            // subway rider: mid-leap between its two rooftops
            if (e.hopping && e.alive){
                e.hopT = Math.min(1, e.hopT + dt / 0.55);
                const from = e.hopStops[1 - e.hopAt], to = e.hopStops[e.hopAt];
                e.x = lerp(from.x, to.x, e.hopT);
                e.y = lerp(from.y, to.y, e.hopT) - Math.sin(Math.PI * e.hopT) * 90;
                if (e.hopT >= 1){ e.hopping = false; e.x = to.x; e.y = to.y; }
            }

            // shifter: swaps to the next block in its cycle on a timer, and
            // a shift wipes whatever combo you had going against it
            if (e.shiftCycle && e.alive){
                if (e.shiftFlash > 0) e.shiftFlash = Math.max(0, e.shiftFlash - dt);
                e.shiftTimer -= dt;
                if (e.shiftTimer <= 0){
                    e.shiftIndex = (e.shiftIndex + 1) % e.shiftCycle.length;
                    e.blocks = [e.shiftCycle[e.shiftIndex]];
                    e.shiftTimer = e.shiftInterval;
                    e.shiftFlash = 0.4;
                    e.pressedKeys = [];
                    e.comboStep = 0;
                    e.comboWindowTimer = 0;
                    spawnEffect(e.x + e.w / 2, e.y - 10, '#4fa3ff', 0.35);
                }
            }

            // patrollers keep walking their rooftop no matter what — blocking
            // their sword never stops their legs, even mid-fight
            if (e.type === 'swordPatroller' && e.alive){
                e.x += e.patrolDir * e.patrolSpeed * dt;
                if (e.x <= e.patrolMinX){ e.x = e.patrolMinX; e.patrolDir = 1; }
                if (e.x >= e.patrolMaxX){ e.x = e.patrolMaxX; e.patrolDir = -1; }
                e.walkPhase += dt * 8;
            }

            // chargers rush straight at the player, mid-slash the whole way,
            // staying within their own rooftop
            if (e.type === 'chargerSlasher' && e.alive){
                const playerCx = player.x + player.w / 2;
                const myCx = e.x + e.w / 2;
                e.facing = playerCx >= myCx ? 1 : -1;
                const closeEnough = Math.abs(playerCx - myCx) < SWORD_REACH * 0.75;
                if (!closeEnough){
                    e.x += e.facing * 95 * dt;
                    e.x = Math.max(e.homeMinX, Math.min(e.homeMaxX, e.x));
                    e.walkPhase = (e.walkPhase || 0) + dt * 8;
                }
            }

            // swinger: a timed dodge fight. Every 1-3s it winds up a swing at
            // your head; duck it with Q inside the 1s telegraph or it kills
            // you. Duck it and you get 1.5s to finish it with A.
            if (e.swingState && e.alive){
                const distToPlayer = Math.hypot(
                    (e.x + e.w / 2) - (player.x + player.w / 2),
                    (e.y + e.h / 2) - (player.y + player.h / 2)
                );
                const playerInRange = distToPlayer <= SWING_ENGAGE_RANGE;

                if (e.swingState === 'idle'){
                    // only threatens you once you're actually near it
                    if (playerInRange){
                        e.swingTimer -= dt;
                        if (e.swingTimer <= 0){
                            e.swingState = 'telegraph';
                            e.swingStateTimer = 1.0;
                        }
                    }
                } else if (e.swingState === 'telegraph'){
                    e.swingStateTimer -= dt;
                    if (e.swingStateTimer <= 0){
                        e.swingState = 'idle';
                        e.swingTimer = randRange(1, 3);
                        // only actually connects if you're still in range —
                        // walking away mid-telegraph is a valid way to dodge it
                        if (playerInRange){
                            spawnEffect(player.x + player.w / 2, player.y + player.h * 0.3, '#ff3030', 0.35);
                            respawnPlayer();
                        }
                    }
                } else if (e.swingState === 'open'){
                    e.swingStateTimer -= dt;
                    if (e.swingStateTimer <= 0){
                        if (e.autoFinish){
                            // no follow-up key needed — once you're back on
                            // your feet from the duck, the kick lands itself
                            killSwingerEnemy(e, e.finishPose);
                        } else if (e.openWindowKills && !(deathSequence && deathSequence.phase)){
                            spawnEffect(player.x + player.w / 2, player.y + player.h * 0.3, '#ff3030', 0.35);
                            respawnPlayer();
                        } else {
                            e.swingState = 'idle';
                            e.swingTimer = randRange(1, 3);
                        }
                    }
                }
                // 'exposed' is untimed — no decay needed
            }
        }
    }

    // Z -> X -> A, strictly in order, against whichever alive enemy is
    // actually in sword range. Wrong key, wrong order, or nothing in range
    // and doing it right still fails you if you're not close enough — the
    // enemy gets the opening instead.
    const effects = []; // transient visual-only fx: {x,y,color,start,duration}
    function spawnEffect(x, y, color, duration){
        effects.push({ x, y, color, start: gameTime, duration: duration || 0.35 });
    }

    function killComboEnemy(e){
        e.alive = false;
        e.comboWindowTimer = 0;
        e.deathTimer = 0.5;
        e.deathParticles = [];
        for (let i = 0; i < 7; i++){
            const a = (i / 7) * Math.PI * 2 + rand() * 0.6;
            e.deathParticles.push({
                vx: Math.cos(a), vy: Math.sin(a) - 0.4,
                color: i % 2 === 0 ? '#c9ccd0' : '#ff5a3d',
                size: 3 + rand() * 3
            });
        }
        spawnEffect(e.x + e.w / 2, e.y + e.h * 0.45, '#ffffff', 0.3);
    }

    function handleCombatKey(k){
        if (deathSequence && deathSequence.phase) return; // mid punish sequence — no interrupting it
        if (k === 's' && !sUnlocked) return; // S doesn't exist yet
        if (k === 'q' && !qUnlocked) return; // Q doesn't exist yet
        if (k === 'c' && !cUnlocked) return; // C doesn't exist yet
        if (k === 'w' && !wUnlocked) return; // W doesn't exist yet

        // a sniper has you in its sights: Q / W just duck under the shot
        if ((k === 'q' || k === 'w') && enemies.some(e => e.sniper && e.alive && e.aiming)){
            player.combatPose = 'duck';
            player.combatTimer = 0.75; // long enough to cover the whole 0.6s flare
            return;
        }

        // "duckable" enemies (anything with a swingState) are a completely
        // different mechanic — a timed dodge, not a key-order puzzle — so
        // handle them before anything else. Each one can configure:
        //   postDuckKey (default 'a')   — the key required right after the duck
        //   finalKey (optional)          — a second key required after that
        //   openWindowDuration (default 1.5) — how long you get for postDuckKey
        //   openWindowKills (default false)  — whether missing that window kills you
        if (k === 'q' || k === 'c' || k === 'a' || k === 'w'){
            for (const e of enemies){
                if (!e.alive || !e.swingState) continue;
                const dist = Math.hypot(
                    (e.x + e.w / 2) - (player.x + player.w / 2),
                    (e.y + e.h / 2) - (player.y + player.h / 2)
                );
                if (dist > SWING_ENGAGE_RANGE) continue;

                const postDuckKey = e.postDuckKey || 'a';

                // some enemies collapse duck + kill into a single key
                if (e.duckKillKey && k === e.duckKillKey && e.swingState === 'telegraph'){
                    killSwingerEnemy(e, 'duckKick');
                    return;
                }

                if (k === (e.duckKey || 'q') && e.swingState === 'telegraph'){
                    player.combatPose = 'duck';
                    player.combatTimer = 0.4;
                    spawnEffect(player.x + player.w / 2, player.y + player.h * 0.3, '#3dffb0', 0.3);
                    if (e.duckHandoff){
                        // duck is just the opener — hand this enemy off to
                        // the regular blocks/resistance combo system to
                        // actually finish it
                        e.swingState = null;
                        return;
                    }
                    e.swingState = 'open';
                    e.swingStateTimer = e.autoFinish ? (e.autoFinishDelay != null ? e.autoFinishDelay : 0.6) : (e.openWindowDuration || 1.5);
                    return;
                }

                if (k === postDuckKey && e.swingState === 'open'){
                    if (e.bossPhases){
                        // the boss doesn't die to its opener — the flip just
                        // gets you behind it and starts phase 2
                        flipBehind(e);
                        setBossPhase(e, 1);
                        e.hitFlash = 0.25;
                        spawnEffect(e.x + e.w / 2, e.y + e.h * 0.3, '#b060ff', 0.35);
                        return;
                    }
                    if (e.finalKey){
                        // one more key needed — not the kill yet
                        e.swingState = 'exposed';
                        e.swingStateTimer = 0; // untimed from here
                        if (postDuckKey === 'c'){
                            flipBehind(e); // C always jumps you behind the target
                        } else {
                            player.combatPose = 'kill';
                            player.combatTimer = 0.35;
                        }
                        spawnEffect(e.x + e.w / 2, e.y + e.h * 0.4, '#b060ff', 0.3);
                        return;
                    }
                    killSwingerEnemy(e, e.finishPose);
                    return;
                }

                if (e.finalKey && k === e.finalKey && e.swingState === 'exposed'){
                    killSwingerEnemy(e);
                    return;
                }
            }
        }

        let target = null, bestDist = Infinity;
        for (const e of enemies){
            if (!e.alive || e.swingState) continue; // handled above, not the block-combo system
            if (e.hopping) continue; // mid-leap — can't reach it
            if (e.washRoofY != null && !e.level) continue; // gondola's below the roof
            const dx = (e.x + e.w / 2) - (player.x + player.w / 2);
            const dy = (e.y + e.h / 2) - (player.y + player.h / 2);
            const dist = Math.hypot(dx, dy);
            // an enemy handed off from a duck (e.g. the resister) can be
            // ducked from as far as SWING_ENGAGE_RANGE, so it needs to stay
            // reachable at that same range right after — not shrink to the
            // tighter melee-only SWORD_REACH the stationary puzzle enemies use
            const reach = e.duckHandoff ? SWING_ENGAGE_RANGE : SWORD_REACH;
            if (dist <= reach && dist < bestDist){ bestDist = dist; target = e; }
        }
        if (!target) return; // nothing in reach — key does nothing

        // ---- street enemy rules that decide whether this key even counts ----
        if (target.decoy){ startPunishSequence(target); return; } // swung at a fake
        if (target.type === 'courier' && !target.braking){ startPunishSequence(target); return; } // run down at speed
        if (target.light === 'yellow') return; // waiting on the light — ignored
        if (target.light === 'red'){ startPunishSequence(target); return; }
        if (target.beat){
            const ph = target.beatClock;
            const onBeat = ph < target.beatWindow || ph > target.beat - target.beatWindow;
            if (!onBeat){ startPunishSequence(target); return; }
        }
        if (target.droneAlive){
            const droneFront = Math.sin(target.droneAngle) > 0.35;
            if (k === 'a' && droneFront){
                target.droneAlive = false;
                player.combatPose = 'kill';
                player.combatTimer = 0.35;
                spawnEffect(target.x + target.w / 2 + Math.cos(target.droneAngle) * 30, target.y + target.h * 0.2, '#ffcf3d', 0.4);
            } else {
                startPunishSequence(target);
            }
            return;
        }
        if (target.swap && target.swap[k]) k = target.swap[k]; // hacked controls

        const midX = (player.x + player.w / 2 + target.x + target.w / 2) / 2;
        const midY = (player.y + target.y) / 2;

        // an enemy is beaten by pressing (block length + 1) keys total, as
        // long as: no two presses in a row are the same letter, and the
        // presses-so-far never spell out one of the enemy's blocks — forward
        // OR backward. Any other combination of that length works.
        target.pressedKeys = target.pressedKeys || [];
        // twin blades: every key lands on both, so the combo has to get past
        // both enemies' blocks, and the longer block sets the kill length
        const twin = target.twin && target.twin.alive ? target.twin : null;
        const blocks = (target.blocks || ['z']).concat(twin ? twin.blocks : []); // 'z' fallback shouldn't normally be hit
        // countdown sets its own exact length
        const killLength = target.killLength || (Math.max(...blocks.map(b => b.length)) + 1);

        const lastKey = target.pressedKeys[target.pressedKeys.length - 1];
        const repeatFail = lastKey === k;

        // mirror bot: its echo of your key goes into the sequence too
        const echo = target.mirror ? (KEY_PAIRS[k] || k) : null;
        const seqSoFar = target.mirror ? (target.echoSeq || []) : target.pressedKeys;
        const tentative = seqSoFar.concat(echo ? [k, echo] : [k]).join('');
        const blockFail = blocks.some(b => {
            if (target.anyOrder){
                // glitch: any arrangement of the block's letters in a row
                const want = b.split('').sort().join('');
                for (let i = 0; i + b.length <= tentative.length; i++){
                    if (tentative.slice(i, i + b.length).split('').sort().join('') === want) return true;
                }
                return false;
            }
            const rev = b.split('').reverse().join('');
            return tentative.includes(b) || tentative.includes(rev);
        });

        // shadow: every second key must be the partner of the one before it
        const pairFail = target.pairRule && target.pressedKeys.length % 2 === 1 && k !== KEY_PAIRS[lastKey];

        // some enemies require a specific opening move (e.g. phantom must be
        // opened with C — the flip in) before anything else counts
        const firstKeyFail = target.requiredFirst && target.pressedKeys.length === 0 && k !== target.requiredFirst;

        // bouncer: one key isn't allowed in at all
        const bannedFail = target.banned && k === target.banned;

        const correct = !repeatFail && !blockFail && !firstKeyFail && !bannedFail && !pairFail;
        if (correct){
            target.pressedKeys.push(k);
            if (target.mirror) target.echoSeq = tentative.split('');
            if (target.shaftRoofY != null) target.sinkTimer = 0;
        }

        if (correct){
            target.comboStep = target.pressedKeys.length;
            target.hitFlash = 0.25;
            if (twin){
                twin.pressedKeys = target.pressedKeys.slice();
                twin.comboStep = target.comboStep;
                twin.hitFlash = 0.25;
            }
            // resistance: some enemies shrug off one specific key as a
            // finishing blow — everything about the press still lands
            // (animation, hit flash, it's added to the sequence) but it
            // just doesn't kill, so you need a different key to close it out.
            // requiredKey is separate: that key must show up somewhere in
            // the sequence before any finishing blow counts at all.
            const isFinalBlow = target.pressedKeys.length >= killLength
                && k !== target.resist
                && (!target.requiredKey || target.pressedKeys.includes(target.requiredKey));

            // each key has its own animation/effect, independent of whether
            // it happens to be the finishing blow
            if (k === 'z'){
                player.combatPose = 'block';
                player.combatTimer = 0.3;
                spawnEffect(midX, midY, '#dfe6ea', 0.3);
            } else if (k === 'x'){
                player.combatPose = 'counter';
                player.combatTimer = 0.28;
                spawnEffect(target.x + target.w / 2, target.y + target.h * 0.4, '#ff5a3d', 0.4);
            } else if (k === 's'){
                // strikes from the flank — the sword sweeps in from behind
                // the enemy instead of the front
                player.combatPose = 'sideAttack';
                player.combatTimer = 0.3;
                spawnEffect(target.x + target.w / 2, target.y + target.h * 0.5, '#3dffb0', 0.35);
            } else if (k === 'c'){
                // then you've got 1 second to finish the combo from there
                flipBehind(target);
                target.comboWindowTimer = 1.0;
                spawnEffect(target.x + target.w / 2, target.y + target.h * 0.3, '#b060ff', 0.35);
            } else { // 'a'
                player.combatPose = 'kill';
                player.combatTimer = 0.35;
                spawnEffect(target.x + target.w / 2, target.y + target.h * 0.45, '#ffffff', 0.3);
            }

            if (isFinalBlow && target.bossPhases && target.bossPhase < target.bossPhases.length - 1){
                // the overseer shrugs it off and moves to its next phase
                setBossPhase(target, target.bossPhase + 1);
                spawnEffect(target.x + target.w / 2, target.y + target.h * 0.3, '#ffcf3d', 0.45);
            } else if (isFinalBlow){
                killComboEnemy(target);
                if (twin) killComboEnemy(twin);
                // magician: the real one goes down and the fakes vanish with it
                if (target.magicGroup) for (const m of target.magicGroup) if (m.alive) killComboEnemy(m);
                // crew: that finishing key opens the next bot's combo
                const next = target.crewNext;
                if (next && next.alive){
                    next.pressedKeys = [k];
                    next.comboStep = 1;
                    next.hitFlash = 0.25;
                }
            } else {
                if (target.keyGap && k !== 'c'){
                    // clocker fuse: the next key has to land before this runs out
                    target.comboWindowTimer = target.keyGap;
                }
                if (target.hopStops){
                    // subway rider: leaps to the other roof
                    target.hopAt = 1 - target.hopAt;
                    target.hopT = 0;
                    target.hopping = true;
                }
            }
        } else {
            startPunishSequence(target);
        }
    }

    function update(dt){
        const frozen = deathSequence && deathSequence.phase; // punished — no moving, no fighting back

        // horizontal input
        let dir = 0;
        if (!frozen){
            if (keys['arrowleft']) dir -= 1;
            if (keys['arrowright']) dir += 1;
        }
        if (dir !== 0) player.facing = dir;
        player.vx = dir * MOVE_SPEED;

        // jump
        const wantsJump = !frozen && (keys[' '] || keys['arrowup']);
        if (wantsJump && (player.onGround || player.coyote > 0)) {
            player.vy = JUMP_VEL;
            player.onGround = false;
            player.coyote = 0;
        }

        // physics
        player.vy += GRAVITY * dt;
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        // rooftop collision (landing only, moving downward)
        player.onGround = false;
        const feetX = player.x + player.w / 2;
        const b = buildingAt(feetX);
        if (b && player.vy >= 0){
            const feetY = player.y + player.h;
            if (feetY >= b.y && feetY - player.vy * dt <= b.y + 4){
                player.y = b.y - player.h;
                player.vy = 0;
                player.onGround = true;
                player.coyote = COYOTE_TIME;
                lastRespawnBuildingIdx = buildings.indexOf(b);
            }
        }
        if (!player.onGround) player.coyote = Math.max(0, player.coyote - dt);

        // fell into a gap -> soft respawn on the last rooftop stood on
        if (player.y > GROUND_Y + 300) respawnPlayer();

        if (player.combatTimer > 0){
            player.combatTimer -= dt;
            if (player.combatTimer <= 0) player.combatPose = 'idle';
        }
        if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - dt);
        if (!sUnlocked && player.x >= buildings[5].x - 40) sUnlocked = true;
        if (!qUnlocked && player.x >= buildings[8].x - 40) qUnlocked = true;
        if (!cUnlocked && player.x >= buildings[9].x - 40) cUnlocked = true;
        if (!wUnlocked && player.x >= buildings[11].x - 40) wUnlocked = true;
        updateEnemies(dt);

        if (deathSequence && deathSequence.phase){
            const seq = deathSequence;
            seq.timer -= dt;
            if (seq.phase === 'block'){
                if (seq.timer <= 0){
                    seq.phase = 'strike';
                    seq.timer = 0.32;
                    seq.enemy.punishPose = 'strike';
                    player.combatPose = 'hit';
                }
            } else if (seq.phase === 'strike'){
                // enemy visibly lunges forward through the strike
                seq.enemy.punishLunge = 1 - Math.max(0, seq.timer) / 0.32;
                if (seq.timer <= 0){
                    spawnEffect(player.x + player.w / 2, player.y + player.h * 0.4, '#ff3030', 0.35);
                    seq.enemy.punishPose = null;
                    seq.enemy.punishLunge = 0;
                    deathSequence = null;
                    respawnPlayer();
                }
            }
        }
        for (let i = effects.length - 1; i >= 0; i--){
            if (gameTime - effects[i].start > effects[i].duration) effects.splice(i, 1);
        }

        // clamp to world
        player.x = Math.max(-100, Math.min(WORLD_LENGTH + 100, player.x));

        // run animation phase
        if (player.onGround && dir !== 0) player.runPhase += dt * 10;
        else if (player.onGround) player.runPhase = 0;

        // progress bar
        const progress = Math.max(0, Math.min(1, player.x / WORLD_LENGTH));
        document.getElementById('progress-bar-fill').style.width = (progress * 100).toFixed(1) + '%';
    }

    // ---------- camera ----------
    const camera = { x: 0, y: 0 };
    function updateCamera(){
        const targetX = player.x - W / 2;
        const targetY = (player.y - H * 0.58);
        camera.x += (targetX - camera.x) * 0.12;

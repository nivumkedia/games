<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
<style>
  :root {
    --bg: #f4f7fb; --panel: #ffffff; --border: #dde3ec; --text: #1f2933;
    --muted: #6b7785; --accent: #3b82f6; --accent-d: #2563eb; --green: #16a34a;
    --red: #dc2626; --tab: #eef2f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 12px 0 0; display: flex; align-items: center; gap: 8px; }
  header h1 .logo { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg,#3776ab 50%,#ffd43b 50%); }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; }
  .dot.ready { background: var(--green); }
  .dot.busy { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .spacer { flex: 1; }

  button, select { font: inherit; font-size: 14px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  button:hover { background: var(--tab); }
  button.primary { background: var(--green); color: #fff; border-color: var(--green); font-weight: 600; padding: 7px 18px; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  main { flex: 1; display: flex; min-height: 0; }
  .left { flex: 1.3; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
  .right { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 8px 0; background: var(--tab); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab { padding: 7px 12px; border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--muted); }
  .tab.active { background: var(--panel); border-color: var(--border); color: var(--text); margin-bottom: -1px; }
  .tab .x { opacity: .4; font-size: 14px; }
  .tab .x:hover { opacity: 1; color: var(--red); }
  .tab.add { color: var(--accent); font-weight: 700; }

  .editor-wrap { flex: 1; min-height: 0; background: var(--panel); }
  .CodeMirror { height: 100%; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 14px; line-height: 1.55; }
  .CodeMirror-gutters { background: #fafbfd; border-right: 1px solid var(--border); }
  .CodeMirror-activeline-background { background: #f2f7ff; }

  .panel-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--tab); border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--muted); }
  .panel-head button { padding: 4px 10px; font-size: 12px; }
  #console { flex: 1; overflow-y: auto; padding: 12px 14px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; background: var(--panel); }
  #console .err { color: var(--red); }
  #console .info { color: var(--muted); font-style: italic; }
  #console .echo { color: var(--accent-d); }
  #console .in { color: var(--green); font-weight: 600; }
  #console img { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; margin: 6px 0; display: block; }

  .repl { display: flex; align-items: center; border-top: 1px solid var(--border); background: #fafbfd; }
  .repl span { padding: 0 6px 0 12px; color: var(--accent); font-family: monospace; font-weight: 700; }
  .repl input { flex: 1; border: none; background: transparent; padding: 10px 8px; font-family: "SF Mono", Menlo, monospace; font-size: 13.5px; outline: none; }

  .pip { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--tab); }
  .pip input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-family: monospace; font-size: 13px; }

  .hint { font-size: 12px; color: var(--muted); }
  kbd { background: var(--tab); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 11px; }

  @media (max-width: 800px) { main { flex-direction: column; } .left { border-right: none; border-bottom: 1px solid var(--border); flex: 1.2; } }

  .learn-btn { background: #fff7e0; border-color: #f5c94a; font-weight: 600; }
  .learn-btn:hover { background: #ffefbf; }
  .learn { width: 410px; flex-shrink: 0; display: flex; flex-direction: column; background: #fffdf7; border-right: 1px solid var(--border); min-height: 0; }
  .learn[hidden] { display: none; }
  .learn-head { padding: 10px 14px; border-bottom: 1px solid var(--border); background: #fff7e0; }
  .learn-top { display: flex; align-items: center; gap: 8px; }
  .learn-top button { padding: 2px 8px; font-size: 13px; }
  .dots span.gate { border-radius: 6px; border-color: #f59e0b; color: #b45309; font-weight: 700; }
  .dots span.locked { opacity: .45; cursor: not-allowed; background: #f3f4f6; }
  .learn-body .project { background: #fff1f2; border-color: #fda4af; }
  .feedback pre { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin: 4px 0; font-weight: 400; font-size: 12.5px; white-space: pre; overflow-x: auto; }
  .feedback .diffline { background: #fecaca; display: inline-block; min-width: 100%; }
  .feedback .testcase { display: flex; gap: 8px; margin: 6px 0; }
  .feedback .testcase > div { flex: 1; min-width: 0; }
  .feedback p { margin: 6px 0; font-weight: 400; }
  .levels { display: flex; gap: 4px; margin-top: 8px; }
  .levels button { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #fff; }
  .levels button.on { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .dots { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .dots span { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 1.5px solid #e5d7a8; font-size: 11px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .dots span.done { background: #dcfce7; border-color: var(--green); color: var(--green); }
  .dots span.cur { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
  .learn-body { flex: 1; overflow-y: auto; padding: 14px 18px 20px; font-size: 15px; line-height: 1.6; }
  .learn-body h2 { font-size: 20px; margin: 4px 0 10px; }
  .learn-body h3 { font-size: 15px; margin: 18px 0 6px; }
  .learn-body p { margin: 8px 0; }
  .learn-body code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; font-family: "SF Mono", Menlo, monospace; font-size: 13px; }
  .learn-body pre { background: #f4f7fb; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: "SF Mono", Menlo, monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; margin: 8px 0; }
  .learn-body .tip { background: #eff6ff; border-left: 4px solid var(--accent); padding: 8px 12px; border-radius: 6px; margin: 10px 0; font-size: 14px; }
  .learn-body .challenge { background: #fff7e0; border: 1px solid #f5c94a; border-radius: 10px; padding: 10px 14px; margin-top: 16px; }
  .learn-body .challenge h3 { margin-top: 2px; }
  .learn-body .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
  .learn-body .row button { font-size: 13px; padding: 6px 10px; }
  .learn-body .go { background: var(--accent); color: #fff; border-color: var(--accent); }
  .learn-body .go:hover { background: var(--accent-d); }
  .hintbox { background: #f5f3ff; border-left: 4px solid #8b5cf6; padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: 14px; }
  .feedback { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .feedback.good { background: #dcfce7; color: #166534; }
  .feedback.bad { background: #fef3c7; color: #92400e; }
  .learn-nav { display: flex; padding: 10px 14px; border-top: 1px solid var(--border); background: #fff7e0; }
  .learn-nav .next { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  #console .friendly { display: block; background: #fef3c7; color: #78350f; border-left: 4px solid #f59e0b; padding: 8px 12px; border-radius: 6px; margin: 6px 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; white-space: normal; }
  @media (max-width: 800px) { .learn { width: 100%; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); } }

  button.stop { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; font-weight: 600; }
  button.stop:hover { background: #fecaca; }
  #stageWrap { flex: 1.6; min-height: 0; display: flex; align-items: center; justify-content: center; background: #e9eef5; border-bottom: 1px solid var(--border); position: relative; padding: 8px; }
  #stageWrap[hidden] { display: none; }
  #stageCanvas { background: #fff; border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.12); outline: none; }
  #stageCanvas:focus { box-shadow: 0 0 0 3px var(--accent), 0 2px 10px rgba(0,0,0,.12); }
  #stageHint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(31,41,51,.85); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 13px; pointer-events: none; }
  #stageHint[hidden] { display: none; }
  .inline-in { font: inherit; color: var(--green); font-weight: 600; border: none; border-bottom: 2px solid var(--accent); background: #eef6ff; outline: none; padding: 1px 6px; min-width: 180px; border-radius: 4px 4px 0 0; }

  /* ---------- presenting mode ---------- */
  #presentBar, #presentSplash { display: none; }
  body.presenting header, body.presenting .left, body.presenting .learn, body.presenting .repl,
  body.presenting .pip, body.presenting .panel-head { display: none !important; }
  body.presenting .right { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; padding: 0 32px 28px;
    background: radial-gradient(1200px 600px at 10% 0%, #e0f2fe 0%, transparent 60%), radial-gradient(900px 600px at 100% 100%, #fef3c7 0%, transparent 60%), linear-gradient(160deg, #f8fbff, #fdf7ff); }
  body.presenting #presentBar { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 1280px; padding: 18px 0 14px; }
  body.presenting #presentBar button { font-size: 15px; padding: 9px 18px; border-radius: 999px; }
  body.presenting #presentBar #pExit { background: rgba(255,255,255,.7); }
  .ptitle { font-size: 24px; font-weight: 800; letter-spacing: -.3px; color: #1e293b; }
  body.presenting #stageWrap { flex: 1 1 auto; width: 100%; background: transparent; border: none; padding: 4px; }
  body.presenting #stageCanvas { border-radius: 16px; box-shadow: 0 24px 60px rgba(30,60,120,.22); }
  body.presenting #stageCanvas:focus { box-shadow: 0 24px 60px rgba(30,60,120,.22); }
  body.presenting #console { width: 100%; max-width: 920px; flex: 1 1 auto; background: #fff; border-radius: 20px; box-shadow: 0 16px 50px rgba(30,60,120,.14);
    padding: 30px 38px; font-size: 21px; line-height: 1.65; margin-top: 6px; }
  body.presenting.has-stage #console { flex: 0 0 auto; max-height: 22vh; font-size: 16px; padding: 12px 22px; margin-top: 16px; border-radius: 14px; }
  body.presenting.has-stage #console:empty { display: none; }
  body.presenting #console .info { display: none; }
  body.presenting #console img { margin: 10px auto; }
  body.presenting .inline-in { min-width: 280px; }
  body.presenting #presentSplash.show { display: flex; position: absolute; inset: 0; z-index: 5; align-items: center; justify-content: center; background: inherit; }
  #presentSplash .card { background: #fff; border-radius: 28px; padding: 48px 72px 40px; text-align: center; box-shadow: 0 30px 80px rgba(30,60,120,.18); max-width: 90vw; }
  #presentSplash .emoji { font-size: 56px; }
  #presentSplash .big-title { font-size: 44px; font-weight: 800; letter-spacing: -.5px; margin: 6px 0 26px; color: #1e293b; }
  #presentSplash button { font-size: 24px; font-weight: 700; padding: 16px 54px; border-radius: 999px; background: var(--green); color: #fff; border: none; box-shadow: 0 10px 24px rgba(22,163,74,.35); transition: transform .12s; }
  #presentSplash button:hover { transform: scale(1.05); background: var(--green); }
  #presentSplash p { color: var(--muted); margin: 18px 0 0; font-size: 15px; }
</style>
</head>
<body>
<header>
  <h1><span class="logo"></span>Python Editor</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Loading Python…</span></div>
  <div class="spacer"></div>
  <button id="learnBtn" class="learn-btn">🎓 Learn Python</button>
  <select id="examples">
    <option value="">📚 Examples…</option>
  </select>
  <button id="openBtn" title="Open a .py file">📂 Open</button>
  <button id="saveBtn" title="Download this file">💾 Download</button>
  <button id="presentBtn" title="Show just the output, big and clean">🎬 Present</button>
  <button id="stopBtn" class="stop" hidden>■ Stop</button>
  <button id="runBtn" class="primary" disabled>▶ Run</button>
  <input type="file" id="fileInput" accept=".py,.txt" hidden>
</header>

<main>
  <aside class="learn" id="learn" hidden>
    <div class="learn-head">
      <div class="learn-top">
        <strong>🎓 Learn Python</strong>
        <span id="stepLabel" class="hint"></span>
        <div class="spacer"></div>
        <button id="learnClose" title="Hide lessons">✕</button>
      </div>
      <div class="levels" id="levels"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="learn-body" id="learnBody"></div>
    <div class="learn-nav">
      <button id="prevStep">← Back</button>
      <div class="spacer"></div>
      <button id="nextStep" class="next">Next →</button>
    </div>
  </aside>
  <section class="left">
    <div class="tabs" id="tabs"></div>
    <div class="editor-wrap" id="editorWrap"></div>
  </section>
  <section class="right">
    <div id="presentBar">
      <span class="ptitle" id="presentTitle"></span>
      <div class="spacer"></div>
      <button id="pStop" class="stop" hidden>■ Stop</button>
      <button id="pRun" class="primary">▶ Run</button>
      <button id="pExit" title="Exit presenting (Esc)">✕ Exit</button>
    </div>
    <div id="presentSplash">
      <div class="card">
        <div class="emoji">🎮</div>
        <div class="big-title" id="splashTitle"></div>
        <button id="splashRun">▶ Run</button>
        <p>Press the button (or Enter) to start</p>
      </div>
    </div>
    <div class="panel-head">
      Output
      <div class="spacer"></div>
      <span class="hint"><kbd>⌘/Ctrl</kbd>+<kbd>Enter</kbd> to run</span>
      <button id="clearBtn">Clear</button>
    </div>
    <div id="stageWrap" hidden>
      <canvas id="stageCanvas" tabindex="0" width="600" height="500"></canvas>
      <div id="stageHint" hidden>🎮 Click the stage to control it with your keyboard</div>
    </div>
    <div id="console"></div>
    <div class="repl"><span>&gt;&gt;&gt;</span><input id="replInput" placeholder="Type Python here and press Enter (uses variables from your last run)" disabled></div>
    <div class="pip">
      <input id="pipInput" placeholder="package name, e.g. numpy, pandas, requests, matplotlib">
      <button id="pipBtn" disabled>pip install</button>
    </div>
  </section>
</main>

<script type="text/plain" id="kidturtle">
"""A browser version of Python's turtle module (draws on the Stage canvas)."""
import math, sys, json
import js

try:
    from pyodide.ffi import create_proxy
except ImportError:  # pragma: no cover
    create_proxy = lambda f: f

_TS = js.TS


def _headless():
    return getattr(sys, "_turtle_headless", False)


def _q(*a):
    if not _headless():
        _TS.q(*a)


def _proxy(fun):
    return create_proxy(fun) if fun is not None else None


_colormode = [1.0]


def _col(args):
    c = args[0] if len(args) == 1 else args
    if isinstance(c, str):
        return c
    r, g, b = c
    if _colormode[0] == 1.0:
        r, g, b = r * 255, g * 255, b * 255
    return f"rgb({int(r)},{int(g)},{int(b)})"


def _yield_frame():
    y = getattr(sys, "_kid_yield", None)
    if y:
        y(True)


class Vec2D(tuple):
    def __new__(cls, x, y):
        return tuple.__new__(cls, (x, y))

    def __add__(self, o):
        return Vec2D(self[0] + o[0], self[1] + o[1])

    def __sub__(self, o):
        return Vec2D(self[0] - o[0], self[1] - o[1])

    def __mul__(self, o):
        if isinstance(o, (int, float)):
            return Vec2D(self[0] * o, self[1] * o)
        return self[0] * o[0] + self[1] * o[1]

    __rmul__ = __mul__

    def __abs__(self):
        return math.hypot(self[0], self[1])

    def __neg__(self):
        return Vec2D(-self[0], -self[1])

    def __repr__(self):
        return "(%.2f,%.2f)" % self


class Terminator(Exception):
    pass


class TurtleGraphicsError(Exception):
    pass


class _Screen:
    def __init__(self):
        self._w, self._h = 600, 500
        self._tracer = 1
        self._bg = "white"

    def setup(self, width=600, height=500, startx=None, starty=None):
        if isinstance(width, float) and width <= 1:
            width = int(900 * width)
        if isinstance(height, float) and height <= 1:
            height = int(700 * height)
        self._w, self._h = int(width), int(height)
        _q("setup", 0, self._w, self._h)

    def screensize(self, canvwidth=None, canvheight=None, bg=None):
        if canvwidth is None and canvheight is None and bg is None:
            return (self._w, self._h)
        if canvwidth and canvheight:
            self.setup(canvwidth, canvheight)
        if bg:
            self.bgcolor(bg)

    def bgcolor(self, *c):
        if not c:
            return self._bg
        self._bg = _col(c)
        _q("bg", 0, self._bg)

    def bgpic(self, *a):
        pass

    def title(self, t):
        _q("title", 0, str(t))

    def tracer(self, n=None, delay=None):
        if n is None:
            return self._tracer
        self._tracer = n

    def update(self):
        _q("update", 0)
        _yield_frame()

    def delay(self, d=None):
        return 0

    def listen(self, *a):
        if not _headless():
            _TS.listen()

    def _bindkey(self, kind, fun, key):
        if _headless():
            return
        _TS.bindKey(kind, "" if key is None else str(key), _proxy(fun))

    def onkeypress(self, fun, key=None):
        self._bindkey("down", fun, key)

    onkey = onkeypress

    def onkeyrelease(self, fun, key=None):
        self._bindkey("up", fun, key)

    def ontimer(self, fun, t=0):
        if _headless() or fun is None:
            return
        _TS.timer(_proxy(fun), int(t or 0))

    def onscreenclick(self, fun, btn=1, add=None):
        if not _headless():
            _TS.bindClick(_proxy(fun))

    onclick = onscreenclick

    def window_width(self):
        return self._w

    def window_height(self):
        return self._h

    def mainloop(self):
        pass

    done = exitonclick = bye = mainloop

    def turtles(self):
        return list(_all)

    def clear(self):
        for t in _all:
            t.clear()

    clearscreen = resetscreen = reset = clear

    def colormode(self, m=None):
        if m is None:
            return _colormode[0]
        _colormode[0] = 255 if m == 255 else 1.0

    def register_shape(self, name, shape=None):
        pass

    addshape = register_shape

    def getshapes(self):
        return ["arrow", "blank", "circle", "classic", "square", "triangle", "turtle"]

    def textinput(self, title, prompt):
        return input(prompt + " ")

    def numinput(self, title, prompt, default=None, minval=None, maxval=None):
        return float(input(prompt + " "))

    def getcanvas(self):
        return None


_screen = _Screen()
_all = []
_ids = [0]

_SPEEDS = {"fastest": 0, "fast": 10, "normal": 6, "slow": 3, "slowest": 1}


class Turtle:
    def __init__(self, shape="classic", undobuffersize=None, visible=True):
        _ids[0] += 1
        self._id = _ids[0]
        _all.append(self)
        self._x = 0.0
        self._y = 0.0
        self._h = 0.0
        self._pd = True
        self._pc = "black"
        self._fc = "black"
        self._ps = 1
        self._speed = 3
        self._vis = visible
        self._shape = shape
        self._stretch = (1, 1)
        self._filling = False
        self._fillpts = []
        self._seg_count = 0
        self._seg_len = 0.0
        self._stamps = 0
        _q("new", self._id, shape, 1 if visible else 0)

    # ---- internal ----

        t.x = c.sx + (x - c.sx) * f; t.y = c.sy + (y - c.sy) * f;
        if (f >= 1) { this.active = null; if (pd) this.add({ tid: c.tid, t: "line", x1: c.sx, y1: c.sy, x2: x, y2: y, col, w }); }
        else this.active = pd ? { x1: c.sx, y1: c.sy, x2: t.x, y2: t.y, col, w } : null;
        break;
      }
      case "turn": {
        if (c.sh === undefined) c.sh = t.h;
        t.h = f >= 1 ? a[0] : c.sh + a[1] * f; break;
      }
      case "state": {
        const [k, v] = a;
        if (k === "pen") t.pen = v; else if (k === "fill") t.fill = v; else if (k === "visible") t.vis = !!v;
        else if (k === "shape") t.shape = v; else if (k === "stretch") { const [sw, sl] = v.split(",").map(Number); t.sw = sw; t.sl = sl; }
        break;
      }
      case "fillstart": t.fillItem = { tid: c.tid, t: "fill", pts: null, col: null }; this.items.push(t.fillItem); break;
      case "fillend": if (t.fillItem) { t.fillItem.col = a[0]; t.fillItem.pts = JSON.parse(a[1]); t.fillItem = null; this.rebuild(); } break;
      case "dot": this.add({ tid: c.tid, t: "dot", x: a[0], y: a[1], r: a[2] / 2, col: a[3] }); break;
      case "write": this.add({ tid: c.tid, t: "text", x: a[0], y: a[1], text: a[2], align: a[3], font: a[4], col: a[5] }); break;
      case "stamp": this.add({ tid: c.tid, t: "stamp", st: { ...t } }); break;
      case "clear": this.items = this.items.filter(i => i.tid !== c.tid); this.rebuild(); break;
      case "clearstamps": this.items = this.items.filter(i => !(i.tid === c.tid && i.t === "stamp")); this.rebuild(); break;
      case "bg": this.bg = a[0]; break;
      case "setup": this.w = a[0]; this.h = a[1]; this.fit(); this.rebuild(); break;
      case "title": this.title = a[0]; updatePresentTitle(); break;
    }
  },
  add(item) { this.items.push(item); this.drawItem(this.cctx, item); },
  rebuild() {
    const g = this.cctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, this.cache.width, this.cache.height);
    for (const i of this.items) this.drawItem(g, i);
  },
  X(x) { return (x + this.w / 2) * this.scale; },
  Y(y) { return (this.h / 2 - y) * this.scale; },
  drawItem(g, i) {
    const s = this.scale;
    g.setTransform(1, 0, 0, 1, 0, 0);
    if (i.t === "line") {
      g.strokeStyle = i.col; g.lineWidth = Math.max(1, i.w) * s; g.lineCap = "round"; g.lineJoin = "round";
      g.beginPath(); g.moveTo(this.X(i.x1), this.Y(i.y1)); g.lineTo(this.X(i.x2), this.Y(i.y2)); g.stroke();
    } else if (i.t === "fill" && i.pts && i.pts.length > 2) {
      g.fillStyle = i.col; g.beginPath();
      i.pts.forEach(([x, y], k) => k ? g.lineTo(this.X(x), this.Y(y)) : g.moveTo(this.X(x), this.Y(y)));
      g.closePath(); g.fill("nonzero");
    } else if (i.t === "dot") {
      g.fillStyle = i.col; g.beginPath(); g.arc(this.X(i.x), this.Y(i.y), Math.max(0.5, i.r) * s, 0, Math.PI * 2); g.fill();
    } else if (i.t === "text") {
      g.fillStyle = i.col; g.textBaseline = "alphabetic";
      g.textAlign = i.align === "center" ? "center" : i.align === "right" ? "right" : "left";
      let fs = 12;
      g.font = i.font.replace(/([\d.]+)px/, (m, n) => { fs = +n; return (n * s) + "px"; });
      const lines = String(i.text).split("\n");
      lines.forEach((ln, k) => g.fillText(ln, this.X(i.x), this.Y(i.y + (lines.length - 1 - k) * fs * 1.25)));
    } else if (i.t === "stamp") this.drawSprite(g, i.st);
  },
  drawSprite(g, t) {
    if (t.shape === "blank") return;
    const s = this.scale;
    g.setTransform(s, 0, 0, s, this.X(t.x), this.Y(t.y));
    g.rotate(-t.h * Math.PI / 180);
    g.scale(t.sl, t.sw);
    g.fillStyle = t.fill; g.strokeStyle = t.pen; g.lineWidth = 1 / Math.max(t.sl, t.sw);
    g.beginPath();
    if (t.shape === "circle") g.arc(0, 0, 10, 0, Math.PI * 2);
    else (SHAPES[t.shape] || SHAPES.classic).forEach(([x, y], k) => k ? g.lineTo(x, -y) : g.moveTo(x, -y));
    g.closePath(); g.fill(); g.stroke();
    g.setTransform(1, 0, 0, 1, 0, 0);
  },
  render() {
    const g = this.ctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = this.bg; g.fillRect(0, 0, this.canvas.width, this.canvas.height);
    g.drawImage(this.cache, 0, 0);
    if (this.active) this.drawItem(g, { t: "line", ...this.active });
    for (const t of this.turtles.values()) if (t.vis) this.drawSprite(g, t);
  },
  // ---- events ----
  listen() { if (!presenting) this.canvas.focus(); },
  bindKey(kind, key, fn) {
    const m = this.keys[kind];
    m.get(key)?.destroy?.();
    if (fn) m.set(key, fn); else m.delete(key);
    showStageHint(); updateStopBtn();
  },
  timer(fn, ms) {
    const id = setTimeout(() => {
      this.timers.delete(id);
      this.call(fn);
      fn.destroy?.();
      updateStopBtn();
    }, ms);
    this.timers.set(id, fn);
    updateStopBtn();
  },
  bindClick(fn) { this.click?.destroy?.(); this.click = fn; updateStopBtn(); },
  bindTurtleClick(tid, fn) { this.tclicks.get(tid)?.destroy?.(); if (fn) this.tclicks.set(tid, fn); else this.tclicks.delete(tid); updateStopBtn(); },
  call(fn, ...args) {
    try { fn(...args); }
    catch (e) {
      const tb = cleanTraceback(String(e.message || e)).trimEnd();
      writeLine(tb, "err"); friendlyError(tb);
      this.stopEvents();
    }
  },
  onMouse(e) {
    this.canvas.focus();
    const r = this.canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * this.w - this.w / 2;
    const y = this.h / 2 - (e.clientY - r.top) / r.height * this.h;
    for (const [tid, fn] of this.tclicks) {
      const t = this.turtles.get(tid);
      if (t && Math.hypot(t.x - x, t.y - y) < 12 * Math.max(t.sw, t.sl)) return this.call(fn, x, y);
    }
    if (this.click) this.call(this.click, x, y);
  },
  onKey(e, kind) {
    const m = this.keys[kind];
    if (!m.size) return false;
    const k = KEYMAP[e.key] || e.key;
    const fn = m.get(k) || m.get(k.length === 1 ? (k === k.toLowerCase() ? k.toUpperCase() : k.toLowerCase()) : "\0") || m.get("");
    if (!fn) return false;
    if (kind === "down" || true) this.call(fn);
    return true;
  },
  nextFrame() { return new Promise(r => requestAnimationFrame(() => r())); },
  sleep(ms) { return new Promise(r => setTimeout(r, ms)); },
};

function cleanTraceback(msg) {
  const lines = msg.split("\n");
  const i = lines.findIndex(l => /File "(<exec>|\/home\/pyodide\/)/.test(l));
  if (i > 0) return ["Traceback (most recent call last):", ...lines.slice(i)].join("\n")
    .replace(/File "<exec>"/g, `File "${state.active}"`).replace(/\/home\/pyodide\//g, "");
  return msg;
}

async function prepare(code) {
  // write every tab into the filesystem so they can import each other
  for (const [name, src] of Object.entries(state.files)) py.FS.writeFile("/home/pyodide/" + name, src);
  const mods = Object.keys(state.files).map(n => n.slice(0, -3));
  py.globals.set("_tab_mods", py.toPy(mods));
  py.runPython(`
import sys, importlib
if "/home/pyodide" not in sys.path: sys.path.insert(0, "/home/pyodide")
for _m in _tab_mods: sys.modules.pop(_m, None)
importlib.invalidate_caches()
`);
  const allSrc = Object.values(state.files).join("\n");
  await py.loadPackagesFromImports(allSrc, { messageCallback: m => /Loading|Loaded/.test(m) && writeLine(m, "info"), errorCallback: () => {} });
  if (/^\s*(import|from)\s+(matplotlib|pylab)/m.test(allSrc)) py.runPython("_setup_mpl()");
}

function friendlyError(msg) {
  const lines = msg.trim().split("\n");
  const last = lines[lines.length - 1] || "";
  let lineNo = null;
  for (const l of lines) { const m = l.match(/line (\d+)/); if (m && !/_pyodide|\/lib\//.test(l)) lineNo = m[1]; }
  let tip = null;
  if (/unterminated string|EOL while scanning|unterminated triple/.test(last)) tip = "You started some text with a quote <b>\"</b> but never closed it. Every opening quote needs a matching closing quote.";
  else if (/expected ':'/.test(last)) tip = "Lines that start with <b>if</b>, <b>else</b>, <b>elif</b>, <b>for</b>, <b>while</b> or <b>def</b> need a colon <b>:</b> at the end.";
  else if (/IndentationError|TabError/.test(last)) tip = "Spacing problem! Lines <i>inside</i> an if / for / while / def need to be pushed in by 4 spaces (press Tab). Lines that aren't inside one shouldn't be pushed in.";
  else if (/was never closed|unmatched|does not match opening/.test(last)) tip = "Your brackets don't match up. Every <b>(</b> needs a <b>)</b>, every <b>[</b> needs a <b>]</b>.";
  else if (/NameError: name '(.+?)' is not defined/.test(last)) {
    const n = last.match(/name '(.+?)'/)[1];
    tip = `Python doesn't know what <b>${n}</b> is. Check: Is it spelled the same everywhere (capitals matter)? If it's meant to be text, put it in quotes: <code>"${n}"</code>. If it's a variable, did you create it <i>before</i> this line?`;
  }
  else if (/can only concatenate str|unsupported operand type.*'str'.*'int'|unsupported operand type.*'int'.*'str'/.test(last)) tip = "You're mixing text and numbers. Answers from <b>input()</b> are text — wrap them in <b>int()</b> to make them numbers, or use an f-string like <code>f\"I am {age}\"</code> to put numbers in text.";
  else if (/not supported between instances of/.test(last)) tip = "You're comparing text with a number. If the text came from <b>input()</b>, wrap it in <b>int()</b> first.";
  else if (/invalid literal for int/.test(last)) tip = "<b>int()</b> only works on whole numbers like <code>42</code>. Did you type a word or a decimal instead?";
  else if (/ZeroDivisionError/.test(last)) tip = "You can't divide by zero — not even Python can!";
  else if (/'=' .*Maybe you meant '=='|cannot assign to/.test(last)) tip = "Use <b>==</b> (two equals) to <i>check</i> if things are equal. One <b>=</b> is only for putting something into a variable.";
  else if (/SyntaxError/.test(last)) tip = "Python couldn't understand how this line is written. Look for a missing quote, bracket, colon or a typo.";
  else if (/ProgramTooLong/.test(last)) tip = "Your program ran for a long time without stopping, so I stopped it. Is there a <b>while</b> loop that never ends? For games, use <code>screen.ontimer(loop, 16)</code> instead of <code>while True</code>.";
  else if (/ProgramStopped: input cancelled/.test(last)) tip = "You pressed Cancel on the question box, so the program stopped. Run it again and type an answer.";
  if (!tip) return;
  const el = document.createElement("span");
  el.className = "friendly";
  el.innerHTML = "💡 <b>What went wrong?</b> " + tip + (lineNo ? ` <br>👉 Look at <b>line ${lineNo}</b>.` : "");
  cons.appendChild(el);
  cons.scrollTop = cons.scrollHeight;
}

async function runCode() {
  if (!py || busy) return;
  busy = true; running = true; window.pyStop = false;
  pendingInput?.(null);
  TS.reset();
  updateStopBtn();
  if (presenting) { cons.innerHTML = ""; hideSplash(); }
  capture = { out: "", err: false };
  const code = editor.getValue();
  document.getElementById("runBtn").disabled = true;
  document.getElementById("pRun").disabled = true;
  setStatus("Running…", "busy");
  if (cons.childNodes.length) writeLine("");
  writeLine(`▶ Running ${state.active}`, "info");
  await new Promise(r => setTimeout(r, 20)); // let the UI paint
  const t0 = performance.now();
  try {
    await prepare(code);
    const ns = py.globals.get("dict")();
    ns.set("__name__", "__main__");
    await py.runPythonAsync("_begin_run()");
    try { await py.runPythonAsync(code, { globals: ns, filename: "<exec>" }); }
    finally { py.runPython("_end_run()"); }
    if (lastNs) lastNs.destroy();
    lastNs = ns;
    if (py.runPython("'matplotlib.pyplot' in sys.modules")) py.runPython("import matplotlib.pyplot as _p; _p.show()");
    writeLine(`✓ Finished in ${((performance.now() - t0) / 1000).toFixed(2)}s`, "info");
  } catch (e) {
    const tb = cleanTraceback(String(e.message || e)).trimEnd();
    if (/ProgramStopped: Stopped/.test(tb)) writeLine("■ Stopped", "info");
    else { writeLine(tb, "err"); friendlyError(tb); }
    capture.err = true;
  } finally {
    const result = capture; capture = null;
    busy = false; running = false;
    if (window.onRunFinished) window.onRunFinished(code, result);
    document.getElementById("runBtn").disabled = false;
    document.getElementById("pRun").disabled = false;
    document.getElementById("pRun").textContent = "↻ Run again";
    updateStopBtn();
    if (TS.hasEvents()) {
      setStatus("Game running", "busy");
      if (!presenting && (TS.keys.down.size || TS.keys.up.size)) TS.canvas.focus();
    } else setStatus("Ready", "ready");
  }
}
document.getElementById("runBtn").onclick = runCode;

    const m = String(err.message || err).split("\n");
    const i = m.findIndex(l => l.includes('"<repl>"'));
    writeLine((i > 0 ? m.slice(i) : m.slice(-2)).join("\n").trimEnd(), "err");
  } finally { busy = false; }
});

// pip
async function pipInstall() {
  const inp = document.getElementById("pipInput");
  const pkgs = inp.value.trim().split(/[\s,]+/).filter(Boolean);
  if (!pkgs.length || !py || busy) return;
  const btn = document.getElementById("pipBtn"); btn.disabled = true;
  setStatus("Installing…", "busy");
  for (const p of pkgs) {
    writeLine(`$ pip install ${p}`, "echo");
    try {
      py.globals.set("_pkg", p);
      await py.runPythonAsync("import micropip; await micropip.install(_pkg)");
      writeLine(`Installed ${p}`, "info");
    } catch (e) {
      writeLine(String(e.message || e).split("\n").filter(Boolean).slice(-1)[0], "err");
    }
  }
  inp.value = ""; btn.disabled = false; setStatus("Ready", "ready");
}
document.getElementById("pipBtn").onclick = pipInstall;
document.getElementById("pipInput").addEventListener("keydown", e => e.key === "Enter" && pipInstall());

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); runCode(); }
});

{
  level: 2,
  title: "🌀 Recursion: a function that calls itself",
  body: `<p>This one's a brain-bender 🤯. A <b>recursive</b> function solves a problem by calling <b>itself</b> on a smaller version of the problem.</p>
<p>Every recursive function needs a <b>base case</b> — a point where it stops. Otherwise it would go on forever!</p>
<p><b>Factorial</b> means multiplying all numbers down to 1: <code>5! = 5 × 4 × 3 × 2 × 1 = 120</code>. Notice that 5! is just 5 × 4!. That's recursion!</p>`,
  example: `def countdown(n):\n    if n == 0:          # base case: stop!\n        print("Liftoff! 🚀")\n        return\n    print(n)\n    countdown(n - 1)    # call itself with a smaller number\n\ncountdown(5)`,
  challenge: `Write a <b>recursive</b> function <code>factorial(n)</code>. If n is 1, return 1. Otherwise, return n times <code>factorial(n - 1)</code>. Then print <code>factorial(5)</code> — it should show <b>120</b>.`,
  starter: `def factorial(n):\n    # base case: if n is 1, return 1\n\n    # otherwise: return n times factorial of (n - 1)\n\n\nprint(factorial(5))\n`,
  hint: `<code>def factorial(n):</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;if n == 1:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;return 1</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;return n * factorial(n - 1)</code>`,
  check: (c, o) => { const s = strip(c); return !/def\s+factorial/.test(s) ? "Define def factorial(n):" : (s.match(/factorial\s*\(/g) || []).length < 3 ? "Make factorial call itself inside the function: return n * factorial(n - 1)" : !/(^|\D)120(\D|$)/.test(o) ? "print(factorial(5)) should show 120. Check your base case and the multiply." : true; },
},
{

  title: "⚡ List comprehensions: lists in one line",
  body: `<p>Making a new list from an old one is so common that Python has a shortcut called a <b>list comprehension</b>:</p>
<pre>squares = [n * n for n in range(1, 6)]
# [1, 4, 9, 16, 25]</pre>
<p>Read it like a sentence: "<i>n times n, for every n in 1 to 5</i>".</p>
<p>Add an <code>if</code> at the end to <b>filter</b>, keeping only some items:</p>
<pre>evens = [n for n in range(10) if n % 2 == 0]
# [0, 2, 4, 6, 8]</pre>
<p>And <code>", ".join(list_of_words)</code> glues a list of strings together into one string.</p>`,

{

<pre>sorted(players, key=lambda p: p["score"])</pre>

  challenge: `Make a <b>playlist</b> 🎵: a list of at least 4 songs, where each song is a dictionary with a <code>"title"</code> and <code>"minutes"</code>. Print the songs sorted from <b>shortest to longest</b>, then print the total length of the playlist.`,

},

<p><code>t.circle(50)</code> draws a circle with a radius of 50. <code>t.circle(50, 180)</code> draws only half of it (an arc).</p>
<p>To <b>fill</b> a shape with color, put <code>t.begin_fill()</code> before drawing it and <code>t.end_fill()</code> after. <code>t.color("black", "yellow")</code> means a black outline with a yellow fill.</p>

{

  body: `<p>Here's where it gets powerful: put your drawing code in a <b>function</b>, then call it lots of times with different numbers. Add <code>random</code> and you get generative art — a different picture every time you press Run!</p>
<div class="tip">⚡ Drawing lots of stuff? Add <code>screen.tracer(0)</code> at the start and <code>screen.update()</code> at the end. The turtle draws everything invisibly and then shows it all at once — super fast.</div>`,
  example: `import turtle\nimport random\n\nscreen = turtle.Screen()\nscreen.bgcolor("white")\nscreen.tracer(0)\nt = turtle.Turtle()\nt.hideturtle()\n\ndef bubble(x, y, size, color):\n    t.penup()\n    t.goto(x, y - size)\n    t.pendown()\n    t.color(color)\n    t.begin_fill()\n    t.circle(size)\n    t.end_fill()\n\nfor i in range(40):\n    x = random.randint(-280, 280)\n    y = random.randint(-230, 230)\n    bubble(x, y, random.randint(5, 40), random.choice(["pink", "lightblue", "plum", "gold"]))\n\nscreen.update()`,

  starter: `import turtle\nimport random\n\nscreen = turtle.Screen()\nscreen.bgcolor("midnightblue")\nscreen.tracer(0)\nt = turtle.Turtle()\nt.hideturtle()\nt.color("gold")\n\ndef draw_star(x, y, size):\n    # lift the pen, go to x, y, put it down, draw a star\n    pass\n\n# draw 30 random stars\n\nscreen.update()\n`,

{
  level: 3,
  title: "🏁 Many turtles & writing text",
  body: `<p>You can make as many turtles as you want! Each one is its own object with its own position and color — and you can keep them in a <b>list</b>.</p>
<p><code>t.write("Hello!", align="center", font=("Arial", 24, "bold"))</code> writes text where the turtle is. <code>t.hideturtle()</code> hides the turtle itself so only the drawing shows.</p>
<p>Shapes you can use: <code>"turtle"</code>, <code>"circle"</code>, <code>"square"</code>, <code>"triangle"</code>, <code>"arrow"</code>, <code>"classic"</code>.</p>`,
  example: `import turtle\n\nnames = ["red", "blue", "green"]\nracers = []\nfor i in range(3):\n    r = turtle.Turtle()\n    r.shape("turtle")\n    r.color(names[i])\n    r.penup()\n    r.goto(-250, 60 - i * 60)\n    racers.append(r)\n\nfor r in racers:\n    r.forward(100)\n\nsign = turtle.Turtle()\nsign.hideturtle()\nsign.penup()\nsign.goto(0, 150)\nsign.write("Ready... set...", align="center", font=("Arial", 24, "bold"))`,
  challenge: `Make a <b>turtle race</b> 🐢🏁! Put 4 turtles of different colors on a starting line. In a <code>while</code> loop, move each one forward a <b>random</b> amount. When one gets past <code>x = 200</code>, stop and <code>write</code> who won.`,
  starter: `import turtle\nimport random\n\ncolors = ["red", "blue", "green", "orange"]\nracers = []\n# 1. make 4 turtles, put them on the start line, add to racers\n\n# 2. race! keep moving them until one passes x = 200\n\n# 3. write the winner\n`,
  hint: `<code>winner = None</code><br><code>while winner is None:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;for i in range(4):</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;racers[i].forward(random.randint(1, 10))</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;if racers[i].xcor() &gt; 200 and winner is None:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;winner = colors[i]</code><br>Then use a hidden turtle to <code>write(f"{winner} wins!", ...)</code>`,
  check: c => { const s = strip(c); return !/\.append\s*\(/.test(s) && !/\[\s*turtle\.Turtle/.test(s) ? "Keep your racers in a list." : !/\bwhile\b/.test(s) ? "Use a while loop for the race." : !/random/.test(s) ? "Move them a random amount with random.randint(...)." : !/\.write\s*\(/.test(s) ? "Write who won with .write(...)." : !/xcor/.test(s) ? "Check xcor() to see if someone crossed the finish line." : true; },

{
  level: 3,
  title: "⌨️ Controlling it with your keyboard",
  body: `<p>Now the fun part — making it <b>interactive</b>! Instead of drawing by itself, your program waits for you to press keys.</p>
<p>You write a function for what should happen, then connect it to a key: <code>screen.onkey(go_up, "Up")</code>. Then call <code>screen.listen()</code> so the screen starts listening.</p>
<p>Key names: <code>"Up"</code> <code>"Down"</code> <code>"Left"</code> <code>"Right"</code> <code>"space"</code> <code>"Return"</code> (Enter), and letters like <code>"a"</code>.</p>
<p><code>screen.onscreenclick(func)</code> calls <code>func(x, y)</code> wherever you click!</p>
<div class="tip">🎮 After you press Run, <b>click on the stage</b> so it gets your key presses.</div>`,
  example: `import turtle\n\nscreen = turtle.Screen()\nt = turtle.Turtle()\nt.shape("turtle")\nt.speed(0)\n\ndef go_forward():\n    t.forward(20)\n\ndef turn_left():\n    t.left(30)\n\ndef turn_right():\n    t.right(30)\n\ndef jump(x, y):\n    t.penup()\n    t.goto(x, y)\n    t.pendown()\n\nscreen.onkey(go_forward, "Up")\nscreen.onkey(turn_left, "Left")\nscreen.onkey(turn_right, "Right")\nscreen.onscreenclick(jump)\nscreen.listen()`,
  challenge: `Make an <b>Etch-a-Sketch</b> ✏️. The arrow keys move the turtle up, down, left and right (drawing as it goes). <code>"space"</code> changes the pen to a random color, and <code>"c"</code> clears the drawing with <code>t.clear()</code>.`,
  starter: `import turtle\nimport random\n\nscreen = turtle.Screen()\nt = turtle.Turtle()\nt.speed(0)\nt.pensize(3)\n\n# write functions for up, down, left, right, new color, and clear\n\n# connect them to keys with screen.onkey(...)\n\nscreen.listen()\n`,
  hint: `<code>def up():</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;t.setheading(90)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;t.forward(10)</code><br>(do the same with 270 for down, 180 for left, 0 for right)<br><br><code>def new_color():</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;t.color(random.choice(["red", "blue", "green", "purple"]))</code><br><br><code>screen.onkey(up, "Up")</code> … <code>screen.onkey(new_color, "space")</code> … <code>screen.onkey(t.clear, "c")</code>`,
  check: c => { const s = strip(c); return (s.match(/onkey(press)?\s*\(/g) || []).length < 6 ? "Connect 6 keys: the 4 arrows, space and c." : !/["']space["']/.test(s) ? "Connect a function to \"space\" for a new color." : !/\.clear/.test(s) ? "Use t.clear() to wipe the drawing when c is pressed." : !/listen\s*\(/.test(s) ? "Call screen.listen() at the end." : true; },
},
{

  body: `<p><b>Checkpoint!</b> 🚧 Build a little shape factory: a set of drawing <b>functions</b> that other code can use. This uses everything from the last 7 lessons: turtles, loops, turning math, penup/goto, fill, random, functions and keyboard controls.</p>
<p>This time I'll test your <b>functions</b> exactly: I'll create my own turtle, call your functions with it, and check how many lines were drawn, how long they were in total, and where the turtle ended up.</p>`,
  spec: `<p>Write these 4 functions. Each one takes a turtle <code>t</code> as its first parameter and must leave the turtle back <b>where it started</b>, pointing the <b>same way</b> (except <code>row</code>, see below):</p>
<p>• <code>polygon(t, sides, size)</code> — draw a regular shape with that many sides, each <code>size</code> long, turning <b>left</b> <code>360 / sides</code> after each one.<br>
• <code>star(t, size)</code> — draw a 5-pointed star: 5 lines of length <code>size</code>, turning <b>right 144</b> after each.<br>
• <code>flower(t, petals, size)</code> — call <code>polygon(t, 6, size)</code> <code>petals</code> times, turning left <code>360 / petals</code> after each one.<br>
• <code>row(t, count, size, gap)</code> — draw <code>count</code> squares (use <code>polygon</code>!). After each square, lift the pen, move forward <code>size + gap</code>, and put the pen down. (So the turtle ends up <code>count × (size + gap)</code> further along.)</p>
<p>Then, in your main program, use your functions to draw a <b>scene</b> with at least one filled shape, and make the <code>"space"</code> key draw a flower at a <b>random</b> spot.</p>`,

    { inputs: [], after: `t = turtle.Turtle()\nrow(t, 3, 20, 10)\n_report(t)`, expect: "lines: 12, length: 240, at: (90, 0), facing: 0" },
    { inputs: [], after: `t = turtle.Turtle()\nflower(t, 6, 20)\n_report(t)\nt = turtle.Turtle()\nt.left(90)\nflower(t, 5, 30)\n_report(t)`, expect: "lines: 36, length: 720, at: (0, 0), facing: 0\nlines: 30, length: 900, at: (0, 0), facing: 90" },

{
  level: 3,
  title: "⏱️ The game loop",
  body: `<p>Every video game has a <b>game loop</b>: a function that runs over and over, many times a second. Each time, it moves things a tiny bit and redraws the screen. That's what makes things look like they're moving!</p>
<p>In turtle, you make a game loop with <code>screen.ontimer(loop, 16)</code>, which means "<i>run loop() again in 16 milliseconds</i>". The loop calls it at the end, so it keeps going forever (about 60 times a second).</p>
<p>Speed is stored in variables like <code>dx</code> (how far to move sideways each frame) and <code>dy</code> (up and down). To bounce, just flip it: <code>dx = -dx</code>.</p>
<div class="tip">🌍 <code>global dx</code> inside the function means "I want to change the dx variable from outside this function", not make a new one.</div>
<p>Use <code>screen.tracer(0)</code> at the start, then <code>screen.update()</code> at the end of every loop, so each frame shows up all at once with no flicker.</p>`,
  example: `import turtle\n\nscreen = turtle.Screen()\nscreen.bgcolor("lightblue")\nscreen.tracer(0)\n\nball = turtle.Turtle()\nball.shape("circle")\nball.color("red")\nball.penup()\n\ndx = 4\n\ndef loop():\n    global dx\n    ball.setx(ball.xcor() + dx)\n    if ball.xcor() > 290 or ball.xcor() < -290:\n        dx = -dx\n    screen.update()\n    screen.ontimer(loop, 16)\n\nloop()`,
  challenge: `Make a ball that bounces off <b>all four walls</b> (like an old screensaver). It needs both <code>dx</code> and <code>dy</code>. The stage is 600 wide and 500 tall, so the walls are at x = ±290 and y = ±240. Bonus: change the ball's color every time it bounces!`,
  starter: `import turtle\n\nscreen = turtle.Screen()\nscreen.tracer(0)\n\nball = turtle.Turtle()\nball.shape("circle")\nball.penup()\n\ndx = 3\ndy = 2\n\ndef loop():\n    global dx, dy\n    # move the ball by dx and dy\n\n    # bounce off the left/right walls and the top/bottom walls\n\n    screen.update()\n    screen.ontimer(loop, 16)\n\nloop()\n`,
  hint: `<code>ball.goto(ball.xcor() + dx, ball.ycor() + dy)</code><br><code>if ball.xcor() &gt; 290 or ball.xcor() &lt; -290:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;dx = -dx</code><br><code>if ball.ycor() &gt; 240 or ball.ycor() &lt; -240:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;dy = -dy</code>`,
  check: c => { const s = strip(c); return !/ontimer\s*\(/.test(s) ? "Keep the loop going with screen.ontimer(loop, 16)." : !/dy\s*=\s*-\s*dy/.test(s) || !/dx\s*=\s*-\s*dx/.test(s) ? "Bounce in both directions: dx = -dx and dy = -dy" : !/ycor/.test(s) ? "Check ycor() to bounce off the top and bottom." : true; },
},
{
  level: 3,
  title: "🕹️ Smooth player controls",
  body: `<p>With <code>onkey</code>, holding a key down moves your player in jerky steps. Real games feel smooth because they check <b>which keys are held down</b> on every frame.</p>
<p>The trick: a dictionary that remembers each key. <code>onkeypress</code> sets it to <code>True</code> when you press, <code>onkeyrelease</code> sets it back to <code>False</code> when you let go. Then the game loop moves the player if the key is held.</p>
<p>A <code>lambda</code> is handy here — a tiny function written in one line: <code>lambda: keys.update(Left=True)</code>.</p>
<p>Keep the player on screen by checking the edges before moving.</p>`,
  example: `import turtle\n\nscreen = turtle.Screen()\nscreen.tracer(0)\n\nplayer = turtle.Turtle()\nplayer.shape("square")\nplayer.color("green")\nplayer.shapesize(1, 3)   # 1 tall, 3 wide\nplayer.penup()\nplayer.goto(0, -200)\n\nkeys = {"Left": False, "Right": False}\n\ndef hold(key, down):\n    keys[key] = down\n\nfor k in keys:\n    screen.onkeypress(lambda k=k: hold(k, True), k)\n    screen.onkeyrelease(lambda k=k: hold(k, False), k)\nscreen.listen()\n\ndef loop():\n    if keys["Left"] and player.xcor() > -270:\n        player.setx(player.xcor() - 6)\n    if keys["Right"] and player.xcor() < 270:\n        player.setx(player.xcor() + 6)\n    screen.update()\n    screen.ontimer(loop, 16)\n\nloop()`,
  challenge: `Make a player that moves smoothly in <b>all 4 directions</b> with the arrow keys and <b>can't leave the screen</b>. Bonus: make it go faster while you hold <code>"space"</code>.`,
  starter: `import turtle\n\nscreen = turtle.Screen()\nscreen.tracer(0)\n\nplayer = turtle.Turtle()\nplayer.shape("turtle")\nplayer.penup()\n\nkeys = {"Up": False, "Down": False, "Left": False, "Right": False}\n\n# connect onkeypress / onkeyrelease for every key\n\nscreen.listen()\n\ndef loop():\n    # move the player for each key that is held (stay inside the walls!)\n\n    screen.update()\n    screen.ontimer(loop, 16)\n\nloop()\n`,
  hint: `Copy the <code>hold</code> function and the <code>for k in keys:</code> loop from the example.<br>In the loop:<br><code>if keys["Up"] and player.ycor() &lt; 230:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;player.sety(player.ycor() + 5)</code><br>…and the same idea for Down, Left and Right.`,
  check: c => { const s = strip(c); return !/onkeyrelease\s*\(/.test(s) ? "Use onkeyrelease so the player stops when you let go." : !/ontimer/.test(s) ? "Move the player inside a game loop with ontimer." : !/["']Up["']/.test(s) || !/["']Down["']/.test(s) ? "Handle all 4 arrow keys." : !/ycor/.test(s) || !/xcor/.test(s) ? "Check xcor() and ycor() to keep the player on screen." : true; },
},
{
  level: 3,
  title: "💥 Collisions & keeping score",
  body: `<p>How does a game know when two things touch? Measure the distance between them! <code>player.distance(coin)</code> gives the distance in steps. If it's small (like less than 20), they're touching. 💥</p>
<p>When the player grabs the coin, add to the score and move the coin somewhere random.</p>
<p>To show the score, use a hidden turtle that writes text. Each time the score changes, <code>clear()</code> it and <code>write()</code> again.</p>`,
  example: `import turtle\nimport random\n\nscreen = turtle.Screen()\nscreen.tracer(0)\n\ncoin = turtle.Turtle("circle")\ncoin.color("gold")\ncoin.penup()\n\nhud = turtle.Turtle()\nhud.hideturtle()\nhud.penup()\nhud.goto(0, 210)\n\nscore = 0\n\ndef show_score():\n    hud.clear()\n    hud.write(f"Score: {score}", align="center", font=("Arial", 20, "bold"))\n\ndef clicked(x, y):\n    global score\n    if coin.distance(x, y) < 20:\n        score += 1\n        coin.goto(random.randint(-270, 270), random.randint(-220, 190))\n        show_score()\n        screen.update()\n\nshow_score()\nscreen.update()\nscreen.onscreenclick(clicked)\nprint("Click the coin!")`,
  challenge: `Make a <b>coin collector</b> 🪙: a player you move with the arrow keys (use your smooth controls!), a coin at a random spot, and a score at the top. When the player touches the coin, the score goes up by 1 and the coin jumps to a new random spot.`,

LESSONS.forEach(l => l.level = l.level || 1);
const LEVEL_NAMES = { 1: "Level 1 · Beginner", 2: "Level 2 · Challenger", 3: "Level 3 · Game Maker" };

const LEARN_KEY = "pyeditor.learn.v2";
let learn = (() => { try { return JSON.parse(localStorage.getItem(LEARN_KEY)) || null; } catch { return null; } })();
const firstVisit = !learn;
learn = learn || { step: 0, done: {}, open: true };
const saveLearn = () => localStorage.setItem(LEARN_KEY, JSON.stringify(learn));
const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
let gateNo = 0;
LESSONS.forEach(l => { if (l.gate) l.gateNo = ++gateNo; });
const projFile = L => `project${L.gateNo}.py`;

// everything after the first unpassed project is locked
function lockAfter() {
  const i = LESSONS.findIndex((l, k) => l.gate && !learn.done[k]);
  return i === -1 ? Infinity : i;
}
function goTo(i) {
  if (i > lockAfter()) return;
  learn.step = i; saveLearn(); renderLearn();
}

function loadLesson(code, file = "lesson.py") {
  state.files[file] = code;
  switchTo(file);
}

function renderLearn() {
  const lock = lockAfter();
  if (learn.step > lock) learn.step = lock;
  const L = LESSONS[learn.step];
  const lvl = L.level;
  const inLevel = LESSONS.map((l, i) => i).filter(i => LESSONS[i].level === lvl);
  document.getElementById("stepLabel").textContent = `Step ${inLevel.indexOf(learn.step) + 1} of ${inLevel.length}`;
  const lv = document.getElementById("levels");
  lv.innerHTML = "";
  for (const n of [1, 2, 3]) {
    const b = document.createElement("button");
    const first = LESSONS.findIndex(l => l.level === n);
    const locked = first > lock;
    b.textContent = (locked ? "🔒 " : "") + LEVEL_NAMES[n];
    b.className = n === lvl ? "on" : "";
    b.disabled = locked;
    b.title = locked ? "Pass the project before it to unlock" : "";
    b.onclick = () => goTo(Math.min(learn.lastStep?.[n] ?? first, lock));
    lv.appendChild(b);
  }
  learn.lastStep = learn.lastStep || {}; learn.lastStep[lvl] = learn.step;
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  inLevel.forEach((i, k) => {
    const les = LESSONS[i];
    const d = document.createElement("span");
    d.textContent = i > lock ? "🔒" : learn.done[i] ? "✓" : les.gate ? "★" : k + 1;
    d.className = (learn.done[i] ? "done " : "") + (les.gate ? "gate " : "") + (i > lock ? "locked " : "") + (i === learn.step ? "cur" : "");
    d.title = i > lock ? "Locked — pass the project first" : les.title;
    d.onclick = () => goTo(i);
    dots.appendChild(d);
  });
  let h = `<h2>${L.title}</h2>${L.body}`;
  if (L.example) h += `<h3>👀 Example</h3><pre>${esc(L.example)}</pre>
    <div class="row"><button data-act="copy">📋 Put this in the editor</button><button class="go" data-act="run">▶ Put it in &amp; run it</button></div>`;
  if (L.challenge) h += `<div class="challenge"><h3>🏆 Your challenge${learn.done[learn.step] ? " ✅" : ""}</h3><p>${L.challenge}</p>
    <div class="row"><button class="go" data-act="start">✏️ Start the challenge</button><button data-act="hint">💡 Show a hint</button></div>
    <div class="hintbox" id="hintBox" hidden>${L.hint}</div>
    <div id="feedback"></div></div>`;
  if (L.gate) {
    const t = L.tests[0];
    h += `<div class="challenge project"><h3>📋 What your program must do${learn.done[learn.step] ? " ✅ PASSED" : ""}</h3>${L.spec}
    <h3>🧪 Example test</h3>
    ${t.after ? `<p class="hint">I'll run your code, then this:</p><pre>${esc(t.after)}</pre>` : `<p class="hint">If someone types:</p><pre>${t.inputs.map(esc).map(x => x === "" ? "(blank)" : x).join("\n")}</pre>`}
    <p class="hint">your program must print exactly:</p><pre>${esc(t.expect)}</pre>
    <p class="hint">…plus <b>${L.tests.length - 1} secret tests</b> with different answers. Capitals, spaces and punctuation all count!</p>
    <div class="row"><button data-act="pstart">✏️ ${state.files[projFile(L)] !== undefined ? "Open my project" : "Start the project"}</button><button class="go" data-act="ptest">🧪 Check my project</button></div>
    <p class="hint">🚫 No hints on projects — this is where you show what you've learned! You can always go back to earlier lessons to look things up.</p>
    <div id="feedback"></div></div>`;
  }
  const body = document.getElementById("learnBody");
  body.innerHTML = h; body.scrollTop = 0;
  body.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === "copy") loadLesson(L.example + "\n");
    if (a === "run") { loadLesson(L.example + "\n"); runCode(); }
    if (a === "start") { loadLesson(L.starter); editor.setCursor(editor.lineCount(), 0); editor.focus(); setFeedback("bad", "✏️ Write your code in the editor, then press ▶ Run. I'll check it for you!"); }
    if (a === "pstart") {
      const f = projFile(L);
      if (state.files[f] === undefined) loadLesson(L.starter, f); else switchTo(f);
      b.textContent = "✏️ Open my project";
      setFeedback("bad", `✏️ Build it in ${f}. Press ▶ Run to try it yourself, then 🧪 Check my project when you think it's perfect.`);
    }
    if (a === "ptest") checkProject(L);
    if (a === "hint") { const hb = document.getElementById("hintBox"); hb.hidden = !hb.hidden; b.textContent = hb.hidden ? "💡 Show a hint" : "🙈 Hide the hint"; }
  });
  document.getElementById("prevStep").disabled = learn.step === 0;
  const nx = document.getElementById("nextStep");
  const next = LESSONS[learn.step + 1];
  nx.disabled = !next || learn.step + 1 > lock;
  nx.textContent = !next ? "Next →"
    : learn.step + 1 > lock ? "🔒 Pass the project to continue"
    : next.level !== lvl ? `Start Level ${next.level} →`
    : learn.done[learn.step] || !L.challenge ? "Next →" : "Skip →";
}
function setFeedback(kind, text, html) {
  const f = document.getElementById("feedback");
  if (!f) return;
  f.className = "feedback " + kind;
  if (html) f.innerHTML = html; else f.textContent = text;
  f.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function setLearnOpen(open) {
  learn.open = open; saveLearn();
  document.getElementById("learn").hidden = !open;
  setTimeout(() => editor.refresh(), 0);
}

const norm = t => t.replace(/\r/g, "").split("\n").map(l => l.trimEnd()).join("\n").replace(/\n+$/, "").replace(/^\n+/, "");
async function checkProject(L) {
  if (!py) return setFeedback("bad", "⏳ Python is still loading, try again in a second.");
  if (busy) return;
  const f = projFile(L);
  if (state.files[f] === undefined) return setFeedback("bad", "Click ✏️ Start the project first.");
  if (state.active !== f) switchTo(f);
  const code = state.files[f];
  const s = strip(code);
  for (const [rule, msg] of L.requires) {
    const ok = typeof rule === "function" ? rule(s) : rule.test(s);
    if (!ok) return setFeedback("bad", "🤏 Not yet: " + msg);
  }
  busy = true; setStatus("Testing…", "busy");
  setFeedback("bad", "🧪 Running tests…");
  await new Promise(r => setTimeout(r, 30));
  let passed = 0, fail = null;
  try {
    await prepare(code);
    const run = py.globals.get("_run_test");
    for (let k = 0; k < L.tests.length; k++) {
      const t = L.tests[k];
      const res = run(t.after ? code + "\n\n" + (L.testPrelude || "") + t.after + "\n" : code, py.toPy(t.inputs));
      const [out, err] = res.toJs(); res.destroy();
      const got = norm(out), want = norm(t.expect);
      if (!err && got === want) { passed++; continue; }
      fail = { k, t, got, want, err };
      break;
    }
    run.destroy();
  } catch (e) { fail = { k: 0, t: L.tests[0], got: "", want: norm(L.tests[0].expect), err: String(e.message || e) }; }
  busy = false; setStatus("Ready", "ready");
  if (!fail) {
    const i = LESSONS.indexOf(L);
    learn.done[i] = true; saveLearn(); renderLearn();
    const nxt = LESSONS[i + 1];
    return setFeedback("good", "", `🏆 <b>ALL ${L.tests.length} TESTS PASSED!</b> Your program is perfect. ${nxt ? `The next part is unlocked — click "${nxt.level !== L.level ? "Start Level " + nxt.level : "Next"} →".` : ""}`);
  }
  const secret = fail.k > 0;
  const gl = fail.got.split("\n"), wl = fail.want.split("\n");
  let line = 0; while (line < Math.max(gl.length, wl.length) && gl[line] === wl[line]) line++;
  const show = (arr, other) => arr.map((x, j) => `<span class="${j === line ? "diffline" : ""}">${esc(x) || "&nbsp;"}</span>`).join("\n");
  let html = `❌ <b>${passed} of ${L.tests.length} tests passed.</b> ${secret ? "Test " + (fail.k + 1) + " (a secret test) failed" : "Test 1 failed"}.<br>`;
  html += fail.t.after ? `<div class="testcase"><div><b>Test code run after yours:</b><pre>${esc(fail.t.after)}</pre></div></div>` : `<div class="testcase"><div><b>Answers typed in:</b><pre>${fail.t.inputs.map(esc).join("\n")}</pre></div></div>`;
  if (fail.err) html += `<div><b>💥 Your program crashed:</b><pre>${esc(fail.err)}</pre></div>`;
  html += `<div class="testcase"><div><b>Expected:</b><pre>${show(wl)}</pre></div><div><b>Your program printed:</b><pre>${fail.got ? show(gl) : "(nothing)"}</pre></div></div>`;
  if (!fail.err && line < Math.max(gl.length, wl.length)) html += `<p>👉 The first difference is on <b>line ${line + 1}</b> of the output${wl[line] !== undefined ? `: it should be <code>${esc(wl[line])}</code>` : " — your program printed extra lines"}.</p>`;
  setFeedback("bad", "", html);
}

window.onRunFinished = (code, result) => {
  if (!learn.open) return;
  const L = LESSONS[learn.step];
  if (L.gate) {
    if (!result.err && state.active === projFile(L)) setFeedback("bad", "▶ That was a practice run. When you think it's perfect, press 🧪 Check my project.");
    return;
  }
  if (!L.check) return;
  if (L.example && code.trim() === L.example.trim()) {
    if (!result.err) setFeedback("good", "👍 That's the example running! Now scroll down and try the challenge yourself.");
    return;
  }
  if (result.err) return setFeedback("bad", "🐛 There's an error. Read the 💡 yellow tip in the Output panel, fix it, and run again. Errors are totally normal — every programmer gets them!");
  const r = L.check(code, result.out);
  if (r === true) {
    const cheers = ["🎉 Nailed it!", "🔥 Awesome work!", "⭐ Perfect!", "🚀 You're a natural!", "💯 Great job!"];
    learn.done[learn.step] = true; saveLearn(); renderLearn();
    setFeedback("good", `${cheers[learn.step % cheers.length]} Challenge complete. Click "Next →" when you're ready.`);
  } else setFeedback("bad", "🤏 " + r);
};

document.getElementById("learnBtn").onclick = () => setLearnOpen(document.getElementById("learn").hidden);
document.getElementById("learnClose").onclick = () => setLearnOpen(false);
document.getElementById("prevStep").onclick = () => { if (learn.step > 0) goTo(learn.step - 1); };
document.getElementById("nextStep").onclick = () => { if (learn.step < LESSONS.length - 1) goTo(learn.step + 1); };
renderLearn();
setLearnOpen(learn.open);
if (firstVisit) loadLesson(LESSONS[0].example + "\n");

// ---------- presenting mode ----------
function prettyName(f) {
  return f.replace(/\.py$/, "").replace(/[_\-]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}
function updatePresentTitle() {
  const t = TS.title || prettyName(state.active);
  document.getElementById("presentTitle").textContent = t;
  document.getElementById("splashTitle").textContent = t;
}
function hideSplash() { document.getElementById("presentSplash").classList.remove("show"); }
function enterPresent() {
  presenting = true;
  document.body.classList.add("presenting");
  TS.title = "";
  updatePresentTitle();
  document.getElementById("pRun").textContent = "▶ Run";
  document.getElementById("presentSplash").classList.add("show");
  TS.reset(); stopProgram(); window.pyStop = false;
  cons.innerHTML = "";
  document.documentElement.requestFullscreen?.().catch(() => {});
  showStageHint();
  setTimeout(() => document.getElementById("splashRun").focus(), 50);
}
function exitPresent() {
  presenting = false;
  document.body.classList.remove("presenting");
  hideSplash();
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  setTimeout(() => { TS.fit(); editor.refresh(); showStageHint(); }, 50);
}
document.getElementById("presentBtn").onclick = enterPresent;
document.getElementById("pExit").onclick = exitPresent;
document.getElementById("pRun").onclick = () => runCode();
document.getElementById("splashRun").onclick = () => runCode();
document.addEventListener("keydown", e => {
  if (!presenting) return;
  const inField = /INPUT|TEXTAREA/.test(document.activeElement?.tagName);
  if (e.key === "Escape" && !TS.keys.down.has("Escape") && !inField) { e.preventDefault(); exitPresent(); }
  else if (e.key === "Enter" && document.getElementById("presentSplash").classList.contains("show")) { e.preventDefault(); runCode(); }
});
document.addEventListener("fullscreenchange", () => setTimeout(() => TS.fit(), 50));

boot();
editor.focus();
</script>
</body>

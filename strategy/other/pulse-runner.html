<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>Pulse Runner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    overflow: hidden;
    background: #0b1020;
    color: #eaf6ff;
    font-family: "Segoe UI", Arial, sans-serif;
}

#game {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #07101d;
}

.hud {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    z-index: 5;
}

.hud-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.pill {
    min-width: 78px;
    padding: 7px 10px;
    border: 1px solid rgba(136, 220, 255, 0.28);
    border-radius: 7px;
    background: rgba(8, 18, 36, 0.72);
    color: #dff7ff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.24);
}

.instruction {
    position: fixed;
    top: 54px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(8, 18, 36, 0.72);
    border: 1px solid rgba(136, 220, 255, 0.28);
    color: #cdeaff;
    font-size: 12px;
    font-weight: 600;
    pointer-events: none;
    max-width: min(520px, 82vw);
    text-align: center;
}

.overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 35%, rgba(42, 220, 255, 0.16), rgba(7, 10, 22, 0.86) 58%);
    z-index: 10;
}

.overlay.hidden { display: none; }

.panel {
    width: min(760px, calc(100vw - 32px));
    padding: 22px;
    border: 1px solid rgba(124, 226, 255, 0.28);
    border-radius: 8px;
    background: rgba(8, 16, 32, 0.9);
    box-shadow: 0 18px 70px rgba(0, 0, 0, 0.42);
    text-align: center;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
}

.panel h1 {
    color: #8deaff;
    font-size: 34px;
    letter-spacing: 0;
    margin-bottom: 8px;
}

.panel p {
    color: #aac7d8;
    font-size: 14px;
    line-height: 1.45;
    margin-bottom: 16px;
}

.primary-btn {
    border: 1px solid rgba(141, 234, 255, 0.65);
    border-radius: 7px;
    background: #20c6ff;
    color: #06101d;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    padding: 10px 16px;
}

.primary-btn:hover { background: #6ee6ff; }

.mode-select {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-top: 14px;
}

.mode-card {
    border: 1px solid rgba(141, 234, 255, 0.28);
    border-radius: 8px;
    background: rgba(12, 28, 52, 0.82);
    color: #eaf6ff;
    cursor: pointer;
    padding: 10px;
    text-align: left;
    font: inherit;
    transition: border-color 0.2s, transform 0.2s, background 0.2s;
}

.mode-card:hover,
.mode-card.selected {
    border-color: #8deaff;
    background: rgba(32, 198, 255, 0.15);
    transform: translateY(-2px);
}

.mode-card.preview {
    cursor: default;
    opacity: 0.82;
}

.mode-card.preview:hover {
    border-color: rgba(141, 234, 255, 0.28);
    background: rgba(12, 28, 52, 0.82);
    transform: none;
}

.mode-art {
    position: relative;
    height: 150px;
    overflow: hidden;
    border-radius: 7px;
    background: linear-gradient(#162a50, #07101f);
    margin-bottom: 10px;
}

.art-label {
    position: absolute;
    left: 10px;
    top: 10px;
    z-index: 2;
    padding: 4px 7px;
    border: 1px solid rgba(141, 234, 255, 0.42);
    border-radius: 5px;
    background: rgba(6, 16, 29, 0.78);
    color: #eaf6ff;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.8px;
}

.mode-art::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 18px;
    height: 18px;
    background: #19365e;
    border-top: 4px solid #42d8ff;
}

.art-player {
    position: absolute;
    left: 78px;
    top: 54px;
    width: 24px;
    height: 34px;
    border-radius: 7px;
    background: #8deaff;
    box-shadow: 0 0 14px rgba(141, 234, 255, 0.7);
}

.art-player::before,
.art-enemy::before {
    content: "";
    position: absolute;
    top: 9px;
    left: 6px;
    width: 4px;
    height: 4px;
    background: #09213a;
    box-shadow: 9px 0 0 #09213a;
}

.art-enemy {
    position: absolute;
    right: 58px;
    bottom: 36px;
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: #b64cff;
    box-shadow: 0 0 14px rgba(182, 76, 255, 0.72);
}

.mode-name {
    display: block;
    color: #8deaff;
    font-weight: 800;
    margin-bottom: 3px;
}

.mode-desc {
    color: #aac7d8;
    font-size: 12px;
    line-height: 1.35;
}

.shop-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 6;
    padding: 8px 12px;
    border: 1px solid rgba(144, 224, 255, 0.38);
    border-radius: 7px;
    background: rgba(7, 16, 31, 0.86);
    color: #dff7ff;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 900;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2), inset 0 1px rgba(255, 255, 255, 0.08);
    display: none;

.shop-panel {
    position: fixed;
    top: 54px;
    right: 14px;
    z-index: 6;
    width: min(270px, calc(100vw - 28px));
    display: none;
    padding: 12px;
    border: 1px solid rgba(144, 224, 255, 0.32);
    border-radius: 8px;
    background: rgba(7, 16, 31, 0.94);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.42), inset 0 1px rgba(255, 255, 255, 0.08);
}

.shop-panel.open { display: block; }

.shop-title {
    color: #8deaff;
    font-size: 14px;
    font-weight: 900;
    margin-bottom: 8px;
}

.shop-line {
    color: #aac7d8;
    font-size: 12px;
    line-height: 1.35;
    margin-bottom: 10px;
}

.shop-buy {
    width: 100%;
    border: 1px solid rgba(141, 234, 255, 0.58);
    border-radius: 7px;
    background: linear-gradient(180deg, #53e0ff, #1bb8f2);
    color: #06101d;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 900;
    padding: 8px 10px;
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.35);
}

.shop-buy + .shop-buy { margin-top: 8px; }

.shop-buy:disabled {
    opacity: 0.48;
    cursor: default;
}

.touch-controls {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    display: none;
    justify-content: space-between;
    pointer-events: none;
    z-index: 6;
}

.touch-cluster {
    display: flex;
    gap: 10px;
}

.touch-btn {
    width: 54px;
    height: 54px;
    border: 1px solid rgba(141, 234, 255, 0.32);
    border-radius: 8px;
    background: rgba(8, 18, 36, 0.72);
    color: #dff7ff;
    font-size: 20px;
    font-weight: 800;
    pointer-events: auto;
    touch-action: none;
}

@media (max-width: 760px), (pointer: coarse) {
    .touch-controls { display: flex; }
    .pill { min-width: 64px; font-size: 11px; }
    .mode-select { grid-template-columns: 1fr; }
    .mode-art { height: 120px; }
}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>

<div class="hud">
    <div class="hud-group">
        <div class="pill" id="level">Level 1</div>
        <div class="pill" id="kills">Kills 0</div>
    </div>
</div>
<div class="instruction" id="instruction"></div>

<button class="shop-toggle" id="shop-toggle">Shop</button>
<div class="shop-panel" id="shop-panel">
    <div class="shop-title">Shop</div>
    <div class="shop-line" id="shop-info"></div>
    <button class="shop-buy" id="attack-upgrade-btn">Buy Attack Range</button>
    <button class="shop-buy" id="shield-upgrade-btn">Buy Sword Block Time</button>
    <button class="shop-buy" id="archery-upgrade-btn">Buy Archery Range</button>
</div>

<div class="overlay" id="overlay">
    <div class="panel">
        <h1>Pulse Runner</h1>
        <p>Pick Normal for the campaign run, or Ultimate for the 20-level gauntlet (coming soon).</p>
        <div class="mode-select" id="mode-select">
            <button class="mode-card selected" data-mode="normal">
                <div class="mode-art" aria-hidden="true">
                    <span class="art-label">NORMAL</span>
                    <span class="art-player"></span>
                    <span class="art-enemy"></span>
                </div>
                <span class="mode-name">Normal</span>
                <span class="mode-desc">A hand-built platformer campaign with spikes, pits, buttons, and enemies.</span>
            </button>
            <button class="mode-card preview" data-mode="ultimate" aria-label="Ultimate mode, coming soon">
                <div class="mode-art" aria-hidden="true">
                    <span class="art-label">COMING SOON</span>
                </div>
                <span class="mode-name">Ultimate</span>
                <span class="mode-desc">20 levels of dragons, gears, caves, and trapdoors. In progress.</span>
            </button>
        </div>
        <button class="primary-btn" id="start-btn">Start Normal</button>
    </div>
</div>

<div class="overlay hidden" id="win-screen">
    <div class="panel">
        <h1 id="win-title">Level Complete!</h1>
        <p id="win-text"></p>
        <button class="primary-btn" id="next-btn">Continue</button>
    </div>
</div>

<div class="touch-controls" aria-hidden="true">
    <div class="touch-cluster">
        <button class="touch-btn" data-key="left">L</button>
        <button class="touch-btn" data-key="right">R</button>
    </div>
    <div class="touch-cluster">
        <button class="touch-btn" data-key="attack">X</button>
        <button class="touch-btn" data-key="jump">J</button>
    </div>
</div>

    canvas.width = window.innerWidth;

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.fill();
}

function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

let levelIndex = 0;
let killBank = 0;
let attackUpgradeLevel = 0;
let shieldUpgradeLevel = 0;
let archeryRangeLevel = 0;
let running = false;

function loadLevel(index) {
    const level = levels[index];
    levelIndex = index;
    world.width = level.width;
    start = { ...level.start };
    goal = { ...level.goal };
    platforms = level.platforms.map(p => ({ ...p }));
    gates = level.gates.map(g => ({ ...g, open: false }));
    spikes = level.spikes.map(s => ({ ...s }));
    saws = (level.saws || []).map(s => ({ ...s, dir: 1, angle: 0 }));
    rockSpawners = (level.rocks || []).map(r => createRockSpawner(r.x));
    lavaPools = (level.lava || []).map(l => ({ ...l }));
    barriers = (level.barriers || []).map(b => createBarrier(b));
    turrets = (level.turrets || []).map(t => createTurret(t));
    turretShots = [];
    enemies = level.enemies.map(e => ({ ...e, x0: e.x, dir: 1, alive: true }));
    buttons = level.buttons.map(b => ({ ...b, pressed: false }));
    arrows = [];
    particles = [];
    levelEl.textContent = level.name;
    setInstruction(level.intro || level.name);
    updateHud();
    respawn();
}

function respawn() {
    player.x = start.x;
    player.y = start.y;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.facing = 1;
    player.attackTimer = 0;
    player.blockTimer = 0;
    player.hitFlash = 0;
    cameraX = 0;
}

let lastInstruction = "";
function setInstruction(text) {
    if (text === lastInstruction) return;
    lastInstruction = text;
    instructionEl.textContent = text;
}

function updateHud() {
    killsEl.textContent = `Kills ${killBank}`;
    updateShop();
}

// ---- Shop (ported from Battlebound, minus sword select/take-apart/sell) ----
function attackUpgradeCost() { return 10 + attackUpgradeLevel; }
function shieldUpgradeCost() { return 15 + shieldUpgradeLevel * 5; }
function archeryUpgradeCost() { return archeryRangeLevel === 0 ? 30 : 40; }
function shieldUnlocked() { return true; }
function archeryUnlocked() { return levelIndex >= 2; }

function attackReach() { return 46 + attackUpgradeLevel * 12; }
function shieldDurationFrames() { return Math.round((30 + shieldUpgradeLevel * 15)); }
function archeryDistance() { return [420, 620, 900][archeryRangeLevel] || 420; }

function buyAttackUpgrade() {
    if (attackUpgradeLevel >= 3) return;
    const cost = attackUpgradeCost();
    if (killBank < cost) return;
    killBank -= cost;
    attackUpgradeLevel += 1;
    updateHud();
}
function buyShieldUpgrade() {
    if (!shieldUnlocked() || shieldUpgradeLevel >= 3) return;
    const cost = shieldUpgradeCost();
    if (killBank < cost) return;
    killBank -= cost;
    shieldUpgradeLevel += 1;
    updateHud();
}
function buyArcheryUpgrade() {
    if (!archeryUnlocked() || archeryRangeLevel >= 2) return;
    const cost = archeryUpgradeCost();
    if (killBank < cost) return;
    killBank -= cost;
    archeryRangeLevel += 1;
    updateHud();
}

function updateShop() {
    if (attackUpgradeLevel >= 3) {
        attackUpgradeBtn.textContent = "Maxed Out";
        attackUpgradeBtn.disabled = true;
    } else {
        const cost = attackUpgradeCost();
        attackUpgradeBtn.textContent = `Buy Attack Range (${cost})`;
        attackUpgradeBtn.disabled = killBank < cost;
    }

    if (!shieldUnlocked()) {
        shieldUpgradeBtn.textContent = "Sword Block Locked";
        shieldUpgradeBtn.disabled = true;
    } else if (shieldUpgradeLevel >= 3) {
        shieldUpgradeBtn.textContent = "Sword Block Maxed";
        shieldUpgradeBtn.disabled = true;
    } else {
        const cost = shieldUpgradeCost();
        shieldUpgradeBtn.textContent = `Buy Sword Block Time (${cost})`;
        shieldUpgradeBtn.disabled = killBank < cost;
    }

    if (!archeryUnlocked()) {
        archeryUpgradeBtn.textContent = "Archery Locked";
        archeryUpgradeBtn.disabled = true;
    } else if (archeryRangeLevel >= 2) {
        archeryUpgradeBtn.textContent = "Archery Maxed Out";
        archeryUpgradeBtn.disabled = true;
    } else {
        const cost = archeryUpgradeCost();
        archeryUpgradeBtn.textContent = `Buy Archery Range (${cost})`;
        archeryUpgradeBtn.disabled = killBank < cost;
    }

    const attackLine = attackUpgradeLevel >= 3 ? "Attack range maxed" : `Attack range ${attackUpgradeLevel}/3`;
    const shieldLine = shieldUpgradeLevel >= 3 ? "Sword block maxed" : `Sword block ${shieldUpgradeLevel}/3`;
    const archeryLine = !archeryUnlocked() ? "Archery locked until Level 3" : (archeryRangeLevel >= 2 ? "Archery maxed" : `Archery range ${archeryRangeLevel}/2`);
    shopInfo.textContent = `Kills: ${killBank}. ${attackLine}. ${shieldLine}. ${archeryLine}.`;
}

attackUpgradeBtn.addEventListener("click", buyAttackUpgrade);
shieldUpgradeBtn.addEventListener("click", buyShieldUpgrade);
archeryUpgradeBtn.addEventListener("click", buyArcheryUpgrade);
shopToggle.addEventListener("click", () => {
    shopPanel.classList.toggle("open");
    updateShop();
});

// ---- Input ----
const keys = { left: false, right: false, jump: false, attack: false, block: false, shoot: false };
window.addEventListener("keydown", e => {
    if (e.repeat) return;
    setKey(e.key, true);
});
window.addEventListener("keyup", e => setKey(e.key, false));

function setKey(key, val) {
    const k = key.toLowerCase();
    if (k === "arrowleft" || k === "a") keys.left = val;
    else if (k === "arrowright" || k === "d") keys.right = val;
    else if (k === "arrowup" || k === "w" || k === " ") keys.jump = val;
    else if (k === "x") { keys.attack = val; if (val) attack(); }
    else if (k === "z") keys.block = val && shieldUnlocked();
    else if (k === "c") { keys.shoot = val; if (val) shootArrow(); }
}

document.querySelectorAll(".touch-btn").forEach(btn => {
    const key = btn.dataset.key;
    btn.addEventListener("touchstart", e => { e.preventDefault(); touchKey(key, true); });
    btn.addEventListener("touchend", e => { e.preventDefault(); touchKey(key, false); });
});
function touchKey(key, val) {
    if (key === "left") keys.left = val;
    if (key === "right") keys.right = val;
    if (key === "jump") keys.jump = val;
    if (key === "attack" && val) attack();
}

// ---- Combat ----
function attack() {
    if (player.attackTimer > 0) return;
    player.attackTimer = 14;
    const reach = attackReach();
    const box = {
        x: player.facing > 0 ? player.x + player.w : player.x - reach,
        y: player.y - 6,
        w: reach,
        h: player.h + 12
    };
    for (const enemy of enemies) {
        if (!enemy.alive) continue;
        const enemyRect = { x: enemy.x, y: enemy.y, w: player.w, h: player.h };
        if (rectsOverlap(box, enemyRect)) killEnemy(enemy);
    }
}

function killEnemy(enemy) {
    enemy.alive = false;
    killBank += 2;
    updateHud();
}

function shootArrow() {
    if (!archeryUnlocked()) return;
    arrows.push({
        x: player.x + player.w / 2,
        y: player.y + player.h / 2,
        vx: player.facing * 11,
        life: archeryDistance()
    });
}

function updateArrows() {
    for (let i = arrows.length - 1; i >= 0; i--) {
        const a = arrows[i];
        a.x += a.vx;
        a.life -= Math.abs(a.vx);
        let hit = false;
        for (const enemy of enemies) {
            if (!enemy.alive) continue;
            const enemyRect = { x: enemy.x, y: enemy.y, w: player.w, h: player.h };
            if (rectsOverlap({ x: a.x - 4, y: a.y - 4, w: 8, h: 8 }, enemyRect)) {
                killEnemy(enemy);
                hit = true;
                break;
            }
        }
        if (hit || a.life <= 0) arrows.splice(i, 1);
    }
}

// ---- Update loop ----
function takeHit() {
    if (player.blockTimer > 0) return;
    if (player.hitFlash > 0) return;
    player.hitFlash = 60;
    respawn();
}

function updatePlayer() {
    const speed = player.grounded ? GROUND_ACCEL : AIR_ACCEL;
    if (keys.left) { player.vx -= speed; player.facing = -1; }
    if (keys.right) { player.vx += speed; player.facing = 1; }
    if (!keys.left && !keys.right) player.vx *= player.grounded ? 0.82 : 0.96;
    player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));

    if (keys.jump && player.grounded) {
        player.vy = -JUMP_POWER;
        player.grounded = false;
    }

    player.vy += GRAVITY;
    player.vy = Math.min(player.vy, 18);

    player.x += player.vx;
    for (const solid of solids()) {
        if (!rectsOverlap(player, solid)) continue;
        if (player.vx > 0) player.x = solid.x - player.w;
        if (player.vx < 0) player.x = solid.x + solid.w;
        player.vx = 0;
    }

    player.y += player.vy;
    player.grounded = false;
    for (const solid of solids()) {
        if (!rectsOverlap(player, solid)) continue;
        if (player.vy > 0) {
            player.y = solid.y - player.h;
            player.vy = 0;
            player.grounded = true;
        } else if (player.vy < 0) {
            player.y = solid.y + solid.h;
            player.vy = 0;
        }
    }

    player.x = Math.max(0, Math.min(world.width - player.w, player.x));
    if (player.y > world.height + 180) takeHit();

    if (player.attackTimer > 0) player.attackTimer -= 1;
    if (player.hitFlash > 0) player.hitFlash -= 1;
    player.blockTimer = keys.block && shieldUnlocked() ? shieldDurationFrames() : Math.max(0, player.blockTimer - 1);

    for (const spike of spikes) {
        if (rectsOverlap(player, spike)) { takeHit(); break; }
    }
    for (const lava of lavaPools) {
        if (rectsOverlap(player, lava)) { takeHit(); break; }
    }
    for (const barrier of barriers) {
        if (barrier.on && rectsOverlap(player, barrier)) { takeHit(); break; }
    }
    for (const saw of saws) {
        const sawBox = { x: saw.x - saw.r, y: saw.y - saw.r, w: saw.r * 2, h: saw.r * 2 };
        if (rectsOverlap(player, sawBox)) { takeHit(); break; }
    }
    for (const enemy of enemies) {
        if (enemy.alive && rectsOverlap(player, { x: enemy.x, y: enemy.y, w: player.w, h: player.h })) takeHit();
    }

    for (const button of buttons) {
        const zone = { x: button.x - 4, y: button.y - 30, w: button.w + 8, h: 40 };
        const pressed = player.grounded && rectsOverlap(player, zone);
        if (pressed && !button.pressed) {
            button.pressed = true;
            gates.forEach(g => { if (g.id === button.target) g.open = true; });
        }
    }

    if (rectsOverlap(player, goal)) completeLevel();

    cameraX = Math.max(0, Math.min(world.width - window.innerWidth, player.x - window.innerWidth * 0.38));
}

function solids() {
    return platforms.concat(gates.filter(g => !g.open));
}

function updateEnemies() {
    for (const enemy of enemies) {
        if (!enemy.alive) continue;
        enemy.x += enemy.dir * enemy.speed;
        if (enemy.x < enemy.min) { enemy.x = enemy.min; enemy.dir = 1; }
        if (enemy.x + player.w > enemy.max) { enemy.x = enemy.max - player.w; enemy.dir = -1; }
    }
}

function updateSaws() {
    for (const saw of saws) {
        saw.x += saw.dir * saw.speed;
        if (saw.x < saw.min) { saw.x = saw.min; saw.dir = 1; }
        if (saw.x > saw.max) { saw.x = saw.max; saw.dir = -1; }
        saw.angle += saw.speed * 0.12;
    }
}

function updateRocks() {
    for (const rock of rockSpawners) {
        if (rock.state === "idle") {
            rock.timer -= 1;
            if (rock.timer <= 0) { rock.state = "warn"; rock.timer = 30; }
        } else if (rock.state === "warn") {
            rock.timer -= 1;
            if (rock.timer <= 0) { rock.state = "falling"; rock.ry = 40; rock.vy = 4; }
        } else if (rock.state === "falling") {
            rock.vy += 0.5;
            rock.ry += rock.vy;
            if (rectsOverlap(player, { x: rock.x - rock.r, y: rock.ry - rock.r, w: rock.r * 2, h: rock.r * 2 })) takeHit();
            if (rock.ry > world.height + 40) {
                rock.state = "idle";
                rock.timer = 40 + Math.floor(Math.random() * 30);
            }
        }
    }
}

function updateBarriers() {
    for (const barrier of barriers) {
        barrier.timer -= 1;
        if (barrier.timer <= 0) {
            barrier.on = !barrier.on;
            barrier.timer = barrier.period;
        }
    }
}

function updateTurrets() {
    for (const turret of turrets) {
        turret.timer -= 1;
        if (turret.timer <= 0) {
            turret.timer = turret.interval;
            turretShots.push({ x: turret.x, y: turret.y, vx: turret.dir * 8 });
        }
    }
    for (let i = turretShots.length - 1; i >= 0; i--) {
        const shot = turretShots[i];
        shot.x += shot.vx;
        if (rectsOverlap(player, { x: shot.x - 6, y: shot.y - 6, w: 12, h: 12 })) {
            takeHit();
            turretShots.splice(i, 1);
            continue;
        }
        if (shot.x < -50 || shot.x > world.width + 50) turretShots.splice(i, 1);
    }
}

function completeLevel() {
    if (!running) return;
    running = false;
    if (levelIndex >= levels.length - 1) {
        endRun();
    } else {
        winTitle.textContent = "Level Complete!";
        winText.textContent = `On to ${levels[levelIndex + 1].name}.`;
        winScreen.classList.remove("hidden");
    }
}

function endRun() {
    running = false;
    winTitle.textContent = "Campaign Complete!";
    winText.textContent = "More levels coming soon.";
    winScreen.classList.remove("hidden");
}

nextBtn.addEventListener("click", () => {
    winScreen.classList.add("hidden");
    if (levelIndex >= levels.length - 1) {
        overlay.classList.remove("hidden");
    } else {
        loadLevel(levelIndex + 1);
        running = true;
    }
});

// ---- Rendering (ported from Battlebound) ----
function drawBackground() {
    const w = window.innerWidth, h = window.innerHeight;
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#07101d");
    sky.addColorStop(0.48, "#102744");
    sky.addColorStop(1, "#06101c");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = "rgba(171, 237, 255, 0.72)";
    for (let i = 0; i < 34; i++) {
        const x = (i * 173 - cameraX * 0.08) % (w + 180) - 60;
        const y = 36 + (i * 47) % 210;
        const size = 1 + (i % 3) * 0.6;
        ctx.fillRect(x, y, size, size);
    }

    ctx.fillStyle = "rgba(126, 245, 255, 0.12)";
    ctx.beginPath();
    ctx.arc(w - 118, 92, 46, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(223, 251, 255, 0.78)";
    ctx.beginPath();
    ctx.arc(w - 118, 92, 24, 0, Math.PI * 2);
    ctx.fill();

    const backOffset = -(cameraX * 0.12) % 520;
    ctx.fillStyle = "rgba(35, 78, 116, 0.42)";
    ctx.beginPath();
    ctx.moveTo(backOffset - 120, h);
    for (let x = backOffset - 120; x < w + 620; x += 260) {
        ctx.lineTo(x + 120, h - 235);
        ctx.lineTo(x + 260, h);
    }
    ctx.closePath();
    ctx.fill();

    const frontOffset = -(cameraX * 0.24) % 430;
    ctx.fillStyle = "rgba(18, 52, 82, 0.62)";
    ctx.beginPath();
    ctx.moveTo(frontOffset - 100, h);
    for (let x = frontOffset - 100; x < w + 520; x += 215) {
        ctx.lineTo(x + 96, h - 152);
        ctx.lineTo(x + 215, h);
    }
    ctx.closePath();
    ctx.fill();

    const glow = ctx.createLinearGradient(0, h - 170, 0, h);
    glow.addColorStop(0, "rgba(73, 255, 168, 0)");
    glow.addColorStop(1, "rgba(73, 255, 168, 0.08)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, h - 170, w, 170);
}

function drawPlatforms() {
    platforms.forEach(platform => {
        ctx.shadowColor = "rgba(0, 0, 0, 0.28)";
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 8;
        const body = ctx.createLinearGradient(0, platform.y, 0, platform.y + platform.h);
        body.addColorStop(0, "#25527d");
        body.addColorStop(0.62, "#17395e");
        body.addColorStop(1, "#0f2744");
        ctx.fillStyle = body;
        roundRect(platform.x, platform.y, platform.w, platform.h, 8);
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.fillStyle = "#72e6ff";
        roundRect(platform.x + 8, platform.y + 4, Math.max(0, platform.w - 16), 5, 3);
        ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
        ctx.fillRect(platform.x + 12, platform.y + 12, Math.max(0, platform.w - 24), 2);
        ctx.fillStyle = "rgba(2, 9, 18, 0.28)";
        ctx.fillRect(platform.x + 8, platform.y + platform.h - 8, Math.max(0, platform.w - 16), 5);
    });
    ctx.shadowColor = "transparent";

    gates.filter(g => !g.open).forEach(gate => {
        ctx.fillStyle = "#ff5f7a";
        roundRect(gate.x, gate.y, gate.w, gate.h, 6);
        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        roundRect(gate.x + 4, gate.y + 4, gate.w - 8, gate.h - 8, 4);
    });
}

function drawSpikes() {
    spikes.forEach(spike => {
        ctx.fillStyle = "#ff315d";
        roundRect(spike.x, spike.y, spike.w, spike.h, 4);
        for (let x = spike.x + 10; x < spike.x + spike.w; x += 22) {
            ctx.fillStyle = "#ffd2dc";
            ctx.beginPath();
            ctx.moveTo(x, spike.y + 2);
            ctx.lineTo(x + 9, spike.y + spike.h - 2);
            ctx.lineTo(x - 9, spike.y + spike.h - 2);
            ctx.closePath();
            ctx.fill();
        }
    });
}

function drawSaws() {
    saws.forEach(saw => {
        ctx.save();
        ctx.translate(saw.x, saw.y);
        ctx.rotate(saw.angle);
        ctx.shadowColor = "rgba(255, 49, 93, 0.5)";
        ctx.shadowBlur = 10;
        const teeth = 10;
        ctx.fillStyle = "#d9dee6";
        ctx.beginPath();
        for (let i = 0; i < teeth; i++) {
            const a1 = (i / teeth) * Math.PI * 2;
            const a2 = a1 + (Math.PI * 2) / teeth / 2;
            ctx.lineTo(Math.cos(a1) * saw.r, Math.sin(a1) * saw.r);
            ctx.lineTo(Math.cos(a2) * saw.r * 1.3, Math.sin(a2) * saw.r * 1.3);
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#7c8797";
        ctx.beginPath();
        ctx.arc(0, 0, saw.r * 0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#3a4048";
        ctx.beginPath();
        ctx.arc(0, 0, saw.r * 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function drawRocks() {
    rockSpawners.forEach(rock => {
        if (rock.state === "warn") {
            const pulse = 0.5 + Math.sin(rock.timer * 0.6) * 0.3;
            ctx.fillStyle = `rgba(255, 210, 95, ${pulse})`;
            ctx.beginPath();
            ctx.arc(rock.x, 30, rock.r * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#3a2c14";
            ctx.font = "bold 22px Arial";
            ctx.textAlign = "center";
            ctx.fillText("!", rock.x, 36);
        } else if (rock.state === "falling") {
            ctx.save();
            ctx.translate(rock.x, rock.ry);
            ctx.fillStyle = "#8a7360";
            ctx.beginPath();
            ctx.moveTo(-rock.r, -2);
            ctx.lineTo(-rock.r * 0.4, -rock.r);
            ctx.lineTo(rock.r * 0.5, -rock.r * 0.7);
            ctx.lineTo(rock.r, 4);
            ctx.lineTo(rock.r * 0.3, rock.r);
            ctx.lineTo(-rock.r * 0.6, rock.r * 0.8);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "rgba(0, 0, 0, 0.25)";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }
    });
}

function drawLava() {
    const t = Date.now() * 0.001;
    lavaPools.forEach(lava => {
        const glow = ctx.createLinearGradient(0, lava.y, 0, lava.y + lava.h);
        glow.addColorStop(0, "#ffd76a");
        glow.addColorStop(0.4, "#ff7a1f");
        glow.addColorStop(1, "#b5220a");
        ctx.fillStyle = glow;
        roundRect(lava.x, lava.y, lava.w, lava.h, 6);
        ctx.fillStyle = "rgba(255, 240, 180, 0.55)";
        for (let x = lava.x + 14; x < lava.x + lava.w - 10; x += 26) {
            const bob = Math.sin(t * 3 + x * 0.05) * 3;
            ctx.beginPath();
            ctx.arc(x, lava.y + lava.h * 0.4 + bob, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    });
}

function drawBarriers() {
    barriers.forEach(barrier => {
        if (barrier.on) {
            ctx.save();
            ctx.strokeStyle = "#7ef5ff";
            ctx.lineWidth = 4;
            ctx.shadowColor = "#7ef5ff";
            ctx.shadowBlur = 14;
            ctx.beginPath();
            const zigzags = 6;
            for (let i = 0; i <= zigzags; i++) {
                const y = barrier.y + (barrier.h / zigzags) * i;
                const x = barrier.x + barrier.w / 2 + (i % 2 === 0 ? -barrier.w / 2 : barrier.w / 2);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.restore();
        } else {
            ctx.strokeStyle = "rgba(126, 245, 255, 0.25)";
            ctx.lineWidth = 2;
            ctx.strokeRect(barrier.x, barrier.y, barrier.w, barrier.h);
        }
    });
}

function drawTurrets() {
    turrets.forEach(turret => {
        ctx.fillStyle = "#3a4048";
        roundRect(turret.x - 16, turret.y - 12, 32, 24, 4);
        ctx.fillStyle = "#7c8797";
        ctx.fillRect(turret.dir < 0 ? turret.x - 32 : turret.x, turret.y - 5, 16, 10);
    });
    turretShots.forEach(shot => {
        ctx.save();
        ctx.shadowColor = "#ff4fd8";
        ctx.shadowBlur = 6;
        ctx.fillStyle = "#ff4fd8";
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function drawButtons() {
    buttons.forEach(button => {
        ctx.fillStyle = button.pressed ? "#49ffa8" : "#ffd25f";
        roundRect(button.x, button.y, button.w, button.h, 4);
    });
}

function drawEnemies() {
    enemies.forEach(enemy => {
        if (!enemy.alive) return;
        ctx.shadowColor = "rgba(182, 76, 255, 0.4)";
        ctx.shadowBlur = 10;
        const body = ctx.createLinearGradient(0, enemy.y, 0, enemy.y + player.h);
        body.addColorStop(0, "#e2b8ff");
        body.addColorStop(0.5, "#b64cff");
        body.addColorStop(1, "#6a1fb8");
        ctx.fillStyle = body;
        roundRect(enemy.x, enemy.y, player.w, player.h, 10);
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#1a0733";
        ctx.fillRect(enemy.x + player.w * 0.22, enemy.y + player.h * 0.28, 5, 5);
        ctx.fillRect(enemy.x + player.w * 0.58, enemy.y + player.h * 0.28, 5, 5);
    });
}

function drawArrows() {
    arrows.forEach(a => {
        ctx.strokeStyle = "#ffe680";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(a.x - a.vx * 1.5, a.y);
        ctx.lineTo(a.x + a.vx * 1.5, a.y);
        ctx.stroke();
    });
}

function drawPlayer() {
    const flashing = player.hitFlash > 0 && Math.floor(player.hitFlash / 4) % 2 === 0;
    if (flashing) return;
    ctx.shadowColor = CHARACTER.glow;
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;
    const body = ctx.createLinearGradient(0, player.y, 0, player.y + player.h);
    body.addColorStop(0, CHARACTER.top);
    body.addColorStop(0.48, CHARACTER.mid);
    body.addColorStop(1, CHARACTER.bottom);
    ctx.fillStyle = body;
    roundRect(player.x, player.y, player.w, player.h, 12);
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
    roundRect(player.x + player.w * 0.18, player.y + player.h * 0.12, player.w * 0.24, player.h * 0.42, 8);
    ctx.fillStyle = "#09213a";
    const eyeSize = Math.max(5, Math.min(7, player.w * 0.18));
    ctx.fillRect(player.x + player.w * 0.24, player.y + player.h * 0.25, eyeSize, eyeSize);
    ctx.fillRect(player.x + player.w * 0.6, player.y + player.h * 0.25, eyeSize, eyeSize);
    ctx.fillStyle = CHARACTER.foot;
    ctx.fillRect(player.x + player.w * 0.2, player.y + player.h - 8, player.w * 0.58, 4);

    if (player.attackTimer > 0) {
        const reach = attackReach();
        const swordX = player.facing > 0 ? player.x + player.w : player.x - reach;
        ctx.fillStyle = "rgba(223, 251, 255, 0.85)";
        ctx.fillRect(swordX, player.y + player.h * 0.35, reach, 6);
    }
    if (player.blockTimer > 0) {
        ctx.strokeStyle = "rgba(114, 230, 255, 0.75)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x + player.w / 2, player.y + player.h / 2, player.w * 0.9, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function drawGoal() {
    ctx.fillStyle = "#49ffa8";
    roundRect(goal.x, goal.y, goal.w, goal.h, 10);
    ctx.fillStyle = "#08182b";
    roundRect(goal.x + 12, goal.y + 16, goal.w - 24, goal.h - 32, 8);
    ctx.strokeStyle = "#a3ffd4";
    ctx.lineWidth = 4;
    ctx.strokeRect(goal.x + 13, goal.y + 17, goal.w - 26, goal.h - 34);
}

function draw() {
    drawBackground();
    ctx.save();
    ctx.translate(-cameraX, 0);
    drawPlatforms();
    drawSpikes();
    drawLava();
    drawBarriers();
    drawTurrets();
    drawSaws();
    drawRocks();
    drawButtons();
    drawEnemies();
    drawArrows();
    drawGoal();
    drawPlayer();
    ctx.restore();
}

function loop() {
    if (running) {
        updatePlayer();
        updateEnemies();
        updateSaws();
        updateRocks();
        updateBarriers();
        updateTurrets();
        updateArrows();
    }
    draw();
    requestAnimationFrame(loop);
}

// ---- Mode select / start ----
let selectedMode = "normal";
modeSelect.querySelectorAll(".mode-card").forEach(card => {
    card.addEventListener("click", () => {
        if (card.classList.contains("preview")) return;
        modeSelect.querySelectorAll(".mode-card").forEach(c => c.classList.remove("selected"));
        card.classList.add("selected");
        selectedMode = card.dataset.mode;
    });
});

startBtn.addEventListener("click", () => {
    overlay.classList.add("hidden");
    shopToggle.style.display = "block";
    loadLevel(0);
    running = true;
});

requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Runner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    overflow: hidden;
    background: #0b1020;
    color: #eaf6ff;
    font-family: "Segoe UI", Arial, sans-serif;
}

#game {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #07101d;
}

.hud {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    z-index: 5;
}

.hud-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.pill {
    min-width: 78px;
    padding: 7px 10px;
    border: 1px solid rgba(136, 220, 255, 0.28);
    border-radius: 7px;
    background: rgba(8, 18, 36, 0.72);
    color: #dff7ff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.24);
}

.instruction {
    position: fixed;
    top: 54px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(8, 18, 36, 0.72);
    border: 1px solid rgba(136, 220, 255, 0.28);
    color: #cdeaff;
    font-size: 12px;
    font-weight: 600;
    pointer-events: none;
    max-width: min(520px, 82vw);
    text-align: center;
}

.overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 35%, rgba(42, 220, 255, 0.16), rgba(7, 10, 22, 0.86) 58%);
    z-index: 10;
}

.overlay.hidden { display: none; }

.panel {
    width: min(760px, calc(100vw - 32px));
    padding: 22px;
    border: 1px solid rgba(124, 226, 255, 0.28);
    border-radius: 8px;
    background: rgba(8, 16, 32, 0.9);
    box-shadow: 0 18px 70px rgba(0, 0, 0, 0.42);
    text-align: center;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
}

.panel h1 {
    color: #8deaff;
    font-size: 34px;
    letter-spacing: 0;
    margin-bottom: 8px;
}

.panel p {
    color: #aac7d8;
    font-size: 14px;
    line-height: 1.45;
    margin-bottom: 16px;
}

.primary-btn {
    border: 1px solid rgba(141, 234, 255, 0.65);
    border-radius: 7px;
    background: #20c6ff;
    color: #06101d;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    padding: 10px 16px;
}

.primary-btn:hover { background: #6ee6ff; }

.mode-select {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-top: 14px;
}

.mode-card {
    border: 1px solid rgba(141, 234, 255, 0.28);
    border-radius: 8px;
    background: rgba(12, 28, 52, 0.82);
    color: #eaf6ff;
    cursor: pointer;
    padding: 10px;
    text-align: left;
    font: inherit;
    transition: border-color 0.2s, transform 0.2s, background 0.2s;
}

.mode-card:hover,
.mode-card.selected {
    border-color: #8deaff;
    background: rgba(32, 198, 255, 0.15);
    transform: translateY(-2px);
}

.mode-card.preview {
    cursor: default;
    opacity: 0.82;
}

.mode-card.preview:hover {
    border-color: rgba(141, 234, 255, 0.28);
    background: rgba(12, 28, 52, 0.82);
    transform: none;
}

.mode-art {
    position: relative;
    height: 150px;
    overflow: hidden;
    border-radius: 7px;
    background: linear-gradient(#162a50, #07101f);
    margin-bottom: 10px;
}

.art-label {
    position: absolute;
    left: 10px;
    top: 10px;
    z-index: 2;
    padding: 4px 7px;
    border: 1px solid rgba(141, 234, 255, 0.42);
    border-radius: 5px;
    background: rgba(6, 16, 29, 0.78);
    color: #eaf6ff;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.8px;
}

.mode-art::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 18px;
    height: 18px;
    background: #19365e;
    border-top: 4px solid #42d8ff;
}

.art-player {
    position: absolute;
    left: 78px;
    top: 54px;
    width: 24px;
    height: 34px;
    border-radius: 7px;
    background: #8deaff;
    box-shadow: 0 0 14px rgba(141, 234, 255, 0.7);
}

.art-player::before,
.art-enemy::before {
    content: "";
    position: absolute;
    top: 9px;
    left: 6px;
    width: 4px;
    height: 4px;
    background: #09213a;
    box-shadow: 9px 0 0 #09213a;
}

.art-enemy {
    position: absolute;
    right: 58px;
    bottom: 36px;
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: #b64cff;
    box-shadow: 0 0 14px rgba(182, 76, 255, 0.72);
}

.mode-name {
    display: block;
    color: #8deaff;
    font-weight: 800;
    margin-bottom: 3px;
}

.mode-desc {
    color: #aac7d8;
    font-size: 12px;
    line-height: 1.35;
}

.shop-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 6;
    padding: 8px 12px;
    border: 1px solid rgba(144, 224, 255, 0.38);
    border-radius: 7px;
    background: rgba(7, 16, 31, 0.86);
    color: #dff7ff;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 900;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2), inset 0 1px rgba(255, 255, 255, 0.08);
    display: none;
}

.shop-panel {
    position: fixed;
    top: 54px;
    right: 14px;
    z-index: 6;
    width: min(270px, calc(100vw - 28px));
    display: none;
    padding: 12px;
    border: 1px solid rgba(144, 224, 255, 0.32);
    border-radius: 8px;
    background: rgba(7, 16, 31, 0.94);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.42), inset 0 1px rgba(255, 255, 255, 0.08);
}

.shop-panel.open { display: block; }

.shop-title {
    color: #8deaff;
    font-size: 14px;
    font-weight: 900;
    margin-bottom: 8px;
}

.shop-line {
    color: #aac7d8;
    font-size: 12px;
    line-height: 1.35;
    margin-bottom: 10px;
}

.shop-buy {
    width: 100%;
    border: 1px solid rgba(141, 234, 255, 0.58);
    border-radius: 7px;
    background: linear-gradient(180deg, #53e0ff, #1bb8f2);
    color: #06101d;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 900;
    padding: 8px 10px;
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.35);
}

.shop-buy + .shop-buy { margin-top: 8px; }

.shop-buy:disabled {
    opacity: 0.48;
    cursor: default;
}

.touch-controls {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    display: none;
    justify-content: space-between;
    pointer-events: none;
    z-index: 6;
}

.touch-cluster {
    display: flex;
    gap: 10px;
}

.touch-btn {
    width: 54px;
    height: 54px;
    border: 1px solid rgba(141, 234, 255, 0.32);
    border-radius: 8px;
    background: rgba(8, 18, 36, 0.72);
    color: #dff7ff;
    font-size: 20px;
    font-weight: 800;
    pointer-events: auto;
    touch-action: none;
}

@media (max-width: 760px), (pointer: coarse) {
    .touch-controls { display: flex; }
    .pill { min-width: 64px; font-size: 11px; }
    .mode-select { grid-template-columns: 1fr; }
    .mode-art { height: 120px; }
}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>

<div class="hud">
    <div class="hud-group">
        <div class="pill" id="level">Level 1</div>
        <div class="pill" id="kills">Kills 0</div>
    </div>
</div>
<div class="instruction" id="instruction"></div>

<button class="shop-toggle" id="shop-toggle">Shop</button>
<div class="shop-panel" id="shop-panel">
    <div class="shop-title">Shop</div>
    <div class="shop-line" id="shop-info"></div>
    <button class="shop-buy" id="attack-upgrade-btn">Buy Attack Range</button>
    <button class="shop-buy" id="shield-upgrade-btn">Buy Sword Block Time</button>
    <button class="shop-buy" id="archery-upgrade-btn">Buy Archery Range</button>
</div>

<div class="overlay" id="overlay">
    <div class="panel">
        <h1>Pulse Runner</h1>
        <p>Pick Normal for the campaign run, or Ultimate for the 20-level gauntlet (coming soon).</p>
        <div class="mode-select" id="mode-select">
            <button class="mode-card selected" data-mode="normal">
                <div class="mode-art" aria-hidden="true">
                    <span class="art-label">NORMAL</span>
                    <span class="art-player"></span>
                    <span class="art-enemy"></span>
                </div>
                <span class="mode-name">Normal</span>
                <span class="mode-desc">A hand-built platformer campaign with spikes, pits, buttons, and enemies.</span>
            </button>
            <button class="mode-card" data-mode="ultimate" aria-label="Ultimate mode">
                <div class="mode-art" aria-hidden="true">
                    <span class="art-label">ULTIMATE</span>
                </div>
                <span class="mode-name">Ultimate</span>
                <span class="mode-desc">Superlong floating-platform gauntlets with 20 escalating hazards. In progress.</span>
            </button>
        </div>
        <button class="primary-btn" id="start-btn">Start Normal</button>
    </div>
</div>

<div class="overlay hidden" id="win-screen">
    <div class="panel">
        <h1 id="win-title">Level Complete!</h1>
        <p id="win-text"></p>
        <button class="primary-btn" id="next-btn">Continue</button>
    </div>
</div>

<div class="touch-controls" aria-hidden="true">
    <div class="touch-cluster">
        <button class="touch-btn" data-key="left">L</button>
        <button class="touch-btn" data-key="right">R</button>
    </div>
    <div class="touch-cluster">
        <button class="touch-btn" data-key="attack">X</button>
        <button class="touch-btn" data-key="jump">J</button>
    </div>
</div>

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.fill();
}

function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function platformStrip(x, y, w, h, tunnel) { return tunnel ? { x, y, w, h, tunnel: true } : { x, y, w, h }; }
function createRockSpawner(spec) {
    const type = spec.type || "rock";
    return { x: spec.x, type, fallMult: type === "icicle" ? 2 : 1, r: 56, state: "idle", ry: 0, vy: 0, timer: 30 + Math.floor(Math.random() * 30) };
}
function createBarrier(spec) {
    const period = spec.period || 25;
    return { x: spec.x, y: spec.y, w: spec.w, h: spec.h, period, on: true, timer: spec.phase || period };
}
function createTurret(spec) {
    const interval = spec.interval || 90;
    return { x: spec.x, y: spec.y, dir: spec.dir || -1, aim: !!spec.aim, interval, timer: spec.phase || interval, range: spec.range || 500 };
}
function createTimedPlatform(spec) {
    const period = spec.period || 60;
    return {
        x: spec.x, y: spec.y, w: spec.w, h: spec.h, period, solid: true, timer: spec.phase || period,
        min: spec.min, max: spec.max, moveSpeed: spec.moveSpeed || 0, dir: 1
    };
}
function createCrumblingPlatform(spec) {
    return { x: spec.x, y: spec.y, w: spec.w, h: spec.h, state: "solid", timer: 0, shakeTimer: 0 };
}
function createAxe(spec) {
    return {
        anchorX: spec.anchorX, anchorY: spec.anchorY, length: spec.length || 180,
        amplitude: spec.amplitude || 1, period: spec.period || 90, t: spec.phase || 0,
        angle: 0, r: spec.r || 26
    };
}
function createArrowTrap(spec) {
    return { x: spec.x, y: spec.y, w: spec.w || 44, h: spec.h || 12, dir: spec.dir || 1, launchY: spec.launchY, cooldown: 0 };
}
function createGeyser(spec) {
    const idleTime = spec.idleTime || 90;
    return { x: spec.x, w: spec.w || 50, groundY: spec.groundY, height: spec.height || 220, idleTime, state: "idle", timer: spec.phase || idleTime };
}
function createCrusher(spec) {
    return {
        x: spec.x, w: spec.w, h: spec.h,
        topY: spec.topY, bottomY: spec.bottomY,
        period: spec.period || 90,
        state: "up", timer: spec.phase || spec.period || 90,
        y: spec.topY
    };
}
function createBoulder(spec) {
    return { x: spec.x, y: spec.y, r: spec.r || 36, min: spec.min, max: spec.max, speed: spec.speed || 4, dir: 1, angle: 0 };
}
function createDrone(spec) {
    const interval = spec.interval || 70;
    return {
        x: spec.x, y: spec.y, r: spec.r || 20,
        min: spec.min, max: spec.max, speed: spec.speed || 3, dir: 1,

    };
}

function loadLevel(index) {

    start = { ...level.start };
    goal = { ...level.goal };
    platforms = level.platforms.map(p => ({ ...p }));
    gates = level.gates.map(g => ({ ...g, open: false }));
    spikes = level.spikes.map(s => ({ ...s }));
    saws = (level.saws || []).map(s => ({ ...s, dir: 1, angle: 0 }));
    rockSpawners = (level.rocks || []).map(r => createRockSpawner(r));
    lavaPools = (level.lava || []).map(l => ({ ...l }));
    barriers = (level.barriers || []).map(b => createBarrier(b));

    timedPlatforms = (level.timedPlatforms || []).map(t => createTimedPlatform(t));
    crumblingPlatforms = (level.crumblingPlatforms || []).map(c => createCrumblingPlatform(c));
    axes = (level.axes || []).map(a => createAxe(a));
    arrowTraps = (level.arrowTraps || []).map(a => createArrowTrap(a));
    geysers = (level.geysers || []).map(g => createGeyser(g));
    trapArrows = [];
    crushers = (level.crushers || []).map(c => createCrusher(c));
    boulders = (level.boulders || []).map(b => createBoulder(b));
    drones = (level.drones || []).map(d => createDrone(d));
    turretShots = [];
    enemies = level.enemies.map(e => ({ ...e, x0: e.x, dir: 1, alive: true }));
    buttons = level.buttons.map(b => ({ ...b, pressed: false }));
    arrows = [];

    setInstruction(level.intro || level.name);
    updateHud();
    respawn();
}

    player.attackTimer = 0;
    player.blockTimer = 0;
    player.hitFlash = 0;
    cameraX = 0;
    cameraY = 0;
}

let lastInstruction = "";
function setInstruction(text) {
    if (text === lastInstruction) return;
    lastInstruction = text;
    instructionEl.textContent = text;
}

function updateHud() {
    killsEl.textContent = `Kills ${killBank}`;
    updateShop();
}

// ---- Shop (ported from Battlebound, minus sword select/take-apart/sell) ----
function attackUpgradeCost() { return 10 + attackUpgradeLevel; }
function shieldUpgradeCost() { return 15 + shieldUpgradeLevel * 5; }
function archeryUpgradeCost() { return archeryRangeLevel === 0 ? 30 : 40; }
function shieldUnlocked() { return true; }
function archeryUnlocked() { return levelIndex >= 2; }

function attackReach() { return 46 + attackUpgradeLevel * 12; }
function shieldDurationFrames() { return Math.round((30 + shieldUpgradeLevel * 15)); }
function archeryDistance() { return [420, 620, 900][archeryRangeLevel] || 420; }

function buyAttackUpgrade() {
    if (attackUpgradeLevel >= 3) return;
    const cost = attackUpgradeCost();
    if (killBank < cost) return;
    killBank -= cost;
    attackUpgradeLevel += 1;
    updateHud();
}
function buyShieldUpgrade() {
    if (!shieldUnlocked() || shieldUpgradeLevel >= 3) return;
    const cost = shieldUpgradeCost();
    if (killBank < cost) return;
    killBank -= cost;
    shieldUpgradeLevel += 1;
    updateHud();
}
function buyArcheryUpgrade() {
    if (!archeryUnlocked() || archeryRangeLevel >= 2) return;
    const cost = archeryUpgradeCost();
    if (killBank < cost) return;
    killBank -= cost;
    archeryRangeLevel += 1;
    updateHud();
}

function updateShop() {
    if (attackUpgradeLevel >= 3) {
        attackUpgradeBtn.textContent = "Maxed Out";
        attackUpgradeBtn.disabled = true;
    } else {
        const cost = attackUpgradeCost();
        attackUpgradeBtn.textContent = `Buy Attack Range (${cost})`;
        attackUpgradeBtn.disabled = killBank < cost;
    }

    if (!shieldUnlocked()) {
        shieldUpgradeBtn.textContent = "Sword Block Locked";
        shieldUpgradeBtn.disabled = true;
    } else if (shieldUpgradeLevel >= 3) {
        shieldUpgradeBtn.textContent = "Sword Block Maxed";
        shieldUpgradeBtn.disabled = true;
    } else {
        const cost = shieldUpgradeCost();
        shieldUpgradeBtn.textContent = `Buy Sword Block Time (${cost})`;
        shieldUpgradeBtn.disabled = killBank < cost;
    }

    if (!archeryUnlocked()) {
        archeryUpgradeBtn.textContent = "Archery Locked";
        archeryUpgradeBtn.disabled = true;
    } else if (archeryRangeLevel >= 2) {
        archeryUpgradeBtn.textContent = "Archery Maxed Out";
        archeryUpgradeBtn.disabled = true;
    } else {
        const cost = archeryUpgradeCost();
        archeryUpgradeBtn.textContent = `Buy Archery Range (${cost})`;
        archeryUpgradeBtn.disabled = killBank < cost;
    }

    const attackLine = attackUpgradeLevel >= 3 ? "Attack range maxed" : `Attack range ${attackUpgradeLevel}/3`;
    const shieldLine = shieldUpgradeLevel >= 3 ? "Sword block maxed" : `Sword block ${shieldUpgradeLevel}/3`;
    const archeryLine = !archeryUnlocked() ? "Archery locked until Level 3" : (archeryRangeLevel >= 2 ? "Archery maxed" : `Archery range ${archeryRangeLevel}/2`);
    shopInfo.textContent = `Kills: ${killBank}. ${attackLine}. ${shieldLine}. ${archeryLine}.`;
}

attackUpgradeBtn.addEventListener("click", buyAttackUpgrade);
shieldUpgradeBtn.addEventListener("click", buyShieldUpgrade);
archeryUpgradeBtn.addEventListener("click", buyArcheryUpgrade);
shopToggle.addEventListener("click", () => {
    shopPanel.classList.toggle("open");
    updateShop();
});

// ---- Input ----
const keys = { left: false, right: false, jump: false, attack: false, block: false, shoot: false };
window.addEventListener("keydown", e => {
    if (e.repeat) return;
    setKey(e.key, true);
});
window.addEventListener("keyup", e => setKey(e.key, false));

function setKey(key, val) {
    const k = key.toLowerCase();
    if (k === "arrowleft" || k === "a") keys.left = val;
    else if (k === "arrowright" || k === "d") keys.right = val;
    else if (k === "arrowup" || k === "w" || k === " ") keys.jump = val;
    else if (k === "x") { keys.attack = val; if (val) attack(); }
    else if (k === "z") keys.block = val && shieldUnlocked();
    else if (k === "c") { keys.shoot = val; if (val) shootArrow(); }
}

document.querySelectorAll(".touch-btn").forEach(btn => {
    const key = btn.dataset.key;
    btn.addEventListener("touchstart", e => { e.preventDefault(); touchKey(key, true); });
    btn.addEventListener("touchend", e => { e.preventDefault(); touchKey(key, false); });
});
function touchKey(key, val) {
    if (key === "left") keys.left = val;
    if (key === "right") keys.right = val;
    if (key === "jump") keys.jump = val;
    if (key === "attack" && val) attack();
}

// ---- Combat ----
function attack() {
    if (player.attackTimer > 0) return;
    player.attackTimer = 14;
    const reach = attackReach();
    const box = {
        x: player.facing > 0 ? player.x + player.w : player.x - reach,
        y: player.y - 6,
        w: reach,
        h: player.h + 12
    };
    for (const enemy of enemies) {
        if (!enemy.alive) continue;
        const enemyRect = { x: enemy.x, y: enemy.y, w: player.w, h: player.h };
        if (rectsOverlap(box, enemyRect)) killEnemy(enemy);
    }
}

function killEnemy(enemy) {
    enemy.alive = false;
    killBank += 2;
    updateHud();
}

function shootArrow() {
    if (!archeryUnlocked()) return;
    arrows.push({
        x: player.x + player.w / 2,
        y: player.y + player.h / 2,
        vx: player.facing * 11,
        life: archeryDistance()
    });
}

function updateArrows() {
    for (let i = arrows.length - 1; i >= 0; i--) {
        const a = arrows[i];
        a.x += a.vx;
        a.life -= Math.abs(a.vx);
        let hit = false;
        for (const enemy of enemies) {
            if (!enemy.alive) continue;
            const enemyRect = { x: enemy.x, y: enemy.y, w: player.w, h: player.h };
            if (rectsOverlap({ x: a.x - 4, y: a.y - 4, w: 8, h: 8 }, enemyRect)) {
                killEnemy(enemy);
                hit = true;
                break;
            }
        }
        if (hit || a.life <= 0) arrows.splice(i, 1);
    }
}

// ---- Update loop ----
function takeHit() {
    if (player.blockTimer > 0) return;
    if (player.hitFlash > 0) return;
    player.hitFlash = 60;
    respawn();
}

function updatePlayer() {
    const speed = player.grounded ? GROUND_ACCEL : AIR_ACCEL;
    if (keys.left) { player.vx -= speed; player.facing = -1; }
    if (keys.right) { player.vx += speed; player.facing = 1; }
    if (!keys.left && !keys.right) player.vx *= player.grounded ? 0.82 : 0.96;
    player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));

    if (keys.jump && player.grounded) {
        player.vy = -JUMP_POWER;
        player.grounded = false;
    }

    player.vy += GRAVITY;
    player.vy = Math.min(player.vy, 18);

    player.x += player.vx;
    for (const solid of solids()) {
        if (!rectsOverlap(player, solid)) continue;
        if (player.vx > 0) player.x = solid.x - player.w;
        if (player.vx < 0) player.x = solid.x + solid.w;
        player.vx = 0;
    }

    player.y += player.vy;
    player.grounded = false;
    for (const solid of solids()) {
        if (!rectsOverlap(player, solid)) continue;
        if (player.vy > 0) {
            player.y = solid.y - player.h;
            player.vy = 0;
            player.grounded = true;
        } else if (player.vy < 0) {
            player.y = solid.y + solid.h;
            player.vy = 0;
        }
    }

    player.x = Math.max(0, Math.min(world.width - player.w, player.x));
    if (player.y > world.height + 180) takeHit();

    if (player.attackTimer > 0) player.attackTimer -= 1;
    if (player.hitFlash > 0) player.hitFlash -= 1;
    player.blockTimer = keys.block && shieldUnlocked() ? shieldDurationFrames() : Math.max(0, player.blockTimer - 1);

    for (const spike of spikes) {
        if (rectsOverlap(player, spike)) { takeHit(); break; }
    }
    for (const lava of lavaPools) {
        if (rectsOverlap(player, lava)) { takeHit(); break; }
    }
    for (const barrier of barriers) {
        if (barrier.on && rectsOverlap(player, barrier)) { takeHit(); break; }
    }
    for (const saw of saws) {
        const sawBox = { x: saw.x - saw.r, y: saw.y - saw.r, w: saw.r * 2, h: saw.r * 2 };
        if (rectsOverlap(player, sawBox)) { takeHit(); break; }
    }
    for (const enemy of enemies) {
        if (enemy.alive && rectsOverlap(player, { x: enemy.x, y: enemy.y, w: player.w, h: player.h })) takeHit();
    }

    for (const button of buttons) {
        const zone = { x: button.x - 4, y: button.y - 30, w: button.w + 8, h: 40 };
        const pressed = player.grounded && rectsOverlap(player, zone);
        if (pressed && !button.pressed) {
            button.pressed = true;
            gates.forEach(g => { if (g.id === button.target) g.open = true; });
        }
    }

    if (rectsOverlap(player, goal)) completeLevel();

    cameraX = Math.max(0, Math.min(world.width - window.innerWidth, player.x - window.innerWidth * 0.38));
    cameraY = player.y > 680
        ? Math.max(0, Math.min(Math.max(0, world.height - window.innerHeight), player.y - window.innerHeight * 0.5))
        : 0;
}

function solids() {
    return platforms.concat(gates.filter(g => !g.open)).concat(timedPlatforms.filter(t => t.solid)).concat(crumblingPlatforms.filter(c => c.state !== "gone"));
}

function updateTimedPlatforms() {
    for (const tp of timedPlatforms) {
        tp.timer -= 1;
        if (tp.timer <= 0) {
            tp.solid = !tp.solid;
            tp.timer = tp.period;
        }
        if (tp.moveSpeed > 0 && tp.solid) {
            const standing = player.grounded && rectsOverlap(player, { x: tp.x - 2, y: tp.y - 4, w: tp.w + 4, h: tp.h + 4 });
            const prevX = tp.x;
            tp.x += tp.dir * tp.moveSpeed;
            if (tp.x < tp.min) { tp.x = tp.min; tp.dir = 1; }
            if (tp.x > tp.max) { tp.x = tp.max; tp.dir = -1; }
            if (standing) player.x += tp.x - prevX;
        }
    }
}

function updateCrumblingPlatforms() {
    for (const cp of crumblingPlatforms) {
        if (cp.state === "solid") {
            const standing = player.grounded && rectsOverlap(player, { x: cp.x, y: cp.y - 4, w: cp.w, h: cp.h + 4 });
            if (standing) {
                cp.timer += 1;
                cp.shakeTimer = cp.timer;
                if (cp.timer > 5) { cp.state = "gone"; cp.timer = 150; cp.shakeTimer = 0; }
            } else {
                cp.timer = 0;
                cp.shakeTimer = 0;
            }
        } else if (cp.state === "gone") {
            cp.timer -= 1;
            if (cp.timer <= 0) cp.state = "solid";
        }
    }
}

function updateAxes() {
    for (const axe of axes) {
        axe.t += 1;
        axe.angle = Math.sin((axe.t / axe.period) * Math.PI * 2) * axe.amplitude;
        const headX = axe.anchorX + Math.sin(axe.angle) * axe.length;
        const headY = axe.anchorY + Math.cos(axe.angle) * axe.length;
        if (rectsOverlap(player, { x: headX - axe.r, y: headY - axe.r, w: axe.r * 2, h: axe.r * 2 })) takeHit();
    }
}

function updateArrowTraps() {
    for (const trap of arrowTraps) {
        if (trap.cooldown > 0) trap.cooldown -= 1;
        const zone = { x: trap.x - 4, y: trap.y - 30, w: trap.w + 8, h: 40 };
        if (player.grounded && trap.cooldown <= 0 && rectsOverlap(player, zone)) {
            trapArrows.push({ x: trap.x + trap.w / 2, y: trap.launchY, vx: trap.dir * 9 });
            trap.cooldown = 60;
        }
    }
    for (let i = trapArrows.length - 1; i >= 0; i--) {
        const a = trapArrows[i];
        a.x += a.vx;
        if (rectsOverlap(player, { x: a.x - 8, y: a.y - 3, w: 16, h: 6 })) {
            takeHit();
            trapArrows.splice(i, 1);
            continue;
        }
        if (a.x < -50 || a.x > world.width + 50) trapArrows.splice(i, 1);
    }
}

function updateGeysers() {
    for (const g of geysers) {
        g.timer -= 1;
        if (g.timer <= 0) {
            if (g.state === "idle") { g.state = "warn"; g.timer = 20; }
            else if (g.state === "warn") { g.state = "erupt"; g.timer = 25; }
            else if (g.state === "erupt") { g.state = "idle"; g.timer = g.idleTime; }
        }
        if (g.state === "erupt") {
            const hitbox = { x: g.x, y: g.groundY - g.height, w: g.w, h: g.height };
            if (rectsOverlap(player, hitbox)) takeHit();
        }
    }
}

function updateCrushers() {
    for (const c of crushers) {
        c.timer -= 1;
        if (c.timer <= 0) {
            if (c.state === "up") { c.state = "down"; c.timer = 12; c.y = c.bottomY; }
            else if (c.state === "down") { c.state = "up"; c.timer = c.period; c.y = c.topY; }
        }
        if (c.state === "down" && rectsOverlap(player, { x: c.x, y: c.y, w: c.w, h: c.h })) takeHit();
    }
}

function updateBoulders() {
    for (const b of boulders) {
        b.x += b.dir * b.speed;
        if (b.x < b.min) { b.x = b.min; b.dir = 1; }
        if (b.x > b.max) { b.x = b.max; b.dir = -1; }
        b.angle += b.dir * b.speed * 0.05;
        if (rectsOverlap(player, { x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 })) takeHit();
    }
}

function updateDrones() {
    for (const d of drones) {
        d.x += d.dir * d.speed;
        if (d.x < d.min) { d.x = d.min; d.dir = 1; }
        if (d.x > d.max) { d.x = d.max; d.dir = -1; }
        if (rectsOverlap(player, { x: d.x - d.r, y: d.y - d.r, w: d.r * 2, h: d.r * 2 })) takeHit();

        d.timer -= 1;
        if (d.timer <= 0) {
            d.timer = d.interval;
            const dx = (player.x + player.w / 2) - d.x;
            const dy = (player.y + player.h / 2) - d.y;
            const dist = Math.hypot(dx, dy) || 1;
            turretShots.push({ x: d.x, y: d.y, vx: (dx / dist) * 8, vy: (dy / dist) * 8, range: d.range });
        }
    }
}

function updateEnemies() {
    for (const enemy of enemies) {
        if (!enemy.alive) continue;
        enemy.x += enemy.dir * enemy.speed;
        if (enemy.x < enemy.min) { enemy.x = enemy.min; enemy.dir = 1; }
        if (enemy.x + player.w > enemy.max) { enemy.x = enemy.max - player.w; enemy.dir = -1; }
    }
}

function updateSaws() {
    for (const saw of saws) {
        saw.x += saw.dir * saw.speed;
        if (saw.x < saw.min) { saw.x = saw.min; saw.dir = 1; }
        if (saw.x > saw.max) { saw.x = saw.max; saw.dir = -1; }
        saw.angle += saw.speed * 0.12;
    }
}

function updateRocks() {
    for (const rock of rockSpawners) {
        if (rock.state === "idle") {
            rock.timer -= 1;
            if (rock.timer <= 0) { rock.state = "warn"; rock.timer = 30; }
        } else if (rock.state === "warn") {
            rock.timer -= 1;
            if (rock.timer <= 0) { rock.state = "falling"; rock.ry = 40; rock.vy = 4 * rock.fallMult; }
        } else if (rock.state === "falling") {
            rock.vy += 0.5 * rock.fallMult;
            rock.ry += rock.vy;
            if (rectsOverlap(player, { x: rock.x - rock.r, y: rock.ry - rock.r, w: rock.r * 2, h: rock.r * 2 })) takeHit();
            if (rock.ry > world.height + 40) {
                rock.state = "idle";
                rock.timer = 40 + Math.floor(Math.random() * 30);
            }
        }
    }
}

function updateBarriers() {
    for (const barrier of barriers) {
        barrier.timer -= 1;
        if (barrier.timer <= 0) {
            barrier.on = !barrier.on;
            barrier.timer = barrier.period;
        }
    }
}

function updateTurrets() {
    for (const turret of turrets) {
        turret.timer -= 1;
        if (turret.timer <= 0) {
            turret.timer = turret.interval;
            if (turret.aim) {
                const dx = (player.x + player.w / 2) - turret.x;
                const dy = (player.y + player.h / 2) - turret.y;
                const dist = Math.hypot(dx, dy) || 1;
                turretShots.push({ x: turret.x, y: turret.y, vx: (dx / dist) * 8, vy: (dy / dist) * 8, range: turret.range });
            } else {
                turretShots.push({ x: turret.x, y: turret.y, vx: turret.dir * 8, vy: 0, range: turret.range });
            }
        }
    }
    for (let i = turretShots.length - 1; i >= 0; i--) {
        const shot = turretShots[i];
        shot.x += shot.vx;
        shot.y += shot.vy;
        shot.range -= Math.hypot(shot.vx, shot.vy);
        if (rectsOverlap(player, { x: shot.x - 6, y: shot.y - 6, w: 12, h: 12 })) {
            takeHit();
            turretShots.splice(i, 1);
            continue;
        }
        if (shot.range <= 0 || shot.x < -50 || shot.x > world.width + 50 || shot.y < -50 || shot.y > world.height + 200) turretShots.splice(i, 1);
    }
}

function completeLevel() {
    if (!running) return;
    running = false;
    if (levelIndex >= levels.length - 1) {
        endRun();
    } else {
        winTitle.textContent = "Level Complete!";
        winText.textContent = `On to ${levels[levelIndex + 1].name}.`;
        winScreen.classList.remove("hidden");
    }
}

function endRun() {
    running = false;
    winTitle.textContent = "Campaign Complete!";
    winText.textContent = "More levels coming soon.";
    winScreen.classList.remove("hidden");
}

nextBtn.addEventListener("click", () => {
    winScreen.classList.add("hidden");
    if (levelIndex >= levels.length - 1) {
        overlay.classList.remove("hidden");
    } else {
        loadLevel(levelIndex + 1);
        running = true;
    }
});

// ---- Rendering (ported from Battlebound) ----
function drawBackground() {
    const w = window.innerWidth, h = window.innerHeight;
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#07101d");
    sky.addColorStop(0.48, "#102744");
    sky.addColorStop(1, "#06101c");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = "rgba(171, 237, 255, 0.72)";
    for (let i = 0; i < 34; i++) {
        const x = (i * 173 - cameraX * 0.08) % (w + 180) - 60;
        const y = 36 + (i * 47) % 210;
        const size = 1 + (i % 3) * 0.6;
        ctx.fillRect(x, y, size, size);
    }

    ctx.fillStyle = "rgba(126, 245, 255, 0.12)";
    ctx.beginPath();
    ctx.arc(w - 118, 92, 46, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(223, 251, 255, 0.78)";
    ctx.beginPath();
    ctx.arc(w - 118, 92, 24, 0, Math.PI * 2);
    ctx.fill();

    const backOffset = -(cameraX * 0.12) % 520;
    ctx.fillStyle = "rgba(35, 78, 116, 0.42)";
    ctx.beginPath();
    ctx.moveTo(backOffset - 120, h);
    for (let x = backOffset - 120; x < w + 620; x += 260) {
        ctx.lineTo(x + 120, h - 235);
        ctx.lineTo(x + 260, h);
    }
    ctx.closePath();
    ctx.fill();

    const frontOffset = -(cameraX * 0.24) % 430;
    ctx.fillStyle = "rgba(18, 52, 82, 0.62)";
    ctx.beginPath();
    ctx.moveTo(frontOffset - 100, h);
    for (let x = frontOffset - 100; x < w + 520; x += 215) {
        ctx.lineTo(x + 96, h - 152);
        ctx.lineTo(x + 215, h);
    }
    ctx.closePath();
    ctx.fill();

    const glow = ctx.createLinearGradient(0, h - 170, 0, h);
    glow.addColorStop(0, "rgba(73, 255, 168, 0)");
    glow.addColorStop(1, "rgba(73, 255, 168, 0.08)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, h - 170, w, 170);
}

function drawPlatforms() {
    platforms.forEach(platform => {
        ctx.shadowColor = "rgba(0, 0, 0, 0.28)";
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 8;
        const body = ctx.createLinearGradient(0, platform.y, 0, platform.y + platform.h);
        if (platform.tunnel) {
            body.addColorStop(0, "#3a2f28");
            body.addColorStop(0.62, "#241c17");
            body.addColorStop(1, "#120d0a");
        } else {
            body.addColorStop(0, "#25527d");
            body.addColorStop(0.62, "#17395e");
            body.addColorStop(1, "#0f2744");
        }
        ctx.fillStyle = body;
        roundRect(platform.x, platform.y, platform.w, platform.h, 8);
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.fillStyle = platform.tunnel ? "#ff8a4a" : "#72e6ff";
        roundRect(platform.x + 8, platform.y + 4, Math.max(0, platform.w - 16), 5, 3);
        ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
        ctx.fillRect(platform.x + 12, platform.y + 12, Math.max(0, platform.w - 24), 2);
        ctx.fillStyle = "rgba(2, 9, 18, 0.28)";
        ctx.fillRect(platform.x + 8, platform.y + platform.h - 8, Math.max(0, platform.w - 16), 5);
    });
    ctx.shadowColor = "transparent";

    gates.filter(g => !g.open).forEach(gate => {
        ctx.fillStyle = "#ff5f7a";
        roundRect(gate.x, gate.y, gate.w, gate.h, 6);
        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        roundRect(gate.x + 4, gate.y + 4, gate.w - 8, gate.h - 8, 4);
    });

    timedPlatforms.forEach(tp => {
        if (tp.solid) {
            ctx.shadowColor = "rgba(255, 214, 92, 0.5)";
            ctx.shadowBlur = 14;
            const body = ctx.createLinearGradient(0, tp.y, 0, tp.y + tp.h);
            body.addColorStop(0, "#ffe19a");
            body.addColorStop(0.62, "#f2a83a");
            body.addColorStop(1, "#b9701a");
            ctx.fillStyle = body;
            roundRect(tp.x, tp.y, tp.w, tp.h, 8);
            ctx.shadowBlur = 0;
        } else {
            ctx.strokeStyle = "rgba(255, 214, 92, 0.28)";
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.strokeRect(tp.x, tp.y, tp.w, tp.h);
            ctx.setLineDash([]);
        }
    });

    crumblingPlatforms.forEach(cp => {
        if (cp.state === "gone") {
            ctx.strokeStyle = "rgba(178, 140, 100, 0.25)";
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(cp.x, cp.y, cp.w, cp.h);
            ctx.setLineDash([]);
            return;
        }
        const shake = cp.shakeTimer > 0 ? (Math.random() - 0.5) * Math.min(6, cp.shakeTimer * 0.3) : 0;
        ctx.save();
        ctx.translate(shake, 0);
        ctx.shadowColor = "rgba(0, 0, 0, 0.28)";
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 8;
        const body = ctx.createLinearGradient(0, cp.y, 0, cp.y + cp.h);
        body.addColorStop(0, "#25527d");
        body.addColorStop(0.62, "#17395e");
        body.addColorStop(1, "#0f2744");
        ctx.fillStyle = body;
        roundRect(cp.x, cp.y, cp.w, cp.h, 8);
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.fillStyle = "#72e6ff";
        roundRect(cp.x + 8, cp.y + 4, Math.max(0, cp.w - 16), 5, 3);
        ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
        ctx.fillRect(cp.x + 12, cp.y + 12, Math.max(0, cp.w - 24), 2);
        ctx.fillStyle = "rgba(2, 9, 18, 0.28)";
        ctx.fillRect(cp.x + 8, cp.y + cp.h - 8, Math.max(0, cp.w - 16), 5);
        ctx.restore();
    });
}

function drawSpikes() {
    spikes.forEach(spike => {
        ctx.fillStyle = "#ff315d";
        roundRect(spike.x, spike.y, spike.w, spike.h, 4);
        for (let x = spike.x + 10; x < spike.x + spike.w; x += 22) {
            ctx.fillStyle = "#ffd2dc";
            ctx.beginPath();
            ctx.moveTo(x, spike.y + 2);
            ctx.lineTo(x + 9, spike.y + spike.h - 2);
            ctx.lineTo(x - 9, spike.y + spike.h - 2);
            ctx.closePath();
            ctx.fill();
        }
    });
}

function drawSaws() {
    saws.forEach(saw => {
        ctx.save();
        ctx.translate(saw.x, saw.y);
        ctx.rotate(saw.angle);
        ctx.shadowColor = "rgba(255, 49, 93, 0.5)";
        ctx.shadowBlur = 10;
        const teeth = 10;
        ctx.fillStyle = "#d9dee6";
        ctx.beginPath();
        for (let i = 0; i < teeth; i++) {
            const a1 = (i / teeth) * Math.PI * 2;
            const a2 = a1 + (Math.PI * 2) / teeth / 2;
            ctx.lineTo(Math.cos(a1) * saw.r, Math.sin(a1) * saw.r);
            ctx.lineTo(Math.cos(a2) * saw.r * 1.3, Math.sin(a2) * saw.r * 1.3);
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#7c8797";
        ctx.beginPath();
        ctx.arc(0, 0, saw.r * 0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#3a4048";
        ctx.beginPath();
        ctx.arc(0, 0, saw.r * 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function drawRocks() {
    rockSpawners.forEach(rock => {
        if (rock.state === "warn") {
            const pulse = 0.5 + Math.sin(rock.timer * 0.6) * 0.3;
            ctx.fillStyle = `rgba(255, 210, 95, ${pulse})`;
            ctx.beginPath();
            ctx.arc(rock.x, 30, rock.r * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#3a2c14";
            ctx.font = "bold 22px Arial";
            ctx.textAlign = "center";
            ctx.fillText("!", rock.x, 36);
        } else if (rock.state === "falling") {
            ctx.save();
            ctx.translate(rock.x, rock.ry);
            if (rock.type === "icicle") {
                ctx.shadowColor = "rgba(160, 235, 255, 0.85)";
                ctx.shadowBlur = 18;
                const grad = ctx.createLinearGradient(0, -rock.r, 0, rock.r * 1.3);
                grad.addColorStop(0, "#ffffff");
                grad.addColorStop(0.45, "#d8f6ff");
                grad.addColorStop(1, "#6fc9ea");
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(-rock.r * 0.55, -rock.r);
                ctx.lineTo(rock.r * 0.55, -rock.r);
                ctx.lineTo(rock.r * 0.32, rock.r * 0.1);
                ctx.lineTo(rock.r * 0.12, rock.r * 0.55);
                ctx.lineTo(0, rock.r * 1.35);
                ctx.lineTo(-rock.r * 0.12, rock.r * 0.55);
                ctx.lineTo(-rock.r * 0.32, rock.r * 0.1);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = "rgba(90, 190, 220, 0.55)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-rock.r * 0.55, -rock.r);
                ctx.lineTo(rock.r * 0.12, rock.r * 0.55);
                ctx.moveTo(rock.r * 0.55, -rock.r);
                ctx.lineTo(0, rock.r * 1.35);
                ctx.stroke();
                ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
                ctx.beginPath();
                ctx.moveTo(-rock.r * 0.3, -rock.r * 0.9);
                ctx.lineTo(-rock.r * 0.1, -rock.r * 0.9);
                ctx.lineTo(-rock.r * 0.22, rock.r * 0.6);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "rgba(140, 220, 255, 0.6)";
            } else {
                ctx.fillStyle = "#8a7360";
                ctx.beginPath();
                ctx.moveTo(-rock.r, -2);
                ctx.lineTo(-rock.r * 0.4, -rock.r);
                ctx.lineTo(rock.r * 0.5, -rock.r * 0.7);
                ctx.lineTo(rock.r, 4);
                ctx.lineTo(rock.r * 0.3, rock.r);
                ctx.lineTo(-rock.r * 0.6, rock.r * 0.8);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "rgba(0, 0, 0, 0.25)";
            }
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }
    });
}

function drawLava() {
    const t = Date.now() * 0.001;
    lavaPools.forEach(lava => {
        const glow = ctx.createLinearGradient(0, lava.y, 0, lava.y + lava.h);
        glow.addColorStop(0, "#ffd76a");
        glow.addColorStop(0.4, "#ff7a1f");
        glow.addColorStop(1, "#b5220a");
        ctx.fillStyle = glow;
        roundRect(lava.x, lava.y, lava.w, lava.h, 6);
        ctx.fillStyle = "rgba(255, 240, 180, 0.55)";
        for (let x = lava.x + 14; x < lava.x + lava.w - 10; x += 26) {
            const bob = Math.sin(t * 3 + x * 0.05) * 3;
            ctx.beginPath();
            ctx.arc(x, lava.y + lava.h * 0.4 + bob, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    });
}

function drawBarriers() {
    barriers.forEach(barrier => {
        if (barrier.on) {
            ctx.save();
            ctx.strokeStyle = "#7ef5ff";
            ctx.lineWidth = 4;
            ctx.shadowColor = "#7ef5ff";
            ctx.shadowBlur = 14;
            ctx.beginPath();
            const zigzags = 6;
            for (let i = 0; i <= zigzags; i++) {
                const y = barrier.y + (barrier.h / zigzags) * i;
                const x = barrier.x + barrier.w / 2 + (i % 2 === 0 ? -barrier.w / 2 : barrier.w / 2);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.restore();
        } else {
            ctx.strokeStyle = "rgba(126, 245, 255, 0.25)";
            ctx.lineWidth = 2;
            ctx.strokeRect(barrier.x, barrier.y, barrier.w, barrier.h);
        }
    });
}

function drawCrushers() {
    crushers.forEach(c => {
        ctx.fillStyle = "#4a4f58";
        ctx.fillRect(c.x + c.w / 2 - 6, 0, 12, c.y);
        const body = ctx.createLinearGradient(0, c.y, 0, c.y + c.h);
        body.addColorStop(0, "#8a919c");
        body.addColorStop(1, "#4a4f58");
        ctx.fillStyle = body;
        roundRect(c.x, c.y, c.w, c.h, 6);
        ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
        ctx.fillRect(c.x + 6, c.y + 5, c.w - 12, 4);
    });
}

function drawBoulders() {
    boulders.forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.angle);
        const body = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.3, b.r * 0.2, 0, 0, b.r);
        body.addColorStop(0, "#a08363");
        body.addColorStop(1, "#5c4a34");
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.arc(0, 0, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
        ctx.lineWidth = 3;
        for (let i = 0; i < 4; i++) {
            const a = (i / 4) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * b.r * 0.3, Math.sin(a) * b.r * 0.3);
            ctx.lineTo(Math.cos(a) * b.r * 0.85, Math.sin(a) * b.r * 0.85);
            ctx.stroke();
        }
        ctx.restore();
    });
}

function drawAxes() {
    axes.forEach(axe => {
        const headX = axe.anchorX + Math.sin(axe.angle) * axe.length;
        const headY = axe.anchorY + Math.cos(axe.angle) * axe.length;
        ctx.strokeStyle = "#5c6470";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(axe.anchorX, axe.anchorY);
        ctx.lineTo(headX, headY);
        ctx.stroke();
        ctx.fillStyle = "#3a4048";
        ctx.beginPath();
        ctx.arc(axe.anchorX, axe.anchorY, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(headX, headY);
        ctx.rotate(axe.angle);
        const grad = ctx.createLinearGradient(-axe.r, 0, axe.r, 0);
        grad.addColorStop(0, "#dfe6ee");
        grad.addColorStop(1, "#8a94a3");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, -axe.r * 1.1);
        ctx.lineTo(axe.r, 0);
        ctx.lineTo(0, axe.r * 1.1);
        ctx.lineTo(-axe.r * 0.35, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#6b4a2a";
        ctx.fillRect(-axe.r * 0.35, -6, axe.r * 0.35, 12);
        ctx.restore();
    });
}

function drawDrones() {
    drones.forEach(d => {
        ctx.save();
        ctx.shadowColor = "#ff4fd8";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#2c3038";
        roundRect(d.x - d.r, d.y - d.r * 0.6, d.r * 2, d.r * 1.2, 8);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(126, 245, 255, 0.5)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(d.x - d.r * 1.4, d.y);
        ctx.lineTo(d.x - d.r * 0.6, d.y);
        ctx.moveTo(d.x + d.r * 0.6, d.y);
        ctx.lineTo(d.x + d.r * 1.4, d.y);
        ctx.stroke();
        ctx.fillStyle = "#ff4fd8";
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r * 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function drawTurrets() {
    turrets.forEach(turret => {
        ctx.fillStyle = "#3a4048";
        roundRect(turret.x - 16, turret.y - 12, 32, 24, 4);
        ctx.fillStyle = "#7c8797";
        if (turret.aim) {
            const angle = Math.atan2((player.y + player.h / 2) - turret.y, (player.x + player.w / 2) - turret.x);
            ctx.save();
            ctx.translate(turret.x, turret.y);
            ctx.rotate(angle);
            ctx.fillRect(0, -5, 26, 10);
            ctx.restore();
        } else {
            ctx.fillRect(turret.dir < 0 ? turret.x - 32 : turret.x, turret.y - 5, 16, 10);
        }
    });
    turretShots.forEach(shot => {
        ctx.save();
        ctx.shadowColor = "#ff4fd8";
        ctx.shadowBlur = 6;
        ctx.fillStyle = "#ff4fd8";
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function drawButtons() {
    buttons.forEach(button => {
        ctx.fillStyle = button.pressed ? "#49ffa8" : "#ffd25f";
        roundRect(button.x, button.y, button.w, button.h, 4);
    });
}

function drawArrowTraps() {
    arrowTraps.forEach(trap => {
        ctx.fillStyle = trap.cooldown > 40 ? "#ff9a4a" : "#8a94a3";
        roundRect(trap.x, trap.y, trap.w, trap.h, 3);
    });
    trapArrows.forEach(a => {
        ctx.strokeStyle = "#e8d9b0";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(a.x - a.vx * 1.6, a.y);
        ctx.lineTo(a.x + a.vx * 1.6, a.y);
        ctx.stroke();
        ctx.fillStyle = "#3a4048";
        ctx.beginPath();
        const tipX = a.x + Math.sign(a.vx) * 10;
        ctx.moveTo(tipX, a.y);
        ctx.lineTo(tipX - Math.sign(a.vx) * 8, a.y - 4);
        ctx.lineTo(tipX - Math.sign(a.vx) * 8, a.y + 4);
        ctx.closePath();
        ctx.fill();
    });
}

function drawGeysers() {
    geysers.forEach(g => {
        if (g.state === "warn") {
            const pulse = 0.4 + Math.sin(g.timer * 0.7) * 0.3;
            ctx.fillStyle = `rgba(255, 140, 50, ${pulse})`;
            roundRect(g.x, g.groundY - 6, g.w, 6, 2);
        } else if (g.state === "erupt") {
            const grad = ctx.createLinearGradient(0, g.groundY - g.height, 0, g.groundY);
            grad.addColorStop(0, "#fff4a3");
            grad.addColorStop(0.5, "#ff9d18");
            grad.addColorStop(1, "#ff4718");
            ctx.fillStyle = grad;
            ctx.save();
            ctx.shadowColor = "#ff7418";
            ctx.shadowBlur = 20;
            ctx.beginPath();
            const midX = g.x + g.w / 2;
            const wobble = Math.sin(g.timer * 1.5) * 6;
            ctx.moveTo(g.x, g.groundY);
            ctx.quadraticCurveTo(g.x + wobble, g.groundY - g.height * 0.5, midX, g.groundY - g.height);
            ctx.quadraticCurveTo(g.x + g.w - wobble, g.groundY - g.height * 0.5, g.x + g.w, g.groundY);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    });
}

function drawEnemies() {
    enemies.forEach(enemy => {
        if (!enemy.alive) return;
        ctx.shadowColor = "rgba(182, 76, 255, 0.4)";
        ctx.shadowBlur = 10;
        const body = ctx.createLinearGradient(0, enemy.y, 0, enemy.y + player.h);
        body.addColorStop(0, "#e2b8ff");
        body.addColorStop(0.5, "#b64cff");
        body.addColorStop(1, "#6a1fb8");
        ctx.fillStyle = body;
        roundRect(enemy.x, enemy.y, player.w, player.h, 10);
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#1a0733";
        ctx.fillRect(enemy.x + player.w * 0.22, enemy.y + player.h * 0.28, 5, 5);
        ctx.fillRect(enemy.x + player.w * 0.58, enemy.y + player.h * 0.28, 5, 5);
    });
}

function drawArrows() {
    arrows.forEach(a => {
        ctx.strokeStyle = "#ffe680";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(a.x - a.vx * 1.5, a.y);
        ctx.lineTo(a.x + a.vx * 1.5, a.y);
        ctx.stroke();
    });
}

function drawPlayer() {
    const flashing = player.hitFlash > 0 && Math.floor(player.hitFlash / 4) % 2 === 0;
    if (flashing) return;
    ctx.shadowColor = CHARACTER.glow;
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;
    const body = ctx.createLinearGradient(0, player.y, 0, player.y + player.h);
    body.addColorStop(0, CHARACTER.top);
    body.addColorStop(0.48, CHARACTER.mid);
    body.addColorStop(1, CHARACTER.bottom);
    ctx.fillStyle = body;
    roundRect(player.x, player.y, player.w, player.h, 12);
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
    roundRect(player.x + player.w * 0.18, player.y + player.h * 0.12, player.w * 0.24, player.h * 0.42, 8);
    ctx.fillStyle = "#09213a";
    const eyeSize = Math.max(5, Math.min(7, player.w * 0.18));
    ctx.fillRect(player.x + player.w * 0.24, player.y + player.h * 0.25, eyeSize, eyeSize);
    ctx.fillRect(player.x + player.w * 0.6, player.y + player.h * 0.25, eyeSize, eyeSize);
    ctx.fillStyle = CHARACTER.foot;
    ctx.fillRect(player.x + player.w * 0.2, player.y + player.h - 8, player.w * 0.58, 4);

    if (player.attackTimer > 0) {
        const reach = attackReach();
        const swordX = player.facing > 0 ? player.x + player.w : player.x - reach;
        ctx.fillStyle = "rgba(223, 251, 255, 0.85)";
        ctx.fillRect(swordX, player.y + player.h * 0.35, reach, 6);
    }
    if (player.blockTimer > 0) {
        ctx.strokeStyle = "rgba(114, 230, 255, 0.75)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x + player.w / 2, player.y + player.h / 2, player.w * 0.9, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function drawGoal() {
    ctx.fillStyle = "#49ffa8";
    roundRect(goal.x, goal.y, goal.w, goal.h, 10);
    ctx.fillStyle = "#08182b";
    roundRect(goal.x + 12, goal.y + 16, goal.w - 24, goal.h - 32, 8);
    ctx.strokeStyle = "#a3ffd4";
    ctx.lineWidth = 4;
    ctx.strokeRect(goal.x + 13, goal.y + 17, goal.w - 26, goal.h - 34);
}

function draw() {
    drawBackground();
    ctx.save();
    ctx.translate(-cameraX, -cameraY);
    drawPlatforms();
    drawSpikes();
    drawLava();
    drawBarriers();
    drawTurrets();
    drawCrushers();
    drawBoulders();
    drawAxes();
    drawDrones();
    drawSaws();
    drawRocks();
    drawButtons();
    drawArrowTraps();
    drawGeysers();
    drawEnemies();
    drawArrows();
    drawGoal();
    drawPlayer();
    ctx.restore();
}

function loop() {
    if (running) {
        updatePlayer();
        updateEnemies();
        updateSaws();
        updateRocks();
        updateBarriers();
        updateTurrets();
        updateTimedPlatforms();
        updateCrumblingPlatforms();
        updateAxes();
        updateArrowTraps();
        updateGeysers();
        updateCrushers();
        updateBoulders();
        updateDrones();
        updateArrows();
    }
    draw();
    requestAnimationFrame(loop);
}

// ---- Mode select / start ----
let selectedMode = "normal";
modeSelect.querySelectorAll(".mode-card").forEach(card => {
    card.addEventListener("click", () => {
        if (card.classList.contains("preview")) return;
        modeSelect.querySelectorAll(".mode-card").forEach(c => c.classList.remove("selected"));
        card.classList.add("selected");
        selectedMode = card.dataset.mode;
        startBtn.textContent = selectedMode === "ultimate" ? "Start Ultimate" : "Start Normal";
    });
});

startBtn.addEventListener("click", () => {
    overlay.classList.add("hidden");
    shopToggle.style.display = "block";
    levels = selectedMode === "ultimate" ? ultimateLevels : normalLevels;
    const startIndex = selectedMode === "ultimate" ? 3 : Math.max(0, levels.length - 1);
    loadLevel(startIndex);
    running = true;
});

requestAnimationFrame(loop);
</script>
</body>

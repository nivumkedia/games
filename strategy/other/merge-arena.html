<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge Arena</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, sans-serif;
  background: #dbeafe;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
}

#game {
  width: 100%;
  max-width: 1120px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 6px 30px rgba(0,0,0,0.13);
  overflow: hidden;
}

/* ── Header ─────────────────────────────────── */
#header {
  background: linear-gradient(135deg, #1d4ed8 0%, #7c3aed 100%);
  color: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; white-space: nowrap; }
.hp-section { display: flex; align-items: center; gap: 8px; flex: 1; }
.hp-section.p2 { justify-content: flex-end; }
.hp-label { font-size: 12px; font-weight: 800; }
.hp-bar-wrap { width: 90px; height: 8px; background: rgba(255,255,255,0.25); border-radius: 4px; overflow: hidden; }
.hp-bar { height: 100%; border-radius: 4px; transition: width 0.4s; }
.hp-p1 { background: #34d399; }
.hp-p2 { background: #fb923c; }
.hp-num { font-size: 15px; font-weight: 900; }
.round-badge {
  background: rgba(255,255,255,0.18);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

/* ── Main 3-column layout ────────────────────── */
#main {
  display: grid;
  grid-template-columns: 1fr 84px 1fr;
  min-height: 580px;
}

.player-area {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.player-area.p2 { border-left: 1px solid #e5e7eb; }

.player-label {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.player-label.p1 { color: #059669; }
.player-label.p2 { color: #ea580c; }

.section-label {
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #9ca3af;
  margin-bottom: 4px;
}

/* ── Shop ───────────────────────────────────── */
.shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.gold-display { font-size: 13px; font-weight: 800; color: #b45309; }
.shop-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }

.shop-item {
  padding: 6px 3px;
  background: #f9fafb;
  border: 2px solid #e5e7eb;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
  transition: all 0.12s;
}
.shop-item:hover:not(.sold):not(.broke) {
  border-color: #6366f1;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(99,102,241,0.22);
}
.shop-item.sold { opacity: 0.3; cursor: not-allowed; }
.shop-item.broke { opacity: 0.5; cursor: not-allowed; }
.si-em { font-size: 20px; line-height: 1; }
.si-name { font-size: 8px; font-weight: 700; color: #374151; margin-top: 2px; }
.si-cost { font-size: 10px; color: #b45309; font-weight: 800; }
.si-stat { font-size: 7px; color: #9ca3af; }

/* ── Board ──────────────────────────────────── */
.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}

.cell {
  aspect-ratio: 1;
  min-height: 62px;
  background: #f9fafb;
  border: 2px dashed #d1d5db;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color 0.1s, background 0.1s;
  position: relative;
}
.cell:hover { border-color: #9ca3af; background: #f3f4f6; }
.cell.drag-over { border-color: #6366f1; background: #eef2ff; border-style: solid; }
.cell.has-unit { border-style: solid; }
.cell.t1 { border-color: #9ca3af; }
.cell.t2 { border-color: #a78bfa; }
.cell.t3 { border-color: #f59e0b; }
.cell.selected { outline: 3px solid #3b82f6; outline-offset: 1px; }
.cell.can-merge { animation: mpulse 1.2s ease-in-out infinite; }
@keyframes mpulse {
  0%,100% { box-shadow: 0 0 0 2px #a78bfa; }
  50%      { box-shadow: 0 0 0 4px #7c3aed, 0 0 14px rgba(124,58,237,0.45); }
}

.unit-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  width: 100%;
  padding: 3px;
  cursor: grab;
}
.unit-wrap:active { cursor: grabbing; }
.u-em { font-size: 24px; line-height: 1; }
.u-name { font-size: 8px; font-weight: 700; color: #4b5563; text-align: center; }
.u-hbar { width: 72%; height: 3px; background: #e5e7eb; border-radius: 2px; margin-top: 2px; }
.u-hfill { height: 100%; border-radius: 2px; }
.tier-pip {
  position: absolute;
  top: 2px; right: 2px;
  font-size: 7px; font-weight: 900;
  background: #6366f1; color: white;
  border-radius: 3px; padding: 1px 3px;
  line-height: 1.2;
}

/* ── Bench ──────────────────────────────────── */
.bench { display: flex; gap: 4px; flex-wrap: wrap; }
.bench-cell {
  width: 54px; height: 54px;
  background: #f9fafb;
  border: 2px dashed #d1d5db;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.1s;
  position: relative;
  flex-shrink: 0;
}
.bench-cell:hover { border-color: #9ca3af; }
.bench-cell.drag-over { border-color: #6366f1; background: #eef2ff; }
.bench-cell.has-unit { border-style: solid; border-color: #9ca3af; }

/* ── Center column ──────────────────────────── */
#center-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  border-left: 1px solid #e5e7eb;
  border-right: 1px solid #e5e7eb;
  background: #f8fafc;
  padding: 10px 6px;
}
.vs-text { font-size: 26px; font-weight: 900; color: #9ca3af; }
.btn-battle {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  background: linear-gradient(180deg, #1d4ed8, #7c3aed);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 18px 10px;
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
  letter-spacing: 1.5px;
  transition: all 0.15s;
  box-shadow: 0 4px 14px rgba(99,102,241,0.4);
}
.btn-battle:hover:not(:disabled) {
  transform: rotate(180deg) translateY(-2px);
  box-shadow: 0 6px 20px rgba(99,102,241,0.55);
}
.btn-battle:disabled { opacity: 0.35; cursor: not-allowed; transform: rotate(180deg); box-shadow: none; }

/* ── Small buttons ──────────────────────────── */
.btn-sm {
  padding: 4px 7px;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  background: white;
  font-size: 10px;
  font-weight: 700;
  color: #6b7280;
  cursor: pointer;
  transition: all 0.1s;
}
.btn-sm:hover { background: #f3f4f6; border-color: #9ca3af; }
.btn-sm.locked { background: #fef3c7; border-color: #fcd34d; color: #92400e; }

.sell-btn {
  padding: 7px 10px;
  border: 1px solid #fca5a5;
  border-radius: 7px;
  background: #fff5f5;
  font-size: 11px;
  font-weight: 700;
  color: #dc2626;
  cursor: pointer;
  transition: all 0.1s;
  width: 100%;
}
.sell-btn:hover { background: #fee2e2; }

/* ── Battle overlay ─────────────────────────── */
#battle-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 50;
  align-items: center;
  justify-content: center;
}
#battle-overlay.show { display: flex; }
#battle-box {
  background: white;
  border-radius: 16px;
  padding: 22px 20px;
  width: 700px;
  max-width: 95vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.battle-title {
  text-align: center;
  font-size: 18px;
  font-weight: 900;
  color: #1e293b;
  margin-bottom: 10px;
}
.battle-teams {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 5px;
}
.bl-p1 { color: #059669; }
.bl-p2 { color: #ea580c; }
#battle-canvas {
  display: block;
  width: 100%;
  border: 2px solid #e5e7eb;
  border-radius: 8px;
  background: #f8fafc;
}

/* ── Result modal ───────────────────────────── */
#result-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#result-overlay.show { display: flex; }
#result-card {
  background: white;
  border-radius: 18px;
  padding: 38px 36px;
  text-align: center;
  min-width: 300px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.res-em { font-size: 60px; line-height: 1; }
.res-title { font-size: 28px; font-weight: 900; margin: 10px 0 6px; color: #1e293b; }
.res-desc { color: #6b7280; font-size: 14px; margin-bottom: 22px; }
.btn-next {
  padding: 12px 30px;
  background: linear-gradient(135deg, #1d4ed8, #7c3aed);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-next:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,0.45); }

/* ── Toast ──────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: #1e293b;
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  transition: transform 0.25s;
  z-index: 200;
  white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="game">
  <!-- Header -->
  <div id="header">
    <div class="hp-section p1">
      <span class="hp-label">P1</span>
      <div class="hp-bar-wrap"><div class="hp-bar hp-p1" id="p1-bar"></div></div>
      <span class="hp-num" id="p1-hp">20</span>❤️
    </div>
    <div class="header-title">⚔️ Merge Arena</div>
    <div class="round-badge" id="round-badge">Round 1</div>
    <button onclick="if(confirm('Restart the game?')) playAgain()" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;border-radius:8px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;">🔄 Restart</button>
    <div class="header-title">⚔️</div>
    <div class="hp-section p2">
      💔<span class="hp-num" id="p2-hp">20</span>
      <div class="hp-bar-wrap"><div class="hp-bar hp-p2" id="p2-bar"></div></div>
      <span class="hp-label">P2</span>
    </div>
  </div>

  <div id="main">
    <!-- Player 1 -->
    <div class="player-area" id="p1-area">
      <div class="player-label p1">⚔️ Player 1</div>

      <div>
        <div class="shop-header">
          <div class="gold-display">💰 <span id="p1-gold">3</span></div>
          <div style="display:flex;gap:4px;">
            <button class="btn-sm" id="p1-reroll" onclick="reroll(1)">🔄 2g</button>
            <button class="btn-sm" id="p1-lock" onclick="toggleLock(1)">🔒 Lock</button>
          </div>
        </div>
        <div class="shop-grid" id="p1-shop"></div>
      </div>

      <div>
        <div class="section-label">Board</div>
        <div class="board" id="p1-board"></div>
      </div>

      <div>
        <div class="section-label">Bench</div>
        <div class="bench" id="p1-bench"></div>
      </div>

      <button class="sell-btn" onclick="sell(1)">💰 Sell Selected Unit</button>
    </div>

    <!-- Center -->
    <div id="center-col">
      <div class="vs-text">VS</div>
      <button class="btn-battle" id="battle-btn" onclick="startBattle()">⚔ BATTLE!</button>
      <div style="font-size:9px;color:#9ca3af;font-weight:700;text-align:center;">DRAG TO<br>MERGE ✨</div>
    </div>

    <!-- Player 2 -->
    <div class="player-area p2" id="p2-area">
      <div class="player-label p2">🔥 Player 2</div>

      <div>
        <div class="shop-header">
          <div class="gold-display">💰 <span id="p2-gold">3</span></div>
          <div style="display:flex;gap:4px;">
            <button class="btn-sm" id="p2-reroll" onclick="reroll(2)">🔄 2g</button>
            <button class="btn-sm" id="p2-lock" onclick="toggleLock(2)">🔒 Lock</button>
          </div>
        </div>
        <div class="shop-grid" id="p2-shop"></div>
      </div>

      <div>
        <div class="section-label">Board</div>
        <div class="board" id="p2-board"></div>
      </div>

      <div>
        <div class="section-label">Bench</div>
        <div class="bench" id="p2-bench"></div>
      </div>

      <button class="sell-btn" onclick="sell(2)">💰 Sell Selected Unit</button>
    </div>
  </div>
</div>

<!-- Battle overlay -->
<div id="battle-overlay">
  <div id="battle-box">
    <div class="battle-title">⚔️ Round <span id="battle-rnd">1</span> — Fight!</div>
    <div class="battle-teams">
      <span class="bl-p1">⚔️ Player 1</span>
      <span class="bl-p2">Player 2 🔥</span>
    </div>
    <canvas id="battle-canvas" height="200"></canvas>
  </div>
</div>

<!-- Result modal -->
<div id="result-overlay">
  <div id="result-card">
    <div class="res-em" id="res-em">⚔️</div>
    <div class="res-title" id="res-title"></div>
    <div class="res-desc" id="res-desc"></div>
    <button class="btn-next" id="res-btn">Next Round →</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Unit definitions ─────────────────────────────────────────
const UNITS = {
  // Warrior — melee, balanced
  w1:{id:'w1',name:'Squire',    em:'⚔️', fam:'warrior',tier:1,atk:10,hp:100,spd:1.0, rng:1.3,cost:1},
  w2:{id:'w2',name:'Knight',    em:'🛡️', fam:'warrior',tier:2,atk:23,hp:240,spd:1.0, rng:1.3,cost:3},
  w3:{id:'w3',name:'Champion',  em:'👑', fam:'warrior',tier:3,atk:58,hp:600,spd:1.0, rng:1.3,cost:9},
  // Mage — ranged, high dmg
  m1:{id:'m1',name:'Apprentice',em:'🔮', fam:'mage',   tier:1,atk:22,hp:55, spd:0.65,rng:3.3,cost:1},
  m2:{id:'m2',name:'Mage',      em:'🧙', fam:'mage',   tier:2,atk:48,hp:130,spd:0.65,rng:3.3,cost:3},
  m3:{id:'m3',name:'Archmage',  em:'✨', fam:'mage',   tier:3,atk:110,hp:320,spd:0.65,rng:3.3,cost:9},
  // Mech — melee, tanky
  r1:{id:'r1',name:'Bot',       em:'🤖', fam:'mech',   tier:1,atk:8, hp:165,spd:0.75,rng:1.3,cost:1},
  r2:{id:'r2',name:'Mech',      em:'⚙️', fam:'mech',   tier:2,atk:19,hp:390,spd:0.75,rng:1.3,cost:3},
  r3:{id:'r3',name:'Titan',     em:'🦾', fam:'mech',   tier:3,atk:45,hp:950,spd:0.75,rng:1.3,cost:9},
  // Drone — ranged, fast
  d1:{id:'d1',name:'Drone',     em:'🛸', fam:'drone',  tier:1,atk:14,hp:65, spd:1.5, rng:2.6,cost:1},
  d2:{id:'d2',name:'Rocket',    em:'🚀', fam:'drone',  tier:2,atk:32,hp:155,spd:1.5, rng:2.6,cost:3},
  d3:{id:'d3',name:'Laser',     em:'⚡', fam:'drone',  tier:3,atk:75,hp:380,spd:1.5, rng:2.6,cost:9},
  // Beast — melee, fast
  b1:{id:'b1',name:'Wolf',      em:'🐺', fam:'beast',  tier:1,atk:13,hp:80, spd:1.3, rng:1.3,cost:1},
  b2:{id:'b2',name:'Lion',      em:'🦁', fam:'beast',  tier:2,atk:30,hp:190,spd:1.3, rng:1.3,cost:3},
  b3:{id:'b3',name:'Dragon',    em:'🐉', fam:'beast',  tier:3,atk:70,hp:460,spd:1.3, rng:1.3,cost:9},
};

const T1 = Object.values(UNITS).filter(u => u.tier === 1);
const T2 = Object.values(UNITS).filter(u => u.tier === 2);
const MERGE_MAP = {w1:'w2',w2:'w3',m1:'m2',m2:'m3',r1:'r2',r2:'r3',d1:'d2',d2:'d3',b1:'b2',b2:'b3'};

const BOARD_SIZE = 12; // 4×3
const BENCH_SIZE = 8;
const MAX_HP = 20;
const VW = 660; // virtual canvas width for simulation
const VH = 200;

// ── State ────────────────────────────────────────────────────
let uid = 1;
let selected = {1: null, 2: null};
let drag = null;
let raf = null;
let G = newGame();

function newGame() {
  return {
    round: 1,
    hp:     {1: MAX_HP, 2: MAX_HP},
    gold:   {1: 3,      2: 3},
    board:  {1: Array(BOARD_SIZE).fill(null), 2: Array(BOARD_SIZE).fill(null)},
    bench:  {1: Array(BENCH_SIZE).fill(null), 2: Array(BENCH_SIZE).fill(null)},
    shop:   {1: [], 2: []},
    locked: {1: false,  2: false},
  };
}

function mkUnit(id) {
  return { id, uid: uid++ };
}

// ── Shop ─────────────────────────────────────────────────────
function genShop(p) {
  if (G.locked[p]) return;
  const pool = G.round >= 4 ? [...T1, ...T1, ...T2] : T1;
  G.shop[p] = Array(5).fill(0).map(() => {
    const t = pool[Math.floor(Math.random() * pool.length)];
    return { id: t.id, sold: false };
  });
}

function buy(p, i) {
  const item = G.shop[p][i];
  if (!item || item.sold) return;
  const cost = UNITS[item.id].cost;
  if (G.gold[p] < cost) { toast('Not enough gold!'); return; }

  const fi = G.bench[p].findIndex(c => c === null);
  const fb = G.board[p].findIndex(c => c === null);
  if (fi === -1 && fb === -1) { toast('No space! Sell or move a unit.'); return; }

  G.gold[p] -= cost;
  item.sold = true;
  const unit = mkUnit(item.id);
  if (fi !== -1) G.bench[p][fi] = unit;
  else G.board[p][fb] = unit;
  render();
}

function reroll(p) {
  if (G.gold[p] < 2) { toast('Need 2 gold to reroll!'); return; }
  G.gold[p] -= 2;
  G.locked[p] = false;
  genShop(p);
  render();
}

function toggleLock(p) {
  G.locked[p] = !G.locked[p];
  render();
}

// ── Sell ─────────────────────────────────────────────────────
function sell(p) {
  const sel = selected[p];
  if (!sel) { toast('Click a unit to select it first.'); return; }
  const u = getAt(p, sel.zone, sel.idx);
  if (!u) { selected[p] = null; render(); return; }
  G.gold[p] += Math.max(1, Math.floor(UNITS[u.id].cost / 2));
  setAt(p, sel.zone, sel.idx, null);
  selected[p] = null;
  render();
}

// ── Cell helpers ──────────────────────────────────────────────
function getAt(p, zone, idx) {
  return zone === 'board' ? G.board[p][idx] : G.bench[p][idx];
}
function setAt(p, zone, idx, val) {
  if (zone === 'board') G.board[p][idx] = val;
  else G.bench[p][idx] = val;
}

// ── Drag & drop ───────────────────────────────────────────────
function onDragStart(p, zone, idx) {
  const u = getAt(p, zone, idx);
  if (!u) return;
  drag = { p, zone, idx, unit: u };
}

function onDrop(p, zone, idx) {
  if (!drag) return;
  if (drag.p !== p) { toast('Stay on your own side!'); drag = null; return; }

  const tgt = getAt(p, zone, idx);

  // Merge two identical units
  if (tgt && tgt.id === drag.unit.id && tgt.uid !== drag.unit.uid && MERGE_MAP[tgt.id]) {
    setAt(p, drag.zone, drag.idx, null);
    const newId = MERGE_MAP[tgt.id];
    setAt(p, zone, idx, mkUnit(newId));
    toast(`✨ Merged into ${UNITS[newId].name}!`);
    drag = null;
    render();
    return;
  }

  // Swap / move
  setAt(p, drag.zone, drag.idx, tgt || null);
  setAt(p, zone, idx, drag.unit);
  drag = null;
  render();
}

function selectCell(p, zone, idx) {
  const u = getAt(p, zone, idx);
  if (!u) { selected[p] = null; render(); return; }
  const s = selected[p];
  selected[p] = (s && s.zone === zone && s.idx === idx) ? null : { zone, idx };
  render();
}

// ── Battle ────────────────────────────────────────────────────
function startBattle() {
  const b1 = G.board[1].filter(Boolean);
  const b2 = G.board[2].filter(Boolean);
  if (!b1.length && !b2.length) { toast('Both boards are empty!'); return; }

  document.getElementById('battle-btn').disabled = true;

  // Layout constants for virtual 660×200 canvas
  const COLS = 4, ROWS = 3;
  const CW = VW / (COLS * 2), CH = VH / ROWS;

  // Build fighter objects from board slots
  let fighters = [];

  G.board[1].forEach((u, i) => {
    if (!u) return;
    const t = UNITS[u.id];
    fighters.push({
      ...t, uid: u.uid, team: 1,
      hp: t.hp, maxHp: t.hp,
      x: CW * (0.5 + (i % COLS)),
      y: CH * (0.5 + Math.floor(i / COLS)),
      atkCD: Math.random() / t.spd,
      alive: true,
    });
  });

  G.board[2].forEach((u, i) => {
    if (!u) return;
    const t = UNITS[u.id];
    fighters.push({
      ...t, uid: u.uid, team: 2,
      hp: t.hp, maxHp: t.hp,
      x: VW - CW * (0.5 + (i % COLS)),
      y: CH * (0.5 + Math.floor(i / COLS)),
      atkCD: Math.random() / t.spd,
      alive: true,
    });
  });

  // Pre-simulate battle
  const steps = [];
  const snap = () => fighters.map(f => ({ ...f }));
  steps.push(snap());

  const DT = 0.05, SPEED = 48;
  for (let tick = 0; tick < 900; tick++) {
    const a1 = fighters.filter(f => f.alive && f.team === 1);
    const a2 = fighters.filter(f => f.alive && f.team === 2);
    if (!a1.length || !a2.length) break;

    for (const f of fighters) {
      if (!f.alive) continue;
      const enemies = fighters.filter(e => e.alive && e.team !== f.team);
      if (!enemies.length) continue;

      // Nearest enemy
      let near = null, nearD = Infinity;
      for (const e of enemies) {
        const d = Math.hypot(e.x - f.x, e.y - f.y);
        if (d < nearD) { nearD = d; near = e; }
      }

      f.atkCD = Math.max(0, f.atkCD - DT);
      const rangePx = f.rng * CW;

      if (nearD <= rangePx) {
        if (f.atkCD <= 0) {
          near.hp -= f.atk;
          f.atkCD = 1 / f.spd;
          if (near.hp <= 0) { near.hp = 0; near.alive = false; }
        }
      } else {
        const dx = near.x - f.x, dy = near.y - f.y, d = Math.hypot(dx, dy);
        f.x += (dx / d) * SPEED * DT;
        f.y += (dy / d) * SPEED * DT;
      }
    }

    if (tick % 2 === 0) steps.push(snap());
  }
  steps.push(snap());

  const surv1 = fighters.filter(f => f.alive && f.team === 1).length;
  const surv2 = fighters.filter(f => f.alive && f.team === 2).length;
  const winner = surv1 > 0 && surv2 === 0 ? 1 : surv2 > 0 && surv1 === 0 ? 2 : 0;

  // Show battle overlay and animate
  const overlay = document.getElementById('battle-overlay');
  const canvas  = document.getElementById('battle-canvas');
  document.getElementById('battle-rnd').textContent = G.round;
  overlay.classList.add('show');

  canvas.width  = canvas.offsetWidth || 660;
  canvas.height = 200;
  const ctx   = canvas.getContext('2d');
  const scale = canvas.width / VW;

  let si = 0;
  function frame() {
    if (si >= steps.length) {
      setTimeout(() => finishBattle(winner, surv1, surv2, overlay), 350);
      return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Dividing line
    ctx.save();
    ctx.strokeStyle = '#cbd5e1';
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    ctx.save();
    ctx.scale(scale, scale);

    for (const f of steps[si]) {
      if (!f.alive) continue;
      const hpPct = f.hp / f.maxHp;

      // Emoji
      ctx.font = '20px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(f.em, f.x, f.y);

      // HP bar
      const bw = 28, bh = 4;
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(f.x - bw / 2, f.y + 13, bw, bh);
      ctx.fillStyle = hpPct > 0.5 ? '#34d399' : hpPct > 0.25 ? '#fbbf24' : '#f87171';
      ctx.fillRect(f.x - bw / 2, f.y + 13, bw * hpPct, bh);

      // Team dot
      ctx.fillStyle = f.team === 1 ? '#059669' : '#ea580c';
      ctx.beginPath();
      ctx.arc(f.x, f.y - 14, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
    si += 2;
    raf = requestAnimationFrame(frame);
  }

  if (raf) cancelAnimationFrame(raf);
  frame();
}

function finishBattle(winner, s1, s2, overlay) {
  overlay.classList.remove('show');

  if (winner === 1) G.hp[2] = Math.max(0, G.hp[2] - s1);
  else if (winner === 2) G.hp[1] = Math.max(0, G.hp[1] - s2);

  renderHP();

  const isEnd = G.hp[1] <= 0 || G.hp[2] <= 0;
  const resOv = document.getElementById('result-overlay');
  const em    = document.getElementById('res-em');
  const title = document.getElementById('res-title');
  const desc  = document.getElementById('res-desc');
  const btn   = document.getElementById('res-btn');

  if (winner === 1) {
    em.textContent = '🏆'; title.textContent = 'Player 1 Wins!';
    desc.textContent = `${s1} surviving unit(s) dealt damage to Player 2!`;
  } else if (winner === 2) {
    em.textContent = '🔥'; title.textContent = 'Player 2 Wins!';
    desc.textContent = `${s2} surviving unit(s) dealt damage to Player 1!`;
  } else {
    em.textContent = '🤝'; title.textContent = 'Draw!';
    desc.textContent = 'Both armies wiped each other out. No damage dealt.';
  }

  if (isEnd) {
    const gw = G.hp[1] > 0 ? 1 : G.hp[2] > 0 ? 2 : 0;
    em.textContent    = gw === 1 ? '🏆' : gw === 2 ? '🔥' : '💀';
    title.textContent = gw === 1 ? 'Player 1 is Champion!' : gw === 2 ? 'Player 2 is Champion!' : 'Mutual Destruction!';
    desc.textContent  = `Game over after ${G.round} rounds!`;
    btn.textContent   = '🔄 Play Again';
    btn.onclick       = playAgain;
  } else {
    btn.textContent = `Next Round (${G.round + 1}) →`;
    btn.onclick     = nextRound;
  }

  resOv.classList.add('show');
}

function nextRound() {
  document.getElementById('result-overlay').classList.remove('show');
  G.round++;
  const bonus = 2 + Math.floor(G.round / 3);
  G.gold[1] = Math.min(10, G.gold[1] + bonus);
  G.gold[2] = Math.min(10, G.gold[2] + bonus);
  selected = {1: null, 2: null};
  genShop(1); genShop(2);
  document.getElementById('battle-btn').disabled = false;
  render();
}

function playAgain() {
  document.getElementById('result-overlay').classList.remove('show');
  uid = 1;
  selected = {1: null, 2: null};
  G = newGame();
  genShop(1); genShop(2);
  render();
}

// ── Rendering ─────────────────────────────────────────────────
function render() {
  renderHP();
  document.getElementById('round-badge').textContent = `Round ${G.round}`;
  renderShop(1); renderShop(2);
  renderBoard(1); renderBoard(2);
  renderBench(1); renderBench(2);
}

function renderHP() {
  [1, 2].forEach(p => {
    const h = Math.max(0, G.hp[p]);
    document.getElementById(`p${p}-hp`).textContent = h;
    document.getElementById(`p${p}-bar`).style.width = (h / MAX_HP * 100) + '%';
  });
}

function renderShop(p) {
  document.getElementById(`p${p}-gold`).textContent = G.gold[p];
  const lock = G.locked[p];
  const lb = document.getElementById(`p${p}-lock`);
  lb.textContent = lock ? '🔓 Unlock' : '🔒 Lock';
  lb.className = 'btn-sm' + (lock ? ' locked' : '');

  const cont = document.getElementById(`p${p}-shop`);
  cont.innerHTML = '';
  G.shop[p].forEach((item, i) => {
    const t = UNITS[item.id];
    const div = document.createElement('div');
    const canAfford = G.gold[p] >= t.cost;
    div.className = 'shop-item' + (item.sold ? ' sold' : !canAfford ? ' broke' : '');
    div.innerHTML = `<div class="si-em">${t.em}</div><div class="si-name">${t.name}</div><div class="si-cost">💰${t.cost}</div><div class="si-stat">⚔${t.atk} ❤${t.hp}</div>`;
    if (!item.sold) div.addEventListener('click', () => buy(p, i));
    cont.appendChild(div);
  });
}

function renderBoard(p) {
  renderGrid(`p${p}-board`, G.board[p], p, 'board');
}

function renderBench(p) {
  const cont = document.getElementById(`p${p}-bench`);
  cont.innerHTML = '';
  for (let i = 0; i < BENCH_SIZE; i++) {
    const u = G.bench[p][i];
    const cell = document.createElement('div');
    const isSel = selected[p]?.zone === 'bench' && selected[p]?.idx === i;
    cell.className = 'bench-cell' + (u ? ' has-unit' : '');
    if (isSel) cell.style.outline = '3px solid #3b82f6';
    if (u) {
      const t = UNITS[u.id];
      cell.innerHTML = `<div class="unit-wrap" draggable="true"><span class="u-em">${t.em}</span><span class="u-name" style="font-size:7px">${t.name}</span></div><div class="tier-pip">T${t.tier}</div>`;
      cell.querySelector('.unit-wrap').addEventListener('dragstart', e => { e.dataTransfer.effectAllowed = 'move'; onDragStart(p, 'bench', i); });
      cell.addEventListener('click', () => selectCell(p, 'bench', i));
    }
    cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
    cell.addEventListener('drop', e => { e.preventDefault(); cell.classList.remove('drag-over'); onDrop(p, 'bench', i); });
    cont.appendChild(cell);
  }
}

function renderGrid(id, arr, p, zone) {
  const cont = document.getElementById(id);
  cont.innerHTML = '';

  // Count units that can merge
  const counts = {};
  [...G.board[p], ...G.bench[p]].forEach(u => { if (u) counts[u.id] = (counts[u.id] || 0) + 1; });

  for (let i = 0; i < BOARD_SIZE; i++) {
    const u = arr[i];
    const cell = document.createElement('div');
    const isSel = selected[p]?.zone === zone && selected[p]?.idx === i;
    cell.className = 'cell';

    if (u) {
      const t = UNITS[u.id];
      cell.classList.add('has-unit', `t${t.tier}`);
      if (isSel) cell.classList.add('selected');
      if (counts[u.id] >= 2 && MERGE_MAP[u.id]) cell.classList.add('can-merge');

      const hColor = t.tier === 1 ? '#9ca3af' : t.tier === 2 ? '#a78bfa' : '#f59e0b';
      cell.innerHTML = `
        <div class="unit-wrap" draggable="true">
          <span class="u-em">${t.em}</span>
          <span class="u-name">${t.name}</span>
          <div class="u-hbar"><div class="u-hfill" style="width:100%;background:${hColor}"></div></div>
        </div>
        <div class="tier-pip">T${t.tier}</div>`;

      cell.querySelector('.unit-wrap').addEventListener('dragstart', e => { e.dataTransfer.effectAllowed = 'move'; onDragStart(p, zone, i); });
      cell.addEventListener('click', () => selectCell(p, zone, i));
    } else {
      cell.addEventListener('click', () => selectCell(p, zone, i));
    }

    cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
    cell.addEventListener('drop', e => { e.preventDefault(); cell.classList.remove('drag-over'); onDrop(p, zone, i); });
    cont.appendChild(cell);
  }
}

// ── Toast ─────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Init ──────────────────────────────────────────────────────
genShop(1); genShop(2);
render();
</script>
</body>
</html>
